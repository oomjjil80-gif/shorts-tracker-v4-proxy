# ONE-OFF TEST (branch yv5-run only, never merged) — PR #180 FINAL PAID GEMINI TEST on this commit's Vercel PREVIEW
# (/api/image?oneoff=golden-lock-test, the preview's own GEMINI_API_KEY): Golden 3, the first picture + 2 later pictures with
# the first-image character lock. Every push: free checks only; the paid step (at most 3 calls, stop at the first error,
# no retry) runs only with [run-samples] in the commit message, and never again once style-examples/publish-golden-lock-test-1 exists.
name: golden lock final test x3 (one-off)
on:
  push:
    branches: [yv5-run]
permissions:
  contents: write
  deployments: read
concurrency:
  group: yv5-run
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Single-use guard
        run: |
          if git ls-remote --exit-code --heads origin style-examples/publish-golden-lock-test-1; then echo "already ran: no call"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Wait for this commit's Vercel preview (free checks only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          URL=""
          for i in $(seq 1 60); do
            DEP=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$GITHUB_SHA" --jq '[.[]|select(.environment=="Preview")][0].id // empty')
            if [ -n "$DEP" ]; then
              ST=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$DEP/statuses" --jq '.[0].state // ""')
              if [ "$ST" = success ]; then URL=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$DEP/statuses" --jq '.[0].environment_url'); break; fi
              if [ "$ST" = failure ] || [ "$ST" = error ]; then echo "preview deploy failed: no call"; exit 1; fi
            fi
            sleep 20
          done
          test -n "$URL" || { echo "no preview: no call"; exit 1; }
          echo "preview: $URL"
          PROBE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/image?oneoff=golden-lock-test")
          echo "GET probe: $PROBE"; test "$PROBE" = 405 || { echo "function not reachable: no call"; exit 1; }
          echo "image-health: $(curl -s "$URL/api/image-health" | jq -c '{providerId, modelId, keyConfigured}')"
          echo "openai health (TTS/text, not used for pictures): $(curl -s "$URL/api/health" | jq -c '{keyConfigured}')"
          GEM=$(curl -s "$URL/api/image-health" | jq -r '.keyConfigured')
          test "$GEM" = true || { echo "no GEMINI_API_KEY on the preview: no call"; exit 1; }
          echo "URL=$URL" >> "$GITHUB_ENV"
      - name: The 3 paid Gemini calls (first + 2 locked, stop at the first error) — only with [run-samples]
        id: call
        if: contains(github.event.head_commit.message, '[run-samples]')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx tsx tools/golden-lock-test-run.ts "$URL" out/golden-lock-test-1
      - name: Publish the result (pictures, comparisons, run record) to style-examples/publish-golden-lock-test-1
        if: always() && steps.call.outcome != 'skipped' && contains(github.event.head_commit.message, '[run-samples]')
        run: |
          set -eu
          mkdir -p /tmp/pub && cp -r out/golden-lock-test-1 /tmp/pub/
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git checkout --orphan style-examples/publish-golden-lock-test-1
          git rm -rfq . && rm -rf out node_modules
          mkdir -p style-examples && cp -r /tmp/pub/golden-lock-test-1 style-examples/
          git add style-examples && git commit -qm "golden lock final test: first picture + 2 locked later pictures (max 3 calls)"
          git push origin style-examples/publish-golden-lock-test-1
          cat style-examples/golden-lock-test-1/run.json | jq '.calls'
