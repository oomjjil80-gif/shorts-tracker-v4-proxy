name: source-shorts-benchmark-verify
on:
  push:
    branches: [feat/source-shorts-benchmark-dna]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: >
          npx tsx --test
          tools/source-first-editorial-dna.test.ts
          tools/source-first-window-captions.test.ts
          tools/common-shorts-legacy-audit.test.ts
          tools/p1-content.test.ts
          tools/p1-semantic-repair.test.ts
          tools/p1-units.test.ts
          tools/p15-semantic-reliability.test.ts
