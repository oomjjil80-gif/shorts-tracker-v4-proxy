name: Apply P5 economy longform BM integration

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/p5-economy-longform-bm.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply economy longform BM proxy patch
        run: node tools/p5-economy-longform-bm-patch.mjs
      - name: Commit proxy source integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/claude-story.ts api/gpt-script-qc.ts
          git diff --cached --quiet && exit 0
          git commit -m "Add economy BM longform writer and retention editor prompts"
          git push origin main
