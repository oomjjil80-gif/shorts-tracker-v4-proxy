name: source-clean-edge-verify
on:
  push:
    branches: [feat/source-clean-edge-crop]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: >
          npx tsx --test
          tools/source-clean-edge-crop.test.ts
          tools/source-first-editorial-dna.test.ts
          tools/source-first-window-captions.test.ts
          tools/framing.test.ts
          tools/p15-semantic-reliability.test.ts
