name: Claude Code (owner-approved test)

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  claude:
    # Keep the successful manual smoke test. Owner issue comments use the
    # separate handoff workflow, avoiding an accidental double API invocation.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run Claude (read-only connection test)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--max-turns 6 --allowedTools Read,Glob,Grep'
          prompt: >-
            This is a read-only connection smoke test. Reply with exactly:
            CLAUDE_GITHUB_CONNECTION_OK
            Do not inspect files, use tools, edit code, create PRs, or invoke other providers.
