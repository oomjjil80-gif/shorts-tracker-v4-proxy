name: P1.5 decode diagnostic
on:
  push:
    branches: [p15-decode-diagnostic]
    paths: ['.github/workflows/p15-decode-diagnostic.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Decode existing blocked render
        run: |
          curl -fsS -H 'X-Sync-Key: p15-final-prod-e2e-v2-0aa2154' 'https://shorts-tracker-v4-proxy.vercel.app/api/story?taskType=job_preview&id=job_12f52575-79f2-456a-95f2-65f9816ae49a' > preview.json
          URL=$(node -e 'const d=require("./preview.json");process.stdout.write(d.previews[0].url)')
          curl -fsSL "$URL" -o render.mp4
          echo "FFPROBE"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=index,codec_type,codec_name,duration -of json render.mp4
          echo "STRICT_DECODE"
          set +e
          ffmpeg -v error -xerror -i render.mp4 -f null - 2>decode.err
          CODE=$?
          set -e
          echo "EXIT=$CODE"
          cat decode.err
          echo "VIDEO_PROGRESS"
          ffmpeg -i render.mp4 -map 0:v:0 -f null - 2>&1 | tail -20
