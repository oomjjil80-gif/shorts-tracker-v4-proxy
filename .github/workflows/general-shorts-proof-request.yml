name: General Shorts Proof Request
on:
  push:
    branches: [main]
    paths:
      - 'proof-requests/*.json'

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Locate request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          REQ="$(git diff --name-only HEAD^ HEAD | grep -E '^proof-requests/.*\.json$' | tail -1)"
          test -n "$REQ"
          echo "path=$REQ" >> "$GITHUB_OUTPUT"
      - name: Create proof job and wait for preview
        shell: bash
        env:
          API: https://shorts-tracker-v4-proxy.vercel.app/api/story
          SYNC_KEY: general-shorts-proof-20261005-aspen-toby-v1
          REQ: ${{ steps.req.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p proof-evidence
          sleep 75
          curl -fsS -X POST "$API" \
            -H 'Content-Type: application/json' \
            -H "X-Sync-Key: $SYNC_KEY" \
            --data-binary "@$REQ" > proof-evidence/create.json
          JOB_ID="$(jq -r '.job.id // empty' proof-evidence/create.json)"
          test -n "$JOB_ID"
          echo "$JOB_ID" > proof-evidence/job-id.txt
          for i in $(seq 1 150); do
            curl -fsS "$API?taskType=job_get&id=$JOB_ID" \
              -H "X-Sync-Key: $SYNC_KEY" > proof-evidence/job.json
            STATUS="$(jq -r '.job.status' proof-evidence/job.json)"
            STAGE="$(jq -r '.job.stage' proof-evidence/job.json)"
            echo "job=$JOB_ID status=$STATUS stage=$STAGE"
            if [ "$STATUS" = "WAITING_USER" ] || [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "COMPLETE" ] || [ "$STATUS" = "CANCELLED" ]; then
              break
            fi
            sleep 5
          done
          curl -fsS "$API?taskType=job_preview&id=$JOB_ID" \
            -H "X-Sync-Key: $SYNC_KEY" > proof-evidence/preview.json || true
          jq '{id:.job.id,status:.job.status,stage:.job.stage,waitReason:.job.waitReason,error:.job.error,variants:.job.variants}' proof-evidence/job.json
          jq '{jobId,status,stage,previews:[.previews[]? | {variantId,label,durationSec,qc,contentQc,publishable,recommended,url,validUntil}]}' proof-evidence/preview.json || true
          test "$(jq -r '.job.status' proof-evidence/job.json)" != "FAILED"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: general-shorts-proof-evidence
          path: proof-evidence/
          retention-days: 3
