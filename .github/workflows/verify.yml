name: verify
on:
  pull_request:
  push:
    branches: [p1-5-reference-contracts-v1]
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Select verification scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then
            CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          else
            CHANGED="$(git diff --name-only HEAD^ HEAD)"
          fi
          echo "Changed files:"
          printf '%s\n' "$CHANGED"

          LONGFORM_RENDER_OTHER="$(printf '%s\n' "$CHANGED" | grep -Ev '^(lib/generative/seniorLongform\.ts|lib/jobs/blobs\.ts|lib/jobs/http\.ts|lib/jobs/store\.ts|worker/stages/longform\.ts|tools/longform-chunked-render\.test\.ts|tools/longform-render-memory\.ts|\.github/workflows/verify\.yml)$' || true)"
          NON_TEST="$(printf '%s\n' "$CHANGED" | grep -Ev '^(tools/.*\.test\.(ts|mjs)|\.github/workflows/verify\.yml)$' || true)"
          TESTS="$(printf '%s\n' "$CHANGED" | grep -E '^tools/.*\.test\.(ts|mjs)$' || true)"
          WORKFLOW_ONLY="$(printf '%s\n' "$CHANGED" | grep -Ev '^\.github/workflows/verify\.yml$' || true)"
          YADAM_STYLE_OTHER="$(printf '%s\n' "$CHANGED" | grep -Ev '^(lib/generative/visualStyle\.ts|lib/generative/creativeProfile\.ts|lib/generative/longform\.ts|lib/generative/yasaPlanner\.ts|lib/jobs/http\.ts|lib/jobs/store\.ts|lib/generative/voiceProfile\.ts|lib/generative/yasaLongform\.ts|lib/generative/styleApproval\.ts|lib/generative/thumbnailCopyWriter\.ts|lib/generative/providers\.ts|worker/stages/styleGate\.ts|worker/runJob\.ts|worker/index\.ts|worker/oneoffStyleExamples\.ts|lib/generative/yadamStyleCandidates\.ts|lib/generative/yadamReferenceStyle\.ts|assets/style-reference/yadam-v4/[A-Za-z0-9-]+\.(jpg|md)|assets/style-reference/yadam/[A-Za-z0-9-]+\.(jpg|md)|assets/style-reference/yadam/sent/capture-[123]\.png|lib/generative/yadamStyle\.ts|tools/yadam-style\.test\.ts|tools/fixtures/style-distance/[a-z_]+\.jpg|api/image\.ts|vercel\.json|tools/oneoff-style-examples\.test\.ts|lib/generative/usageLedger\.ts|tools/cost-ledger\.test\.ts|lib/generative/styleJudge\.ts|lib/generative/thumbnailOverride\.ts|lib/generative/seniorLongform\.ts|lib/generative/seniorPlanner\.ts|worker/types\.ts|tools/style-match\.test\.ts|assets/style-examples/yadam/[a-z_]+\.jpg|lib/generative/styleExamples\.ts|lib/generative/titleThumbnail\.ts|tools/title-thumbnail\.test\.ts|tools/wisdom-longform\.test\.ts|tools/style-example\.test\.ts|worker/stages/longform\.ts|tools/creative-profile\.test\.ts|tools/creative-all-content\.test\.ts|tools/yasa-longform-job\.test\.ts|tools/make-yadam-style-previews\.ts|\.github/workflows/verify\.yml)$' || true)"

          GEMINI_IMAGE_OTHER="$(printf '%s\n' "$YADAM_STYLE_OTHER" | grep -Ev '^(lib/generative/geminiImage\.ts|lib/generative/goldenStyle\.ts|lib/generative/planner\.ts|assets/style-reference/golden/ref-[1-5]\.jpg|tools/golden-style\.test\.ts|lib/generative/providers\.ts|lib/generative/usageLedger\.ts|worker/stages/generative\.ts|worker/stages/wisdomThumbnail\.ts|tools/gemini-image\.test\.ts|tools/p2-providers\.test\.ts|tools/p2-generative\.test\.ts|tools/pipeline-features\.test\.ts|tools/wisdom-output\.test\.ts|tools/wisdom-thumbnail\.test\.ts|tools/wisdom-derived-shorts\.test\.ts)$' || true)"

          if [ -z "$LONGFORM_RENDER_OTHER" ]; then
            echo "mode=longform-render" >> "$GITHUB_OUTPUT"
          elif [ -z "$YADAM_STYLE_OTHER" ]; then
            echo "mode=yadam-style" >> "$GITHUB_OUTPUT"
          elif [ -z "$GEMINI_IMAGE_OTHER" ]; then
            echo "mode=gemini-image" >> "$GITHUB_OUTPUT"
          elif [ -z "$WORKFLOW_ONLY" ]; then
            echo "mode=workflow-only" >> "$GITHUB_OUTPUT"
          elif [ -z "$NON_TEST" ] && [ -n "$TESTS" ]; then
            echo "mode=test-only" >> "$GITHUB_OUTPUT"
            {
              echo 'tests<<EOF'
              printf '%s\n' "$TESTS"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Run focused Longform render verification
        if: steps.scope.outputs.mode == 'longform-render'
        shell: bash
        run: |
          set -euo pipefail
          timeout 6m npx tsx --test \
            tools/longform-chunked-render.test.ts \
            tools/jobs-api.test.ts \
            tools/jobs-store.test.ts \
            tools/r2-job-storage.test.ts

      - name: Run focused 숨은야담 verification (그림체, cold open, captions, remaster)
        if: steps.scope.outputs.mode == 'yadam-style'
        shell: bash
        run: |
          set -euo pipefail
          timeout 10m npx tsx --test \
            tools/creative-profile.test.ts \
            tools/creative-all-content.test.ts \
            tools/longform-voice.test.ts \
            tools/yasa-longform-job.test.ts tools/style-match.test.ts tools/yadam-style.test.ts tools/title-thumbnail.test.ts tools/oneoff-style-examples.test.ts tools/cost-ledger.test.ts \
            tools/wisdom-longform.test.ts \
            tools/jobs-api.test.ts \
            tools/jobs-store.test.ts

      - name: Run focused Gemini image verification (every picture path)
        if: steps.scope.outputs.mode == 'gemini-image'
        shell: bash
        run: |
          set -euo pipefail
          timeout 15m npx tsx --test \
            tools/gemini-image.test.ts tools/golden-style.test.ts tools/p2-providers.test.ts tools/p2-generative.test.ts tools/pipeline-features.test.ts \
            tools/cost-ledger.test.ts tools/style-match.test.ts tools/yadam-style.test.ts tools/oneoff-style-examples.test.ts \
            tools/wisdom-output.test.ts tools/wisdom-thumbnail.test.ts tools/wisdom-derived-shorts.test.ts \
            tools/creative-profile.test.ts tools/creative-all-content.test.ts tools/title-thumbnail.test.ts \
            tools/wisdom-longform.test.ts tools/yasa-longform-job.test.ts tools/jobs-api.test.ts tools/jobs-store.test.ts

      - name: Run focused tests for test-only changes
        if: steps.scope.outputs.mode == 'test-only'
        shell: bash
        run: |
          set -euo pipefail
          TESTS="${{ steps.scope.outputs.tests }}"
          printf '%s\n' "$TESTS"
          timeout 4m npx tsx --test $TESTS

      - name: Reuse previous result for workflow-only changes
        if: steps.scope.outputs.mode == 'workflow-only'
        run: echo "Workflow-only change; no code or test behavior changed."

      - name: Run full tests with hang protection
        if: steps.scope.outputs.mode == 'full'
        run: timeout 15m npm test
