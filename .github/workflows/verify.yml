name: verify
on:
  pull_request:
  push:
    branches: [p1-5-reference-contracts-v1]
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Select verification scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then
            CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
          else
            CHANGED="$(git diff --name-only HEAD^ HEAD)"
          fi
          echo "Changed files:"
          printf '%s\n' "$CHANGED"

          # 유료 AI 1회용 승인·$20 경고(차단 아님)·비용 기록: 정책/예약/승인 모듈 + 카드뉴스 유료 경로 + 저장소 create-once.
          BUDGET_OTHER="$(printf '%s\n' "$CHANGED" | grep -Ev '^(lib/generative/(monthlyBudgetPolicy|atomicBudgetReservation|paidApproval)\.ts|db/999_ai_budget_reservations\.sql|lib/objectStorage\.ts|lib/jobs/blobs\.ts|lib/cardnews/[A-Za-z]+\.ts|tools/(monthlyBudgetPolicy|atomicBudgetReservation|paid-approval|cardnews|cardnews-visual)\.test\.ts|docs/[A-Za-z0-9-]+\.md|\.github/workflows/verify\.yml)$' || true)"
          BUDGET_PRESENT="$(printf '%s\n' "$CHANGED" | grep -E '^lib/generative/paidApproval\.ts$' || true)"
          # PLAN cross-review changes run integration tests against the actual PLAN executor.
          PLAN_REVIEW_OTHER="$(printf '%s\n' "$CHANGED" | grep -Ev '^(lib/generative/planCrossReview\.ts|worker/stages/longform\.ts|tools/plan-cross-review\.test\.ts|\.github/workflows/verify\.yml)$' || true)"
          PLAN_REVIEW_PRESENT="$(printf '%s\n' "$CHANGED" | grep -E '^lib/generative/planCrossReview\.ts$' || true)"
          # 급상승 탐색 (new tables + read-only trending_get route + hourly worker tick): focused tests incl. the api/story.ts router and Source Collector regression.
          TRENDING_OTHER="$(printf '%s\n' "$CHANGED" | grep -Ev '^(db/003_trending\.sql|lib/trending/[A-Za-z]+\.ts|api/story\.ts|worker/index\.ts|tools/trending\.test\.ts|\.github/workflows/verify\.yml)$' || true)"
          TRENDING_PRESENT="$(printf '%s\n' "$CHANGED" | grep -E '^lib/trending/trending\.ts$' || true)"
          # 제작 6단계 (제목·썸네일 약속): opt-in connectors in claude-story / gpt-script-qc / job tasks; focused tests incl. the handlers' existing regressions.
          PROMISE_OTHER="$(printf '%s\n' "$CHANGED" | grep -Ev '^(lib/story/titlePromise\.ts|api/claude-story\.ts|api/gpt-script-qc\.ts|api/claude-longform-revise\.ts|api/story\.ts|lib/jobs/http\.ts|tools/title-promise\.test\.ts|\.github/workflows/verify\.yml)$' || true)"
          PROMISE_PRESENT="$(printf '%s\n' "$CHANGED" | grep -E '^lib/story/titlePromise\.ts$' || true)"
          # 카드뉴스 (new lib/cardnews + router lines in api/story.ts): focused tests incl. function-count and Job API regression.
          CARDNEWS_OTHER="$(printf '%s\n' "$CHANGED" | grep -Ev '^(lib/cardnews/[A-Za-z]+\.ts|api/story\.ts|api/image\.ts|tools/(cardnews(-visual|-refs|-projects|-image-review)?|paid-approval)\.test\.ts|\.github/workflows/verify\.yml)$' || true)"
          CARDNEWS_PRESENT="$(printf '%s\n' "$CHANGED" | grep -E '^lib/cardnews/(cardnews|http|visionReview)\.ts
          # 확정 대본 (history Reels): optional brief.fixedScript used verbatim by the Wisdom PLAN; focused tests incl. Wisdom regression.
          FIXED_OTHER="$(printf '%s\n' "$CHANGED" | grep -Ev '^(lib/generative/contracts\.ts|lib/generative/wisdom\.ts|worker/stages/generative\.ts|tools/fixed-script\.test\.ts|\.github/workflows/verify\.yml)$' || true)"
          FIXED_PRESENT="$(printf '%s\n' "$CHANGED" | grep -E '^tools/fixed-script\.test\.ts$' || true)"
          # 야담 쇼츠 (yasa_shorts profile = the Wisdom Shorts pipeline under its own id): focused tests incl. Wisdom Shorts / 야담 롱폼 regressions.
          YASA_SHORTS_OTHER="$(printf '%s\n' "$CHANGED" | grep -Ev '^(lib/jobs/(profiles|store|http)\.ts|lib/generative/(contracts|wisdom|wisdomThumbnail|wisdomUploadText)\.ts|worker/stages/(generative|compile|autoQc|wisdomThumbnail)\.ts|tools/(yasa-shorts|pipeline-features|profile-modules|creative-profile)\.test\.ts|\.github/workflows/verify\.yml)$' || true)"
          YASA_SHORTS_PRESENT="$(printf '%s\n' "$CHANGED" | grep -E '^tools/yasa-shorts\.test\.ts$' || true)"
          # 블록 엔진 (Recipe + 승인 강제를 worker/runJob.ts에 연결): focused tests incl. Job API / worker / pipeline regressions.
          BLOCK_ENGINE_OTHER="$(printf '%s\n' "$CHANGED" | grep -Ev '^(db/004_job_blocks\.sql|lib/jobs/(recipe|recipes|blockStore|blockRuntime|blockScheduler|legacyBlockMapping|http|store|types)\.ts|worker/(runJob|index)\.ts|tools/((block-engine|recipe-contract)\.test|testDb)\.ts|\.github/workflows/verify\.yml)$' || true)"
          BLOCK_ENGINE_PRESENT="$(printf '%s\n' "$CHANGED" | grep -E '^tools/block-engine\.test\.ts$' || true)"
          LONGFORM_RENDER_OTHER="$(printf '%s\n' "$CHANGED" | grep -Ev '^(lib/generative/seniorLongform\.ts|lib/jobs/blobs\.ts|lib/jobs/http\.ts|lib/jobs/store\.ts|worker/stages/longform\.ts|tools/longform-chunked-render\.test\.ts|tools/longform-render-memory\.ts|\.github/workflows/verify\.yml)$' || true)"
          NON_TEST="$(printf '%s\n' "$CHANGED" | grep -Ev '^(tools/.*\.test\.(ts|mjs)|\.github/workflows/verify\.yml)$' || true)"
          TESTS="$(printf '%s\n' "$CHANGED" | grep -E '^tools/.*\.test\.(ts|mjs)$' || true)"
          WORKFLOW_ONLY="$(printf '%s\n' "$CHANGED" | grep -Ev '^\.github/workflows/verify\.yml$' || true)"
          YADAM_STYLE_OTHER="$(printf '%s\n' "$CHANGED" | grep -Ev '^(lib/generative/visualStyle\.ts|lib/generative/creativeProfile\.ts|lib/generative/longform\.ts|lib/generative/yasaPlanner\.ts|lib/jobs/http\.ts|lib/jobs/store\.ts|lib/generative/voiceProfile\.ts|lib/generative/yasaLongform\.ts|lib/generative/styleApproval\.ts|lib/generative/thumbnailCopyWriter\.ts|lib/generative/providers\.ts|worker/stages/styleGate\.ts|worker/runJob\.ts|worker/index\.ts|worker/oneoffStyleExamples\.ts|lib/generative/yadamStyleCandidates\.ts|lib/generative/yadamReferenceStyle\.ts|assets/style-reference/yadam-v4/[A-Za-z0-9-]+\.(jpg|md)|assets/style-reference/yadam/[A-Za-z0-9-]+\.(jpg|md)|assets/style-reference/yadam/sent/capture-[123]\.png|lib/generative/yadamStyle\.ts|tools/yadam-style\.test\.ts|tools/fixtures/style-distance/[a-z_]+\.jpg|api/image\.ts|vercel\.json|tools/oneoff-style-examples\.test\.ts|lib/generative/usageLedger\.ts|tools/cost-ledger\.test\.ts|lib/generative/styleJudge\.ts|lib/generative/thumbnailOverride\.ts|lib/generative/seniorLongform\.ts|lib/generative/seniorPlanner\.ts|worker/types\.ts|tools/style-match\.test\.ts|assets/style-examples/yadam/[a-z_]+\.jpg|lib/generative/styleExamples\.ts|lib/generative/titleThumbnail\.ts|tools/title-thumbnail\.test\.ts|tools/wisdom-longform\.test\.ts|tools/style-example\.test\.ts|worker/stages/longform\.ts|tools/creative-profile\.test\.ts|tools/creative-all-content\.test\.ts|tools/yasa-longform-job\.test\.ts|tools/make-yadam-style-previews\.ts|\.github/workflows/verify\.yml)$' || true)"

          GEMINI_IMAGE_OTHER="$(printf '%s\n' "$YADAM_STYLE_OTHER" | grep -Ev '^(lib/generative/geminiImage\.ts|lib/generative/goldenStyle\.ts|lib/generative/planner\.ts|assets/style-reference/golden/ref-[1-5]\.jpg|tools/golden-style\.test\.ts|lib/generative/providers\.ts|lib/generative/usageLedger\.ts|worker/stages/generative\.ts|worker/stages/wisdomThumbnail\.ts|tools/gemini-image\.test\.ts|tools/p2-providers\.test\.ts|tools/p2-generative\.test\.ts|tools/pipeline-features\.test\.ts|tools/wisdom-output\.test\.ts|tools/wisdom-thumbnail\.test\.ts|tools/wisdom-derived-shorts\.test\.ts|lib/generative/wisdomUploadText\.ts)$' || true)"

          # Isolated feature verification; mandatory typecheck remains unchanged.
          # Scoped offline Odyssey plan recovery: also check real store and API tests.
          ASSET_BILLING_OTHER="$(printf '%s\n' "$CHANGED" | grep -Ev '^(lib/jobs/store\.ts|lib/jobs/http\.ts|tools/sleep-asset-billing-recovery\.test\.ts|\.github/workflows/verify\.yml)$' || true)"
          ASSET_BILLING_PRESENT="$(printf '%s\n' "$CHANGED" | grep -E '^tools/sleep-asset-billing-recovery\.test\.ts$' || true)"
          OFFLINE_RESTORE_OTHER="$(printf '%s\n' "$CHANGED" | grep -Ev '^(lib/jobs/sleepDraftImport\.ts|lib/jobs/http\.ts|lib/jobs/store\.ts|tools/sleep-draft-import\.test\.ts|\.github/workflows/verify\.yml)$' || true)"
          OFFLINE_RESTORE_PRESENT="$(printf '%s\n' "$CHANGED" | grep -E '^lib/jobs/sleepDraftImport\.ts$' || true)"
          SLEEP_OTHER="$(printf '%s\n' "$CHANGED" | grep -Ev '^(lib/generative/sleepClassic\.ts|lib/generative/longform\.ts|worker/stages/longform\.ts|tools/sleep-classic\.test\.ts|\.github/workflows/verify\.yml)$' || true)"
          SLEEP_PRESENT="$(printf '%s\n' "$CHANGED" | grep -E '^lib/generative/sleepClassic\.ts$' || true)"
          if [ -z "$BUDGET_OTHER" ] && [ -n "$BUDGET_PRESENT" ]; then
            echo "mode=ai-budget" >> "$GITHUB_OUTPUT"
          elif [ -z "$ASSET_BILLING_OTHER" ] && [ -n "$ASSET_BILLING_PRESENT" ]; then
            echo "mode=odyssey-asset-billing" >> "$GITHUB_OUTPUT"
          elif [ -z "$OFFLINE_RESTORE_OTHER" ] && [ -n "$OFFLINE_RESTORE_PRESENT" ]; then
            echo "mode=odyssey-offline-restore" >> "$GITHUB_OUTPUT"
          elif [ -z "$SLEEP_OTHER" ] && [ -n "$SLEEP_PRESENT" ]; then
            echo "mode=sleep-classic" >> "$GITHUB_OUTPUT"
          elif [ -z "$BLOCK_ENGINE_OTHER" ] && [ -n "$BLOCK_ENGINE_PRESENT" ]; then
            echo "mode=block-engine" >> "$GITHUB_OUTPUT"
          elif [ -z "$YASA_SHORTS_OTHER" ] && [ -n "$YASA_SHORTS_PRESENT" ]; then
            echo "mode=yasa-shorts" >> "$GITHUB_OUTPUT"
          elif [ -z "$FIXED_OTHER" ] && [ -n "$FIXED_PRESENT" ]; then
            echo "mode=fixed-script" >> "$GITHUB_OUTPUT"
          elif [ -z "$CARDNEWS_OTHER" ] && [ -n "$CARDNEWS_PRESENT" ]; then
            echo "mode=cardnews" >> "$GITHUB_OUTPUT"
          elif [ -z "$TRENDING_OTHER" ] && [ -n "$TRENDING_PRESENT" ]; then
            echo "mode=trending" >> "$GITHUB_OUTPUT"
          elif [ -z "$PROMISE_OTHER" ] && [ -n "$PROMISE_PRESENT" ]; then
            echo "mode=title-promise" >> "$GITHUB_OUTPUT"
          elif [ -z "$PLAN_REVIEW_OTHER" ] && [ -n "$PLAN_REVIEW_PRESENT" ]; then
            echo "mode=plan-cross-review" >> "$GITHUB_OUTPUT"
          elif [ -z "$LONGFORM_RENDER_OTHER" ]; then
            echo "mode=longform-render" >> "$GITHUB_OUTPUT"
          elif [ -z "$YADAM_STYLE_OTHER" ]; then
            echo "mode=yadam-style" >> "$GITHUB_OUTPUT"
          elif [ -z "$GEMINI_IMAGE_OTHER" ]; then
            echo "mode=gemini-image" >> "$GITHUB_OUTPUT"
          elif [ -z "$WORKFLOW_ONLY" ]; then
            echo "mode=workflow-only" >> "$GITHUB_OUTPUT"
          elif [ -z "$NON_TEST" ] && [ -n "$TESTS" ]; then
            echo "mode=test-only" >> "$GITHUB_OUTPUT"
            {
              echo 'tests<<EOF'
              printf '%s\n' "$TESTS"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Odyssey billing recovery + Job API/store
        if: steps.scope.outputs.mode == 'odyssey-asset-billing'
        shell: bash
        run: |
          set -euo pipefail
          timeout 6m npx tsx --test \
            tools/sleep-asset-billing-recovery.test.ts \
            tools/jobs-api.test.ts \
            tools/jobs-store.test.ts

      - name: Verify offline Odyssey import, Job store and authenticated API
        if: steps.scope.outputs.mode == 'odyssey-offline-restore'
        shell: bash
        run: |
          set -euo pipefail
          timeout 8m npx tsx --test \
            tools/sleep-draft-import.test.ts \
            tools/sleep-draft-recovery.test.ts \
            tools/jobs-api.test.ts \
            tools/jobs-store.test.ts

      - name: Run focused bedtime classic regression
        if: steps.scope.outputs.mode == 'sleep-classic'
        shell: bash
        run: |
          set -euo pipefail
          timeout 5m npx tsx --test tools/sleep-classic.test.ts tools/plan-cross-review.test.ts

      - name: Run focused 유료 AI 승인·비용 verification (single-use approval, concurrent/duplicate calls, $20 warning only, cardnews paid path)
        if: steps.scope.outputs.mode == 'ai-budget'
        shell: bash
        run: |
          set -euo pipefail
          timeout 8m npx tsx --test \
            tools/paid-approval.test.ts \
            tools/monthlyBudgetPolicy.test.ts \
            tools/atomicBudgetReservation.test.ts \
            tools/cardnews.test.ts \
            tools/cardnews-visual.test.ts \
            tools/r2-job-storage.test.ts \
            tools/blob-dedupe.test.ts \
            tools/function-count.test.ts

      - name: Run focused 카드뉴스 verification (cost approval, GPT/Claude flow, save/restore + router and Job API regression)
        if: steps.scope.outputs.mode == 'cardnews'
        shell: bash
        run: |
          set -euo pipefail
          timeout 8m npx tsx --test \
            tools/cardnews.test.ts \
            tools/cardnews-visual.test.ts \
            tools/cardnews-refs.test.ts \
            tools/cardnews-projects.test.ts \
            tools/golden-style.test.ts \
            tools/creative-all-content.test.ts \
            tools/paid-approval.test.ts \
            tools/function-count.test.ts \
            tools/jobs-api.test.ts \
            tools/jobs-store.test.ts

      - name: Run focused 블록 엔진 verification (recipes, approvals, reuse, worker gate + Job API / worker / pipeline regressions)
        if: steps.scope.outputs.mode == 'block-engine'
        shell: bash
        run: |
          set -euo pipefail
          timeout 12m npx tsx --test \
            tools/block-engine.test.ts \
            tools/recipe-contract.test.ts \
            tools/worker.test.ts \
            tools/p1-pipeline.test.ts \
            tools/jobs-api.test.ts \
            tools/jobs-store.test.ts \
            tools/pipeline-features.test.ts \
            tools/profile-modules.test.ts \
            tools/function-count.test.ts

      - name: Run focused 야담 쇼츠 verification (yasa_shorts profile + Wisdom Shorts / 야담 롱폼 regressions)
        if: steps.scope.outputs.mode == 'yasa-shorts'
        shell: bash
        run: |
          set -euo pipefail
          timeout 12m npx tsx --test \
            tools/yasa-shorts.test.ts \
            tools/fixed-script.test.ts \
            tools/pipeline-features.test.ts \
            tools/profile-modules.test.ts \
            tools/creative-profile.test.ts \
            tools/creative-all-content.test.ts \
            tools/p2-planner.test.ts \
            tools/wisdom-output.test.ts \
            tools/wisdom-longform.test.ts \
            tools/yasa-longform-job.test.ts \
            tools/jobs-api.test.ts \
            tools/jobs-store.test.ts \
            tools/function-count.test.ts

      - name: Run focused 확정 대본 verification (fixed script PLAN + Wisdom regression)
        if: steps.scope.outputs.mode == 'fixed-script'
        shell: bash
        run: |
          set -euo pipefail
          timeout 10m npx tsx --test \
            tools/fixed-script.test.ts \
            tools/p2-planner.test.ts \
            tools/creative-profile.test.ts \
            tools/wisdom-output.test.ts \
            tools/jobs-api.test.ts \
            tools/function-count.test.ts

      - name: Run focused 급상승 탐색 verification (collector, ranking, API route, Source Collector + Job API regression)
        if: steps.scope.outputs.mode == 'trending'
        shell: bash
        run: |
          set -euo pipefail
          timeout 8m npx tsx --test \
            tools/trending.test.ts \
            tools/function-count.test.ts \
            tools/source-collector.test.ts \
            tools/jobs-api.test.ts \
            tools/jobs-store.test.ts

      - name: Run focused 제목·썸네일 약속 6단계 verification (promise gate, QC, partial revise, final check + handler regressions)
        if: steps.scope.outputs.mode == 'title-promise'
        shell: bash
        run: |
          set -euo pipefail
          timeout 8m npx tsx --test \
            tools/title-promise.test.ts \
            tools/yasa-story-dna.test.ts \
            tools/jobs-api.test.ts \
            tools/jobs-store.test.ts \
            tools/function-count.test.ts

      - name: Run focused Longform PLAN cross-review verification
        if: steps.scope.outputs.mode == 'plan-cross-review'
        shell: bash
        run: |
          set -euo pipefail
          timeout 5m npx tsx --test tools/plan-cross-review.test.ts

      - name: Run focused Longform render verification
        if: steps.scope.outputs.mode == 'longform-render'
        shell: bash
        run: |
          set -euo pipefail
          timeout 6m npx tsx --test \
            tools/longform-chunked-render.test.ts \
            tools/jobs-api.test.ts \
            tools/jobs-store.test.ts \
            tools/r2-job-storage.test.ts

      - name: Run focused 숨은야담 verification (그림체, cold open, captions, remaster)
        if: steps.scope.outputs.mode == 'yadam-style'
        shell: bash
        run: |
          set -euo pipefail
          timeout 10m npx tsx --test \
            tools/creative-profile.test.ts \
            tools/creative-all-content.test.ts \
            tools/longform-voice.test.ts \
            tools/yasa-longform-job.test.ts tools/style-match.test.ts tools/yadam-style.test.ts tools/title-thumbnail.test.ts tools/oneoff-style-examples.test.ts tools/cost-ledger.test.ts \
            tools/wisdom-longform.test.ts \
            tools/jobs-api.test.ts \
            tools/jobs-store.test.ts

      - name: Run focused Gemini image verification (every picture path)
        if: steps.scope.outputs.mode == 'gemini-image'
        shell: bash
        run: |
          set -euo pipefail
          timeout 15m npx tsx --test \
            tools/gemini-image.test.ts tools/golden-style.test.ts tools/p2-providers.test.ts tools/p2-generative.test.ts tools/pipeline-features.test.ts \
            tools/cost-ledger.test.ts tools/style-match.test.ts tools/yadam-style.test.ts tools/oneoff-style-examples.test.ts \
            tools/wisdom-output.test.ts tools/wisdom-thumbnail.test.ts tools/wisdom-derived-shorts.test.ts \
            tools/creative-profile.test.ts tools/creative-all-content.test.ts tools/title-thumbnail.test.ts \
            tools/wisdom-longform.test.ts tools/yasa-longform-job.test.ts tools/jobs-api.test.ts tools/jobs-store.test.ts

      - name: Run focused tests for test-only changes
        if: steps.scope.outputs.mode == 'test-only'
        shell: bash
        run: |
          set -euo pipefail
          TESTS="${{ steps.scope.outputs.tests }}"
          printf '%s\n' "$TESTS"
          timeout 4m npx tsx --test $TESTS

      - name: Reuse previous result for workflow-only changes
        if: steps.scope.outputs.mode == 'workflow-only'
        run: echo "Workflow-only change; no code or test behavior changed."

      - name: Run full tests with hang protection
        if: steps.scope.outputs.mode == 'full'
        run: timeout 15m npm test
