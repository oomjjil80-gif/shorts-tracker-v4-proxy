          FIXED_OTHER="$(printf '%s\n' "$CHANGED" | grep -Ev '^(lib/generative/contracts\.ts|lib/generative/wisdom\.ts|worker/stages/generative\.ts|tools/fixed-script\.test\.ts|\.github/workflows/verify\.yml)$' || true)"
          FIXED_PRESENT="$(printf '%s\n' "$CHANGED" | grep -E '^tools/fixed-script\.test\.ts$' || true)"
          # 야담 쇼츠 (yasa_shorts profile = the Wisdom Shorts pipeline under its own id): focused tests incl. Wisdom Shorts / 야담 롱폼 regressions.
          YASA_SHORTS_OTHER="$(printf '%s\n' "$CHANGED" | grep -Ev '^(lib/jobs/(profiles|store|http)\.ts|lib/generative/(contracts|wisdom|wisdomThumbnail|wisdomUploadText)\.ts|worker/stages/(generative|compile|autoQc|wisdomThumbnail)\.ts|tools/(yasa-shorts|pipeline-features|profile-modules|creative-profile)\.test\.ts|\.github/workflows/verify\.yml)$' || true)"
          YASA_SHORTS_PRESENT="$(printf '%s\n' "$CHANGED" | grep -E '^tools/yasa-shorts\.test\.ts$' || true)"
          # 블록 엔진 (Recipe + 승인 강제를 worker/runJob.ts에 연결): focused tests incl. Job API / worker / pipeline regressions.
          BLOCK_ENGINE_OTHER="$(printf '%s\n' "$CHANGED" | grep -Ev '^(db/004_job_blocks\.sql|lib/jobs/(recipe|recipes|blockStore|blockRuntime|blockScheduler|legacyBlockMapping|http|store|types)\.ts|worker/(runJob|index)\.ts|tools/((block-engine|recipe-contract)\.test|testDb)\.ts|\.github/workflows/verify\.yml)$' || true)"
          BLOCK_ENGINE_PRESENT="$(printf '%s\n' "$CHANGED" | grep -E '^tools/block-engine\.test\.ts$' || true)"
