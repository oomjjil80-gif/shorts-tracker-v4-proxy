name: verify
on:
  pull_request:
  push:
    branches: [p1-5-reference-contracts-v1]
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run focused tests for test-only changes
        id: focused
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only HEAD^ HEAD)"
          NON_TEST="$(printf '%s\n' "$CHANGED" | grep -Ev '^(tools/.*\.test\.(ts|mjs)|\.github/workflows/verify\.yml)$' || true)"
          TESTS="$(printf '%s\n' "$CHANGED" | grep -E '^tools/.*\.test\.(ts|mjs)$' || true)"
          WORKFLOW_ONLY="$(printf '%s\n' "$CHANGED" | grep -Ev '^\.github/workflows/verify\.yml$' || true)"
          if [ -z "$WORKFLOW_ONLY" ]; then
            echo "Workflow-only change; previous code/test result remains authoritative."
            echo "ran=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$NON_TEST" ] && [ -n "$TESTS" ]; then
            echo "Running only changed tests:"
            printf '%s\n' "$TESTS"
            timeout 4m npx tsx --test $TESTS
            echo "ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "ran=false" >> "$GITHUB_OUTPUT"
          fi
      # PR #158 (longform chunked render) only: the tests in its scope; the long REAL RENDER regression stays out of this PR's CI
      - name: Run longform chunked render scope tests
        if: github.head_ref == 'feat/longform-chunked-render'
        run: timeout 12m npx tsx --test tools/longform-chunked-render.test.ts tools/wisdom-longform.test.ts tools/jobs-api.test.ts tools/jobs-store.test.ts
      - name: Run full tests with hang protection
        if: steps.focused.outputs.ran != 'true' && github.head_ref != 'feat/longform-chunked-render'
        run: timeout 12m npm test
