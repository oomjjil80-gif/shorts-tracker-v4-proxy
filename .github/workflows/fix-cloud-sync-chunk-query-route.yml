name: Fix cloud sync chunk query route

on:
  push:
    paths:
      - '.github/workflows/fix-cloud-sync-chunk-query-route.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sync handler
        shell: python
        run: |
          from pathlib import Path
          p=Path('api/sync/[...path].ts')
          s=p.read_text()
          old="""    if (parts.length === 3 && parts[0] === 'chunk') {\n      const slot = validSlot(parts[1])\n      const index = validIndex(parts[2])\n"""
          new="""    if (parts[0] === 'chunk') {\n      const slot = validSlot(parts.length >= 3 ? parts[1] : (req.query as any).slot)\n      const index = validIndex(parts.length >= 3 ? parts[2] : (req.query as any).index)\n"""
          if old not in s:
              raise SystemExit('chunk route block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Verify
        run: |
          grep -F "parts[0] === 'chunk'" 'api/sync/[...path].ts'
          grep -F "(req.query as any).slot" 'api/sync/[...path].ts'
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'api/sync/[...path].ts'
          git commit -m 'Support query-based cloud sync chunk route'
          git push
