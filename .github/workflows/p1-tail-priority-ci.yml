name: P1 semantic tail priority CI

on:
  push:
    branches: [fix/p1-semantic-tail-priority]
    paths:
      - 'lib/media/aiPlanner.ts'
      - '.github/workflows/p1-tail-priority-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
