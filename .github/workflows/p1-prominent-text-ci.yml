name: P1 prominent text CI

on:
  push:
    branches: [fix/p1-prominent-text-headline]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # verifies semantic prompt v6 and P1 opening publishability guards
