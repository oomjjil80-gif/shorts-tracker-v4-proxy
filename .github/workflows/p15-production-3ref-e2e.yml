name: P1.5 reference QC diagnostic

on:
  push:
    branches: [p15-final-prod-e2e]
    paths: ['.github/workflows/p15-production-3ref-e2e.yml']

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read existing Production Reference QC evidence only
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://shorts-tracker-v4-proxy.vercel.app'
          KEY='p15-final-prod-e2e-after-confidence-fix-71d915'
          JID='job_29e80b39-ce99-4c5c-916e-16149a444f2f'
          curl -fsS -H "X-Sync-Key: $KEY" "$BASE/api/story?taskType=job_get&id=$JID" >/tmp/state.json
          node - <<'NODE'
          const d=require('/tmp/state.json').job
          const v=d.variants[0]
          console.log(JSON.stringify({
            job:d.id,technical:v.qc,content:v.contentQc,reference:v.referenceQc,
            referenceReasons:v.referenceQcReasons,referenceChecks:v.referenceQcChecks,
            publishable:v.publishable
          },null,2))
          if(!Array.isArray(v.referenceQcChecks)||!v.referenceQcChecks.length) throw Error('reference evidence still unavailable')
          NODE
