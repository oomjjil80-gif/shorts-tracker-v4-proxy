name: P1-E production smoke (free)

# 무료 Production 스모크: 배포 상태 조회 + 승인 경로 확인. 유료 공급자(Gemini) 호출 0회.
# 모든 요청은 신·구 코드 어느 쪽이든 공급자 호출 전에 거절되는 입력만 쓴다(빈 prompt, 승인 없는 견적 요청).
on:
  push:
    branches: [ops/p1e-production-smoke]
    paths: ['.github/workflows/p1e-production-smoke.yml']

permissions:
  contents: read
  deployments: read
  statuses: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SHA: a585197dae6107de650fa0d266aab69a4ef3a308
      VERCEL: https://shorts-tracker-v4-proxy.vercel.app
      RAILWAY: https://tracker-api-continuity-production.up.railway.app
      GH_TOKEN: ${{ github.token }}
      SYNC_KEY: ${{ secrets.TRACKER_SYNC_KEY }}
    steps:
      - name: Deployments for the merge commit (wait up to 12 min)
        shell: bash
        run: |
          set -uo pipefail
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${{ github.repository }}/$1"; }
          for i in $(seq 1 24); do
            DEPS=$(api "deployments?sha=$SHA&per_page=20" || echo '[]')
            echo "$DEPS" > deps.json
            node -e "
              const d=require('./deps.json'); console.log('deployments for sha:', d.length);
              for (const x of d) console.log(' -', x.id, x.environment, x.creator?.login, x.created_at)
            "
            PENDING=0
            for id in $(node -e "for (const x of require('./deps.json')) console.log(x.id)"); do
              ST=$(api "deployments/$id/statuses?per_page=1" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const a=JSON.parse(s);const t=a[0]||{};console.log((t.state||'none')+' '+(t.environment_url||t.target_url||''))})")
              echo "   status $id: $ST"
              case "$ST" in success*|failure*|error*|inactive*) ;; *) PENDING=1;; esac
            done
            if [ "$(node -e "console.log(require('./deps.json').length)")" != "0" ] && [ $PENDING = 0 ]; then break; fi
            sleep 30
          done
          echo '--- commit statuses ---'
          api "commits/$SHA/status" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const a=JSON.parse(s);console.log('combined:',a.state);for(const x of a.statuses)console.log(' -',x.context,x.state,x.target_url||'')})"
      - name: API health (Vercel + Railway)
        shell: bash
        run: |
          set -uo pipefail
          for u in "$VERCEL/api/sync-health" "$RAILWAY/api/continuity-health" "$RAILWAY/api/sync-health"; do
            printf '%s -> ' "$u"; curl -sS -m 30 -o b.txt -w '%{http_code} ' "$u"; head -c 200 b.txt; echo
          done
      - name: Cardnews approval path (no provider call)
        shell: bash
        run: |
          set -euo pipefail
          KEY="p1e-smoke-$(date +%s)-0123456789abcdef0123"
          fail=0
          check() { # name expected_status url method body [key]
            local name=$1 want=$2 url=$3 method=$4 body=$5 key=${6:-}
            local code
            code=$(curl -sS -m 60 -o r.json -w '%{http_code}' -X "$method" -H 'Content-Type: application/json' ${key:+-H "X-Sync-Key: $key"} ${body:+--data "$body"} "$url")
            if [ "$code" = "$want" ]; then echo "PASS $name ($code) $(head -c 220 r.json)"; else echo "FAIL $name: want $want got $code $(head -c 300 r.json)"; fail=1; fi
          }
          IMG='{"prompt":"p1e smoke","aspectRatio":"4:5","imageSize":"1K","cutIndex":0,"references":[],"profile":"cardnews"}'
          # 1) /api/image 직접 카드뉴스 호출: 신코드 403(공급자 전), 구코드도 빈 prompt라 400(공급자 전)
          check 'Vercel /api/image direct cardnews -> 403' 403 "$VERCEL/api/image" POST '{"input":{"prompt":"","profile":"cardnews","aspectRatio":"4:5"}}'
          grep -q CARDNEWS_APPROVAL_REQUIRED r.json || { echo 'FAIL missing CARDNEWS_APPROVAL_REQUIRED'; fail=1; }
          for BASE in "$RAILWAY" "$VERCEL"; do
            # 2) 승인 없는 cardnews_image_direct -> 402 견적(공급자 0회)
            check "$BASE direct without key -> 401" 401 "$BASE/api/story" POST "{\"taskType\":\"cardnews_image_direct\",\"imageInput\":$IMG}"
            check "$BASE direct quote -> 402" 402 "$BASE/api/story" POST "{\"taskType\":\"cardnews_image_direct\",\"imageInput\":$IMG}" "$KEY"
            node -e "const r=require('./r.json'); if(r.error.code!=='COST_APPROVAL_REQUIRED'||r.estimate.usd!==0.067||!r.approval?.approvalId) process.exit(1)" && echo '   estimate 0.067 + approvalId issued' || { echo 'FAIL quote shape'; fail=1; }
            # 3) costApproved만(서버가 발급하지 않은 승인 ID) -> 다시 402, 공급자 0회
            check "$BASE direct forged approval -> 402" 402 "$BASE/api/story" POST "{\"taskType\":\"cardnews_image_direct\",\"imageInput\":$IMG,\"costApproved\":true,\"approvedUsd\":5,\"approvalId\":\"00000000-0000-4000-8000-000000000000\"}" "$KEY"
            # 4) 4:5 카드뉴스가 아니면 견적도 없음
            check "$BASE direct 9:16 -> 400" 400 "$BASE/api/story" POST "{\"taskType\":\"cardnews_image_direct\",\"imageInput\":{\"prompt\":\"x\",\"aspectRatio\":\"9:16\",\"profile\":\"cardnews\"}}" "$KEY"
            # 5) 기존 8장 경로: 저장본 없음 -> 409(승인·공급자 전)
            check "$BASE generate without saved state -> 409" 409 "$BASE/api/story" POST "{\"taskType\":\"cardnews_image_generate\",\"cardId\":\"c1\",\"baseRev\":1,\"imageInput\":$IMG}" "$KEY"
            # 6) 기존 기능: 카드뉴스 목록·Job 목록(빈 작업 공간)
            check "$BASE cardnews_list -> 200" 200 "$BASE/api/story?taskType=cardnews_list" GET '' "$KEY"
            check "$BASE job_list -> 200" 200 "$BASE/api/story?taskType=job_list" GET '' "$KEY"
          done
          exit $fail
      - name: Worker activity (read-only job_list, counts only)
        if: env.SYNC_KEY != ''
        shell: bash
        run: |
          set -uo pipefail
          curl -sS -m 60 -H "X-Sync-Key: $SYNC_KEY" "$RAILWAY/api/story?taskType=job_list&limit=50" -o jobs.json -w 'job_list %{http_code}\n'
          node -e "
            const r=require('./jobs.json'); if(!r.ok){console.log('job_list not ok', r.error?.code); process.exit(0)}
            const by={}; for(const j of r.jobs) by[j.status]=(by[j.status]||0)+1
            const last=r.jobs.map(j=>j.updatedAt).sort().pop()
            console.log('jobs:', r.jobs.length, 'by status:', JSON.stringify(by), 'last update:', last)
            const active=r.jobs.filter(j=>!['COMPLETE','FAILED','CANCELLED'].includes(j.status)).map(j=>j.status+'/'+j.stage+'@'+j.updatedAt)
            console.log('non-terminal:', active.slice(0,10).join(', ')||'none')
          "
