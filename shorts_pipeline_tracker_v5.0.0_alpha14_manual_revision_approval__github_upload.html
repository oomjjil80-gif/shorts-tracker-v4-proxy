= root.querySelector(\"#preview-fade-black\");\n  const newsCardBox = root.querySelector(\"#preview-news-card\");\n  const newsKicker = root.querySelector(\"#preview-news-kicker\");\n  const newsHeadline = root.querySelector(\"#preview-news-headline\");\n  const newsKeyInfo = root.querySelector(\"#preview-news-keyinfo\");\n  const econAidBox = root.querySelector(\"#preview-econ-aid\");\n  const subtitleBox = root.querySelector(\"#preview-subtitle\");\n  const scrubBar = root.querySelector(\"#pv-scrub\");\n  const playhead = root.querySelector(\"#pv-playhead\");\n  const playBtn = root.querySelector(\"#pv-play-pause\");\n\n  // -----------------------------------------------------------------------\n  // 오디오/BGM lifecycle — 이벤트당 <audio> 엘리먼트를 재사용한다(매번 새로 만들지 않음).\n  // 중첩 생성으로 같은 음성이 여러 번 겹쳐 재생되는 문제를 막기 위함(조건 6/14/48번).\n  // -----------------------------------------------------------------------\n\n  async function ensureAudioEl(evt) {\n    let entry = player.audioEls.get(evt.id);\n    if (entry) return entry;\n    const url = await getAssetObjectUrl(evt.assetId);\n    if (!url) return null;\n    if (player.audioEls.get(evt.id)) return player.audioEls.get(evt.id); // 동시 요청 방지\n    const audioEl = new Audio(url);\n    audioEl.preload = \"auto\";\n    audioEl.dataset.eventId = evt.id;\n    audioPool.appendChild(audioEl);\n    entry = { el: audioEl, playing: false };\n    player.audioEls.set(evt.id, entry);\n    return entry;\n  }\n\n  async function ensureBgmEl() {\n    if (!ep.bgm || !ep.bgm.assetId) return null;\n    if (player.bgmEl) return player.bgmEl;\n    const url = await getAssetObjectUrl(ep.bgm.assetId);\n    if (!url) return null;\n    if (player.bgmEl) return player.bgmEl;\n    const audioEl = new Audio(url);\n    audioEl.preload = \"auto\";\n    audioPool.appendChild(audioEl);\n    player.bgmEl = audioEl;\n    return audioEl;\n  }\n\n  // PAUSE(및 SEEK 시작 전): 현재 활성 중인 audio를 전부 정지한다 — \"모든 활성 audio 정지\".\n  function stopAllActiveAudio() {\n    player.audioEls.forEach((entry) => {\n      if (entry.playing || !entry.el.paused) {\n        try { entry.el.pause(); } catch (e) {}\n      }\n      entry.playing = false;\n    });\n    if (player.bgmEl && !player.bgmEl.paused) {\n      try { player.bgmEl.pause(); } catch (e) {}\n    }\n  }\n\n  // 현재 currentTime 기준으로 재생 중이어야 할 narration/dialogue/SFX를 재계산해 필요한 것만\n  // play()하고, 범위를 벗어난 것은 pause()한다. BGM은 별도로 envelope 볼륨을 적용한다.\n  async function syncAudioAndBgm(currentTime) {\n    if (!player.isPlaying) return;\n    const events = timeline.tracks.voice.concat(timeline.tracks.sfx);\n    for (const e of events) {\n      const evt = e.event;\n      if (!evt.assetId) continue;\n      const active = currentTime >= e.globalStart && currentTime < e.globalEnd;\n      if (active) {\n        const entry = await ensureAudioEl(evt);\n        if (!entry || !player.isPlaying) continue; // pause()가 그 사이 눌렸을 수 있음\n        const desiredOffset = Math.max(0, currentTime - e.globalStart);\n        // Beta 15 — 연속 재생 중에는 오디오 currentTime을 매 프레임 강제로 보정하지 않는다.\n        // 기존 0.35초 drift 보정은 모바일 브라우저에서 재생 헤드를 반복적으로 seek시켜\n        // 마스터 나레이션이 \"뚝뚝\" 끊기는 원인이 됐다. 시작/seek 직후에만 위치를 맞추고,\n        // 이미 재생 중인 트랙은 브라우저의 연속 오디오 clock을 그대로 신뢰한다.\n        if (!entry.playing) {\n          try { entry.el.currentTime = desiredOffset; } catch (err) {}\n        }\n        if (entry.el.paused) entry.el.play().catch(() => {});\n        entry.playing = true;\n      } else {\n        const entry = player.audioEls.get(evt.id);\n        if (entry && entry.playing) {\n          entry.el.pause();\n          entry.playing = false;\n        }\n      }\n    }\n\n    if (ep.bgm && ep.bgm.assetId) {\n      const bgmEl = await ensureBgmEl();\n      if (bgmEl && player.isPlaying) {\n        const start = ep.bgm.start || 0;\n        const end = ep.bgm.end != null ? ep.bgm.end : totalDuration;\n        const inRange = currentTime >= start && currentTime < end;\n        if (inRange) {\n          if (bgmEl.paused) {\n            try { seFn() : playFn());\n\n  function scrubToEvent(evt) {\n    const rect = scrubBar.getBoundingClientRect();\n    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;\n    if (clientX == null || !rect.width) return;\n    const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));\n    seek(ratio * totalDuration);\n  }\n  scrubBar.addEventListener(\"pointerdown\", (e) => {\n    player.scrubbing = true;\n    scrubToEvent(e);\n  });\n  scrubBar.addEventListener(\"pointermove\", (e) => {\n    if (player.scrubbing) scrubToEvent(e);\n  });\n  window.addEventListener(\"pointerup\", onWindowPointerUp);\n  scrubBar.addEventListener(\"click\", scrubToEvent);\n\n  // -----------------------------------------------------------------------\n  // v2.1-rc.1 — Caption Style Preset 편집 패널(작업지시서 1-C)\n  // -----------------------------------------------------------------------\n\n  async function isCaptionFontAvailable(font) {\n    if (!font) return false;\n    if (!font.probeFamily) return true; // 시스템 기본 글꼴은 항상 사용 가능.\n    try {\n      if (document.fonts && document.fonts.check) {\n        await document.fonts.ready.catch(() => {});\n        return document.fonts.check(`16px \"${font.probeFamily}\"`);\n      }\n    } catch (e) {}\n    return null; // 브라우저가 Font Loading API를 지원하지 않거나 판정 실패.\n  }\n\n  async function fontAvailabilityNote(fontId) {\n    const font = CAPTION_FONT_OPTIONS.find((f) => f.id === fontId);\n    if (!font) return \"\";\n    if (!font.probeFamily) {\n      return `<p class=\"hint\">시스템 기본 글꼴을 사용해요.</p>`;\n    }\n    const available = await isCaptionFontAvailable(font);\n    if (available === true) {\n      return `<p class=\"hint\" style=\"color:var(--accent2);\">✓ 이 기기에서 실제 사용 가능한 폰트로 확인됐어요.</p>`;\n    }\n    if (available === false) {\n      return `<p class=\"hint\" style=\"color:var(--text-dim);\">이 기기에 해당 폰트가 없으면 다음 안전 글꼴로 자동 대체돼요. 앱에는 폰트 파일을 번들하지 않습니다.</p>`;\n    }\n    return `<p class=\"hint\">이 브라우저에서는 설치 여부를 확인할 수 없어요. 선택 시 사용 가능하면 적용하고, 아니면 자동 대체돼요.</p>`;\n  }\n\n  async function decorateFontOptions(select) {\n    if (!select) return;\n    const results = await Promise.all(CAPTION_FONT_OPTIONS.map(async (font) => ({\n      font,\n      available: await isCaptionFontAvailable(font),\n    })));\n    const current = select.value; // 비동기 판정 도중 사용자가 선택을 바꿨다면 최신 값을 보존.\n    select.innerHTML = results.map(({ font, available }) => {\n      const suffix = font.probeFamily ? (available === true ? \" · 사용 가능\" : available === false ? \" · 대체 가능\" : \"\") : \" · 기본\";\n      return `<option value=\"${font.id}\" ${font.id === current ? \"selected\" : \"\"}>${escapeHtml(font.label + suffix)}</option>`;\n    }).join(\"\");\n  }\n\n  async function renderCaptionStyleCard() {\n    const mount = root.querySelector(\"#pv-caption-style-card\");\n    if (!mount) return;\n    const s = captionStyle;\n    const impact = analyzeCaptionImpact(s, cuts, timeline);\n    const confirmedSig = ep.captionStyleConfirmedSignature || \"\";\n    const currentSig = captionStyleSignature(s);\n    const confirmed = confirmedSig === currentSig;\n    const statusText = confirmed ? `✅ 최종 적용 확정됨${ep.captionStyleConfirmedAt ? ` · ${new Date(ep.captionStyleConfirmedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}` : \"\"}` : \"⚠ 변경사항 미확정 — 최종 MP4 전에 확정하세요\";\n    const riskText = impact.split.length\n      ? `✅ 긴 자막 ${impact.split.length}개 CUT 자동 분할 · 가장 긴 CUT ${impact.worst.cutIndex + 1}은 ${impact.worst.pageCount}페이지`\n      : (impact.measured.length ? `✅ 모든 자막이 현재 설정에서 1페이지` : `⚠ 자막 분석 대상 없음 — 미리보기에서 확인하세요`);\n    const safeText = `현재 크기 ${Number(s.fontSizePct).toFixed(1)}% (${Math.round(impact.fontPx)}px @1080p) · 긴 대사는 글씨를 줄이지 않고 시간순으로 자동 교체`;\n\n    mount.innerHTML = `\n      <h3>자막 스타일 · 최종 출력 기준</h3>\n      <p class=\"hint\">미리보기와 최종 MP4가 같은 설정을 사용합니다. 긴 대사는 글씨를 줄이지 않고 자동으로 여러 화면에 나눠 표시합니다. 변경 후 <b>최종 확정</b>을 눌러주세요.</p>\n      <div class=\"card\" style=\"margin:10px 0;padding:12px;\">\n        <div style=\"font-weight:800;\" data-caption-risk>${riskText}</div>\n        <div class=\"hint\" style=\"margin-top:4px;\" data-caption-safe>${safeText} · 한 화면 최대 ${s.maxLines}줄</div>\n        <div class=\"hint\" style=\"margin-top:4px;\" data-caption-status>${statusText}</div>\n      </div>\n      <div class=\"card\" style=\"margin:10px 0;padding:10px 12px;background:rgba(255,255,255,.04);\">\n        <div style=\"font-weight:800;\">👆 상단 큰 영상 미리보기에서 실제 자막을 확인하세요</div>\n        <div class=\"hint\" style=\"margin-top:4px;\">아래 설정을 바꾸면 상단 영상 미리보기에 즉시 반영됩니다. 별도의 작은 자막 미리보기는 사용하지 않습니다.</div>\n      </div>\n      <div class=\"caption-style-grid caption-quick-controls\" style=\"margin-top:10px;\">\n        <div class=\"full\"><label>글자 크기 <b data-caption-size-label>${Number(s.fontSizePct).toFixed(1)}% · 약 ${Math.round(impact.fontPx)}px(1080p)</b></label><input type=\"range\" min=\"1\" max=\"15\" step=\"0.1\" data-cs=\"fontSizePct\" value=\"${s.fontSizePct}\" /></div>\n        <div class=\"full\"><label>자막 가로 폭 <b data-caption-width-label>${Number(s.maxWidthPct).toFixed(0)}%</b></label><input type=\"range\" min=\"40\" max=\"100\" step=\"1\" data-cs=\"maxWidthPct\" value=\"${s.maxWidthPct}\" /><div class=\"hint\" style=\"margin-top:4px;\">100%는 영상 좌우 안전 여백을 거의 모두 쓰는 실제 최대 폭입니다.</div>\n          <div class=\"btn-row\" style=\"margin-top:6px;gap:6px;flex-wrap:nowrap;\"><button class=\"btn ghost small\" type=\"button\" data-caption-width-preset=\"80\">80%</button><button class=\"btn ghost small\" type=\"button\" data-caption-width-preset=\"90\">90%</button><button class=\"btn ghost small\" type=\"button\" data-caption-width-preset=\"96\">96% 넓게</button></div></div>\n        <div><label>한 화면 최대 줄 수</label><input type=\"number\" min=\"1\" max=\"6\" step=\"1\" data-cs=\"maxLines\" value=\"${s.maxLines}\" /></div>\n      </div>\n      <div class=\"btn-row\" style=\"margin-top:12px;flex-wrap:wrap;\">\n        <button class=\"btn\" id=\"pv-caption-style-confirm\" style=\"flex:1;min-width:220px;\" ${confirmed ? \"disabled\" : \"\"}>${confirmed ? \"✅ 자막 변경사항 확정됨\" : \"✓ 자막 변경사항 최종 확정\"}</button>\n      </div>\n      <details style=\"margin-top:12px;\">\n        <summary class=\"hint\" style=\"cursor:pointer;\">폰트·색상·위치 등 세부 자막 설정</summary>\n        <div class=\"caption-style-grid\" style=\"margin-top:10px;\">\n        <div class=\"full\">\n          <label>폰트</label>\n          <select data-cs=\"fontId\">${CAPTION_FONT_OPTIONS.map((f) => `<option value=\"${f.id}\" ${f.id === s.fontId ? \"selected\" : \"\"}>${escapeHtml(f.label)}</option>`).join(\"\")}</select>\n          <div data-font-note style=\"margin-top:4px;\"></div>\n        </div>\n        <div><label>굵기</label><select data-cs=\"fontWeight\">${CAPTION_FONT_WEIGHTS.map((w) => `<option value=\"${w}\" ${w === s.fontWeight ? \"selected\" : \"\"}>${w}</option>`).join(\"\")}</select></div>\n        <div><label>정렬</label><select data-cs=\"textAlign\"><option value=\"left\" ${s.textAlign === \"left\" ? \"selected\" : \"\"}>왼쪽</option><option value=\"center\" ${s.textAlign === \"center\" ? \"selected\" : \"\"}>가운데</option><option value=\"right\" ${s.textAlign === \"right\" ? \"selected\" : \"\"}>오른쪽</option></select></div>\n        <div><label>가로 위치</label><select data-cs=\"horizontalAlign\"><option value=\"left\" ${s.horizontalAlign === \"left\" ? \"selected\" : \"\"}>왼쪽</option><option value=\"center\" ${s.horizontalAlign === \"center\" ? \"selected\" : \"\"}>가운데</option><option value=\"right\" ${s.horizontalAlign === \"right\" ? \"selected\" : \"\"}>오른쪽</option></select></div>\n        <div><label>상단 위치(%)</label><input type=\"range\" min=\"0\" max=\"95\" step=\"1\" data-cs=\"topPct\" value=\"${s.topPct}\" /></div>\n        <div><label>줄 간격</label><input type=\"range\" min=\"1\" max=\"2.5\" step=\"0.05\" data-cs=\"lineHeight\" value=\"${s.lineHeight}\" /></div>\n        <div><label>글자 색</label><input type=\"color\" data-cs=\"textColor\" value=\"${s.textColor}\" /></div>\n        <div><label>외곽선 색</label><input type=\"color\" data-cs=\"strokeColor\" value=\"${s.strokeColor}\" /></div>\n        <div><label>외곽선 두께</label><input type=\"range\" min=\"0\" max=\"8\" step=\"0.5\" data-cs=\"strokeWidth\" value=\"${s.strokeWidth}\" /></div>\n        <div><label style=\"display:flex;align-items:center;gap:6px;\"><input type=\"checkbox\" data-cs=\"shadow\" style=\"width:auto;\" ${s.shadow ? \"checked\" : \"\"} /> 그림자</label></div>\n        ${s.shadow ? `<div><label>그림자 강도</label><input type=\"range\" min=\"0\" max=\"1\" step=\"0.05\" data-cs=\"shadowIntensity\" value=\"${s.shadowIntensity}\" /></div>` : \"\"}\n        <div><label style=\"display:flex;align-items:center;gap:6px;\"><input type=\"checkbox\" data-cs=\"backgroundBox\" style=\"width:auto;\" ${s.backgroundBox ? \"checked\" : \"\"} /> 배경 박스</label></div>\n        ${s.backgroundBox ? `<div><label>배경 색</label><input type=\"color\" data-cs=\"backgroundColor\" value=\"${s.backgroundColor}\" /></div><div><label>배경 불투명도</label><input type=\"range\" min=\"0\" max=\"1\" step=\"0.05\" data-cs=\"backgroundOpacity\" value=\"${s.backgroundOpacity}\" /></div><div><label>배경 모서리 둥글기</label><input type=\"range\" min=\"0\" max=\"40\" step=\"1\" data-cs=\"backgroundRadius\" value=\"${s.backgroundRadius}\" /></div>` : \"\"}\n        </div>\n        <div class=\"btn-row\" style=\"margin-top:12px;\">\n          <button class=\"btn secondary small\" id=\"pv-caption-style-reset\">${escapeHtml(\"채널 기본(CHANNEL_TOP_CAPTION)\")}으로 리셋</button>\n        </div>\n      </details>\n    `;\n\n    const fontSelect = mount.querySelector('[data-cs=\"fontId\"]');\n    const refreshCaptionCardStatus = () => {\n      const liveImpact = analyzeCaptionImpact(captionStyle, cuts, timeline);\n      const label=mount.querySelector('[data-caption-size-label]');\n      if(label) label.textContent=`${Number(captionStyle.fontSizePct).toFixed(1)}% · 약 ${Math.round(1080*Number(captionStyle.fontSizePct)/100)}px(1080p)`;\n      const widthLabel=mount.querySelector('[data-caption-width-label]');\n      if(widthLabel) widthLabel.textContent=`${Number(captionStyle.maxWidthPct).toFixed(0)}%`;\n      const risk=mount.querySelector('[data-caption-risk]');\n      if (risk) risk.textContent = liveImpact.split.length\n        ? `✅ 긴 자막 ${liveImpact.split.length}개 CUT 자동 분할 · 가장 긴 CUT ${liveImpact.worst.cutIndex + 1}은 ${liveImpact.worst.pageCount}페이지`\n        : (liveImpact.measured.length ? `✅ 모든 자막이 현재 설정에서 1페이지` : `⚠ 자막 분석 대상 없음 — 미리보기에서 확인하세요`);\n      const safe=mount.querySelector('[data-caption-safe]');\n      if (safe) safe.textContent=`현재 크기 ${Number(captionStyle.fontSizePct).toFixed(1)}% (${Math.round(liveImpact.fontPx)}px @1080p) · 긴 대사는 글씨를 줄이지 않고 시간순으로 자동 교체 · 한 화면 최대 ${captionStyle.maxLines}줄`;\n      const status=mount.querySelector('[data-caption-status]');\n      if (status) status.textContent='⚠ 변경사항 미확정 — 최종 MP4 전에 확정하세요';\n      const btn=mount.querySelector('#pv-caption-style-confirm');\n      if (btn) { btn.disabled=false; btn.textContent='✓ 자막 변경사항 최종 확정'; }\n      renderSubtitle(player.currentTime || 0);\n    };\n    decorateFontOptions(fontSelect);\n    fontAvailabilityNote(s.fontId).then((html)=>{ const noteEl=mount.querySelector(\"[data-font-note]\"); if(noteEl) noteEl.innerHTML=html; });\n\n    mount.querySelectorAll(\"[data-cs]\").forEach((input) => {\n      const key=input.dataset.cs, isCheckbox=input.type===\"checkbox\";\n      const commit=async()=>{\n        const raw=isCheckbox?input.checked:(input.type===\"range\"||input.type===\"number\"?Number(input.value):input.value);\n        captionStyle={...captionStyle,[key]:raw}; ep.captionStyle=captionStyle;\n        ep.captionStyleConfirmedSignature=null; ep.captionStyleConfirmedAt=null; ep.previewReviewedAt=null;\n        applyCaptionStyleToDom(); refreshCaptionCardStatus();\n        await ctx.save({ captionStyle:ep.captionStyle, captionStyleConfirmedSignature:null, captionStyleConfirmedAt:null, previewReviewedAt:null });\n        if (key === \"shadow\" || key === \"backgroundBox\") {\n          await renderCaptionStyleCard();\n          const details = root.querySelector(\"#pv-caption-style-card details\");\n          if (details) details.open = true;\n        }\n        renderReviewCard();\n      };\n      input.addEventListener(isCheckbox||input.tagName===\"SELECT\"?\"change\":\"change\",commit);\n      if (input.type === \"range\") input.addEventListener(\"input\",()=>{ const raw=Number(input.value); captionStyle={...captionStyle,[key]:raw}; ep.captionStyle=captionStyle; ep.captionStyleConfirmedSignature=null; ep.captionStyleConfirmedAt=null; applyCaptionStyleToDom(); refreshCaptionCardStatus(); });\n    });\n\n    mount.querySelectorAll(\"[data-caption-width-preset]\").forEach((btn)=>{\n      btn.onclick=async()=>{\n        const v=Number(btn.dataset.captionWidthPreset);\n        captionStyle={...captionStyle,maxWidthPct:v}; ep.captionStyle=captionStyle;\n        ep.captionStyleConfirmedSignature=null; ep.captionStyleConfirmedAt=null; ep.previewReviewedAt=null;\n        const range=mount.querySelector('[data-cs=\"maxWidthPct\"]'); if(range) range.value=String(v);\n        applyCaptionStyleToDom(); refreshCaptionCardStatus();\n        await ctx.save({captionStyle:ep.captionStyle,captionStyleConfirmedSignature:null,captionStyleConfirmedAt:null,previewReviewedAt:null});\n        renderReviewCard();\n      };\n    });\n\n    mount.querySelector(\"#pv-caption-style-reset\").onclick=async()=>{ captionStyle=newCaptionStyle(); ep.captionStyle=captionStyle; ep.captionStyleConfirmedSignature=null; ep.captionStyleConfirmedAt=null; ep.previewReviewedAt=null; await ctx.save({captionStyle:ep.captionStyle,captionStyleConfirmedSignature:null,captionStyleConfirmedAt:null,previewReviewedAt:null}); applyCaptionStyleToDom(); renderCaptionStyleCard(); renderReviewCard(); toast(\"채널 기본 자막 스타일로 되돌렸어요 — 최종 확정이 필요합니다\"); };\n    mount.querySelector(\"#pv-caption-style-confirm\").onclick=async()=>{ ep.captionStyle=captionStyle; ep.captionStyleConfirmedSignature=captionStyleSignature(captionStyle); ep.captionStyleConfirmedAt=Date.now(); await ctx.save({captionStyle:ep.captionStyle,captionStyleConfirmedSignature:ep.captionStyleConfirmedSignature,captionStyleConfirmedAt:ep.captionStyleConfirmedAt}); renderCaptionStyleCard(); toast(\"자막 변경사항을 최종 출력 설정으로 확정했어요\"); };\n  }\n\n  // -----------------------------------------------------------------------\n  // QC 결과 패널\n  // -----------------------------------------------------------------------\n\n  function renderQcCard() {\n    const items = getQcResults(ep);\n    const summary = summarizeQc(items);\n    const mount = root.querySelector(\"#pv-qc-card\");\n    mount.innerHTML = `\n      <h3>QC 결과</h3>\n      <p class=\"hint\">ERROR ${summary.errorCount} · WARNING ${summary.warningCount} · INFO ${summary.infoCount}</p>\n      ${renderQcGroup(\"ERROR\", QC_SEVERITY.ERROR, items)}\n      ${renderQcGroup(\"WARNING\", QC_SEVERITY.WARNING, items)}\n      ${renderQcGroup(\"INFO\", QC_SEVERITY.INFO, items)}\n    `;\n    mount.querySelectorAll(\"[data-qc-jump]\").forEach((btn) => {\n      btn.onclick = () => {\n        const idx = Number(btn.dataset.qcJump);\n        if (!isNaN(idx)) seek(getCutGlobalRange(cuts, idx).start);\n      };\n    });\n    return { items, summary };\n  }\n\n  function renderQcGroup(label, severity, items) {\n    const list = items.filter((i) => i.severity === severity);\n    if (!list.length) return \"\";\n    return `<div class=\"qc-group\" data-qc-group=\"${severity}\">\n      <p class=\"hint\" style=\"font-weight:700;margin-top:10px;\">${label} ${list.length}</p>\n      ${list\n        .map((i) =>\n          i.cutIndex != null\n            ? `<button type=\"button\" class=\"qc-item qc-${severity}\" data-qc-jump=\"${i.cutIndex}\">${escapeHtml(i.message)}</button>`\n            : `<p class=\"qc-item qc-${severity}\">${escapeHtml(i.message)}</p>`\n        )\n        .join(\"\")}\n    </div>`;\n  }\n\n  // -----------------------------------------------------------------------\n  // 검토 완료 카드 — 매번 새로 계산해서 최신 상태만 보여준다(Phase 4에서 발견한 stale 카드\n  // 버그의 교훈 — 이 화면은 편집 기능이 없어 로컬 갱신 경로가 없지만, 원칙은 동일하게 지킨다).\n  // -----------------------------------------------------------------------\n\n  function renderReviewCard() {\n    const mount = root.querySelector(\"#pv-review-mount\");\n    if (!mount) return;\n    const summary = summarizeQc(getQcResults(ep));\n    mount.innerHTML = `<div class=\"card\"></div>`;\n    const card = mount.querySelector(\".card\");\n    if (summary.errorCount > 0) {\n      card.innerHTML = `<h3>최종 확인</h3><p class=\"hint\">ERROR ${summary.errorCount}건 때문에 아직 최종 제작으로 넘어갈 수 없어요.</p>\n        <button class=\"btn\" id=\"pv-open-qc\" style=\"width:100%;margin-top:8px;\">⚠ ERROR ${summary.errorCount}건 확인</button>`;\n      card.querySelector(\"#pv-open-qc\").onclick = () => {\n        const advanced = root.querySelector(\"#pv-advanced-tools\");\n        if (advanced) {\n          advanced.open = true;\n          advanced.scrollIntoView({ behavior: \"smooth\", block: \"start\" });\n        }\n      };\n    } else if (ep.previewReviewedAt) {\n      card.innerHTML = `<h3>최종 확인</h3><p class=\"hint\">✅ 미리보기/QC 확인 완료 · 이제 실제 영상 파일을 만들 수 있어요.</p>\n        <button class=\"btn\" id=\"pv-go-export\" style=\"width:100%;margin-top:8px;\">⑥ 내보내기 / 영상 만들기 →</button>`;\n      card.querySelector(\"#pv-go-export\").onclick = () => {\n        teardown();\n        location.hash = `#/episode/${ep.id}/cutExport`;\n      };\n    } else {\n      card.innerHTML = `<h3>최종 확인</h3><p class=\"hint\">ERROR는 없습니다. 위 미리보기를 확인했다면 한 번만 확정하세요.</p>\n        <button class=\"btn\" id=\"pv-mark-reviewed\" style=\"width:100%;margin-top:8px;\">✓ 미리보기 / QC 확인 완료</button>`;\n      card.querySelector(\"#pv-mark-reviewed\").onclick = async () => {\n        teardown();\n        ep.previewReviewedAt = Date.now();\n        await ctx.save({ previewReviewedAt: ep.previewReviewedAt });\n        toast(\"미리보기 / QC 확인을 완료했어요\");\n        ctx.reRender();\n      };\n    }\n  }\n\n  renderQcCard();\n  renderReviewCard();\n  renderCaptionStyleCard();\n  setTime(0);\n}\n","js_v420a12/production.js":"// Phase 6 — production.json 생성 도메인 모듈.\n//\n// 이 화면(cutExportStep.js)이 직접 production.json을 조립하지 않는다 — \"View 안에 조립 로직을\n// 작성하지 마세요\"라는 조건에 따라 전부 여기서만 만든다. View는 이 모듈이 반환한 결과를\n// 표시/복사/다운로드만 한다.\n//\n// 핵심 원칙(조건 28번, \"Timeline = Preview = production.json\"):\n// - 시간 계산은 절대 여기서 다시 만들지 않는다 — timeline.js(getCutGlobalRange/getEpisodeDuration/\n//   buildTimeline)를 그대로 재사용한다. Preview가 재생하는 값과 production.json에 찍히는 값이\n//   서로 다른 계산 경로를 타면 \"명세와 실제가 다르다\"는 최악의 결과가 되기 때문이다.\n// - Preview/QC(qc.js)의 규칙도 새로 만들지 않는다 — getQcResults()를 그대로 재사용하고,\n//   Phase 6에서만 필요한(실제 asset 존재 검증 등) 규칙만 얹는다.\n// - production.json은 Tracker 내부 데이터 모델(JSON.stringify(episode))이 아니다 — 내부 필드명이\n//   나중에 바뀌어도 Renderer 계약이 불필요하게 깨지지 않도록, 아래 buildCutSchema/buildAudioEventSchema\n//   등 명시적 매핑 함수를 항상 거친다.\n\nimport { getAsset } from \"./db.js\";\nimport { getMasterStart, resolveCaptionStyle } from \"./model.js\";\nimport { getCutGlobalRange, getEpisodeDuration, buildTimeline, describeCutDuration } from \"./timeline.js\";\nimport { getQcResults, QC_SEVERITY } from \"./qc.js\";\nimport { PRODUCTION_SCHEMA_VERSION, APP_VERSION as APP_VERSION_SSOT } from \"./version.js\";\n\n// Phase 7: 버전 문자열은 js/version.js가 유일한 소스다 — 여기서 다시 리터럴로 적지 않는다.\n// export 이름은 기존 호출부(cutExportStep.js, 테스트)와의 호환을 위해 그대로 유지한다.\nexport const SCHEMA_VERSION = PRODUCTION_SCHEMA_VERSION;\nexport const APP_VERSION = APP_VERSION_SSOT;\n\n// 향후 사용자가 직접 바꿀 수 있는 화면이 생기더라도(Phase 6 범위 밖) episode.renderSettings가\n// 이미 있으면 그 값을 우선한다 — 지금은 이 기본값만 실제로 쓰인다.\nexport const DEFAULT_RENDER_SETTINGS = { width: 1080, height: 1920, fps: 30 };\nexport const RENDER_PRESETS = [\n  { id: \"shorts_720p\", label: \"720 × 1280\", width: 720, height: 1280 },\n  { id: \"shorts_1080p\", label: \"1080 × 1920 (권장)\", width: 1080, height: 1920 },\n  { id: \"shorts_1440p\", label: \"1440 × 2560\", width: 1440, height: 2560 },\n];\nexport const RENDER_FPS_OPTIONS = [24, 30, 60];\n\nexport function normalizeRenderSettings(raw) {\n  const input = raw && typeof raw === \"object\" ? raw : {};\n  const width = Number(input.width);\n  const height = Number(input.height);\n  const fps = Number(input.fps);\n  const preset = RENDER_PRESETS.find((p) => p.width === width && p.height === height) || RENDER_PRESETS[1];\n  return {\n    width: preset.width,\n    height: preset.height,\n    fps: RENDER_FPS_OPTIONS.includes(fps) ? fps : DEFAULT_RENDER_SETTINGS.fps,\n  };\n}\n\nexport function getRendererReadiness(production) {\n  const checks = [];\n  const add = (ok, label, detail = \"\") => checks.push({ ok: !!ok, label, detail });\n  const rs = normalizeRenderSettings(production?.renderSettings);\n  add((rs.width * 16) === (rs.height * 9), \"9:16 렌더 규격\", `${rs.width}×${rs.height}`);\n  add(RENDER_FPS_OPTIONS.includes(rs.fps), \"지원 FPS\", `${rs.fps}fps`);\n  add(!!production?.captionStyle, \"자막 스타일 계약\", production?.captionStyle ? \"production.json 포함\" : \"누락\");\n  add((production?.cuts || []).length > 0, \"CUT 데이터\", `${(production?.cuts || []).length}개`);\n  add(Number(production?.totalDuration) > 0, \"전체 길이\", `${Number(production?.totalDuration || 0).toFixed(2)}초`);\n  const broken = (production?.assets || []).filter((a) => a.broken).length;\n  add(broken === 0, \"미디어 참조\", broken ? `깨진 asset ${broken}개` : `${(production?.assets || []).length}개 정상`);\n  return { ready: checks.every((c) => c.ok), checks };\n}\n\n// ---------------------------------------------------------------------------\n// 파일명 — Renderer가 어떤 OS/파일시스템에서 실행되어도 안전하게 쓸 수 있는 이름을 만든다.\n// ---------------------------------------------------------------------------\n\nconst EXT_BY_MIME = {\n  \"image/png\": \"png\",\n  \"image/jpeg\": \"jpg\",\n  \"image/jpg\": \"jpg\",\n  \"image/webp\": \"webp\",\n  \"image/gif\": \"gif\",\n  \"audio/wav\": \"wav\",\n  \"audio/x-wav\": \"wav\",\n  \"audio/wave\": \"wav\",\n  \"audio/mpeg\": \"mp3\",\n  \"audio/mp3\": \"mp3\",\n  \"audio/mp4\": \"m4a\",\n  \"audio/aac\": \"aac\",\n  \"audio/ogg\": \"ogg\",\n  \"audio/webm\": \"webm\",\n};\n\nexport function extFromMime(mimeType, fallbackName) {\n  if (mimeType && EXT_BY_MIME[mimeType]) return EXT_BY_MIME[mimeType];\n  const m = /\\.([a-zA-Z0-9]+)$/.exec(fallbackName || \"\");\n  if (m) return m[1].toLowerCase();\n  return \"bin\";\n}\n\n// 경로 구분자·제어문자 등 파일시스템에 위험한 문자만 제거하고, 한글/영문/숫자는 그대로 둔다.\n// 공백은 밑줄로 치환한다(공백이 포함된 파일명은 일부 Renderer/커맨드라인 도구에서 다루기 번거롭다).\nexport function sanitizeFilename(name, fallback = \"asset\") {\n  let s = String(name ?? \"\").trim();\n  s = s.replace(/[\\/\\\\:*?\"<>|]/g, \"\");\n  s = s.replace(/[\\x00-\\x1f]/g, \"\");\n  s = s.replace(/\\s+/g, \"_\");\n  s = s.replace(/^\\.+/, \"\");\n  s = s.slice(0, 80);\n  return s || fallback;\n}\n\n// content_issue의 slug()와 동일한 규칙(한글/영문/숫자만 남기고 나머지는 밑줄) — 두 Export\n// 화면이 파일명 만드는 방식을 다르게 두지 않기 위해 같은 규칙을 여기서도 그대로 쓴다.\nfunction slugTitle(s) {\n  return (s || \"episode\").replace(/[^\\w가-힣]+/g, \"_\").slice(0, 40);\n}\n\nexport function productionFilename(episode) {\n  return `production_${slugTitle(episode?.title)}.json`;\n}\n\nfunction pad2(n) {\n  return String(n).padStart(2, \"0\");\n}\n\nfunction buildFilename(usage, ext) {\n  switch (usage.usage) {\n    case \"cutImage\":\n      return `cut${pad2(usage.cutNumber)}.${ext}`;\n    case \"styleReference\":\n      return `style_reference.${ext}`;\n    case \"characterReference\":\n      return `character_reference.${ext}`;\n    case \"bgm\":\n      return `bgm.${ext}`;\n    case \"masterNarration\":\n      return `master_narration.${ext}`;\n    case \"audioEvent\": {\n      const n = pad2(usage.cutNumber);\n      if (usage.eventType === \"narration\") return `cut${n}_narration.${ext}`;\n      if (usage.eventType === \"dialogue\") {\n        const tag = sanitizeFilename(usage.speaker, \"\").toLowerCase() || \"dialogue\";\n        return `cut${n}_dialogue_${tag}.${ext}`;\n      }\n      if (usage.eventType === \"sfx\") {\n        const tag = sanitizeFilename(usage.name, \"\").toLowerCase() || \"sfx\";\n        return `cut${n}_sfx_${tag}.${ext}`;\n      }\n      return `cut${n}_audio.${ext}`;\n    }\n    default:\n      return `asset.${ext}`;\n  }\n}\n\nfunction audioTypeLabel(type) {\n  return { narration: \"나레이션\", dialogue: \"대사\", sfx: \"SFX\", silence: \"정적\" }[type] || \"오디오\";\n}\n\nfunction usageLabel(ref) {\n  if (ref.usage === \"cutImage\") return `CUT ${ref.cutNumber} 이미지`;\n  if (ref.usage === \"audioEvent\") return `CUT ${ref.cutNumber} ${audioTypeLabel(ref.eventType)}`;\n  if (ref.usage === \"bgm\") return \"BGM\";\n  if (ref.usage === \"masterNarration\") return \"마스터 나레이션\";\n  if (ref.usage === \"styleReference\") return \"스타일 레퍼런스\";\n  if (ref.usage === \"characterReference\") return \"캐릭터 레퍼런스\";\n  return \"asset\";\n}\n\nfunction stepHintForUsage(usage) {\n  if (usage === \"cutImage\" || usage === \"styleReference\" || usage === \"characterReference\") return \"cutImages\";\n  return \"cutAudio\";\n}\n\n// ---------------------------------------------------------------------------\n// 1) episode가 실제로 참조하는 asset 목록 수집 — \"사용하지 않는 고아 Asset은 넣지 않는다\"는\n//    조건을 지키기 위해, episode 데이터를 훑어서 실제로 참조되는 assetId만 모은다.\n// ---------------------------------------------------------------------------\n\nfunction resolveDialogueSpeaker(cut, evt) {\n  const line = (cut.dialogueLines || []).find((l) => l.id === evt.sourceDialogueId);\n  return (line && line.speaker) || \"\";\n}\n\nexport function collectAssetUsages(episode) {\n  const usages = [];\n  if (!episode) return usages;\n  if (episode.styleReferenceAssetId) {\n    usages.push({ assetId: episode.styleReferenceAssetId, kind: \"image\", usage: \"styleReference\" });\n  }\n  if (episode.characterReferenceAssetId) {\n    usages.push({ assetId: episode.characterReferenceAssetId, kind: \"image\", usage: \"characterReference\" });\n  }\n  if (episode.bgm && episode.bgm.assetId) {\n    usages.push({ assetId: episode.bgm.assetId, kind: \"audio\", usage: \"bgm\" });\n  }\n  // rc.3(Master Narration Mode) — 마스터 나레이션 파일도 다른 asset과 똑같이 \"실제로\n  // 참조되는 asset\"으로 등록해야 한다. 이걸 빼먹으면 (1) production.json의 asset manifest에\n  // 이 파일이 아예 빠져 Renderer가 받을 수 없고, (2) Data Health Check/findOrphanAssets가\n  // 이 파일을 \"아무도 참조하지 않는 고아 asset\"으로 잘못 판단하게 된다.\n  if (episode.audioMode === \"master_narration\" && episode.masterNarration && episode.masterNarration.assetId) {\n    usages.push({\n      assetId: episode.masterNarration.assetId,\n      kind: \"audio\",\n      usage: \"masterNarration\",\n      sourceDuration: episode.masterNarration.duration ?? null,\n    });\n  }\n  (episode.cuts || []).forEach((cut, i) => {\n    const n = i + 1;\n    if (cut.image && cut.image.assetId) {\n      usages.push({ assetId: cut.image.assetId, kind: \"image\", usage: \"cutImage\", cutIndex: i, cutId: cut.id, cutNumber: n });\n    }\n    if (cut.video && cut.video.assetId) {\n      usages.push({ assetId: cut.video.assetId, kind: \"video\", usage: \"cutVideo\", cutIndex: i, cutId: cut.id, cutNumber: n });\n    }\n    (cut.audioEvents || []).forEach((evt) => {\n      if (!evt.assetId) return;\n      // rc.4(코드 리뷰 수정) — master_narration 모드에서 CUT별 narration audioEvent는\n      // \"DB에는 보존하지만 production에는 활성 asset으로 내보내지 않는\" 비활성 데이터다\n      // (timeline.js의 VOICE 트랙 필터링과 동일한 원칙). 여기서 제외해야 asset manifest에도\n      // 빠지고(MN-25), 아래 buildCutSchema()가 만드는 CUT audioEvents 목록에서도 이 이벤트\n      // 자체가 함께 빠지므로(같은 필터를 buildCutSchema에도 적용) validateProduction()의\n      // \"manifest에 없는 asset 참조\" 오탐도 생기지 않는다. per_cut으로 되돌아가면 이 필터가\n      // 그냥 통과하지 않게 되어(else 분기) 다시 정상적으로 활성 usage로 잡힌다 — episode 데이터\n      // 자체는 이 필터링 동안 한 번도 수정되지 않는다.\n      if (episode.audioMode === \"master_narration\" && evt.type === \"narration\") return;\n      usages.push({\n        assetId: evt.assetId,\n        kind: \"audio\",\n        usage: \"audioEvent\",\n        cutIndex: i,\n        cutId: cut.id,\n        cutNumber: n,\n        eventId: evt.id,\n        eventType: evt.type,\n        speaker: evt.type === \"dialogue\" ? resolveDialogueSpeaker(cut, evt) || evt.speaker || \"\" : \"\",\n        name: evt.type === \"sfx\" ? evt.name || \"\" : \"\",\n        sourceDuration: evt.sourceDuration ?? evt.duration ?? null,\n      });\n    });\n  });\n  return usages;\n}\n\n// ---------------------------------------------------------------------------\n// 2) 실제 IndexedDB assets store를 조회해 asset manifest를 만든다(조건 6, 7).\n//    qc.js는 동기 구조상 \"assetId 필드가 있는가\"만 본다 — 여기서는 그 assetId가 실제로\n//    Blob과 함께 저장돼 있는지까지 실제로 조회해서 검증한다(broken reference 발견).\n// ---------------------------------------------------------------------------\n\nexport async function loadAssetManifest(episode) {\n  const usages = collectAssetUsages(episode);\n  const firstUsageById = new Map();\n  usages.forEach((u) => {\n    if (!firstUsageById.has(u.assetId)) firstUsageById.set(u.assetId, u);\n  });\n\n  const usedNames = new Set();\n  const manifest = [];\n  const brokenRefs = [];\n\n  for (const [assetId, usage] of firstUsageById) {\n    let asset = null;\n    try {\n      asset = await getAsset(assetId);\n    } catch (e) {\n      asset = null;\n    }\n    const broken = !asset || !asset.blob;\n    if (broken) {\n      usages.filter((u) => u.assetId === assetId).forEach((u) => brokenRefs.push(u));\n    }\n\n    const mimeType = asset?.mimeType || null;\n    const ext = extFromMime(mimeType, asset?.originalFileName);\n    let filename = broken ? null : buildFilename(usage, ext);\n    if (filename) {\n      let unique = filename;\n      let suffix = 2;\n      while (usedNames.has(unique)) {\n        const dot = filename.lastIndexOf(\".\");\n        unique = dot > -1 ? `${filename.slice(0, dot)}_${suffix}${filename.slice(dot)}` : `${filename}_${suffix}`;\n        suffix++;\n      }\n      filename = unique;\n      usedNames.add(filename);\n    }\n\n    const entry = {\n      id: assetId,\n      kind: usage.kind,\n      filename,\n      mimeType,\n      size: asset?.sizeBytes ?? null,\n    };\n    if (usage.kind === \"audio\") entry.duration = usage.sourceDuration ?? null;\n    if (broken) entry.broken = true;\n    manifest.push(entry);\n  }\n\n  return { manifest, brokenRefs, usages };\n}\n\n// ---------------------------------------------------------------------------\n// 3) production.json 조립 — 순수 함수(비동기/DB 조회 없음). assetManifestResult는\n//    loadAssetManifest()가 미리 계산해 넘겨준 결과를 그대로 받는다.\n// ---------------------------------------------------------------------------\n\nfunction buildAudioEventSchema(evt, cut, cutGlobalStart) {\n  const cutRelativeStart = evt.start || 0;\n  const base = {\n    id: evt.id,\n    type: evt.type,\n    assetId: evt.assetId || null,\n    cutRelativeStart,\n    globalStart: cutGlobalStart + cutRelativeStart,\n    duration: evt.duration ?? 0,\n    volume: evt.volume ?? 1,\n    fadeIn: evt.fadeIn || 0,\n    fadeOut: evt.fadeOut || 0,\n  };\n  if (evt.type === \"narration\") {\n    // Subtitle과 동일한 원칙 — 원문은 항상 Story(cut.narration)에서 읽는다. audioEvent에\n    // 남아있을 수 있는 옛 evt.text는 신뢰하지 않는다(Phase 5 원칙을 Phase 6에도 그대로 적용).\n    base.text = cut.narration || \"\";\n  } else if (evt.type === \"dialogue\") {\n    const line = (cut.dialogueLines || []).find((l) => l.id === evt.sourceDialogueId);\n    base.speaker = (line && line.speaker) || evt.speaker || \"\";\n    base.text = (line && line.text) || \"\";\n    base.sourceDialogueId = evt.sourceDialogueId || null;\n  } else if (evt.type === \"sfx\") {\n    base.name = evt.name || \"\";\n  }\n  return base;\n}\n\nfunction compactNewsText(text, max = 34) {\n  const clean = String(text || \"\").replace(/\\s+/g, \" \").trim();\n  if (clean.length <= max) return clean;\n  return clean.slice(0, max - 1).trimEnd() + \"…\";\n}\n\nfunction deriveNewsCard(cut, i, channelKey) {\n  if (channelKey !== \"economy_current\") return null;\n\n  const narration = String(cut?.narration || \"\").replace(/\\s+/g, \" \").trim();\n  const rawSituation = String(cut?.situation || \"\").replace(/\\s+/g, \" \").trim();\n  const purpose = String(cut?.purpose || \"\").replace(/\\s+/g, \" \").trim();\n\n  // Preview와 동일하게 내부 메타(scene:/top:)는 최종 영상 문구에 노출하지 않는다.\n  const situationParts = rawSituation\n    .split(\"·\")\n    .map((x) => x.trim())\n    .filter(Boolean);\n  const topPart = situationParts.find((x) => /^top:/i.test(x));\n  const importedTopKey = topPart ? topPart.replace(/^top:/i, \"\").trim() : \"\";\n  const publicSituation = situationParts\n    .filter((x) => !/^scene:/i.test(x) && !/^top:/i.test(x))\n    .join(\" · \")\n    .trim();\n\n  let keyInfo = importedTopKey;\n  if (/12\\s*억/.test(narration)) keyInfo = \"기본공제 12억원 유지\";\n  else if (/150\\s*%/.test(narration)) keyInfo = \"세부담 상한 150% 유지\";\n  else if (/ISA/i.test(narration) && /(계약기간|납입한도)/.test(narration)) keyInfo = \"ISA 계약기간·납입한도 현행 유지\";\n  else if (/국회/.test(narration)) keyInfo = \"정부안 확정 · 국회 심사 예정\";\n  else if (/29일|한 달/.test(narration) && /(뒤집|수정)/.test(narration)) keyInfo = \"29일 만에 정책 방향 재수정\";\n  else if (!keyInfo) {\n    const numberHit = narration.match(/(?:\\d[\\d,.]*\\s*(?:원|만원|억원|조원|%|퍼센트|년|개월|일|배|명|건|가구|세|억|조)|ISA|종부세|부가세|소득세|법인세|금리|물가|세율|공제|한도|예산)/i);\n    if (numberHit) {\n      const at = narration.indexOf(numberHit[0]);\n      keyInfo = compactNewsText(\n        narration.slice(Math.max(0, at - 11), Math.min(narration.length, at + numberHit[0].length + 17)).trim(),\n        36\n      );\n    } else {\n      const firstSentence = narration.split(/[.!?。]/)[0] || narration;\n      keyInfo = compactNewsText(firstSentence, 32);\n    }\n  }\n\n  // Preview Alpha62와 동일한 \"대사 축약이 아닌 화면용 카피\" 규칙.\n  const all = `${publicSituation} ${narration} ${purpose}`;\n  let headline = compactNewsText(publicSituation || keyInfo || narration, 18);\n\n  if (/실제.*금리.*상승|금리.*오른 게 아니|금리.*인상.*아니/.test(all)) headline = \"금리 인상 NO!!\";\n  else if (/인정.*여유.*줄|여유.*작아/.test(all)) headline = \"대출 여유 DOWN!\";\n  else if (/사람마다.*한도|한도.*다르|누구나.*똑같/.test(all)) headline = \"한도, 사람마다 다름!\";\n  else if ((/내 돈|자기자금/.test(all)) && (/늘|더 채/.test(all))) headline = \"내 돈 부담 UP!\";\n  else if (/잘 들어봐|계산.*비밀|왜.*한도/.test(all)) headline = \"한도 계산의 비밀\";\n  else if (/구독|좋아요/.test(all)) headline = \"구독·좋아요 = 시간 SAVE!\";\n  else if (/줄.*서|기다|궁금증.*시간/.test(all)) headline = \"궁금증 해결엔 시간 필요!\";\n\n  return {\n    kicker: \"\",\n    headline: compactNewsText(headline, 20),\n    keyInfo: \"\"\n  };\n}\n\n\nfunction deriveEconomyVisualAid(cut, index) {\n  const n = [\n    cut?.narration,\n    cut?.debug?.narration,\n    cut?.situation,\n    cut?.purpose,\n    cut?.visualIntent,\n    cut?.topKeyText\n  ].filter(Boolean).join(\" \").replace(/\\s+/g, \" \").trim();\n  if (!n) return null;\n\n  // Keep overlays deliberately compact: one relation/equation per explanatory CUT.\n  if (/미래.*금리|금리.*올라도|스트레스\\s*금리|미래\\s*위험/.test(n)) {\n    return {\n      type: \"equation\",\n      title: \"한도 계산\",\n      lines: [\"현재 금리 + 미래 금리 위험\"]\n    };\n  }\n  if (/부담.*크게|갚아야 할 부담|인정.*여유|여유.*작아/.test(n)) {\n    return {\n      type: \"flow\",\n      title: \"계산 구조\",\n      lines: [\"상환 부담 ↑  ⇒  인정 여유 ↓\"]\n    };\n  }\n  if (/내 돈|자기자금|부족한 만큼|대출 한도.*줄/.test(n)) {\n    return {\n      type: \"equation\",\n      title: \"집값 구성\",\n      lines: [\"대출 ↓  ⇒  자기자금 ↑\"]\n    };\n  }\n  // CUT-scoped classification:\n  // \"기존 빚\" 한 단어만으로 비교 장면으로 분류하면 다음 설명 CUT까지\n  // 3열 비교표가 따라오는 문제가 생긴다. 실제 조건 확인 CUT을 먼저 분리한다.\n  if (/금리만 보고|실제로 얼마까지|소득.*기존 빚|상환방식|실제 한도|내 실제 조건/.test(n)\n      && !/누구나 똑같|사람마다 달라|소득도 다르고|이미 진 빚.*다르/.test(n)) {\n    return {\n      type: \"flow\",\n      title: \"내 실제 조건\",\n      lines: [\"소득 + 기존 빚 + 상환방식 ⇒ 실제 한도\"]\n    };\n  }\n\n  // 비교표는 '서로 다름'을 명시하는 장면에만 허용한다.\n  if (/누구나 똑같|사람마다 달라|소득도 다르고|이미 진 빚.*다르|조건.*다르|결과.*다르/.test(n)) {\n    return {\n      type: \"compare\",\n      title: \"같은 제도 · 다른 결과\",\n      columns: [\n        { head: \"A\", body: [\"소득 여유 ↑\", \"기존 빚 ↓\", \"결손 작음\"] },\n        { head: \"민재\", body: [\"중간 조건\", \"중간 부담\", \"결손 중간\"] },\n        { head: \"B\", body: [\"기존 빚 ↑\", \"상환 부담 ↑\", \"결손 큼\"] }\n      ]\n    };\n  }\n  return null;\n}\n\nfunction buildCutSchema(cut, i, cuts, audioMode, channelKey) {\n  const range = getCutGlobalRange(cuts, i);\n  const motion = cut.motion || {};\n  return {\n    id: cut.id,\n    index: i + 1,\n    start: range.start,\n    duration: range.duration,\n    mediaType: cut.mediaType === \"video\" && cut.video?.assetId ? \"video\" : \"image\",\n    imageAssetId: (cut.image && cut.image.assetId) || null,\n    videoAssetId: (cut.video && cut.video.assetId) || null,\n    video: cut.video ? {\n      duration: cut.video.duration ?? null,\n      trimStart: Math.max(0, Number(cut.video.trimStart || 0)),\n      trimEnd: cut.video.trimEnd == null ? null : Math.max(0, Number(cut.video.trimEnd)),\n      mute: cut.video.mute !== false,\n    } : null,\n    motion: {\n      type: motion.type || \"STATIC\",\n      startScale: motion.startScale ?? 1,\n      endScale: motion.endScale ?? 1,\n      panX: motion.panX ?? 0,\n      panY: motion.panY ?? 0,\n      easing: motion.easing || \"linear\",\n      ...(Array.isArray(motion.visualBeats) && motion.visualBeats.length ? { visualBeats: motion.visualBeats.map((b) => ({ ...b })) } : {}),\n    },\n    transitionOut: {\n      type: cut.transition || \"HARD_CUT\",\n      duration: cut.transitionDuration || 0,\n    },\n    subtitle: {\n      narration: !!(cut.subtitle && cut.subtitle.narration),\n      dialogue: !!(cut.subtitle && cut.subtitle.dialogue),\n    },\n    newsCard: deriveNewsCard(cut, i, channelKey),\n    economyVisualAid: channelKey === \"economy_current\" ? deriveEconomyVisualAid(cut, i) : null,\n    // rc.4(코드 리뷰 수정) — master_narration 모드에서는 CUT별 narration audioEvent를 Renderer\n    // 계약(production.json)에 내보내지 않는다 — 마스터 나레이션 하나만 활성 오디오이므로,\n    // 이걸 그대로 내보내면 Renderer가 같은 나레이션을 두 번(마스터 파일 + 이 CUT 이벤트)\n    // 재생할 구조적 위험이 생긴다. episode.cuts[i].audioEvents 자체는 건드리지 않으며(DB에는\n    // 그대로 보존, per_cut으로 되돌아가면 다시 정상적으로 내보내진다), 여기서는 production.json\n    // 조립 시점에만 필터링한다(collectAssetUsages의 동일 필터와 짝을 이룬다).\n    audioEvents: (cut.audioEvents || [])\n      .filter((evt) => !(audioMode === \"master_narration\" && evt.type === \"narration\"))\n      .map((evt) => buildAudioEventSchema(evt, cut, range.start)),\n    // Renderer 핵심 계약과 분리된 참고용 메타데이터 — Renderer는 이 하위 필드를 몰라도 된다.\n    debug: {\n      durationSource: describeCutDuration(cut, audioMode).source,\n      imageStatus: (cut.image && cut.image.status) || \"미생성\",\n      purpose: cut.purpose || \"\",\n      situation: cut.situation || \"\",\n      narration: cut.narration || \"\",\n      // rc.3: Master Narration 모드일 때만 참고용으로 이 CUT의 마스터 파일 내 시작 지점(초)을\n      // 함께 남긴다 — Renderer 필수 계약이 아니라, 사람이 원본 마커 값을 확인하고 싶을 때용.\n      ...(audioMode === \"master_narration\" ? { masterStart: getMasterStart(cut, i) } : {}),\n    },\n  };\n}\n\nfunction buildSubtitleEvent(flatEvent, cuts) {\n  const cut = cuts[flatEvent.cutIndex];\n  let text = \"\";\n  if (flatEvent.event.type === \"narration\") {\n    text = (cut && cut.narration) || \"\";\n  } else {\n    const line = ((cut && cut.dialogueLines) || []).find((l) => l.id === flatEvent.event.sourceDialogueId);\n    text = (line && line.text) || \"\";\n  }\n  return { type: flatEvent.event.type, text, start: flatEvent.globalStart, end: flatEvent.globalEnd, cutId: flatEvent.cutId };\n}\n\nfunction buildBgmSchema(episode, totalDuration) {\n  const bgm = episode?.bgm;\n  if (!bgm || !bgm.assetId) return null;\n  return {\n    assetId: bgm.assetId,\n    start: bgm.start || 0,\n    end: bgm.end != null ? bgm.end : totalDuration,\n    volume: bgm.volume ?? 1,\n    fadeIn: bgm.fadeIn || 0,\n    fadeOut: bgm.fadeOut || 0,\n    fadeCurve: bgm.fadeCurve || \"linear\",\n    cutActions: { ...(bgm.cutActions || {}) },\n  };\n}\n\n// 암호학적 해시가 아니다 — \"새 crypto 의존성을 추가하지 말라\"는 조건에 따라, 새 라이브러리도\n// Web Crypto의 비동기 흐름도 필요 없는 간단한 FNV-1a 32bit 해시로 변경 감지용 fingerprint만\n// 만든다. 목적은 \"Preview 이후 데이터가 바뀌었는데 예전 production.json을 쓰는 문제\"를 줄이는\n// 것이지 위변조 방지가 아니다.\nexport function fnv1aHex(str) {\n  let hash = 0x811c9dc5;\n  for (let i = 0; i < str.length; i++) {\n    hash ^= str.charCodeAt(i);\n    hash = Math.imul(hash, 0x01000193);\n  }\n  return (hash >>> 0).toString(16).padStart(8, \"0\");\n}\n\nfunction fingerprintProduction(production) {\n  const basis = JSON.stringify({\n    renderSettings: production.renderSettings,\n    captionStyle: production.captionStyle,\n    totalDuration: production.totalDuration,\n    assets: production.assets,\n    cuts: production.cuts,\n    subtitleEvents: production.subtitleEvents,\n    bgm: production.bgm,\n  });\n  return fnv1aHex(basis);\n}\n\n// episode + (loadAssetManifest 결과)를 받아 production.json 전체 객체를 만든다. 순수 함수 —\n// DB 조회/난수/현재시각 없이도 동작하도록 opts.now로 시각을 주입할 수 있다(테스트 결정성).\nexport function buildProduction(episode, assetManifestResult, opts = {}) {\n  const cuts = episode?.cuts || [];\n  const totalDuration = getEpisodeDuration(episode);\n  const timeline = buildTimeline(episode);\n  const manifest = (assetManifestResult && assetManifestResult.manifest) || [];\n\n  const audioMode = episode?.formatType === \"cut\" ? episode?.audioMode || \"per_cut\" : null;\n  const cutSchemas = cuts.map((cut, i) => buildCutSchema(cut, i, cuts, audioMode, episode?.channelKey || \"unassigned\"));\n  const subtitleEvents = timeline.tracks.subtitle.map((e) => buildSubtitleEvent(e, cuts));\n  const bgm = buildBgmSchema(episode, totalDuration);\n  // rc.3(Master Narration Mode) — Renderer가 \"이 영상은 CUT별 나레이션이 아니라 통합\n  // 나레이션 파일 + CUT 시작 마커 기반\"이라는 것을 명시적으로 알 수 있게 최상위에 노출한다.\n  // per_cut(기존) episode/format에서는 null로 둔다 — 기존 schema를 깨지 않는 선택적 필드다.\n  const masterNarrationSchema =\n    audioMode === \"master_narration\" && episode?.masterNarration && episode.masterNarration.assetId\n      ? { assetId: episode.masterNarration.assetId, duration: episode.masterNarration.duration ?? null }\n      : null;\n\n  const production = {\n    schemaVersion: SCHEMA_VERSION,\n    generatedBy: { app:
