ame = slotFiles[i].file.name;\n    });\n    await ctx.save({ scenes: ep.scenes });\n    showMappingFromSaved();\n  }\n\n  function showMappingFromSaved() {\n    const lines = ep.scenes.map((s, i) => `STEP${i + 1} (씬 ${i + 1}, ${s.badge || \"배지없음\"})  ←  ${s.image_filename || \"(미지정)\"}`);\n    root.querySelector(\"#mapping-card\").style.display = \"\";\n    root.querySelector(\"#mapping-out\").textContent = lines.join(\"\\n\");\n    root.querySelector(\"#copy-mapping\").onclick = () => copyText(lines.join(\"\\n\"));\n  }\n}\n","js_v420a12/views/narrationStep.js":"import { durationsFromMeasuredStarts } from \"../sceneTiming.js\";\nimport { el, toast, copyText, fmtSec } from \"../util.js\";\n\nlet mediaEl = null;\nlet objectUrl = null;\n\nexport async function render(root, ep, ctx) {\n  const n = ep.scenes.length;\n\n  root.innerHTML = `\n    <div class=\"card\">\n      <h3>1) 육성 녹음 파일 선택</h3>\n      <p class=\"hint\">파일은 이 기기 브라우저 안에서만 재생돼요 — 서버로 전송되지 않아요.</p>\n      <input type=\"file\" id=\"file-input\" accept=\"audio/*,video/*\" class=\"btn secondary\" style=\"padding:10px;\" />\n      ${ep.narrationAudioName ? `<p class=\"hint\">이전에 선택한 파일: ${escapeHtml(ep.narrationAudioName)} (새로고침 후에는 다시 선택해야 해요)</p>` : \"\"}\n    </div>\n    <div class=\"player-box\" id=\"player-box\" style=\"display:none;\">\n      <div id=\"media-mount\"></div>\n      <div class=\"time-readout\" id=\"time-readout\">0.00s</div>\n      <div class=\"scrub-row\">\n        <button class=\"btn small secondary\" data-seek=\"-1\">-1s</button>\n        <button class=\"btn small secondary\" data-seek=\"-0.1\">-0.1s</button>\n        <button class=\"btn small\" id=\"play-btn\">▶ 재생</button>\n        <button class=\"btn small secondary\" data-seek=\"0.1\">+0.1s</button>\n        <button class=\"btn small secondary\" data-seek=\"1\">+1s</button>\n      </div>\n      <div class=\"scrub-row\">\n        <button class=\"btn small secondary\" data-rate=\"0.5\">0.5x</button>\n        <button class=\"btn small secondary\" data-rate=\"1\">1x</button>\n      </div>\n      <div class=\"timeline\" id=\"timeline\"><div class=\"playhead\" id=\"playhead\"></div></div>\n    </div>\n    <div class=\"card\" id=\"markers-card\" style=\"display:none;\">\n      <h3>2) 문장이 시작되는 순간 탭하세요</h3>\n      <div id=\"marker-list\"></div>\n    </div>\n    <div class=\"card\" id=\"result-card\" style=\"display:none;\">\n      <h3>3) 결과</h3>\n      <pre class=\"code-block\" id=\"result-out\"></pre>\n      <div class=\"btn-row\" style=\"margin-top:8px;\">\n        <button class=\"btn secondary\" id=\"copy-result\">복사</button>\n        <button class=\"btn\" id=\"apply-result\">③ 재생시간에 실측값 반영</button>\n      </div>\n    </div>\n    <button class=\"btn secondary\" id=\"save-next\" style=\"margin-top:14px;\">저장하고 다음 (⑥ 내보내기)</button>\n  `;\n\n  root.querySelector(\"#file-input\").onchange = async (e) => {\n    const file = e.target.files[0];\n    if (!file) return;\n    if (objectUrl) URL.revokeObjectURL(objectUrl);\n    objectUrl = URL.createObjectURL(file);\n    await ctx.save({ narrationAudioName: file.name });\n    mountPlayer(file.type.startsWith(\"video/\") ? \"video\" : \"audio\", objectUrl);\n    root.querySelector(\"#player-box\").style.display = \"\";\n    root.querySelector(\"#markers-card\").style.display = \"\";\n    renderMarkers();\n  };\n\n  root.querySelector(\"#save-next\").onclick = async () => {\n    await ctx.save({ scenes: ep.scenes });\n    toast(\"저장했어요\");\n    location.hash = `#/episode/${ep.id}/export`;\n  };\n\n  function mountPlayer(kind, url) {\n    const mount = root.querySelector(\"#media-mount\");\n    mount.innerHTML = \"\";\n    mediaEl = document.createElement(kind);\n    mediaEl.src = url;\n    mediaEl.controls = false;\n    mediaEl.playsInline = true;\n    mount.appendChild(mediaEl);\n\n    mediaEl.addEventListener(\"timeupdate\", updateReadout);\n    mediaEl.addEventListener(\"loadedmetadata\", updateReadout);\n\n    root.querySelectorAll(\"[data-seek]\").forEach((btn) => {\n      btn.onclick = () => {\n        mediaEl.currentTime = Math.max(0, mediaEl.currentTime + Number(btn.dataset.seek));\n      };\n    });\n    root.querySelectorAll(\"[data-rate]\").forEach((btn) => {\n      btn.onclick = () => {\n        mediaEl.playbackRate = Number(btn.dataset.rate);\n        root.querySelectorAll(\"[data-rate]\").forEach((b) => b.classList.toggle(\"secondary\", b !== btn));\n        btn.classList.remove(\"secondary\");\n      };\n    });\n    const playBtn = root.querySelector(\"#play-btn\");\n    playBtn.onclick = () => {\n      if (mediaEl.paused) { mediaEl.play(); playBtn.textContent = \"⏸ 일시정지\"; }\n      else { mediaEl.pause(); playBtn.textContent = \"▶ 재생\"; }\n    };\n    mediaEl.addEventListener(\"pause\", () => (playBtn.textContent = \"▶ 재생\"));\n    mediaEl.addEventListener(\"play\", () => (playBtn.textContent = \"⏸ 일시정지\"));\n  }\n\n  function updateReadout() {\n    root.querySelector(\"#time-readout\").textContent = fmtSec(mediaEl.currentTime) + \"s\";\n    const dur = mediaEl.duration || 1;\n    const pct = Math.min(100, (mediaEl.currentTime / dur) * 100);\n    const ph = root.querySelector(\"#playhead\");\n    if (ph) ph.style.left = pct + \"%\";\n    updateTimelineMarkers();\n  }\n\n  function updateTimelineMarkers() {\n    const tl = root.querySelector(\"#timeline\");\n    if (!tl || !mediaEl?.duration) return;\n    tl.querySelectorAll(\".marker\").forEach((m) => m.remove());\n    ep.scenes.forEach((s) => {\n      if (s.measured_start == null) return;\n      const pct = Math.min(100, (s.measured_start / mediaEl.duration) * 100);\n      const m = el(`<div class=\"marker\" style=\"left:${pct}%\"></div>`);\n      tl.appendChild(m);\n    });\n  }\n\n  function renderMarkers() {\n    const list = root.querySelector(\"#marker-list\");\n    list.innerHTML = \"\";\n    ep.scenes.forEach((s, i) => {\n      const row = el(`\n        <div class=\"marker-row\">\n          <div class=\"txt\">씬 ${i + 1}. ${escapeHtml(truncate(s.narration_line || s.headline || \"(문장 없음)\", 30))}</div>\n          <div class=\"val\">${s.measured_start != null ? fmtSec(s.measured_start) + \"s\" : \"--\"}</div>\n          <button class=\"btn small ${s.measured_start != null ? \"secondary\" : \"\"}\" data-mark=\"${i}\">${s.measured_start != null ? \"다시찍기\" : \"지금 시작!\"}</button>\n        </div>\n      `);\n      row.querySelector(\"[data-mark]\").onclick = async () => {\n        if (!mediaEl) return;\n        s.measured_start = Math.round(mediaEl.currentTime * 100) / 100;\n        await ctx.save({ scenes: ep.scenes });\n        renderMarkers();\n        updateTimelineMarkers();\n        maybeShowResult();\n      };\n      list.appendChild(row);\n    });\n  }\n\n  function maybeShowResult() {\n    const starts = ep.scenes.map((s) => s.measured_start);\n    if (starts.some((v) => v == null)) return;\n    const dur = mediaEl?.duration || starts[starts.length - 1] + 3;\n    const allStarts = [...starts, Math.round(dur * 100) / 100];\n    const durs = durationsFromMeasuredStarts(allStarts);\n    const code = `_SENTENCE_STARTS = [${allStarts.map((v) => v.toFixed(2)).join(\", \")}]\\n# SCENE_DURS = [${durs.map((v) => v.toFixed(2)).join(\", \")}]  (총 ${dur.toFixed(2)}s)`;\n    root.querySelector(\"#result-card\").style.display = \"\";\n    root.querySelector(\"#result-out\").textContent = code;\n    root.querySelector(\"#copy-result\").onclick = () => copyText(code);\n    root.querySelector(\"#apply-result\").onclick = async () => {\n      ep.scenes.forEach((s, i) => (s._estimatedDur = durs[i]));\n      await ctx.save({ scenes: ep.scenes });\n      toast(\"③ 재생시간에 실측값을 반영했어요\");\n    };\n  }\n\n  if (ep.scenes.some((s) => s.measured_start != null)) {\n    root.querySelector(\"#markers-card\").style.display = \"\";\n    renderMarkers();\n    maybeShowResult();\n  }\n}\n\nfunction truncate(s, n) {\n  return s.length > n ? s.slice(0, n) + \"…\" : s;\n}\nfunction escapeHtml(s) {\n  return String(s ?? \"\").replace(/[&<>]/g, (c) => ({ \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\" }[c]));\n}\n","js_v420a12/views/exportStep.js":"import { copyText, downloadText, toast } from \"../util.js\";\nimport { seriesTypeLabel } from \"../seriesTypes.js\";\nimport { saveEpisode } from \"../db.js\";\n\nexport async function render(root, ep, ctx) {\n  root.innerHTML = `\n    <div class=\"card\">\n      <h3>content_issue JSON 미리보기</h3>\n      <pre class=\"code-block\" id=\"json-out\"></pre>\n      <div class=\"btn-row\" style=\"margin-top:8px;\">\n        <button class=\"btn secondary\" id=\"copy-json\">복사</button>\n        <button class=\"btn secondary\" id=\"dl-json\">다운로드</button>\n      </div>\n    </div>\n\n    <div class=\"card\">\n      <h3>업로드 메타데이터</h3>\n      <label>제목 후보 (한 줄에 하나씩)</label>\n      <textarea id=\"f-titles\" rows=\"3\" placeholder=\"1. ...&#10;2. ...\">${attr(ep.metaTitleCandidates)}</textarea>\n      <label>설명</label>\n      <textarea id=\"f-desc\" rows=\"5\" placeholder=\"영상 설명 본문...\">${attr(ep.metaDescription)}</textarea>\n      <label>해시태그</label>\n      <textarea id=\"f-tags\" rows=\"2\" placeholder=\"#오늘의이슈 #시사 #Shorts\">${attr(ep.metaHashtags)}</textarea>\n      <label>썸네일 후보 메모</label>\n      <textarea id=\"f-thumb\" rows=\"2\" placeholder=\"STEP1 훅 장면 + 헤드라인 텍스트\">${attr(ep.metaThumbnail)}</textarea>\n      <button class=\"btn secondary\" id=\"save-meta\" style=\"margin-top:8px;\">메타데이터 저장</button>\n    </div>\n\n    <div class=\"card\">\n      <h3>메타데이터 미리보기</h3>\n      <pre class=\"code-block\" id=\"meta-out\"></pre>\n      <button class=\"btn secondary\" id=\"copy-meta\" style=\"margin-top:8px;\">전체 복사</button>\n    </div>\n\n    <button class=\"btn\" id=\"confirm-btn\" ${ep.status === \"확정\" || ep.status === \"업로드완료\" ? \"disabled\" : \"\"}>\n      ${ep.status === \"확정\" || ep.status === \"업로드완료\" ? \"확정됨 ✓\" : \"확정\"}\n    </button>\n  `;\n\n  renderJson();\n  renderMeta();\n\n  root.querySelector(\"#copy-json\").onclick = () => copyText(buildJson());\n  root.querySelector(\"#dl-json\").onclick = () => downloadText(`content_${slug(ep.title)}.json`, buildJson());\n\n  root.querySelector(\"#save-meta\").onclick = async () => {\n    // Phase 7 수정: ctx.save()를 쓰지 않는다. episode.js의 ctx.save()는 \"현재 보고 있는 STEP의\n    // statusByStep 값으로 상태를 자동 승격\"하는 범용 로직을 갖고 있는데, export STEP의\n    // statusByStep 값이 하필 \"확정\"이다(STATUS_BY_STEP.export === \"확정\"). 그 로직을 그대로\n    // 쓰면 사용자가 [확정] 버튼을 누르지 않고 단순히 메타데이터만 저장해도 episode.status가\n    // 조용히 \"확정\"으로 승격돼버린다 — \"복사/다운로드/메타데이터 저장 ≠ 최종 확정\"이라는 원칙에\n    // 어긋난다(Phase 6에서 cutExportStep.js에 적용한 것과 동일한 수정). status는 아래\n    // #confirm-btn 클릭에서만 명시적으로 바뀐다.\n    Object.assign(ep, {\n      metaTitleCandidates: root.querySelector(\"#f-titles\").value,\n      metaDescription: root.querySelector(\"#f-desc\").value,\n      metaHashtags: root.querySelector(\"#f-tags\").value,\n      metaThumbnail: root.querySelector(\"#f-thumb\").value,\n    });\n    await saveEpisode(ep);\n    toast(\"저장했어요\");\n    renderMeta();\n  };\n\n  root.querySelector(\"#copy-meta\").onclick = () => copyText(buildMetaText());\n\n  root.querySelector(\"#confirm-btn\").onclick = async () => {\n    await ctx.save({ status: \"확정\" });\n    toast(\"확정했어요\");\n    ctx.reRender();\n  };\n\n  function buildJson() {\n    const scenes = ep.scenes.map((s) => {\n      const out = {\n        badge: s.badge || \"\",\n        ...(s.panel ? { panel: true } : {}),\n        bg_style: \"normal\",\n        headline: s.headline || \"\",\n        caption: s.caption || \"\",\n        bg_top: s.bg_top,\n        bg_bottom: s.bg_bottom,\n        badge_color: s.badge_color,\n      };\n      if (s.headline_size) out.headline_size = s.headline_size;\n      if (s.countup) out.countup = s.countup;\n      return out;\n    });\n    const obj = {\n      meta: {\n        date: ep.date,\n        // 기존 v1 데이터와 정확히 동일한 문구를 유지한다(호환성 우선) — 새 시리즈 타입만 레지스트리 라벨을 쓴다.\n        title:\n          ep.seriesType === \"horror\"\n            ? \"오늘의 괴담\"\n            : ep.seriesType === \"general_issue\"\n            ? \"오늘의 이슈\"\n            : seriesTypeLabel(ep.seriesType),\n        subject: ep.subject,\n        sources: ep.sources,\n      },\n      scenes,\n    };\n    return JSON.stringify(obj, null, 2);\n  }\n\n  function renderJson() {\n    root.querySelector(\"#json-out\").textContent = buildJson();\n  }\n\n  function buildMetaText() {\n    const durTotal = ep.scenes.reduce((sum, s) => {\n      if (s.measured_start != null) return sum; // 실측은 아래서 별도 계산\n      return sum + (s._estimatedDur || 0);\n    }, 0);\n    const measured = ep.scenes.every((s) => s.measured_start != null);\n\n    return [\n      \"[제목 후보]\",\n      ep.metaTitleCandidates || \"(미입력)\",\n      \"\",\n      \"[설명]\",\n      ep.metaDescription || \"(미입력)\",\n      \"\",\n      ep.metaHashtags || \"\",\n      \"\",\n      \"[데이터 출처]\",\n      (ep.sources || []).join(\"\\n\") || \"(미입력)\",\n      \"\",\n      \"[업로드 전 체크리스트]\",\n      \"- 자막 문구가 사실관계 그대로인지, 특정 진영에 치우쳐 보이지 않는지 재확인\",\n      \"- 이미지가 AI 생성 상징 이미지라면 설명란 고지 문구 유지\",\n      \"- 나레이션이 본인 육성이면 TTS 고지 불필요, AI 생성 이미지가 있다면 업로드 화면에서 합성 콘텐츠 표시 켜기\",\n      \"- 출처 표기가 최신 보도 기준인지 확인\",\n      \"\",\n      \"[썸네일 후보]\",\n      ep.metaThumbnail || \"(미입력)\",\n      \"\",\n      `[참고] 예상 총 길이: 약 ${measured ? \"(실측값 사용)\" : durTotal.toFixed(1) + \"초\"}`,\n    ].join(\"\\n\");\n  }\n\n  function renderMeta() {\n    root.querySelector(\"#meta-out\").textContent = buildMetaText();\n  }\n}\n\nfunction attr(s) {\n  return String(s ?? \"\").replace(/&/g, \"&amp;\").replace(/</g, \"&lt;\");\n}\nfunction slug(s) {\n  return (s || \"episode\").replace(/[^\\w가-힣]+/g, \"_\").slice(0, 40);\n}\n","js_v420a12/assetUrl.js":"// asset(Blob) → 화면에 표시할 objectURL 변환 캐시.\n// 같은 assetId를 여러 번 그릴 때마다 Blob을 다시 읽고 새 objectURL을 만들지 않도록\n// 캐시한다(불필요한 메모리 누수를 줄인다). asset이 실제로 삭제되면 캐시 항목도 함께 지운다.\n\nimport { getAsset } from \"./db.js\";\n\nconst cache = new Map(); // assetId -> objectURL\n\nexport async function getAssetObjectUrl(assetId) {\n  if (!assetId) return null;\n  if (cache.has(assetId)) return cache.get(assetId);\n  const asset = await getAsset(assetId);\n  if (!asset || !asset.blob) return null;\n  const url = URL.createObjectURL(asset.blob);\n  cache.set(assetId, url);\n  return url;\n}\n\nexport function forgetAssetObjectUrl(assetId) {\n  const url = cache.get(assetId);\n  if (url) {\n    URL.revokeObjectURL(url);\n    cache.delete(assetId);\n  }\n}\n","js_v420a12/views/storyStep.js":"// STEP ② 스토리 / CUT — CUT 에디터 + GLOBAL VISUAL BIBLE + Style/Character Reference.\n//\n// 모바일 우선: CUT은 기본적으로 \"요약 카드\"로 접혀 있고 탭하면 펼쳐진다(전부 펼쳐두면\n// 화면이 지나치게 길어짐). 구조 변경(추가/삭제/복제/순서변경)과 Reference 첨부/삭제는\n// 즉시 ctx.reRender()로 전체를 다시 그려 진행률/다음 할 일 카드에 곧바로 반영되게 하고,\n// 텍스트 필드는 blur 시점에만 저장해서 타이핑 중 화면이 깜빡이지 않게 한다.\n\nimport { newCut, duplicateCut, reindexCuts, newDialogueLine, CUT_PURPOSES, invalidateTimelineReview, invalidatePreviewReview, recalcAudioModeDurations } from \"../model.js\";\nimport { putAsset, deleteAssetSafely } from \"../db.js\";\nimport { getAssetObjectUrl } from \"../assetUrl.js\";\nimport { el, toast, copyText, escapeHtml, confirmOversizedFile, toastAssetSaveError } from \"../util.js\";\n\nexport async function render(root, ep, ctx) {\n  const expandedIds = new Set();\n  // Alpha 7: 이전 버전에서 저장된 index 값이 어긋나도 화면 번호는 배열 순서를 SSOT로 사용한다.\n  // 고급 편집 진입 시 메모리 상의 index도 즉시 정규화한다.\n  reindexCuts(ep.cuts || []);\n\n  root.innerHTML = `\n    <div class=\"card\">\n      <h3>고급 CUT 편집</h3>\n      <p class=\"hint\">기본 제작 흐름에서는 사용할 필요가 없습니다. AI가 만든 CUT 순서·대본·Visual Bible을 직접 수정해야 할 때만 사용하세요.</p>\n      <button class=\"btn secondary small\" id=\"back-to-images\">← 이미지 단계로 돌아가기</button>\n    </div>\n\n    <datalist id=\"cut-purposes\">\n      ${CUT_PURPOSES.map((p) => `<option value=\"${attr(p)}\"></option>`).join(\"\")}\n    </datalist>\n\n    <div class=\"card\">\n      <h3>GLOBAL VISUAL BIBLE</h3>\n      <p class=\"hint\">모든 CUT에 공통으로 적용할 스타일/설정을 적어두면, 각 CUT Prompt와 합쳐서 이미지 생성 AI에 바로 붙여넣을 수 있어요.</p>\n      <textarea id=\"f-global-bible\" rows=\"5\" placeholder=\"예: 반사실주의 일러스트, 어두운 톤, 9:16 세로 구도...\">${attr(ep.globalVisualBible)}</textarea>\n      <div class=\"btn-row\" style=\"margin-top:8px;\">\n        <button class=\"btn secondary small\" id=\"copy-global\">GLOBAL만 복사</button>\n      </div>\n    </div>\n\n    <div class=\"card\">\n      <h3>레퍼런스 이미지</h3>\n      <p class=\"hint\">연속된 CUT을 만들 때 기준으로 삼을 이미지예요. 없어도 진행할 수 있어요.</p>\n      <div class=\"ref-grid\">\n        <div id=\"ref-style\"></div>\n        <div id=\"ref-character\"></div>\n      </div>\n    </div>\n\n    <div id=\"cut-list\"></div>\n\n    <button class=\"btn secondary\" id=\"add-cut\" style=\"margin-top:4px;\">+ CUT 추가</button>\n  `;\n\n  root.querySelector(\"#back-to-images\").onclick = () => (location.hash = `#/episode/${ep.id}/cutImages`);\n\n  root.querySelector(\"#f-global-bible\").addEventListener(\"blur\", async (e) => {\n    ep.globalVisualBible = e.target.value;\n    await ctx.save({ globalVisualBible: e.target.value });\n  });\n  root.querySelector(\"#copy-global\").onclick = () => copyText(buildGlobalText());\n\n  await renderRefSlot(root.querySelector(\"#ref-style\"), \"styleReferenceAssetId\", \"Style Reference\");\n  await renderRefSlot(root.querySelector(\"#ref-character\"), \"characterReferenceAssetId\", \"Character Reference\");\n\n  root.querySelector(\"#add-cut\").onclick = async () => {\n    const cuts = ep.cuts || [];\n    cuts.push(newCut(cuts.length));\n    reindexCuts(cuts);\n    recalcAudioModeDurations(ep); // rc.3: master_narration 모드면 새 CUT 추가로 마커 인덱스가 밀리므로 재계산\n    invalidateTimelineReview(ep);\n    invalidatePreviewReview(ep);\n    await ctx.save({ cuts });\n    ctx.reRender();\n  };\n\n  await renderCutList();\n\n  // ---------------------------------------------------------------------\n  // helpers\n  // ---------------------------------------------------------------------\n\n  function buildGlobalText() {\n    return `[GLOBAL VISUAL BIBLE]\\n\\n${ep.globalVisualBible || \"\"}`;\n  }\n\n  function buildCutText(cut, n) {\n    return `[CUT ${String(n).padStart(2, \"0\")} — PRODUCTION PROMPT]\\n\\n${cut.productionPrompt || \"\"}`;\n  }\n\n  function buildGlobalPlusCutText(cut, n) {\n    return `${buildGlobalText()}\\n\\n\\n${buildCutText(cut, n)}`;\n  }\n\n  async function renderRefSlot(mount, field, label) {\n    const assetId = ep[field];\n    const url = assetId ? await getAssetObjectUrl(assetId) : null;\n    mount.innerHTML = `\n      <div class=\"ref-slot\">\n        <div class=\"ref-slot-label\">${label}</div>\n        <div class=\"ref-slot-thumb\">${url ? `<img src=\"${url}\" />` : `<span class=\"empty-label\">없음</span>`}</div>\n        <div class=\"btn-row\">\n          <button class=\"btn secondary small\" data-ref-attach>${assetId ? \"교체\" : \"첨부\"}</button>\n          ${assetId ? `<button class=\"btn danger small\" data-ref-delete>삭제</button>` : \"\"}\n        </div>\n        <input type=\"file\" accept=\"image/*\" data-ref-input style=\"display:none;\" />\n      </div>\n    `;\n    const fileInput = mount.querySelector(\"[data-ref-input]\");\n    mount.querySelector(\"[data-ref-attach]\").onclick = () => fileInput.click();\n    fileInput.onchange = async (e) => {\n      const file = e.target.files[0];\n      if (!file) return;\n      if (!confirmOversizedFile(file)) return;\n      try {\n        if (assetId) await deleteAssetSafely(assetId, ep.id);\n        const asset = await putAsset({ episodeId: ep.id, kind: \"image\", role: field, blob: file, originalFileName: file.name });\n        await ctx.save({ [field]: asset.id });\n        toast(`${label}를 등록했어요`);\n        ctx.reRender();\n      } catch (err) {\n        toastAssetSaveError(err);\n      }\n    };\n    const delBtn = mount.querySelector(\"[data-ref-delete]\");\n    if (delBtn) {\n      delBtn.onclick = async () => {\n        if (!confirm(`${label}를 삭제할까요?`)) return;\n        await deleteAssetSafely(assetId, ep.id);\n        await ctx.save({ [field]: null });\n        toast(\"삭제했어요\");\n        ctx.reRender();\n      };\n    }\n  }\n\n  async function renderCutList() {\n    const list = root.querySelector(\"#cut-list\");\n    list.innerHTML = \"\";\n    const cuts = ep.cuts || [];\n    if (cuts.length === 0) {\n      list.appendChild(el(`<div class=\"empty-state\">아직 CUT이 없어요.<br/>아래 버튼으로 첫 CUT을 추가해보세요.</div>`));\n      return;\n    }\n    cuts.forEach((cut, i) => list.appendChild(cutCard(cut, i, cuts.length)));\n  }\n\n  function cutCard(cut, i, total) {\n    const n = i + 1;\n    const expanded = expandedIds.has(cut.id);\n    const node = el(`\n      <div class=\"cut-card\">\n        <div class=\"cut-card-head\">\n          <button type=\"button\" class=\"cut-card-summary\" data-toggle>\n            <span class=\"cut-num\">CUT ${n}</span>\n            <span class=\"cut-summary-text\">${escapeHtml(summaryLine(cut))}</span>\n          </button>\n        </div>\n        <div class=\"cut-card-controls\">\n          <button class=\"btn ghost small\" data-act=\"up\" ${i === 0 ? \"disabled\" : \"\"}>▲</button>\n          <button class=\"btn ghost small\" data-act=\"down\" ${i === total - 1 ? \"disabled\" : \"\"}>▼</button>\n          <button class=\"btn ghost small\" data-act=\"dup\">복제</button>\n          <button class=\"btn danger small\" data-act=\"del\">삭제</button>\n        </div>\n        <div class=\"cut-card-body\" data-body></div>\n      </div>\n    `);\n\n    node.querySelector(\"[data-toggle]\").onclick = () => {\n      if (expandedIds.has(cut.id)) expandedIds.delete(cut.id);\n      else expandedIds.add(cut.id);\n      renderCutList();\n    };\n\n    node.querySelector('[data-act=\"up\"]').onclick = async () => {\n      if (i === 0) return;\n      const cuts = ep.cuts;\n      [cuts[i - 1], cuts[i]] = [cuts[i], cuts[i - 1]];\n      reindexCuts(cuts);\n      recalcAudioModeDurations(ep); // rc.3: 순서가 바뀌면 master_narration 마커-CUT 대응도 바뀌므로 재계산\n      invalidateTimelineReview(ep);\n      invalidatePreviewReview(ep);\n      await ctx.save({ cuts });\n      ctx.reRender();\n    };\n    node.querySelector('[data-act=\"down\"]').onclick = async () => {\n      if (i === total - 1) return;\n      const cuts = ep.cuts;\n      [cuts[i + 1], cuts[i]] = [cuts[i], cuts[i + 1]];\n      reindexCuts(cuts);\n      recalcAudioModeDurations(ep); // rc.3: 순서가 바뀌면 master_narration 마커-CUT 대응도 바뀌므로 재계산\n      invalidateTimelineReview(ep);\n      invalidatePreviewReview(ep);\n      await ctx.save({ cuts });\n      ctx.reRender();\n    };\n    node.querySelector('[data-act=\"dup\"]').onclick = async () => {\n      const cuts = ep.cuts;\n      cuts.splice(i + 1, 0, duplicateCut(cut));\n      reindexCuts(cuts);\n      recalcAudioModeDurations(ep); // rc.3: 새 CUT 삽입으로 이후 마커 인덱스가 밀리므로 재계산(복제본의 masterStart는 이미 null)\n      invalidateTimelineReview(ep);\n      invalidatePreviewReview(ep);\n      await ctx.save({ cuts });\n      ctx.reRender();\n    };\n    node.querySelector('[data-act=\"del\"]').onclick = async () => {\n      if (!confirm(`CUT ${n}을 삭제할까요? 연결된 이미지도 함께 정리됩니다.`)) return;\n      if (cut.image?.assetId) await deleteAssetSafely(cut.image.assetId, ep.id);\n      const cuts = ep.cuts.filter((c) => c.id !== cut.id);\n      reindexCuts(cuts);\n      ep.cuts = cuts; // recalcAudioModeDurations가 최신 배열을 보도록(.filter()는 새 배열이라 ep.cuts가 즉시 갱신되지 않음) 먼저 반영\n      recalcAudioModeDurations(ep); // rc.3: CUT 삭제로 이후 마커 인덱스가 당겨지므로 재계산\n      invalidateTimelineReview(ep);\n      invalidatePreviewReview(ep);\n      await ctx.save({ cuts });\n      ctx.reRender();\n    };\n\n    if (expanded) {\n      node.querySelector(\"[data-body]\").appendChild(cutEditor(cut, n));\n    }\n\n    return node;\n  }\n\n  function cutEditor(cut, n) {\n    const node = el(`\n      <div class=\"cut-editor\">\n        <label>장면 목적 (purpose) — 추천값 선택 또는 직접 입력</label>\n        <input type=\"text\" list=\"cut-purposes\" data-f=\"purpose\" value=\"${attr(cut.purpose)}\" placeholder=\"예: HOOK (자유롭게 입력해도 돼요)\" />\n\n        <label>상황 설명</label>\n        <textarea data-f=\"situation\" rows=\"2\">${attr(cut.situation)}</textarea>\n\n        <label>나레이션</label>\n        <textarea data-f=\"narration\" rows=\"2\">${attr(cut.narration)}</textarea>\n\n        <label>연출 메모</label>\n        <textarea data-f=\"directorNote\" rows=\"2\">${attr(cut.directorNote)}</textarea>\n\n        <label>대사</label>\n        <div class=\"dialogue-list\" data-dialogue-list></div>\n        <button class=\"btn secondary small\" data-add-dialogue style=\"margin-top:4px;\">+ 대사 추가</button>\n\n        <label style=\"margin-top:14px;\">Production Prompt</label>\n        <textarea data-f=\"productionPrompt\" rows=\"4\" placeholder=\"이미지 생성 AI에 붙여넣을 프롬프트\">${attr(cut.productionPrompt)}</textarea>\n        <div class=\"btn-row\" style=\"margin-top:8px;\">\n          <button class=\"btn secondary small\" data-copy=\"cut\">CUT만 복사</button>\n          <button class=\"btn secondary small\" data-copy=\"global-cut\">GLOBAL + CUT 복사</button>\n        </div>\n\n        <label style=\"margin-top:14px;\">이미지 준비 상태</label>\n        <p class=\"hint\" style=\"margin-top:2px;\">\n          <span class=\"pill-inline ${imageStatusClass(cut)}\">${escapeHtml(cut.image?.assetId ? cut.image.status : \"미생성\")}</span>\n          이미지 등록/교체/QC는 ③ 이미지 단계에서 해주세요.\n        </p>\n      </div>\n    `);\n\n    node.querySelectorAll(\"input[data-f], textarea[data-f]\").forEach((input) => {\n      input.addEventListener(\"blur\", async () => {\n        cut[input.dataset.f] = input.value;\n        // 나레이션은 Preview 자막의 원본 텍스트다(Single Source of Truth) — 바뀌면 재검토 필요.\n        // purpose/situation/directorNote/productionPrompt는 화면에 그려지지 않는 제작 메모라서\n        // 무효화하지 않는다.\n        if (input.dataset.f === \"narration\") invalidatePreviewReview(ep);\n        await ctx.save({ cuts: ep.cuts });\n      });\n    });\n\n    node.querySelector('[data-copy=\"cut\"]').onclick = () => copyText(buildCutText(cut, n));\n    node.querySelector('[data-copy=\"global-cut\"]').onclick = () => copyText(buildGlobalPlusCutText(cut, n));\n\n    const dialogueList = node.querySelector(\"[data-dialogue-list]\");\n    renderDialogueList();\n    node.querySelector(\"[data-add-dialogue]\").onclick = async () => {\n      cut.dialogueLines.push(newDialogueLine()); // 안정적 id 부여 — STEP4 audioEvents가 이 id로 연결된다\n      invalidatePreviewReview(ep);\n      await ctx.save({ cuts: ep.cuts });\n      renderDialogueList();\n    };\n\n    function renderDialogueList() {\n      dialogueList.innerHTML = \"\";\n      cut.dialogueLines.forEach((line, li) => {\n        const row = el(`\n          <div class=\"dialogue-row\">\n            <input type=\"text\" data-dl-f=\"speaker\" placeholder=\"화자\" value=\"${attr(line.speaker)}\" style=\"width:72px;\" />\n            <input type=\"text\" data-dl-f=\"text\" placeholder=\"대사 내용\" value=\"${attr(line.text)}\" />\n            <input type=\"number\" step=\"0.1\" data-dl-f=\"offset\" placeholder=\"시작(초)\" value=\"${line.offset ?? 0}\" style=\"width:64px;\" />\n            <button class=\"btn danger small\" data-dl-del>삭제</button>\n          </div>\n        `);\n        row.querySelectorAll(\"[data-dl-f]\").forEach((input) => {\n          input.addEventListener(\"blur\", async () => {\n            const f = input.dataset.dlF;\n            line[f] = f === \"offset\" ? Number(input.value) || 0 : input.value;\n            // 대사 텍스트도 Preview 자막의 원본이다 — speaker/offset은 화면에 그려지지 않는다.\n            if (f === \"text\") invalidatePreviewReview(ep);\n            await ctx.save({ cuts: ep.cuts });\n          });\n        });\n        row.querySelector(\"[data-dl-del]\").onclick = async () => {\n          cut.dialogueLines.splice(li, 1);\n          invalidatePreviewReview(ep);\n          await ctx.save({ cuts: ep.cuts });\n          renderDialogueList();\n        };\n        dialogueList.appendChild(row);\n      });\n      if (!cut.dialogueLines.length) {\n        dialogueList.appendChild(el(`<p class=\"hint\" style=\"margin:0;\">등록된 대사가 없어요.</p>`));\n      }\n    }\n\n    return node;\n  }\n}\n\nfunction summaryLine(cut) {\n  const purpose = cut.purpose || \"목적 미지정\";\n  const bodyText = cut.narration || (cut.dialogueLines[0] && cut.dialogueLines[0].text) || \"\";\n  const preview = bodyText ? truncate(bodyText, 26) : \"(내용 없음)\";\n  const imgStatus = cut.image?.assetId ? cut.image.status : \"미생성\";\n  return `${purpose} · ${preview} · 이미지 ${imgStatus}`;\n}\n\nfunction imageStatusClass(cut) {\n  const status = cut.image?.assetId ? cut.image.status : \"미생성\";\n  if (status === \"PASS\" || status === \"확정\") return \"recommended\";\n  if (status === \"RETRY\") return \"blocker\";\n  if (status === \"검수필요\" || status === \"생성중\") return \"required\";\n  return \"optional\";\n}\n\nfunction truncate(s, n) {\n  return s.length > n ? s.slice(0, n) + \"…\" : s;\n}\n\nfunction attr(s) {\n  return String(s ?? \"\")\n    .replace(/&/g, \"&amp;\")\n    .replace(/</g, \"&lt;\")\n    .replace(/\"/g, \"&quot;\");\n}\n","js_v420a12/imageMatch.js":"// 이미지 일괄등록 파일명 자동매칭 — 순수 함수, 아무것도 저장하지 않는다.\n// 반드시 화면에서 \"파일 → 예상 CUT\" 미리보기를 먼저 보여주고, 사용자가\n// [매칭 확정]을 눌러야만 실제로 연결된다(호출부의 책임 — 이 파일은 계산만 한다).\n//\n// 인식하는 패턴(전체 파일명에 정확히 매칭 — 파일명 중간에 우연히 들어간 숫자를\n// CUT 번호로 오인하지 않도록 앵커(^...$)로 고정한다):\n//   cut01.png / cut_01.png / cut-01.png / CUT 01.png / cut1.png  → 숫자 부분을 CUT 번호로\n//   01.png / 1.png                                                → 숫자 자체를 CUT 번호로\n// 확장자: png, jpg, jpeg, webp (대소문자 무관)\n\nconst EXT = \"(?:png|jpe?g|webp)\";\nconst PATTERNS = [/^cut[\\s_-]?(\\d{1,3})\\.EXT$/i, /^(\\d{1,3})\\.EXT$/i].map(\n  (re) => new RegExp(re.source.replace(\"EXT\", EXT), \"i\")\n);\n\nexport function matchFilenameToCutNumber(fileName) {\n  const name = String(fileName || \"\").trim();\n  for (const re of PATTERNS) {\n    const m = name.match(re);\n    if (m) return Number(m[1]);\n  }\n  return null;\n}\n\n// fileNames: string[], cutCount: number(현재 에피소드의 CUT 개수, 1-based 범위 검사용)\n// 반환:\n//   matches:    [{ fileName, cutNumber, cutIndex }]        — 확정 가능한 1:1 매칭\n//   unmatched:  [fileName, ...]                            — 패턴 자체를 인식 못함\n//   outOfRange: [{ fileName, cutNumber }]                  — 패턴은 인식했지만 그런 CUT이 없음\n//   duplicates: [{ cutNumber, fileNames: [...] }]           — 같은 CUT 번호에 파일이 여러 개\nexport function matchFilesToCuts(fileNames, cutCount) {\n  const byCutNumber = new Map(); // cutNumber -> fileName[]\n  const unmatched = [];\n  const outOfRange = [];\n\n  fileNames.forEach((fileName) => {\n    const num = matchFilenameToCutNumber(fileName);\n    if (num == null) {\n      unmatched.push(fileName);\n      return;\n    }\n    if (num < 1 || num > cutCount) {\n      outOfRange.push({ fileName, cutNumber: num });\n      return;\n    }\n    if (!byCutNumber.has(num)) byCutNumber.set(num, []);\n    byCutNumber.get(num).push(fileName);\n  });\n\n  const matches = [];\n  const duplicates = [];\n  byCutNumber.forEach((fileNamesForCut, cutNumber) => {\n    if (fileNamesForCut.length > 1) {\n      duplicates.push({ cutNumber, fileNames: fileNamesForCut });\n    } else {\n      matches.push({ fileName: fileNamesForCut[0], cutNumber, cutIndex: cutNumber - 1 });\n    }\n  });\n\n  matches.sort((a, b) => a.cutNumber - b.cutNumber);\n  duplicates.sort((a, b) => a.cutNumber - b.cutNumber);\n\n  return { matches, unmatched, outOfRange, duplicates };\n}\n","js_v420a12/imageProvider.js":"// V4.2.0 Alpha 11 — Nano Banana 2 client foundation.\n// Browser stores only the HTTPS proxy URL and generation preferences.\n// GEMINI_API_KEY must live on the server-side proxy only.\n\nconst STORAGE_KEY = \"shortsTracker.imageProvider.v1\";\nconst DEFAULTS = Object.freeze({\n  providerId: \"gemini\",\n  modelId: \"gemini-3.1-flash-image\",\n  proxyUrl: \"https://shorts-tracker-v4-proxy.vercel.app\",\n  imageSize: \"1K\",\n  timeoutMs: 120000,\n});\n\nfunction cleanBaseUrl(url) { return String(url || \"\").trim().replace(/\\/+$/, \"\"); }\n\nexport function loadImageProviderSettings() {\n  try {\n    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || \"{}\");\n    const merged = { ...DEFAULTS, ...(raw && typeof raw === \"object\" ? raw : {}) };\n    merged.modelId = DEFAULTS.modelId;\n    delete merged.apiKey;\n    return merged;\n  } catch (_) { return { ...DEFAULTS }; }\n}\n\nexport function saveImageProviderSettings(patch = {}) {\n  const next = { ...loadImageProviderSettings(), ...patch, modelId:DEFAULTS.modelId };\n  delete next.apiKey;\n  localStorage.setItem(STORAGE_KEY, JSON.stringify(next));\n  return next;\n}\n\nexport function imageProviderReady(settings = loadImageProviderSettings()) {\n  return settings.providerId === \"gemini\" && /^https:\\/\\//i.test(cleanBaseUrl(settings.proxyUrl));\n}\n\nasync function fetchJson(url, init, timeoutMs) {\n  const controller = new AbortController();\n  const timer = setTimeout(() => controller.abort(), Math.max(5000, Number(timeoutMs)||DEFAULTS.timeoutMs));\n  try {\n    const res = await fetch(url, { ...init, signal:controller.signal });\n    const text = await res.text();\n    let data = null;\n    try { data = text ? JSON.parse(text) : null; } catch (_) {}\n    if (!res.ok) throw new Error(String(data?.error?.message || data?.error || data?.message || text || `HTTP ${res.status}`));\n    return data;\n  } finally { clearTimeout(timer); }\n}\n\nexport async function checkImageProvider(settings = loadImageProviderSettings()) {\n  if (!imageProviderReady(settings)) return { ok:false, reason:\"proxy_not_configured\" };\n  try {\n    const data = await fetchJson(`${cleanBaseUrl(settings.proxyUrl)}/api/image-health`, {\n      method:\"GET\", headers:{ Accept:\"application/json\" }\n    }, 15000);\n    return { ok:Boolean(data?.ok), ...data };\n  } catch (err) {\n    return { ok:false, reason:\"network_error\", message:err?.message || String(err) };\n  }\n}\n\nfunction base64ToBlob(base64, mimeType=\"image/png\") {\n  const binary = atob(String(base64 || \"\").replace(/^data:[^;]+;base64,/, \"\"));\n  const bytes = new Uint8Array(binary.length);\n  for (let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);\n  return new Blob([bytes], { type:mimeType });\n}\n\nexport async function generateCutImage({ prompt, aspectRatio=\"9:16\", imageSize=\"1K\", cutIndex=0 }) {\n  const settings = loadImageProviderSettings();\n  if (!imageProviderReady(settings)) throw new Error(\"Nano Banana 이미지 프록시가 아직 연결되지 않았습니다.\");\n  const text = String(prompt || \"\").trim();\n  if (!text) throw new Error(\"이미지 프롬프트가 비어 있습니다.\");\n\n  const data = await fetchJson(`${cleanBaseUrl(settings.proxyUrl)}/api/image`, {\n    method:\"POST\",\n    headers:{ \"Content-Type\":\"application/json\", Accept:\"application/json\" },\n    body:JSON.stringify({\n      contractVersion:\"1.0\",\n      taskType:\"cut_image\",\n      providerId:\"gemini\",\n      modelId:\"gemini-3.1-flash-image\",\n      input:{ prompt:text, aspectRatio, imageSize:imageSize || settings.imageSize || \"1K\", cutIndex }\n    }),\n  }, settings.timeoutMs);\n\n  const b64 = data?.image?.base64 || data?.imageBase64 || data?.base64;\n  const mimeType = data?.image?.mimeType || data?.mimeType || \"image/png\";\n  if (!b64) throw new Error(\"이미지 프록시 응답에 이미지 데이터가 없습니다.\");\n  return {\n    blob:base64ToBlob(b64, mimeType),\n    mimeType,\n    modelId:data?.meta?.modelId || \"gemini-3.1-flash-image\",\n    requestId:data?.meta?.requestId || \"\",\n  };\n}\n\nexport const IMAGE_PROVIDER_DEFAULTS = DEFAULTS;\n","js_v420a12/views/cutImagesStep.js":"// STEP ③ 이미지 — CUT별 이미지 첨부/교체/삭제 + QC 상태 관리 + 일괄 등록(자동매칭).\n//\n// 원칙:\n// - 이미지를 \"처음 첨부\"하거나 \"교체\"하면 항상 검수필요로 되돌린다(사용자가 다시 봐야 하므로).\n// - 삭제/교체는 반드시 db.deleteAssetSafely()를 거친다 — Phase 1에서 만든 참조무결성 삭제를 우회하지 않는다.\n// - 일괄 등록은 파일명을 분석해 \"예상 매칭\"만 보여주고, 사용자가 [매칭 확정]을 눌러야 실제로 저장된다.\n\nimport { putAsset, deleteAssetSafely } from \"../db.js\";\nimport { getAssetObjectUrl, forgetAssetObjectUrl } from \"../assetUrl.js\";\nimport { matchFilesToCuts } from \"../imageMatch.js\";\nimport { IMAGE_STATUS_SELECTABLE, IMAGE_GENERATOR a = anchorRow.getBoundingClientRect().top - state.anchorTop;\n          if (Math.abs(delta) > 0.5) {\n            window.scrollBy({ top: delta, left: 0, behavior: \"auto\" });\n          }\n          return;\n        }\n      }\n      window.scrollTo({ top: state.scrollY, left: 0, behavior: \"auto\" });\n    };\n\n    requestAnimationFrame(() => {\n      restore();\n      requestAnimationFrame(restore);\n    });\n  }\n\n  function setGenerationBusy(busy, activeButton = null, label = \"생성 중…\") {\n    generationBusy = busy;\n    root.querySelectorAll(\"[data-generate], #generate-next-missing-image\").forEach((btn) => {\n      btn.disabled = busy || btn.dataset.baseDisabled === \"1\";\n    });\n    if (activeButton && busy) {\n      activeButton.dataset.previousLabel = activeButton.textContent;\n      activeButton.textContent = label;\n    } else if (activeButton && !busy && activeButton.dataset.previousLabel) {\n      activeButton.textContent = activeButton.dataset.previousLabel;\n      delete activeButton.dataset.previousLabel;\n    }\n  }\n\n  function normalizeImageError(err) {\n    const raw = String(err?.message || err || \"알 수 없는 오류\");\n    if (/quota|resource_exhausted|prepayment|credits are depleted/i.test(raw)) {\n      return `Gemini 사용 한도 또는 결제 잔액을 확인해주세요.\\n\\n${raw}`;\n    }\n    if (/429/.test(raw)) {\n      return `요청이 너무 많거나 일시적인 사용 제한이 발생했습니다.\\n\\n${raw}`;\n    }\n    return raw;\n  }\n\n  function showImageGenerationError(cutNo, err, retryFn) {\n    showPersistentError(\n      `CUT ${cutNo} 이미지 생성 실패`,\n      normalizeImageError(err),\n      { onRetry: retryFn }\n    );\n  }\n\n  const approvedCount = cuts.filter((c) => isImageApproved(c)).length;\n  // Alpha 55: 과거 Episode가 channelKey=unassigned로 남아 있어도 소재 handoff/productionPreset의 채널값을 복구해\n  // 경제그루터기 전용 Style Bible이 자동 프롬프트에서 빠지지 않게 한다.\n  const sourceCategoryText = String(ep.sourceCategory || \"\").toLowerCase();\n  const effectiveChannelKey = ep.channelKey === \"economy_current\"\n    ? \"ec
