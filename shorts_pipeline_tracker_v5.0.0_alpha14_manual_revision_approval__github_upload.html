s-result\" class=\"hint\" style=\"margin-top:10px;\">아직 실행하지 않았습니다.</div>\n    </div>\n\n\n    <div class=\"card\">\n      <h3>☁️ 클라우드 동기화</h3>\n      <p class=\"hint\">Private Vercel Blob에 <strong>에피소드 + 이미지 + 오디오 전체 백업</strong>을 암호화된 임의 동기화 코드 공간으로 나눠 저장합니다. 첫 연결은 같은 코드를 다른 기기에 한 번 입력합니다.</p>\n      <label>기기 연결용 동기화 코드</label>\n      <input id=\"cloud-sync-key\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"동기화 코드 만들기 또는 다른 기기 코드 붙여넣기\" />\n      <div class=\"btn-row\" style=\"margin-top:8px;flex-wrap:wrap;\">\n        <button class=\"btn secondary\" id=\"cloud-sync-generate\" type=\"button\">새 코드 만들기</button>\n        <button class=\"btn secondary\" id=\"cloud-sync-save-key\" type=\"button\">코드 저장</button>\n        <button class=\"btn secondary\" id=\"cloud-sync-copy\" type=\"button\">코드 복사</button>\n      </div>\n      <div class=\"btn-row\" style=\"margin-top:8px;flex-wrap:wrap;\">\n        <button class=\"btn\" id=\"cloud-sync-push\" type=\"button\">이 기기 작업 → 클라우드</button>\n        <button class=\"btn secondary\" id=\"cloud-sync-pull\" type=\"button\">클라우드 → 이 기기</button>\n        <button class=\"btn secondary\" id=\"cloud-sync-check\" type=\"button\">연결 확인</button>\n      </div>\n      <div id=\"cloud-sync-status\" class=\"hint\" style=\"margin-top:8px;\">Alpha 11은 안전한 전체 프로젝트 동기화 기반입니다. 자동 증분 동기화는 이 기반 검증 후 활성화합니다.</div>\n    </div>\n\n    <div class=\"card\">\n      <h3>📱↔️💻 기기 이동</h3>\n      <p class=\"hint\">클라우드 없이도 <strong>에피소드 + 이미지 + 오디오를 한 파일</strong>로 다른 기기로 옮길 수 있습니다. 기존 Full Backup 포맷을 그대로 사용합니다.</p>\n      <div class=\"btn-row\">\n        <button class=\"btn\" id=\"device-handoff-export\" type=\"button\">이 기기 전체 작업 내보내기</button>\n        <button class=\"btn secondary\" id=\"device-handoff-import\" type=\"button\">다른 기기 작업 가져오기</button>\n      </div>\n      <div id=\"device-handoff-status\" class=\"hint\" style=\"margin-top:8px;\">클라우드 장애 시에도 사용할 수 있는 수동 기기 이동 경로입니다.</div>\n    </div>\n\n    <div class=\"card\">\n      <h3>빠른 백업 — 프로젝트 정보만</h3>\n      <p class=\"hint\">에피소드·CUT·대본 등 텍스트 정보만 포함돼요. <strong>이미지와 음성 파일은 포함되지 않습니다.</strong>\n      이미지·음성까지 포함하려면 아래 \"전체 백업\"을 이용해주세요.</p>\n      <div class=\"btn-row\">\n        <button class=\"btn secondary\" id=\"light-backup-btn\">빠른 백업 다운로드</button>\n        <button class=\"btn secondary\" id=\"light-restore-btn\">빠른 백업 불러오기</button>\n      </div>\n      <input type=\"file\" id=\"light-restore-file\" accept=\"application/json\" style=\"display:none;\" />\n      <div id=\"light-restore-result\" class=\"hint\" style=\"margin-top:8px;\"></div>\n      <p class=\"hint\" id=\"last-light-backup\" style=\"margin-top:8px;\"></p>\n    </div>\n\n    <div class=\"card\">\n      <h3>전체 백업 — 이미지·음성 포함</h3>\n      <p class=\"hint\">모든 데이터는 이 기기 브라우저(IndexedDB)에만 저장돼요. 실제로 제작을 시작하면 이미지·음성\n      Blob이 쌓이므로, 완전한 프로젝트 복원을 위해서는 전체 백업을 주기적으로 받아두는 걸 권장해요.</p>\n      <p class=\"hint\" id=\"full-backup-preview\">불러오는 중...</p>\n      <p class=\"hint\" id=\"full-backup-warn\" style=\"display:none;color:var(--danger);\"></p>\n      <div class=\"btn-row\">\n        <button class=\"btn\" id=\"full-backup-btn\">전체 백업 시작</button>\n      </div>\n      <p class=\"hint\" id=\"full-backup-progress\"></p>\n      <p class=\"hint\" id=\"last-full-backup\" style=\"margin-top:8px;\"></p>\n    </div>\n\n    <div class=\"card\">\n      <h3>전체 백업 복원</h3>\n      <p class=\"hint\">전체 백업 파일(.spbak)을 선택하면 먼저 파일이 온전한지 검사부터 해요. 검사를 통과하기 전에는\n      기존 데이터가 전혀 바뀌지 않습니다. 기존 데이터와 겹치는 항목이 있으면 어떻게 할지 직접 선택할 수 있어요.</p>\n      <button class=\"btn secondary\" id=\"full-restore-btn\">전체 백업 파일 선택</button>\n      <input type=\"file\" id=\"full-restore-file\" accept=\".spbak,application/octet-stream\" style=\"display:none;\" />\n      <div id=\"full-restore-result\" class=\"hint\" style=\"margin-top:8px;\"></div>\n    </div>\n\n    <div class=\"card\">\n      <h3>사용하지 않는 미디어 파일 정리</h3>\n      <p class=\"hint\">어느 에피소드에서도 참조하지 않는 이미지·음성 파일(고아 파일)을 찾아서 정리해요.</p>\n      <button class=\"btn secondary small\" id=\"orphan-btn\">사용하지 않는 미디어 파일 정리</button>\n      <div id=\"orphan-result\" class=\"hint\" style=\"margin-top:8px;\"></div>\n    </div>\n\n    <div class=\"card\">\n      <h3>데이터 상태 검사</h3>\n      <p class=\"hint\">Episode/CUT/Asset 구조와 참조 무결성을 한 번에 점검해요. 문제를 보여주기만 하고 자동으로\n      삭제하지는 않아요.</p>\n      <button class=\"btn secondary\" id=\"health-btn\">데이터 상태 검사</button>\n      <div id=\"health-result\" class=\"hint\" style=\"margin-top:8px;\"></div>\n    </div>\n\n    <div class=\"card\">\n      <h3>씬 재생시간 계산 기준값</h3>\n      <p class=\"hint\">\n        일반: ${RATE_NORMAL}자/초 · 뉴스/정치: ${RATE_SLOW}자/초 · 공포: ${RATE_HORROR}자/초<br/>\n        여유시간: +${PAD}초, 최소 길이: ${FLOOR}초<br/>\n        이 값은 재생시간의 \"초기 참고값\"이며, 실측/수동 지정값이 있으면 그쪽이 우선돼요.\n      </p>\n    </div>\n\n    <div class=\"card\">\n      <h3>V4 AI / Recipe 기반</h3>\n      <p class=\"hint\">Vercel 보안 프록시를 통해 OpenAI Story Writer를 호출합니다. API 키는 브라우저에 저장하지 않습니다.</p>\n      <div class=\"hint\">\n        AI Contract v${AI_CONTRACT_VERSION} · Task ${AI_TASK_TYPES.length}종<br/>\n        Provider Adapter 슬롯 ${AI_PROVIDER_IDS.length}종 · API Key 저장 0건<br/>\n        Recipe Schema v${RECIPE_SCHEMA_VERSION} · Built-in Recipe ${BUILTIN_RECIPES.length}종\n      </div>\n    </div>\n\n    <div class=\"card\">\n      <h3>앱 정보</h3>\n      <div id=\"app-info\" class=\"hint\">불러오는 중...</div>\n      <p class=\"hint\" style=\"margin-top:8px;\">\n        기본 제작 데이터와 렌더링은 로컬 브라우저에서 처리하며, AI Story Writer를 사용할 때만 설정된 HTTPS 프록시로 네트워크 요청을 보냅니다.\n        스토리/이미지/음성 등 외부에서 만든 제작 결과물을 이 앱에 등록해 CUT · 타임라인 · 미리보기 ·\n        제작 명세(production.json)까지 관리하는 용도예요.\n      </p>\n    </div>\n    <div class=\"card\">\n      <h3>V4 AI Provider</h3>\n      <p class=\"hint\">API 키는 Tracker/브라우저에 저장하지 않습니다. HTTPS 프록시 URL만 저장합니다.</p>\n      <label>OpenAI Proxy URL</label>\n      <input id=\"ai-proxy-url\" type=\"url\" placeholder=\"https://your-proxy.vercel.app\" />\n      <label>모델</label>\n      <select id=\"ai-model\" disabled><option value=\"gpt-5-mini\">gpt-5-mini (Vercel Proxy)</option></select>\n      <label>Reasoning</label>\n      <select id=\"ai-reasoning\"><option value=\"none\">none</option><option value=\"low\">low</option><option value=\"medium\">medium</option></select>\n      <div class=\"btn-row\"><button class=\"btn secondary\" id=\"ai-save\">AI 설정 저장</button><button class=\"btn secondary\" id=\"ai-test\">연결 테스트</button></div>\n      <div id=\"ai-status\" class=\"hint\" style=\"margin-top:8px;\"></div>\n    </div>\n  `;\n\n  const aiSettings = loadAiProviderSettings();\n  const proxyInput = root.querySelector(\"#ai-proxy-url\");\n  const modelSelect = root.querySelector(\"#ai-model\");\n  const reasoningSelect = root.querySelector(\"#ai-reasoning\");\n  const aiStatus = root.querySelector(\"#ai-status\");\n  if (proxyInput) proxyInput.value = aiSettings.proxyUrl || \"\";\n  if (modelSelect) modelSelect.value = \"gpt-5-mini\";\n  if (reasoningSelect) reasoningSelect.value = aiSettings.reasoningEffort || \"low\";\n  root.querySelector(\"#ai-save\")?.addEventListener(\"click\", () => {\n    const next = saveAiProviderSettings({ proxyUrl: proxyInput.value.trim(), modelId: modelSelect.value, reasoningEffort: reasoningSelect.value });\n    aiStatus.textContent = next.proxyUrl ? \"✅ AI 프록시 설정을 저장했습니다.\" : \"⚪ 프록시 URL이 비어 있습니다.\";\n  });\n  root.querySelector(\"#ai-test\")?.addEventListener(\"click\", async () => {\n    saveAiProviderSettings({ proxyUrl: proxyInput.value.trim(), modelId: modelSelect.value, reasoningEffort: reasoningSelect.value });\n    aiStatus.textContent = \"연결 확인 중…\";\n    const result = await checkAiProvider();\n    aiStatus.textContent = result.ok ? `✅ 연결됨 · ${result.provider || \"OpenAI\"} · ${result.model || modelSelect.value}` : `❌ 연결 실패: ${result.message || result.reason || \"unknown\"}`;\n  });\n\n\n  root.querySelector(\"#device-diagnostics\")?.addEventListener(\"click\", async () => {\n    const box = root.querySelector(\"#device-diagnostics-result\");\n    const btn = root.querySelector(\"#device-diagnostics\");\n    if (!box || !btn) return;\n    btn.disabled = true;\n    box.textContent = \"진단 중…\";\n    try {\n      const viewport = computeViewportState(window.innerWidth, window.innerHeight);\n      const legacy = detectRendererCapabilities();\n      const standard = await detectStandardMp4Capabilities();\n      const coarse = !!window.matchMedia?.(\"(pointer: coarse)\")?.matches;\n      const standalone = !!window.matchMedia?.(\"(display-mode: standalone)\")?.matches || navigator.standalone === true;\n      const rows = [\n        [\"Viewport\", `${viewport.width}×${viewport.height} · ${viewport.breakpoint} · ${viewport.orientation}`],\n        [\"Input\", coarse ? \"touch/coarse\" : \"fine/unknown\"],\n        [\"PWA\", standalone ? \"standalone\" : \"browser tab\"],\n        [\"IndexedDB\", \"indexedDB\" in window ? \"지원\" : \"미지원\"],\n        [\"Service Worker\", \"serviceWorker\" in navigator ? \"지원\" : \"미지원\"],\n        [\"Canvas captureStream\", legacy.captureStream ? \"지원\" : \"미지원\"],\n        [\"MediaRecorder\", legacy.mediaRecorder ? `지원${legacy.preferredMimeType ? ` · ${legacy.preferredMimeType}` : \"\"}` : \"미지원\"],\n        [\"WebCodecs H.264\", standard.h264?.supported ? `지원 · ${standard.h264.config?.codec || \"H.264\"}` : \"미지원\"],\n        [\"WebCodecs AAC\", standard.aac?.supported ? \"지원\" : \"미지원\"],\n        [\"표준 MP4\", standard.readyForStandardMp4 ? \"1080×1920 H.264/AAC 경로 사용 가능\" : \"현재 브라우저에서 표준 MP4 경로 미확인\"],\n      ];\n      box.innerHTML = rows.map(([k,v]) => `<div><strong>${escapeHtml(k)}:</strong> ${escapeHtml(v)}</div>`).join(\"\");\n    } catch (err) {\n      box.textContent = `진단 실패: ${err?.message || err}`;\n    } finally {\n      btn.disabled = false;\n    }\n  });\n\n  loadStorageSummary();\n  loadFullBackupPreview();\n  loadLastBackupLabels();\n  loadAppInfo();\n\n  // ---- Private Blob Cloud Sync ----\n  const cloudKeyInput = root.querySelector(\"#cloud-sync-key\");\n  const cloudStatus = root.querySelector(\"#cloud-sync-status\");\n  if (cloudKeyInput) cloudKeyInput.value = getCloudSyncKey();\n  const cloudProgress = (prefix) => ({stage,done,total,bytes}) => {\n    if (!cloudStatus) return;\n    if (stage === \"building\") cloudStatus.textContent = `${prefix} · 전체 백업 구성 중…`;\n    else if (stage === \"uploading\" || stage === \"downloading\") cloudStatus.textContent = `${prefix} · ${done}/${total} 청크 (${fmtBytes(bytes || 0)})`;\n    else if (stage === \"done\") cloudStatus.textContent = `${prefix} · 전송 완료 (${fmtBytes(bytes || 0)})`;\n  };\n  root.querySelector(\"#cloud-sync-generate\")?.addEventListener(\"click\", () => {\n    const key = generateCloudSyncKey();\n    cloudKeyInput.value = key;\n    cloudStatus.textContent = \"새 동기화 코드를 만들었습니다. 다른 기기에는 이 코드를 한 번만 복사해 넣으면 됩니다.\";\n  });\n  root.querySelector(\"#cloud-sync-save-key\")?.addEventListener(\"click\", () => {\n    try {\n      const key = saveCloudSyncKey(cloudKeyInput.value);\n      cloudStatus.textContent = key ? \"동기화 코드를 이 기기에 저장했습니다.\" : \"동기화 코드를 지웠습니다.\";\n    } catch (err) { cloudStatus.textContent = `코드 저장 실패 · ${err?.message || err}`; }\n  });\n  root.querySelector(\"#cloud-sync-copy\")?.addEventListener(\"click\", async () => {\n    const key = cloudKeyInput.value.trim();\n    if (!key) return toast(\"먼저 동기화 코드를 만들어주세요\");\n    try { await navigator.clipboard.writeText(key); toast(\"동기화 코드를 복사했어요\"); }\n    catch { cloudStatus.textContent = \"자동 복사가 막혔습니다. 입력칸의 코드를 길게 눌러 복사해주세요.\"; }\n  });\n  root.querySelector(\"#cloud-sync-check\")?.addEventListener(\"click\", async () => {\n    cloudStatus.textContent = \"클라우드 연결 확인 중…\";\n    try {\n      const health = await checkCloudSync();\n      const key = cloudKeyInput.value.trim();\n      let remote = null;\n      if (key) { saveCloudSyncKey(key); remote = await getCloudManifest(key); }\n      cloudStatus.textContent = remote\n        ? `✅ Private Blob 연결 정상 · 클라우드 최신본 ${fmtDate(remote.updatedAt)} · ${fmtBytes(remote.byteLength || 0)} · revision ${remote.revision}`\n        : `✅ Private Blob 연결 정상${key ? \" · 이 코드에는 아직 클라우드 작업 없음\" : \" · 동기화 코드를 만들면 기기 연결 가능\"}`;\n    } catch (err) { cloudStatus.textContent = `❌ 연결 실패 · ${err?.message || err}`; }\n  });\n  root.querySelector(\"#cloud-sync-push\")?.addEventListener(\"click\", async (e) => {\n    const btn=e.currentTarget; let key;\n    try { key=saveCloudSyncKey(cloudKeyInput.value); if(!key) throw new Error(\"먼저 동기화 코드를 만들어주세요.\"); }\n    catch(err){ cloudStatus.textContent=err?.message||String(err); return; }\n    btn.disabled=true;\n    try {\n      const result=await uploadCloudSnapshot(key,{onProgress:cloudProgress(\"클라우드 업로드\")});\n      if (result?.skipped) {\n        const skipMsg = `변경사항 없음 · 업로드 생략 · Episode ${result.episodeCount ?? 0}개 · Asset ${result.assetCount ?? 0}개`;\n        cloudStatus.textContent = `✅ ${skipMsg}`;\n        try { toast(\"변경사항이 없어 클라우드 업로드를 생략했어요\"); } catch {}\n      } else {\n        cloudStatus.textContent=`✅ 클라우드 저장 완료 · ${fmtBytes(result.bytes)} · revision ${result?.manifest?.revision ?? \"-\"} · ${fmtDate(result?.manifest?.updatedAt)}`;\n        toast(\"이 기기 전체 작업을 클라우드에 저장했어요\");\n      }\n    } catch(err){ cloudStatus.textContent=`❌ 클라우드 저장 실패 · ${err?.message||err}`; }\n    finally{ btn.disabled=false; }\n  });\n  root.querySelector(\"#cloud-sync-pull\")?.addEventListener(\"click\", async (e) => {\n    const btn=e.currentTarget; let key;\n    try { key=saveCloudSyncKey(cloudKeyInput.value); if(!key) throw new Error(\"먼저 동기화 코드를 입력해주세요.\"); }\n    catch(err){ cloudStatus.textContent=err?.message||String(err); return; }\n    btn.disabled=true;\n    try {\n      const {blob,manifest}=await downloadCloudSnapshot(key,{onProgress:cloudProgress(\"클라우드 다운로드\")});\n      const parsed=await readFullBackupHeader(blob);\n      if(!parsed) throw new Error(\"클라우드 파일이 SPB1 전체 백업 형식이 아닙니다.\");\n      const validation=validateFullBackup(parsed);\n      if(!validation.valid) throw new Error(validation.errors.join(\" / \"));\n      const conflicts=await previewRestoreConflicts(parsed.header.episodes,parsed.header.assets);\n      const ok=confirm(`클라우드 작업을 이 기기에 반영할까요?\\n\\nEpisode ${parsed.header.episodeCount}개 · Asset ${parsed.header.assetCount}개\\n기존 동일 항목 ${conflicts.conflictEpisodeCount+conflicts.conflictAssetCount}개는 클라우드 버전으로 덮어씁니다.\\n이 기기에만 있는 추가 항목은 삭제하지 않습니다.`);\n      if(!ok){ cloudStatus.textContent=\"클라우드 복원을 취소했습니다. 기존 데이터는 변경되지 않았습니다.\"; return; }\n      const result=await restoreFullBackup(parsed,\"overwrite\",{onProgress:(stage)=>{cloudStatus.textContent=`클라우드 복원 · ${PROGRESS_LABEL[stage]||stage}`;}});\n      cloudStatus.textContent=`✅ 클라우드 반영 완료 · Episode ${result.restoredEpisodes}개 · Asset ${result.restoredAssets}개 · revision ${manifest.revision}`;\n      toast(\"클라우드 작업을 이 기기에 반영했어요\");\n      loadStorageSummary(); loadFullBackupPreview(); loadAppInfo();\n    } catch(err){ cloudStatus.textContent=`❌ 클라우드 불러오기 실패 · ${err?.message||err}`; }\n    finally{ btn.disabled=false; }\n  });\n\n  // ---- 기기 이동(Device Handoff) ----\n  // 새 포맷을 만들지 않고 이미 검증된 Full Backup/Restore를 재사용한다.\n  root.querySelector(\"#device-handoff-export\")?.addEventListener(\"click\", () => {\n    root.querySelector(\"#full-backup-btn\")?.click();\n    const box = root.querySelector(\"#device-handoff-status\");\n    if (box) box.textContent = \"전체 작업 파일을 만드는 중입니다. 다운로드가 끝나면 다른 기기로 파일을 옮겨주세요.\";\n  });\n  root.querySelector(\"#device-handoff-import\")?.addEventListener(\"click\", () => {\n    root.querySelector(\"#full-restore-btn\")?.click();\n    const box = root.querySelector(\"#device-handoff-status\");\n    if (box) box.textContent = \"다른 기기에서 만든 .spbak 파일을 선택해주세요. 기존 데이터는 검사 통과 전까지 변경되지 않습니다.\";\n  });\n\n  // ---- 빠른 백업(Light) ----\n  root.querySelector(\"#light-backup-btn\").onclick = async () => {\n    const data = await exportAll();\n    downloadText(lightBackupFilename(), JSON.stringify(data, null, 2));\n    recordLightBackupDone();\n    loadLastBackupLabels();\n    toast(\"빠른 백업을 받았어요\");\n ceSave);\n  resultBox?.addEventListener(\"change\", scheduleWorkspaceSave);\n  setActiveDraftFlush(async () => {\n    clearTimeout(storyWorkspaceTimer);\n    persistStoryWorkspace(root);\n  });\n\n  const restored = loadStoryWorkspace();\n  if (restored) {\n    activeIdeaHandoff = restored.ideaHandoff || null;\n    const handoffBox = root.querySelector(\"#sw-idea-handoff\");\n    if (handoffBox && activeIdeaHandoff) handoffBox.innerHTML = `<div class=\"sw-handoff-card\"><strong>${escapeHtml(activeIdeaHandoff.title || \"선택한 소재\")}</strong><span>${escapeHtml(contentChannelLabel(activeIdeaHandoff.channelKey))} · ${escapeHtml(contentFormatLabel(activeIdeaHandoff.contentFormat))} · ${escapeHtml(productionProfileLabel(activeIdeaHandoff.productionProfile))}</span>${activeIdeaHandoff.productionDirection ? `<small>제작 방향 · ${escapeHtml(activeIdeaHandoff.productionDirection)}</small>` : \"\"}</div>`;\n    currentLongformDraft = restored.longformDraft || null;\n    currentLongformQc = restored.longformQc || null;\n    currentLongformRevisionCount = Math.max(0, Number(restored.longformRevisionCount || 0));\n    currentLongformRevisionLimit = Math.max(1, Number(restored.longformRevisionLimit || 1), currentLongformRevisionCount);\n    currentLongformQcHistory = Array.isArray(restored.longformQcHistory) ? restored.longformQcHistory.slice(-4) : (currentLongformQc ? [currentLongformQc] : []);\n    if (currentLongformDraft && claudeLongformResult) renderLongformDraft(claudeLongformResult, currentLongformDraft, { model: currentLongformRevisionCount ? \"Claude 수정본 (복구)\" : \"Claude (복구)\", usage: null, stageLabel: currentLongformRevisionCount ? \"자동 수정 1회 복구\" : \"\" });\n    if (currentLongformQc && gptQcResult) renderGptLongformQc(gptQcResult, currentLongformQc);\n    syncAutoRevisionButton();\n    if (autoLoopStatus && currentLongformQc?.status === \"revision_required\" && currentLongformRevisionCount < 1) autoLoopStatus.textContent = \"↩ Alpha10의 수정 필요 결과를 복구했습니다. 아래 Claude 1회 자동 수정 \n  const baseStyle = String(src.imageStyleNote || src.visualBible || src.visual_bible || \"\").trim();\n  const imageStyleNote = [baseStyle, ...supportingLines].filter(Boolean).join(\"\\n\");\n\n  const sceneTypes = rawCuts.map((c) => String(c?.sceneType || c?.scene_type || \"\").trim().toLowerCase());\n  const explanationCount = sceneTypes.filter((x) => x === \"imagination\" || x === \"explanation\" || x === \"info\").length;\n  const minExplain = cuts.length >= 8 ? Math.max(4, Math.ceil(cuts.length * 0.4)) : Math.ceil(cuts.length * 0.4);\n  const visualWarnings = [];\n  if (cuts.length >= 8 && explanationCount < minExplain) {\n    visualWarnings.push(`경제그루터기 설명/상상 화면 비율 부족: ${explanationCount}/${cuts.length} CUT · 권장 최소 ${minExplain} CUT`);\n  }\n  if (!supportingLines.length) {\n    visualWarnings.push(\"상담객 프로필 없음: 이미지 생성 전 이번 에피소드 전용 상담객 외형/목소리 정보를 지정 권장\");\n  }\n\n  return normalizeStoryDraft({\n    seriesType: src.seriesType || seriesType,\n    title: src.title || src.episodeTitle || src.episode_title || src.subject || \"\",\n    subject: src.subject || src.topic || src.title || src.episodeTitle || \"\",\n    hook: src.hook || cuts[0]?.narration || \"\",\n    summary: src.summary || \"\",\n    imageStyleNote,\n    warnings: [...(Array.isArray(src.warnings) ? src.warnings.map(String) : []), ...visualWarnings, \"Claude Writer import\"],\n    cutCountSuggested: cuts.length,\n    cuts,\n  }, seriesType);\n}\n\nfunction buildLocalScaffold(topic, seriesType) {\n  const recipe = getRecipe(defaultRecipeIdForSeries(seriesType));\n  const count = recipe?.story?.targetCutCount || 8;\n  const cuts = Array.from({ length: count }, (_, i) => ({\n    purpose: PURPOSE_SEQUENCE[i] || (i === count - 1 ? \"엔딩\" : \"전개\"),\n    situation: i === 0 ? `${topic}의 핵심을 즉시 제시` : `${topic}의 정보/사건을 CUT ${i + 1}에서 전개`,\n    narration: i === 0 ? `${topic}. 가장 먼저 봐야 할 핵심부터 시작합니다.` : `${topic} 관련 CUT ${i + 1} 나레이션`,\n    directorNote: \"\",\n    imagePrompt: `${topic} — CUT ${i + 1}, 9:16, ${recipe?.image?.styleNote || \"명확한 장면\"}`,\n    dialogueLines: [],\n  }));\n  return normalizeStoryDraft({\n    seriesType, title: topic, subject: topic, hook: cuts[0]?.narration || \"\",\n    summary: \"AI 연결 실패 시 사용할 로컬 구조 초안\", cutCountSuggested: count, cuts,\n    imageStyleNote: recipe?.image?.styleNote || \"\", warnings: [\"로컬 구조 초안은 AI 생성 결과가 아닙니다.\"],\n  }, seriesType);\n}\n\nfunction renderDraft(box, draft, root, source = \"local\") {\n  box.innerHTML = `\n    <div class=\"card\">\n      <h3>Story Draft ${source === \"ai\" ? \"✨\" : source === \"claude\" ? \"🟣 Claude Import\" : \"\"}</h3>\n      <label>제목</label><input id=\"sw-title\" value=\"${attr(draft.title)}\" />\n      <label>훅</label><textarea id=\"sw-hook\" rows=\"2\">${escapeHtml(draft.hook)}</textarea>\n      <label>AI 전체 이미지 스타일 원본</label><textarea id=\"sw-style\" rows=\"2\">${escapeHtml(draft.imageStyleNote)}</textarea>\n      <p class=\"hint\">에피소드 생성 시 <b>광교 도마뱀 계열 Channel Style Bible</b>을 고정 앵커로 붙이고, 이 스타일 원본과 소재를 바탕으로 <b>Episode Global Visual Bible</b>을 자동 생성합니다.</p>\n      <p class=\"hint\">CUT ${draft.cuts.length}개 · ${escapeHtml((draft.warnings || []).join(\" · \"))}</p>\n      <div class=\"hint\" style=\"margin-top:6px;\">Episode 변환 시 Episode Global Visual Bible을 자동 생성하고, 각 CUT에서는 Channel Style Bible + Episode Global Visual Bible + 개별 장면 프롬프트를 3단 결합해 복사합니다.</div>\n    </div>\n    <div class=\"card\" id=\"sw-feedback-card\">\n      <h3>💬 기획 피드백 / 수정 요청</h3>\n      <p class=\"hint\">현재 초안을 유지한 채 자연어로 방향을 바꿀 수 있습니다. 예: “훅을 더 강하게”, “CUT 3~5를 짧게”, “결말을 반전형으로”, “설명형보다 궁금증형으로”.</p>\n      <textarea id=\"sw-feedback\" rows=\"3\" placeholder=\"현재 초안에서 바꾸고 싶은 점을 그대로 적어주세요\"></textarea>\n      <div class=\"btn-row\" style=\"margin-top:8px;\">\n        <button class=\"btn\" id=\"sw-revise-ai\" type=\"button\" ${source === \"ai\" ? \"\" : \"disabled\"}>✨ AI로 수정안 만들기</button>\n      </div>\n      <div id=\"sw-revision-status\" class=\"hint\" style=\"margin-top:8px;\"></div>\n      <div id=\"sw-revision-preview\"></div>\n    </div>\n    <div id=\"sw-cuts\">${draft.cuts.map((c, i) => cutEditor(c, i)).join(\"\")}</div>\n    <div class=\"card\">\n      <div class=\"btn-row\">\n        <button class=\"btn secondary\" id=\"sw-rebuild\">같은 소재로 로컬 재구성</button>\n        <button class=\"btn\" id=\"sw-create-episode\">이 결과로 에피소드 생성</button>\n      </div>\n      <div id=\"sw-validation\" class=\"hint\" style=\"margin-top:8px;\"></div>\n    </div>\n  `;\n\n  const reviseBtn = box.querySelector(\"#sw-revise-ai\");\n  if (reviseBtn) reviseBtn.onclick = async () => {\n    const feedback = box.querySelector(\"#sw-feedback\")?.value.trim() || \"\";\n    if (!feedback) return toast(\"수정 요청을 입력해주세요\");\n    const currentEdited = readEditedDraft(box, currentDraft);\n    const seriesType = currentEdited.seriesType || root.querySelector(\"#sw-series\")?.value || \"general_issue\";\n    const recipe = getRecipe(defaultRecipeIdForSeries(seriesType));\n    const revisionStatus = box.querySelector(\"#sw-revision-status\");\n    const preview = box.querySelector(\"#sw-revision-preview\");\n    reviseBtn.disabled = true;\n    reviseBtn.textContent = \"AI 수정 중…\";\n    revisionStatus.textContent = \"현재 초안과 수정 요청을 함께 보내 수정안을 만들고 있습니다.\";\n    preview.innerHTML = \"\";\n    try {\n      const result = await reviseStoryDraft({ draft: currentEdited, feedback, seriesType, recipe });\n      const actualModel = result.meta?.model || loadAiProviderSettings().modelId || \"OpenAI\";\n      const ledger = recordAiUsage(result.meta?.usage, actualModel);\n      const proposed = result.draft;\n      const changes = summarizeDraftChanges(currentEdited, proposed);\n      revisionStatus.textContent = ledger.lastCostUsd == null\n        ? \"✅ 수정안 생성 완료 · 아래에서 변경 전/후를 확인하세요.\"\n        : `✅ 수정안 생성 완료 · 이번 실제 추정비용 $${ledger.lastCostUsd.toFixed(4)}`;\n      preview.innerHTML = revisionPreview(currentEdited, proposed, changes);\n      preview.querySelector(\"#sw-accept-revision\")?.addEventListener(\"click\", () => {\n        currentDraft = proposed;\n        currentDraftSource = \"ai\";\n        renderDraft(box, currentDraft, root, \"ai\");\n        persistStoryWorkspace(root);\n        toast(\"AI 수정안을 현재 초안에 적용했어요\");\n      });\n      preview.querySelector(\"#sw-reject-revision\")?.addEventListener(\"click\", () => {\n        preview.innerHTML = \"\";\n        revisionStatus.textContent = \"수정안을 적용하지 않았습니다. 기존 초안은 그대로 유지됩니다.\";\n        toast(\"기존 초안을 유지했어요\");\n      });\n    } catch (err) {\n      revisionStatus.textContent = `❌ AI 수정 실패: ${err?.message || err}`;\n    } finally {\n      reviseBtn.disabled = false;\n      reviseBtn.textContent = \"✨ AI로 수정안 만들기\";\n    }\n  };\n\n  box.querySelector(\"#sw-rebuild\").onclick = () => {\n    const topic = root.querySelector(\"#sw-topic\").value.trim();\n    const seriesType = root.querySelector(\"#sw-series\").value;\n    currentDraft = buildLocalScaffold(topic, seriesType);\n    currentDraftSource = \"local\";\n    renderDraft(box, currentDraft, root, \"local\");\n    persistStoryWorkspace(root);\n  };\n  box.querySelector(\"#sw-create-episode\").onclick = async (event) => {\n    if (creatingEpisode) return;\n    const createBtn = event.currentTarget;\n    const edited = readEditedDraft(box, currentDraft);\n    const validation = validateStoryDraft(edited);\n    const validationBox = box.querySelector(\"#sw-validation\");\n    if (!validation.valid) {\n      validationBox.innerHTML = validation.errors.map((e) => `❌ ${escapeHtml(e)}`).join(\"<br/>\");\n      return;\n    }\n    const emptyPrompts = validation.normalized.cuts.filter((c) => !String(c.imagePrompt || \"\").trim()).length;\n    if (emptyPrompts) {\n      validationBox.textContent = `❌ 이미지 프롬프트가 비어 있는 CUT이 ${emptyPrompts}개 있습니다.`;\n      return;\n    }\n    creatingEpisode = true;\n    createBtn.disabled = true;\n    createBtn.textContent = \"에피소드 생성 중…\";\n    validationBox.textContent = \"Story Draft를 Tracker Episode/CUT 구조로 변환하고 있습니다.\";\n    try {\n      const converted = storyDraftToEpisodePatch(validation.normalized);\n      if (!converted.valid || !converted.patch) throw new Error((converted.errors || []).join(\" / \") || \"Episode 변환 실패\");\n      const ep = newEpisode(validation.normalized.seriesType, \"cut\");\n      Object.assign(ep, converted.patch);\n      if (activeIdeaHandoff) applyIdeaHandoffToEpisode(ep, activeIdeaHandoff);\n      // v4.1.0 Alpha 2: Story Writer 생성 Episode는 기획 완료 조건(title + date)을\n      // 만족하도록 생성일을 자동 기록한다. 사용자가 날짜를 다시 입력하는 수작업을 요구하지 않는다.\n      const created = new Date(ep.createdAt || Date.now());\n      ep.date = `${created.getFullYear()}.${String(created.getMonth() + 1).padStart(2, \"0\")}.${String(created.getDate()).padStart(2, \"0\")}`;\n      // Alpha 7: AI 응답의 index/표시값과 무관하게 실제 배열 순서를 SSOT로 강제한다.\n      // 변환기는 매 CUT에 새 id를 발급하지만, 방어적으로 중복 id가 있으면 다시 발급하지 않고\n      // 변환 자체를 실패시켜 잘못된 참조가 저장되는 일을 막는다.\n      reindexCuts(ep.cuts);\n      const ids = ep.cuts.map((c) => c.id);\n      if (new Set(ids).size !== ids.length) throw new Error(\"CUT ID 중복이 감지되어 저장을 중단했습니다.\");\n      ep.cuts.forEach((c) => {\n        c.productionPrompt = String(c.productionPrompt || \"\").trim();\n        c.aiImageState = c.productionPrompt ? \"prompt_ready\" : \"prompt_missing\";\n      });\n      const recipeId = defaultRecipeIdForSeries(ep.seriesType);\n      ep.recipeState = { ...ep.recipeState, selectedId: recipeId };\n      applyRecipeToEpisode(ep, recipeId);\n      // Beta 4: Story 결과로 Episode Global Visual Bible을 만들고, 이미지 단계에서 Channel Style Bible과 3단 결합한다.\n      ep.globalVisualBible = buildGlobalVisualBible(validation.normalized, getRecipe(recipeId));\n      ep.thumbnail = normalizeThumbnailState(ep.thumbnail, ep.seriesType, ep.channelKey);\n      ep.thumbnail.sourceCutIndex = 0;\n      ep.thumbnail.prompt = buildThumbnailPrompt(ep);\n      ep.thumbnail.status = \"prompt_ready\";\n      ep.thumbnail.updatedAt = Date.now();\n      ep.aiWorkspace = {\n        ...ep.aiWorkspace,\n        providerId: source === \"ai\" ? \"openai\" : null,\n        modelId: source === \"ai\" ? loadAiProviderSettings().modelId : \"\",\n        status: \"succeeded\",\n        lastTaskType: \"story_draft\",\n        lastResultAt: Date.now(),\n        promptInput: root.querySelector(\"#sw-topic\")?.value.trim() || \"\",\n        lastResult: validation.normalized,\n      };\n      await saveEpisode(ep);\n      if (activeIdeaHandoff?.ideaRecord) {\n        const idea = { ...activeIdeaHandoff.ideaRecord };\n        idea.status = \"in_production\";\n        idea.linkedEpisodeId = ep.id;\n        idea.productionStartedAt = Date.now();\n        await saveIdea(idea);\n      }\n      validationBox.textContent = `✅ Episode 생성 완료 · CUT ${ep.cuts.length}개 · 이미지 프롬프트 ${ep.cuts.filter((c) => c.productionPrompt).length}/${ep.cuts.length} 준비`;\n      toast(\"AI Story Draft를 새 에피소드로 변환했어요\");\n      localStorage.removeItem(STORY_WORKSPACE_KEY);\n      creatingEpisode = false;\n      location.hash = `#/episode/${ep.id}/cutImages`;\n    } catch (err) {\n      validationBox.textContent = `❌ Episode 생성 실패: ${err?.message || err}`;\n      createBtn.disabled = false;\n      createBtn.textContent = \"이 결과로 에피소드 생성\";\n      creatingEpisode = false;\n    }\n  };\n}\n\nfunction persistStoryWorkspace(root) {\n  try {\n    const topic = root.querySelector(\"#sw-topic\")?.value || \"\";\n    const seriesType = root.querySelector(\"#sw-series\")?.value || \"general_issue\";\n    const box = root.querySelector(\"#sw-result\");\n    let draft = currentDraft;\n    if (draft && box?.querySelector(\"#sw-title\")) {\n      try { draft = readEditedDraft(box, currentDraft); } catch (_) {}\n    }\n    if (!topic.trim() && !draft && !currentLongformDraft && !currentLongformQc) {\n      localStorage.removeItem(STORY_WORKSPACE_KEY);\n      return;\n    }\n    localStorage.setItem(STORY_WORKSPACE_KEY, JSON.stringify({\n      version: 1, topic, seriesType, draft, longformDraft: currentLongformDraft, longformQc: currentLongformQc, longformRevisionCount: currentLongformRevisionCount, longformRevisionLimit: currentLongformRevisionLimit, longformQcHistory: currentLongformQcHistory, source: currentDraftSource, ideaHandoff: activeIdeaHandoff, updatedAt: Date.now()\n    }));\n  } catch (_) {\n    // workspace checkpoint 실패가 Story Writer 자체를 막아서는 안 된다.\n  }\n}\n\nfunction applyIdeaHandoffToEpisode(ep, handoff) {\n  ep.channelKey = handoff.channelKey || \"unassigned\";\n  ep.contentFormat = handoff.contentFormat || \"shorts\";\n  ep.productionProfile = handoff.productionProfile || \"standard\";\n  ep.sourceIdeaId = handoff.ideaId || \"\";\n  ep.sourceUrl = handoff.sourceUrl || \"\";\n  ep.sourceName = handoff.sourceName || \"\";\n  ep.sources = Array.isArray(handoff.sources) ? handoff.sources : [];\n  ep.verifiedFacts = Array.isArray(handoff.verifiedFacts) ? handoff.verifiedFacts : [];\n  ep.claimsToVerify = Array.isArray(handoff.claimsToVerify) ? handoff.claimsToVerify : [];\n  ep.sourceCategory = handoff.category || \"\";\n  ep.sourceKeywords = handoff.keywords || \"\";\n  ep.productionPreset = {\n    version: 1,\n    channelKey: ep.channelKey,\n    contentFormat: ep.contentFormat,\n    productionProfile: ep.productionProfile,\n    direction: handoff.productionDirection || \"\",\n    visualContentMode: handoff.visualContentMode || \"news\",\n    qcLevel: handoff.qcLevel || \"standard\",\n    appliedAt: Date.now(),\n  };\n}\n\nfunction buildProductionTopic(topic, handoff) {\n  const channelKey = handoff?.channelKey || \"unassigned\";\n  const contentFormat = handoff?.contentFormat || \"shorts\";\n  const profile = handoff?.productionProfile || \"standard\";\n  const direction = handoff?.productionDirection || \"\";\n  const verifiedFacts = Array.isArray(handoff?.verifiedFacts) ? handoff.verifiedFacts.filter(Boolean) : [];\n  const claimsToVerify = Array.isArray(handoff?.claimsToVerify) ? handoff.claimsToVerify.filter(Boolean) : [];\n\n  const economyVisualRules = channelKey === \"economy_current\" && contentFormat === \"shorts\" ? [\n    \"[경제그루터기 SILENT-VIEW VISUAL LOCK — 반드시 준수]\",\n    \"소리를 완전히 꺼도 화면 장면과 상단 핵심정보만으로 현재 상황, 핵심 변화, 개인 영향을 이해할 수 있어야 한다.\",\n    \"대화 장면과 상상 장면 모두 CUT마다 핵심 단어·용어·정책명·숫자 중 시청자가 반드시 알아야 할 포인트를 1~2개 선정한다. 이 정보는 영상 편집 단계의 상단 오버레이용이며 이미지 생성물 안에 글자를 직접 그려 넣지 않는다.\",\n    \"상상/비유 장면은 그루·상담객의 얼굴을 계속 보여주는 것보다 설명 대상 상황을 크게 클로즈업하는 것을 우선한다. 필요하면 두 사람을 화면에서 완전히 제외한다.\",\n    \"경제그루터기에서 대화는 주로 오디오의 뼈대이고 화면은 설명의 뼈대다. 현실 대화 CUT만 연속 배치하지 않는다.\",\n    \"8~10 CUT 쇼츠는 상상/정보/설명 화면을 전체의 40~60%로 설계한다. 9 CUT이면 최소 4 CUT, 가능하면 5 CUT을 상상/정보/설명 화면으로 사용한다.\",\n    \"정책·금리·세금·대출처럼 구조 설명이 필요한 소재는 현실 상담 장면보다 계산 구조, 돈의 흐름, 전후 비교, 집·영수증·계좌·그래프 등 설명 대상을 우선 시각화한다.\",\n    \"상담객은 에피소드마다 별도 프로필을 지정한다. 재등장 인물이라고 명시하지 않은 경우 이전 상담객(예: 수현)을 자동 재사용하지 않는다. 상담객 프로필은 이미지 외형과 TTS 목소리 선택에 함께 사용한다.\",\n    \"상상 공간은 바닥·전경·뒤편에 구름 요소를 남겨 현실 상담 공간과 즉시 구분되게 한다. 단, 구름이 핵심 정보나 상황을 가리면 안 된다.\",\n    \"'뭉게뭉게'처럼 상상으로 전환된 뒤에는 함께 하늘을 보는 두 사람을 반복 배치하지 말고, 구름 위에서 벌어지는 계산·가격·세금·장바구니·영수증·주거·대출 등 실제 설명 대상을 크게 보여준다.\",\n    \"CUT별 imagePrompt는 캐릭터가 필요한 장면인지, 상황 클로즈업이 더 중요한 장면인지 명확히 결정해서 작성한다. 모든 CUT에 캐릭터를 억지로 넣지 않는다.\",\n    \"상단 핵심정보는 긴 자막이 아니라 짧은 핵심어/숫자 중심으로 설계하고 배경과 강한 명도·색 대비가 나도록 한다.\",\n    \"최종 자체검사: 음성 없이 CUT 순서대로 화면을 훑었을 때 무슨 상황인지 이해되지 않는 CUT이 있으면 imagePrompt와 핵심정보 설계를 다시 쓴다.\",\n  ] : [];\n\n  const viewerFirstRules = [\n    \"[VIEWER-FIRST PLANNING LOCK — 반드시 준수]\",\n    \"이 영상의 목표는 뉴스 요약이 아니라, 시청자가 '그래서 나한테 무슨 일인데?'를 1~2초 안에 이해하게 만드는 것이다.\",\n    \"HOOK은 월/날짜/정책명/법 이름/정부 발표를 요약하는 문장으로 시작하지 않는다. 예: '9월, 새로운 법이 시행됩니다' 같은 일반 뉴스 도입은 금지한다.\",\n    \"첫 문장은 사람의 실제 상황, 돈, 손해, 이득, 불편, 놀람, 반전 중 최소 하나를 바로 제시한다.\",\n    \"생활·법·제도 소재는 가능하면 '내가 이런 상황이라면 어떻게 달라지는가'로 시작한다.\",\n    \"여러 제도나 사건이 한 소재에 묶여 있어도 모두를 같은 비중으로 나열하지 말고, 시청자 체감이 가장 큰 1개를 메인 축으로 선택한다. 나머지는 필요할 때만 짧게 보조한다.\",\n    \"계산 가능한 금액·세율·한도·기간 차이가 있고 제공된 사실로 계산할 수 있으면 전/후 차이를 수치로 보여준다. 입력값이 부족하면 대표 가정을 명시하고 추정치라고 밝힌다. 사실을 만들지 않는다.\",\n    \"CUT 1은 개인 상황+결과 훅, 이후 CUT은 왜 그런지 설명하는 순서로 쓴다. 단순 사실 1→사실 2→사실 3→요약 구조를 피한다.\",\n    \"'핵심은 ~입니다', '포인트입니다', '정리하면', '지켜봐야 합니다' 같은 AI식 관용구를 기본 문장으로 쓰지 않는다.\",\n    \"짧고 자연스러운 한국어 구어체를 사용하고, 같은 문장 패턴을 반복하지 않는다.\",\n    \"초안을 출력하기 전에 스스로 검사한다: 첫 2초에 사람/돈/손해/이득/반전이 없거나, 훅이 기사 제목 요약처럼 들리면 훅과 CUT 1을 다시 쓴 뒤 최종 JSON만 출력한다.\",\n  ];\n\n  return [\n    \"[TRACKER CHANNEL PRODUCTION PRESET]\",\n    `채널: ${contentChannelLabel(channelKey)}`,\n    `형식: ${contentFormatLabel(contentFormat)}`,\n    `제작 강도: ${productionProfileLabel(profile)}`,\n    direction ? `제작 방향: ${direction}` : \"제작 방향: Viewer-impact 우선\",\n    ...viewerFirstRules,\n    ...economyVisualRules,\n    verifiedFacts.length ? \"\" : null,\n    verifiedFacts.length ? \"[검증된 사실 — 이 범위 안에서 우선 작성]\" : null,\n    ...verifiedFacts.map((x) => `- ${x}`),\n    claimsToVerify.length ? \"\" : null,\n    claimsToVerify.length ? \"[추가 확인 필요 — 확인되지 않으면 단정 금지]\" : null,\n    ...claimsToVerify.map((x) => `- ${x}`),\n    \"\",\n    \"[소재]\",\n    topic,\n  ].filter((x) => x != null).join(\"\\n\");\n}\n\nfunction loadStoryWorkspace() {\n  try {\n    const raw = localStorage.getItem(STORY_WORKSPACE_KEY);\n    if (!raw) return null;\n    const data = JSON.parse(raw);\n    if (!data || data.version !== 1) return null;\n    return data;\n  } catch (_) { return null; }\n}\n\nfunction readEditedDraft(box, base) {\n  const cuts = base.cuts.map((c, i) => ({ ...c,\n    purpose: box.querySelector(`#sw-purpose-${i}`)?.value.trim() || \"\",\n    situation: box.querySelector(`#sw-situation-${i}`)?.value.trim() || \"\",\n    narration: box.querySelector(`#sw-narration-${i}`)?.value.trim() || \"\",\n    imagePrompt: box.querySelector(`#sw-image-${i}`)?.value.trim() || \"\",\n  }));\n  return normalizeStoryDraft({ ...base, title: box.querySelector(\"#sw-title\").value.trim(), hook: box.querySelector(\"#sw-hook\").value.trim(), imageStyleNote: box.querySelector(\"#sw-style\").value.trim(), cuts }, base.seriesType);\n}\n\n\nfunction summarizeDraftChanges(before, after) {\n  const changedCuts = [];\n  const max = Math.max(before.cuts.length, after.cuts.length);\n  for (let i = 0; i < max; i += 1) {\n    const a = before.cuts[i];\n    const b = after.cuts[i];\n    if (!a || !b) { changedCuts.push(i + 1); continue; }\n    const fields = [\"purpose\", \"situation\", \"narration\", \"imagePrompt\"];\n    if (fields.some((k) => String(a[k] || \"\") !== String(b[k] || \"\"))) changedCuts.push(i + 1);\n  }\n  return {\n    titleChanged: before.title !== after.title,\n    hookChanged: before.hook !== after.hook,\n    styleChanged: before.imageStyleNote !== after.imageStyleNote,\n    cutCountBefore: before.cuts.length,\n    cutCountAfter: after.cuts.length,\n    changedCuts,\n  };\n}\n\nfunction revisionPreview(before, after, changes) {\n  const changedCutText = changes.changedCuts.length ? changes.changedCuts.map((n) => `CUT ${n}`).join(\", \") : \"없음\";\n  return `<div class=\"card\" style=\"margin-top:10px;background:rgba(90,120,255,.06);\">\n    <h3>수정안 비교</h3>\n    <div class=\"hint\" style=\"margin-bottom:8px;\">변경 CUT: <b>${escapeHtml(changedCutText)}</b> · CUT 수 ${changes.cutCountBefore} → ${changes.cutCountAfter}</div>\n    <label>제목</label>\n    <div class=\"hint\">기존: ${escapeHtml(before.title || \"(없음)\")}</div>\n    <div style=\"margin:4px 0 10px;\"><b>수정:</b> ${escapeHtml(after.title || \"(없음)\")}</div>\n    <label>훅</label>\n    <div class=\"hint\">기존: ${escapeHtml(before.hook || \"(없음)\")}</div>\n    <div style=\"margin:4px 0 10px;\"><b>수정:</b> ${escapeHtml(after.hook || \"(없음)\")}</div>\n    <div class=\"hint\">${changes.styleChanged ? \"이미지 스타일도 변경됨 · \" : \"\"}${changes.changedCuts.length ? \"수정안을 적용하면 해당 CUT 편집값이 새 초안으로 교체됩니다.\" : \"CUT 내용 변경은 감지되지 않았습니다.\"}</div>\n    <div class=\"btn-row\" style=\"margin-top:10px;\">\n      <button class=\"btn\" id=\"sw-accept-revision\" type=\"button\">✓ 수정안 적용</button>\n      <button class=\"btn secondary\" id=\"sw-reject-revision\" type=\"button\">기존 초안 유지</button>\n    </div>\n  </div>`;\n}\n\nfunction renderLongformDraft(box, draft, meta = {}) {\n  if (!box || !draft || typeof draft !== \"object\") return;\n  const chapters = Array.isArray(draft.chapters) ? draft.chapters : [];\n  const warnings = Array.isArray(draft.warnings) ? draft.warnings : [];\n  const ending = draft.ending && typeof draft.ending === \"object\" ? draft.ending : null;\n  box.innerHTML = `\n    <div class=\"card\" style=\"margin-top:12px;background:rgba(120,90,255,.06);\">\n      <h3>${meta.stageLabel ? \"Claude 수정 대본\" : \"Claude 본 대본\"}</h3>\n      <div class=\"hint\">${escapeHtml(meta.model || \"Claude\")} · 목표 ${escapeHtml(String(draft.targetMinutes || \"\"))}분 · ${chapters.length}개 챕터${meta.stageLabel ? ` · ${escapeHtml(meta.stageLabel)}` : \"\"}</div>\n      <h2 style=\"margin:12px 0 6px;\">${escapeHtml(draft.title || activeIdeaHandoff?.title || \"롱폼 대본\")}</h2>\n      <div class=\"card\" style=\"padding:12px;margin:8px 0;\"><b>HOOK</b><div style=\"white-space:pre-wrap;margin-top:6px;\">${escapeHtml(draft.hook || \"\")}</div></div>\n      ${chapters.map((chapter, ci) => {\n        const segments = Array.isArray(chapter?.segments) ? chapter.segments : [];\n        return `<details ${ci === 0 ? \"open\" : \"\"} style=\"margin:10px 0;\"><summary><b>${escapeHtml(`CH ${chapter?.chapterNo || ci + 1}. ${chapter?.title || \"챕터\"}`)}</b></summary>\n          <div class=\"hint\" style=\"margin:6px 0 8px;\">${escapeHtml(chapter?.purpose || \"\")}</div>\n          ${segments.map((seg) => `<div class=\"card\" style=\"padding:10px;margin:6px 0;\">\n            <div><b>${escapeHtml(seg?.speaker || \"그루\")}</b> <span class=\"hint\">· ${escapeHtml(seg?.factStatus || \"\")}</span></div>\n            <div style=\"white-space:pre-wrap;margin-top:5px;\">${escapeHtml(seg?.text || \"\")}</div>\n            ${seg?.visualHint ? `<div class=\"hint\" style=\"margin-top:6px;\">🎬 ${escapeHtml(seg.visualHint)}</div>` : \"\"}\n          </div>`).join(\"\")}\n        </details>`;\n      }).join(\"\")}\n      ${ending ? `<div class=\"card\" style=\"padding:12px;margin-top:10px;\"><b>마무리 · ${escapeHtml(ending.speaker || \"그루\")}</b><div style=\"white-space:pre-wrap;margin-top:6px;\">${escapeHtml(ending.text || \"\")}</div></div>` : \"\"}\n      ${warnings.length ? `<div class=\"card\" style=\"padding:12px;margin-top:10px;\"><b>GPT 검수 대기 항목</b><ul>${warnings.map((w) => `<li>${escapeHtml(w)}</li>`).join(\"\")}</ul></div>` : \"\"}\n      <div class=\"hint\" style=\"margin-top:10px;\">Alpha 11에서는 GPT가 수정 필요를 판정하면 Claude 수정 1회 → GPT 최종 QC까지 자동 연결합니다. 자동 수정은 비용 폭주 방지를 위해 최대 1회입니다.</div>\n    </div>`;\n}\n\nfunction renderGptLongformQc(box, qc) {\n  if (!box || !qc || typeof qc !== \"object\") return;\n  const issues = Array.isArray(qc.issues) ? qc.issues : [];\n  const revisions = Array.isArray(qc.revisionInstructions) ? qc.revisionInstructions : [];\n  const vf = Array.isArray(qc.verifiedFactCoverage) ? qc.verifiedFactCoverage : [];\n  const cv = Array.isArray(qc.claimsToVerifyHandling) ? qc.claimsToVerifyHandling : [];\n  const scores = qc.scores || {};\n  const statusLabel = qc.status === \"pass\" ? \"✅ PASS · 확정 가능\" : qc.status === \"blocked\" ? \"⛔ 게시 차단\" : \"🟠 수정 필요\";\n  box.innerHTML = `\n    <div class=\"card\" style=\"margin-top:10px;\">\n      <h3>${escapeHtml(statusLabel)}</h3>\n      <div class=\"hint\">${escapeHtml(qc.model || \"OpenAI\")} · ${qc.reviewedAt ? new Date(qc.reviewedAt).toLocaleString() : \"\"}</div>\n      <p style=\"white-space:pre-wrap;\">${escapeHtml(qc.summary || \"\")}</p>\n      <div class=\"btn-row\" style=\"gap:6px;flex-wrap:wrap;\">\n        <span class=\"badge\">사실 ${escapeHtml(String(scores.factualGrounding ?? \"-\"))}</span>\n        <span class=\"badge\">채널 ${escapeHtml(String(scores.channelFit ?? \"-\"))}</span>\n        <span class=\"badge\">구조 ${escapeHtml(String(scores.structure ?? \"-\"))}</span>\n        <span class=\"badge\">TTS ${escapeHtml(String(scores.ttsNaturalness ?? \"-\"))}</span>\n      </div>\n      ${issues.length ? `<details open style=\"margin-top:10px;\"><summary><b>검수 이슈 ${issues.length}건</b></summary>${issues.map((issue) => `<div class=\"card\" style=\"padding:10px;margin:6px 0;\"><b>${escapeHtml(String(issue.severity || \"\").toUpperCase())} · ${escapeHtml(issue.category || \"\")}</b><div class=\"hint\">${escapeHtml(issue.location || \"\")}</div>${issue.claim ? `<div style=\"margin-top:5px;\">주장: ${escapeHtml(issue.claim)}</div>` : \"\"}${issue.evidence ? `<div class=\"hint\" style=\"margin-top:4px;\">근거: ${escapeHtml(issue.evidence)}</div>` : \"\"}<div style=\"margin-top:5px;\">문제: ${escapeHtml(issue.problem || \"\")}</div><div style=\"margin-top:5px;\">수정: ${escapeHtml(issue.recommendation || \"\")}</div></div>`).join(\"\")}</details>` : `<div class=\"hint\" style=\"margin-top:10px;\">필수 수정 이슈 없음</div>`}\n      ${revisions.length ? `<details open style=\"margin-top:10px;\"><summary><b>Claude 재수정 지시</b></summary><ol>${revisions.map((x) => `<li>${escapeHtml(x)}</li>`).join(\"\")}</ol></details>` : \"\"}\n      ${vf.length ? `<details style=\"margin-top:10px;\"><summary><b>verifiedFacts 대조</b></summary><ul>${vf.map((x) => `<li><b>${escapeHtml(x.result || \"\")}</b> · ${escapeHtml(x.fact || \"\")} ${x.note ? `— ${escapeHtml(x.note)}` : \"\"}</li>`).join(\"\")}</ul></details>` : \"\"}\n      ${cv.length ? `<details style=\"margin-top:10px;\"><summary><b>claimsToVerify 처리</b></summary><ul>${cv.map((x) => `<li><b>${escapeHtml(x.result || \"\")}</b> · ${escapeHtml(x.claim || \"\")} ${x.note ? `— ${escapeHtml(x.note)}` : \"\"}</li>`).join(\"\")}</ul></details>` : \"\"}\n      <div class=\"card\" style=\"padding:10px;margin-top:10px;\"><b>최종 판정</b><div style=\"white-space:pre-wrap;margin-top:5px;\">${escapeHtml(qc.finalDecision || \"\")}</div></div>\n      <div class=\"hint\" style=\"margin-top:8px;\">${qc.status === \"pass\" ? \"이 대본은 Alpha11 QC 기준으로 확정 가능 상태입니다. 다음 단계에서 확정 대본 → CUT 변환을 연결합니다.\" : qc.status === \"blocked\" ? \"현재 자료만으로 안전하게 확정할 수 없습니다. 근거를 보강한 뒤 다시 검수해야 합니다.\" : qc.stage === \"final\" ? \"자동 수정 1회 후에도 수정 필요가 남아 자동 루프를 중단했습니다.\" : \"GPT 수정 지시를 Claude에 1회 자동 전달할 수 있습니다.\"}</div>\n    </div>`;\n}\n\nfunction cutEditor(c, i) {\n  return `<div class=\"card\"><h3>CUT ${i + 1}</h3>\n    <label>목적</label><input id=\"sw-purpose-${i}\" value=\"${attr(c.purpose)}\" />\n    <label>상황</label><textarea id=\"sw-situation-${i}\" rows=\"2\">${escapeHtml(c.situation)}</textarea>\n    <label>나레이션/대본</label><textarea id=\"sw-narration-${i}\" rows=\"3\">${escapeHtml(c.narration)}</textarea>\n    <label>이미지 프롬프트</label><textarea id=\"sw-image-${i}\" rows=\"3\">${escapeHtml(c.imagePrompt)}</textarea></div>`;\n}\nfunction attr(s) { return String(s ?? \"\").replace(/&/g, \"&amp;\").replace(/\"/g, \"&quot;\").replace(/</g, \"&lt;\"); }\n","js_v420a12/app.js":"import { render as renderHome } from \"./views/home.js\";\nimport { render as renderEpisode, waitForEpisodeWrites } from \"./views/episode.js\";\nimport { render as renderSettings } from \"./views/settings.js\";\nimport { render as renderStoryWriter } from \"./views/storyWriter.js\";\nimport { initViewport } from \"./viewport.js\";\nimport { RELEASE_CHANNEL } from \"./version.js\";\nimport { flushActiveDraft, clearActiveDraftFlush } from \"./navigationLifecycle.js\";\n\n// v2.1-rc.1 — Responsive/Adaptive UI: 1회만 초기화한다. route()/hashchange와는 완전히\n// 독립된 훅이다 — resize에 반응해 <html> data attribute만 갱신할 뿐, 이 앱의 라우팅/렌더\n// 흐름을 절대 다시 트리거하지 않는다(그래야 리사이즈 중 상태가 자동으로 보존된다).\ninitViewport();\n\nconst app = document.getElementById(\"app\");\nconst tabbar = document.getElementById(\"tabbar\");\nwindow.__trackerBootRendered = true;\n\nfunction parseHash() {\n  const hash = location.hash.replace(/^#\\/?/, \"\");\n  const parts = hash.split(\"/\").filter(Boolean);\n  if (parts[0] === \"episode\" && parts[1]) {\n    return { name: \"episode\", params: { id: parts[1], step: parts[2] } };\n  }\n  if (parts[0] === \"settings\") return { name: \"settings\", params: {} };\n  if (parts[0] === \"storywriter\") return { name: \"storywriter\", params: {} };\n  return { name: \"home\", params: {} };\n}\n\nfunction renderTabbar(active) {\n  tabbar.innerHTML = `\n    <div class=\"tabbar-inner\">\n      <button data-tab=\"home\" class=\"${active === \"home\" || active === \"episode\" ? \"active\" : \"\"}\">\n        <span class=\"icon\">🎬</span>홈\n      </button>\n      <button data-tab=\"settings\" class=\"${active === \"settings\" ? \"active\" : \"\"}\">\n        <span class=\"icon\">⚙️</span>설정\n      </button>\n    </div>\n  `;\n  tabbar.querySelector('[data-tab=\"home\"]').onclick = () => (location.hash = \"#/\");\n  tabbar.querySelector('[data-tab=\"settings\"]').onclick = () => (location.hash = \"#/settings\");\n}\n\nasync function performRoute() {\n  // Alpha 19: debounce 대기 중인 현재 화면 초안까지 먼저 flush한다.\n  // hashchange는 DOM을 즉시 없애지 않으므로 이 시점에는 기존 입력 필드를 안전하게 읽을 수 있다.\n  await flushActiveDraft();\n  clearActiveDraftFlush();\n  // Alpha 12: 이전 화면에서 시작된 episode write가 끝난 뒤 다음 화면을 읽는다.\n  await waitForEpisodeWrites();\n  const { name, params } = parseHash();\n  renderTabbar(name);\n  window.scrollTo(0, 0);\n  if (name === \"episode\") return renderEpisode(app, params);\n  if (name === \"settings\") return renderSettings(app);\n  if (name === \"storywriter\") return renderStoryWriter(app);\n  return renderHome(app);\n}\n\n// Phase 7 버그 수정(실사용 검증 중 자동 테스트로 발견): hashchange가 짧은 간격으로 연속\n// 발생하면(예: 탭을 아주 빠르게 두 번 누르거나, 코드에서 location.hash를 연속으로 바꾸는 경우)\n// route()가 겹쳐 실행될 수 있었다. 화면마다 render()의 첫 DOM 반영 시점이 다른데(예: home.js는\n// getAllEpisodes()를 먼저 기다린 뒤에야 DOM을 쓰고, settings.js는 즉시 동기적으로 DOM을 쓴 뒤\n// 나머지를 비동기로 채움) — 그 결과 \"나중에 시작됐지만 먼저 끝난\" 화면 위에 \"먼저 시작됐지만\n// 나중에 끝난\" 이전 화면이 뒤늦게 덮어써버리는 경쟁(race) 상태가 있었다. 주소는 새 화면인데\n// 화면 내용은 이전 화면 그대로 멈춰버리는 문제로 이어짐(자동 테스트에서 실제로 재현/발견).\n// route() 호출을 체인으로 직렬화해서, 항상 이전 라우팅이 완전히 끝난 뒤에만 다음 라우팅이\n// 시작되도록 고친다 — 여러 render()를 동시에 진행시키지 않는다.\nlet routeChain = Promise.resolve();\nlet latestRouteRequest = 0;\nfunction route() {\n  const requestId = ++latestRouteRequest;\n  routeChain = routeChain.catch(() => {}).then(async () => {\n    // v4.1.0 Alpha 12 — rapid navigation coalescing.\n    // 모바일에서 STEP 칩을 빠르게 연속 탭했을 때 이미 뒤에 더 최신 이동 요청이 있으면\n    // 중간 화면 렌더를 생략한다. 마지막으로 사용자가 선택한 화면만 렌더해 불필요한\n    // IndexedDB read / DOM mount / 미디어 초기화를 줄인다.\n    if (requestId !== latestRouteRequest) return;\n    try {\n      await performRoute();\n    } catch (err) {\n      console.error(\"Tracker route failure\", err);\n      renderRouteRecovery(err);\n    }\n  });\n  return routeChain;\n}\n\n// Phase 7-FIX 버그 수정(실기기 재검증 중 발견 — Bug 1의 근본 원인 중 하나): 이 스크립트는\n// type=\"module\"이라 브라우저가 이미 defer와 동일하게 \"문서 파싱이 끝난 뒤\"에만 실행한다.\n// 즉 아래 route() 직접 호출 시점에 이미 DOM은 완전히 준비되어 있다. 그런데 예전 코드는\n// 여기에 더해 \"DOMContentLoaded\" 리스너에서도 route()를 또 호출하고 있었다 — module\n// 스크립트가 끝난 직후 곧바로 DOMContentLoaded 이벤트가 발생하므로, 앱을 새로 열 때마다\n// (또는 실기기에서 브라우저가 메모리 회수 후 탭을 다시 불러올 때마다) performRoute()가\n// 사실상 매번 두 번 연달아 실행되고 있었다. routeChain이 두 호출이 \"동시에\" 겹쳐 실행되는\n// 것은 막아주지만, 두 번째 호출도 여전히 getEpisode()를 다시 fetch해서 화면 전체를\n// 새로 그린다 — 그 사이 사용자가 이미 입력을 시작했다면(느린 실기기에서 특히) 입력 중이던\n// DOM 노드가 통째로 교체되어 값이 사라질 수 있는 창구가 된다. module 스크립트 자체의 직접\n// 호출만으로 이미 충분하므로 중복된 DOMContentLoaded 리스너를 제거한다.\nwindow.addEventListener(\"hashchange\", route);\nroute();\n\n\nfunction renderRouteRecovery(err) {\n  renderTabbar(\"home\");\n  app.innerHTML = `\n    <div class=\"topbar\"><h1>화면 복구</h1></div>\n    <div class=\"card\">\n      <h3>현재 화면을 불러오지 못했습니다.</h3>\n      <p class=\"hint\" id=\"route-recovery-message\"></p>\n      <div class=\"btn-row\">\n        <button class=\"btn\" id=\"route-retry\">현재 화면 다시 열기</button>\n        <button class=\"btn secondary\" id=\"route-home\">홈으로 안전 복귀</button>\n      </div>\n      <p class=\"hint\">Episode 데이터는 삭제하거나 초기화하지 않습니다.</p>\n    </div>`;\n  const msg = app.querySelector(\"#route-recovery-message\");\n  if (msg) msg.textContent = err?.message || String(err || \"알 수 없는 오류\");\n  app.querySelector(\"#route-retry\")?.addEventListener(\"click\", () => route());\n  app.querySelector(\"#route-home\")?.addEventListener(\"click\", () => { location.hash = \"#/\"; });\n}\n\n// 모바일에서 앱이 백그라운드로 가거나 브라우저가 페이지를 보관하기 직전,\n// 아직 debounce 대기 중인 입력을 즉시 저장 큐에 올린다. pagehide에서는 완료를 기다릴 수\n// 없지만 visibilitychange(hidden)가 먼저 오는 일반 흐름에서 IndexedDB 저장이 시작된다.\ndocument.addEventListener(\"visibilitychange\", () => {\n  if (document.visibilityState === \"hidden\") flushActiveDraft().catch(() => {});\n});\nwindow.addEventListener(\"pagehide\", () => { flushActiveDraft().catch(() => {}); });\n\n// BFCache에서 브라우저 뒤로가기로 복원된 경우 주소는 맞아도 오래된 DOM snapshot일 수 있으므로\n// 저장 큐를 기다린 뒤 현재 hash를 다시 렌더한다. 일반 pageshow에서는 중복 렌더하지 않는다.\nwindow.addEventListener(\"pageshow\", (event) => {\n  if (event.persisted) route();\n});\n\n// ---------------------------------------------------------------------------\n// v2.1-rc.8 — RC 개발 모드 업데이트 단순화.\n//\n// RC/Alpha 단계에서는 Service Worker를 등록하지 않는다. 같은 localhost:8084 주소를 반복해서\n// 사용하면서 RC 폴더만 바꾸는 실기기 검증 흐름에서, 이전 worker가 다음 RC의 index/app.js를\n// 가로채 업데이트 배너가 교착되는 문제가 반복 확인됐다. 따라서 RC에서는 페이지 로드 시\n// localhost scope에 남아 있는 기존 등록과 Shorts Tracker 캐시만 정리하고, 항상 네트워크의\n// 최신 파일을 직접 사용한다. IndexedDB/에피소드 데이터는 건드리지 않는다.\n//\n// Stable 채널에서는 PWA 오프라인 기능을 위해 Service Worker를 등록한다.\n// ---------------------------------------------------------------------------\nif (\"serviceWorker\" in navigator) {\n  window.addEventListener(\"load\", async () => {\n    if (RELEASE_CHANNEL !== \"stable\") {\n      try {\n        const regs = await navigator.serviceWorker.getRegistrations();\n        await Promise.all(\n          regs\n            .filter((reg) => reg.scope.startsWith(`${location.origin}/`))\n            .map((reg) => reg.unregister())\n        );\n\n        if (\"caches\" in window) {\n          const keys = await caches.keys();\n          await Promise.all(\n            keys\n              .filter((key) => key.startsWith(\"shorts-pipeline-v\"))\n              .map((key) => caches.delete(key))\n          );\n        }\n      } catch (_) {\n        // 정리 실패가 앱 실행을 막아서는 안 된다. RC는 네트워크 파일로 계속 동작한다.\n      }\n
