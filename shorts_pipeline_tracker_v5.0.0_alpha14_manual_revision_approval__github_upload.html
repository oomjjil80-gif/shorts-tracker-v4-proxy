o/*\" data-bgm-input style=\"display:none;\" />\n      ${\n        bgm.assetId\n          ? `\n      <label>시작(초)</label>\n      <input type=\"number\" step=\"0.1\" data-bgm-f=\"start\" value=\"${bgm.start ?? 0}\" />\n      <label>끝(초, 비우면 끝까지)</label>\n      <input type=\"number\" step=\"0.1\" data-bgm-f=\"end\" value=\"${bgm.end ?? \"\"}\" />\n      <label>볼륨(0~1)</label>\n      <input type=\"number\" step=\"0.05\" min=\"0\" max=\"1\" data-bgm-f=\"volume\" value=\"${bgm.volume ?? 1}\" />\n      `\n          : \"\"\n      }\n    `;\n    const fileInput = mount.querySelector(\"[data-bgm-input]\");\n    mount.querySelector(\"[data-bgm-attach]\").onclick = () => fileInput.click();\n    fileInput.onchange = async (e) => {\n      const file = e.target.files[0];\n      if (!file) return;\n      if (!confirmOversizedFile(file)) return;\n      try {\n        const oldAssetId = bgm.assetId;\n        if (oldAssetId) {\n          await deleteAssetSafely(oldAssetId, ep.id);\n          forgetAssetObjectUrl(oldAssetId);\n        }\n        const asset = await putAsset({ episodeId: ep.id, kind: \"audio\", role: \"bgm\", blob: file, originalFileName: file.name });\n        ep.bgm = { ...bgm, assetId: asset.id };\n        invalidateTimelineReview(ep);\n        invalidatePreviewReview(ep);\n        await ctx.save({ bgm: ep.bgm });\n        toast(\"BGM을 등록했어요\");\n        ctx.reRender();\n      } catch (err) {\n        toastAssetSaveError(err);\n      }\n    };\n    const delBtn = mount.querySelector(\"[data-bgm-delete]\");\n    if (delBtn) {\n      delBtn.onclick = async () => {\n        if (!confirm(\"BGM을 삭제할까요?\")) return;\n        await deleteAssetSafely(bgm.assetId, ep.id);\n        ep.bgm = { ...bgm, assetId: null };\n        invalidateTimelineReview(ep);\n        invalidatePreviewReview(ep);\n        await ctx.save({ bgm: ep.bgm });\n        toast(\"삭제했어요\");\n        ctx.reRender();\n      };\n    }\n    mount.querySelectorAll(\"[data-bgm-f]\").forEach((input) => {\n      input.addEventListener(\"blur\", async () => {\n        const f = input.dataset.bgmF;\n        const v = input.value === \"\" ? (f === \"end\" ? null : 0) : Number(input.value);\n        // ep.bgm(최신값)을 기준으로 갱신해야 한다 — bgm(렌더 시점 스냅샷)을 기준으로 하면\n        // start/end/volume을 연달아 수정할 때 먼저 저장된 필드가 나중 blur에 덮어써져 사라진다.\n        ep.bgm = { ...(ep.bgm || bgm), [f]: v };\n        invalidateTimelineReview(ep);\n        invalidatePreviewReview(ep);\n        await ctx.save({ bgm: ep.bgm });\n      });\n    });\n  }\n\n  // ---------------------------------------------------------------------\n  // 일괄 등록 미리보기\n  // ---------------------------------------------------------------------\n\n  // P7-FIX Bug 3 — 자동 매칭에 실패한 파일들(\"unmatched\"/화자 후보/CUT 없음/대사 없음)을 모아\n  // \"수동 지정\" 대상으로 취급한다. 파일명을 다시 바꾸게 하는 대신, 이 안에서 바로 CUT/타입/\n  // (대사라면) 몇 번째 대사인지 골라 즉시 연결할 수 있게 한다 — 실기기에서 실제로 문제였던\n  // \"삼성 녹음 파일명(예: 음성 260826_083402.m4a)은 어떤 패턴에도 안 걸려 unmatched로만\n  // 빠지고 그 다음엔 파일명을 바꾸는 것 말고는 방법이 없었다\"는 흐름을 없앤다.\n  function unresolvedFileNames(result) {\n    return [\n      ...result.unmatched,\n      ...result.speakerCandidates,\n      ...result.invalidDialogue.map((o) => o.fileName),\n      ...result.outOfRange.map((o) => o.fileName),\n    ];\n  }\n\n  function manualAssignRow(fileName) {\n    const row = el(`\n      <div class=\"dialogue-row\" style=\"flex-wrap:wrap;align-items:center;\" data-manual-row>\n        <span class=\"hint\" style=\"width:100%;margin:0 0 4px;\">${escapeHtml(fileName)}</span>\n        <select data-m-cut style=\"width:auto;\">\n          ${cuts.map((c, i) => `<option value=\"${i}\">CUT ${i + 1}</option>`).join(\"\")}\n        </select>\n        <select data-m-type style=\"width:auto;\">\n          <option value=\"narration\">나레이션</option>\n          <option value=\"dialogue\">대사</option>\n          <option value=\"sfx\">SFX</option>\n        </select>\n        <select data-m-dialogue style=\"width:auto;display:none;\"></select>\n        <button class=\"btn secondary small\" data-m-assign>수동 등록</button>\n      </div>\n    `);\n    const cutSel = row.querySelector(\"[data-m-cut]\");\n    const typeSel = row.querySelector(\"[data-m-type]\");\n    const dialogueSel = row.querySelector(\"[data-m-dialogue]\");\n\n    function refreshDialogueOptions() {\n      const cut = cuts[Number(cutSel.value)];\n      const lines = (cut?.dialogueLines || []).filter((l) => l?.text && l.text.trim());\n      dialogueSel.innerHTML = lines.map((l, i) => `<option value=\"${l.id}\">${i + 1}. ${escapeHtml(truncate(l.text))}</option>`).join(\"\");\n      dialogueSel.style.display = typeSel.value === \"dialogue\" ? \"\" : \"none\";\n    }\n    cutSel.onchange = refreshDialogueOptions;\n    typeSel.onchange = refreshDialogueOptions;\n    refreshDialogueOptions();\n\n    row.querySelector(\"[data-m-assign]\").onclick = async () => {\n      const file = pendingAudioFiles?.get(fileName);\n      if (!file) {\n        toast(\"파일을 다시 선택해주세요 — 목록이 갱신됐어요\");\n        return;\n      }\n      const cutIndex = Number(cutSel.value);\n      const cut = cuts[cutIndex];\n      if (!cut) return;\n      const type = typeSel.value;\n      let m;\n      if (type === \"dialogue\") {\n        const dialogueLineId = dialogueSel.value;\n        if (!dialogueLineId) {\n          toast(\"이 CUT에는 대사가 없어요 — 다른 CUT이나 타입을 선택해주세요\");\n          return;\n        }\n        m = { fileName, cutIndex, type, dialogueLineId };\n      } else {\n        m = { fileName, cutIndex, type };\n      }\n      try {\n        const evt = resolveTargetEvent(cut, m);\n        await attachEventAudio(cut, evt, file);\n        toast(`CUT ${cutIndex + 1}에 수동으로 연결했어요`);\n        ctx.reRender();\n      } catch (err) {\n        toastAssetSaveError(err);\n      }\n    };\n    return row;\n  }\n\n  function renderBatchPreview(result) {\n    const box = root.querySelector(\"#audio-batch-preview\");\n    const nothing =\n      !result.matches.length && !result.unmatched.length && !result.duplicates.length && !result.outOfRange.length && !result.invalidDialogue.length && !result.speakerCandidates.length;\n    if (nothing) {\n      box.innerHTML = \"\";\n      return;\n    }\n    const unresolved = unresolvedFileNames(result);\n    box.innerHTML = `\n      <div class=\"card\" style=\"margin-top:10px;\">\n        <h3>매칭 미리보기</h3>\n        ${\n          result.matches.length\n            ? `<p class=\"hint\">매칭됨 (${result.matches.length}개)</p>\n               <table class=\"dur-table\"><tbody>\n                 ${result.matches.map((m) => `<tr><td>${escapeHtml(m.fileName)}</td><td class=\"num\">→ CUT ${m.cutNumber} ${matchLabel(m)}</td></tr>`).join(\"\")}\n               </tbody></table>`\n            : `<p class=\"hint\">확정 가능한 매칭이 없어요.</p>`\n        }\n        ${\n          result.duplicates.length\n            ? `<p class=\"hint\" style=\"color:var(--danger);\">같은 자리를 가리키는 파일이 여러 개예요 — 하나만 남기고 다시 선택해주세요: ${result.duplicates\n                .map((d) => `${d.fileNames.map(escapeHtml).join(\", \")}`)\n                .join(\" / \")}</p>`\n            : \"\"\n        }\n        ${\n          result.invalidDialogue.length\n            ? `<p class=\"hint\" style=\"color:var(--danger);\">그 CUT에는 해당 순번의 대사가 없어요: ${result.invalidDialogue\n                .map((o) => `${escapeHtml(o.fileName)}(CUT ${o.cutNumber} 대사 ${o.dialogueIndex}번)`)\n                .join(\", \")}</p>`\n            : \"\"\n        }\n        ${\n          result.outOfRange.length\n            ? `<p class=\"hint\" style=\"color:var(--danger);\">존재하지 않는 CUT 번호예요: ${result.outOfRange.map((o) => `${escapeHtml(o.fileName)}→CUT ${o.cutNumber}`).join(\", \")}</p>`\n            : \"\"\n        }\n        ${\n          result.speakerCandidates.length\n            ? `<p class=\"hint\">화자 이름 패턴으로 보이지만 CUT/대사가 모호해서 자동 확정하지 않았어요 — 수동으로 등록해주세요: ${result.speakerCandidates.map(escapeHtml).join(\", \")}</p>`\n            : \"\"\n        }\n        ${\n          result.unmatched.length\n            ? `<p class=\"hint\">파일명을 인식하지 못했어요: ${result.unmatched.map(escapeHtml).join(\", \")}</p>`\n            : \"\"\n        }\n        <button class=\"btn\" id=\"confirm-audio-batch\" style=\"margin-top:8px;\" ${result.matches.length ? \"\" : \"disabled\"}>\n          매칭 확정 (${result.matches.length}개 연결)\n        </button>\n        ${\n          unresolved.length && cuts.length\n            ? `<div style=\"margin-top:14px;border-top:1px solid var(--border);padding-top:10px;\">\n                 <p class=\"hint\"><strong>수동 지정</strong> — 파일명을 다시 바꿀 필요 없이 여기서 CUT/타입을 직접 골라 연결할 수 있어요.</p>\n                 <div id=\"audio-manual-assign\"></div>\n               </div>`\n            : \"\"\n        }\n      </div>\n    `;\n    if (unresolved.length && cuts.length) {\n      const manualMount = box.querySelector(\"#audio-manual-assign\");\n      unresolved.forEach((fileName) => manualMount.appendChild(manualAssignRow(fileName)));\n    }\n    const btn = box.querySelector(\"#confirm-audio-batch\");\n    if (btn) {\n      btn.onclick = async () => {\n        const oversized = result.matches.map((m) => pendingAudioFiles?.get(m.fileName)).filter((f) => f && isOversizedAsset(f));\n        if (oversized.length) {\n          const proceed = confirm(`${oversized.length}개 파일이 50MB를 초과합니다.\\n기기 저장공간과 백업 크기가 커질 수 있습니다.\\n그래도 전부 첨부하시겠습니까?`);\n          if (!proceed) return;\n        }\n        let failCount = 0;\n        for (const m of result.matches) {\n          const cut = cuts[m.cutIndex];\n          const file = pendingAudioFiles?.get(m.fileName);\n          if (!cut || !file) continue;\n          try {\n            const evt = resolveTargetEvent(cut, m);\n            await attachEventAudio(cut, evt, file);\n          } catch (err) {\n            failCount++;\n            toastAssetSaveError(err);\n          }\n        }\n        if (failCount === 0) toast(`${result.matches.length}개 오디오를 연결했어요`);\n        else toast(`${result.matches.length - failCount}개 연결, ${failCount}개 실패`);\n        pendingAudioFiles = null;\n        ctx.reRender();\n      };\n    }\n  }\n\n  function matchLabel(m) {\n    if (m.type === \"narration\") return \"나레이션\";\n    if (m.type === \"dialogue\") return `대사 ${m.dialogueIndex}번`;\n    return \"SFX(신규)\";\n  }\n\n  // 배치 매칭 결과 1건을 실제 audioEvent 객체로 해석한다(없으면 새로 만든다).\n  function resolveTargetEvent(cut, m) {\n    cut.audioEvents = cut.audioEvents || [];\n    if (m.type === \"narration\") {\n      let evt = cut.audioEvents.find((e) => e.type === \"narration\");\n      if (!evt) {\n        evt = newAudioEvent(\"narration\");\n        cut.audioEvents.push(evt);\n      }\n      return evt;\n    }\n    if (m.type === \"dialogue\") {\n      let evt = cut.audioEvents.find((e) => e.type === \"dialogue\" && e.sourceDialogueId === m.dialogueLineId);\n      if (!evt) {\n        evt = newAudioEvent(\"dialogue\");\n        evt.sourceDialogueId = m.dialogueLineId;\n        cut.audioEvents.push(evt);\n      }\n      return evt;\n    }\n    // sfx는 항상 새 이벤트\n    const evt = newAudioEvent(\"sfx\");\n    evt.name = m.fileName.replace(/\\.[^.]+$/, \"\");\n    cut.audioEvents.push(evt);\n    return evt;\n  }\n\n  // ---------------------------------------------------------------------\n  // 오디오 파일 첨부/교체(자동 duration 측정 포함) — 공통 헬퍼\n  // ---------------------------------------------------------------------\n\n  async function attachEventAudio(cut, evt, file) {\n    const oldAssetId = evt.assetId;\n    if (oldAssetId) {\n      await deleteAssetSafely(oldAssetId, ep.id);\n      forgetAssetObjectUrl(oldAssetId);\n    }\n    const asset = await putAsset({ episodeId: ep.id, kind: \"audio\", role: `cut_${cut.id}_audio_${evt.id}`, blob: file, originalFileName: file.name });\n    evt.assetId = asset.id;\n    const measured = await measureAudioDuration(file);\n    // 새 파일이므로 원본 실측값(sourceDuration)과 편집용 duration을 함께 새 값으로 갱신한다.\n    // Timeline에서 duration만 따로 조정했더라도, 파일을 교체하면 그 편집값은 더 이상 유효하지\n    // 않으므로 새 측정값으로 리셋되는 게 맞다(파일이 실제로 바뀌었으니까).\n    applyMeasuredDuration(evt, measured);\n    recalcAudioModeDurations(ep);\n    invalidateTimelineReview(ep);\n    invalidatePreviewReview(ep);\n    await ctx.save({ cuts });\n  }\n\n  async function deleteEventAudioAsset(cut, evt) {\n    if (!evt.assetId) return;\n    await deleteAssetSafely(evt.assetId, ep.id);\n    forgetAssetObjectUrl(evt.assetId);\n    evt.assetId = null;\n    recalcAudioModeDurations(ep);\n    invalidateTimelineReview(ep);\n    invalidatePreviewReview(ep);\n    await ctx.save({ cuts });\n  }\n\n  // ---------------------------------------------------------------------\n  // CUT별 오디오 카드(요약 → 탭 확장)\n  // ---------------------------------------------------------------------\n\n  async function renderCutAudioList() {\n    const list = root.querySelector(\"#cut-audio-list\");\n    list.innerHTML = \"\";\n    if (!cuts.length) {\n      list.appendChild(el(`<div class=\"empty-state\">아직 CUT이 없어요.<br/>V4 Story Writer에서 먼저 에피소드를 생성해주세요.</div>`));\n      return;\n    }\n    cuts.forEach((cut, i) => list.appendChild(cutAudioCard(cut, i)));\n  }\n\n  function cutAudioCard(cut, i) {\n    const n = i + 1;\n    const expanded = expandedIds.has(cut.id);\n    const node = el(`\n      <div class=\"cut-card\">\n        <div class=\"cut-card-head\">\n          <button type=\"button\" class=\"cut-card-summary\" data-toggle>\n            <span class=\"cut-num\">CUT ${n}</span>\n            <span class=\"cut-summary-text\">${escapeHtml(cutAudioSummaryLine(cut, ep.audioMode))}</span>\n          </button>\n        </div>\n        <div class=\"cut-card-body\" data-body></div>\n      </div>\n    `);\n    node.querySelector(\"[data-toggle]\").onclick = () => {\n      if (expandedIds.has(cut.id)) expandedIds.delete(cut.id);\n      else expandedIds.add(cut.id);\n      renderCutAudioList();\n    };\n    if (expanded) {\n      const body = node.querySelector(\"[data-body]\");\n      body.appendChild(cutAudioEditor(cut, n));\n    }\n    return node;\n  }\n\n  function cutAudioEditor(cut, n) {\n    const wrap = el(`<div class=\"cut-editor\"></div>`);\n\n    // BGM 동작(continue/lower/raise/stop/fade_out) — 최소 UI, 세부 자동화는 Timeline에서.\n    const bgmAction = (ep.bgm && ep.bgm.cutActions && ep.bgm.cutActions[cut.id]) || \"continue\";\n    const bgmRow = el(`\n      <div>\n        <label>BGM 동작(이 CUT에서)</label>\n        <select data-bgm-action>\n          ${BGM_ACTIONS.map((a) => `<option value=\"${a}\" ${a === bgmAction ? \"selected\" : \"\"}>${BGM_ACTION_LABEL[a]}</option>`).join(\"\")}\n        </select>\n      </div>\n    `);\n    bgmRow.querySelector(\"[data-bgm-action]\").onchange = async (e) => {\n      ep.bgm = ep.bgm || { assetId: null, start: 0, end: null, volume: 1, cutActions: {} };\n      ep.bgm.cutActions = ep.bgm.cutActions || {};\n      ep.bgm.cutActions[cut.id] = e.target.value;\n      invalidateTimelineReview(ep);\n      invalidatePreviewReview(ep);\n      await ctx.save({ bgm: ep.bgm });\n    };\n    wrap.appendChild(bgmRow);\n\n    // 나레이션 — rc.3: 통합 나레이션 모드에서는 이 CUT의 나레이션 음성이 위쪽 \"전체\n    // 나레이션\" 슬롯 + CUT 타이밍 마커에서 관리되므로, 여기 per-cut 개별 첨부 UI는\n    // 표시하지 않는다(CUT별 개별 오디오/고급 모드로 전환하면 다시 나타난다).\n    if (ep.audioMode !== \"master_narration\" && cut.narration && cut.narration.trim()) {\n      wrap.appendChild(narrationRow(cut, n));\n    }\n\n    // 대사(STEP2 dialogueLines 기준 — 여기서 텍스트를 수정하지 않는다, 음성만 연결)\n    const dialogueLines = (cut.dialogueLines || []).filter((l) => l?.text && l.text.trim());\n    if (dialogueLines.length) {\n      wrap.appendChild(el(`<label style=\"margin-top:14px;\">대사 음성</label>`));\n      dialogueLines.forEach((line) => wrap.appendChild(dialogueRow(cut, line, n)));\n    }\n\n    // SFX\n    wrap.appendChild(el(`<label style=\"margin-top:14px;\">SFX</label>`));\n    const sfxList = el(`<div data-sfx-list></div>`);\n    wrap.appendChild(sfxList);\n    renderSfxList(sfxList, cut, n);\n    const addSfxBtn = el(`<button class=\"btn secondary small\" style=\"margin-top:6px;\">+ SFX 추가</button>`);\n    addSfxBtn.onclick = async () => {\n      cut.audioEvents = cut.audioEvents || [];\n      cut.audioEvents.push(newAudioEvent(\"sfx\"));\n      recalcAudioModeDurations(ep);\n      invalidateTimelineReview(ep);\n      invalidatePreviewReview(ep);\n      await ctx.save({ cuts });\n      expandedIds.add(cut.id); // 방금 추가한 카드는 계속 펼쳐둔 채로 다시 그린다\n      renderCutAudioList();\n    };\n    wrap.appendChild(addSfxBtn);\n\n    // 정적(silence)\n    wrap.appendChild(el(`<label style=\"margin-top:14px;\">정적 / Hold</label>`));\n    const silenceList = el(`<div data-silence-list></div>`);\n    wrap.appendChild(silenceList);\n    renderSilenceList(silenceList, cut, n);\n    const addSilenceBtn = el(`<button class=\"btn secondary small\" style=\"margin-top:6px;\">+ 정적 추가</button>`);\n    addSilenceBtn.onclick = async () => {\n      cut.audioEvents = cut.audioEvents || [];\n      cut.audioEvents.push(newAudioEvent(\"silence\"));\n      recalcAudioModeDurations(ep);\n      invalidateTimelineReview(ep);\n      invalidatePreviewReview(ep);\n      await ctx.save({ cuts });\n      expandedIds.add(cut.id);\n      renderCutAudioList();\n    };\n    wrap.appendChild(addSilenceBtn);\n\n    // rc.4(코드 리뷰 후속 수정) — master_narration 모드에서는 이 라벨이 \"오디오 기준 최소\n    // 길이\"(computeMeasuredDuration, CUT별 audioEvent 길이만 봄)를 그대로 보여주면 실제\n    // CUT duration의 Source of Truth(마커 간 차이, resolveCutDuration)와 다른 값을 보여줄 수\n    // 있다 — 예: 마스터 마커 기준 2.0초인데 preserved/비활성 대사·나레이션 이벤트가 2.5초면\n    // 이 표시만 2.5초로 잘못 보인다. 모드에 따라 라벨 문구와 값의 출처를 함께 바꾼다.\n    wrap.appendChild(\n      el(\n        `<p class=\"hint\" style=\"margin-top:14px;\">${\n          ep.audioMode === \"master_narration\" ? \"현재 CUT 길이(마스터 나레이션 타이밍 기준)\" : \"실측 재생시간(오디오 기준 최소 길이)\"\n        }: ${fmtMeasured(cut)}</p>`\n      )\n    );\n\n    return wrap;\n  }\n\n  function refreshSummary(cut) {\n    const card = [...root.querySelectorAll(\".cut-card\")].find((c) => c.querySelector(\".cut-summary-text\") && expandedIds.has(cut.id));\n    // 요약 텍스트는 카드 전체를 다시 그리기 전까지 갱신 안 해도 무방 — 다음 renderCutAudioList()에서 갱신됨.\n    void card;\n  }\n\n  function fmtMeasured(cut) {\n    // rc.4(코드 리뷰 후속 수정) — master_narration 모드에서는 CUT duration의 Single Source of\n    // Truth인 resolveCutDuration()(마커 기반 recalcMasterNarrationDurations가 채운\n    // duration.measured, 또는 manual이 있으면 그 값)을 그대로 보여준다. per_cut 모드는 기존\n    // 그대로 computeMeasuredDuration(cut)(오디오 이벤트 기준)을 보여준다.\n    const m = ep.audioMode === \"master_narration\" ? resolveCutDuration(cut) : computeMeasuredDuration(cut);\n    return m == null ? \"아직 없음\" : `${m.toFixed(1)}초`;\n  }\n\n  function narrationRow(cut, n) {\n    cut.audioEvents = cut.audioEvents || [];\n    let evt = cut.audioEvents.find((e) => e.type === \"narration\");\n    if (!evt) {\n      evt = newAudioEvent(\"narration\");\n      cut.audioEvents.push(evt);\n    }\n    return eventRow({\n      cut,\n      evt,\n      title: \"나레이션\",\n      preview: cut.narration,\n      attachLabel: evt.assetId ? \"나레이션 음성 교체\" : \"나레이션 음성 첨부\",\n      deletable: true,\n      n,\n    });\n  }\n\n  function dialogueRow(cut, line, n) {\n    cut.audioEvents = cut.audioEvents || [];\n    let evt = cut.audioEvents.find((e) => e.type === \"dialogue\" && e.sourceDialogueId === line.id);\n    if (!evt) {\n      evt = newAudioEvent(\"dialogue\");\n      evt.sourceDialogueId = line.id;\n      evt.speaker = line.speaker;\n      evt.text = line.text;\n      cut.audioEvents.push(evt);\n    }\n    const label = line.speaker ? `${line.speaker} \"${truncate(line.text)}\"` : `\"${truncate(line.text)}\"`;\n    return eventRow({\n      cut,\n      evt,\n      title: label,\n      preview: null,\n      attachLabel: evt.assetId ? `${label} 음성 교체` : `${label} 음성 첨부`,\n      deletable: true,\n      n,\n    });\n  }\n\n  function renderSfxList(mount, cut, n) {\n    mount.innerHTML = \"\";\n    const events = (cut.audioEvents || []).filter((e) => e.type === \"sfx\");\n    if (!events.length) {\n      mount.appendChild(el(`<p class=\"hint\" style=\"margin:0;\">등록된 SFX가 없어요.</p>`));\n      return;\n    }\n    events.forEach((evt) => {\n      const row = eventRow({\n        cut,\n        evt,\n        title: evt.name || \"(이름 없음)\",\n        preview: null,\n        attachLabel: evt.assetId ? \"SFX 파일 교체\" : \"SFX 파일 첨부\",\n        deletable: false,\n        n,\n        extraFields: true,\n        onRemoveEvent: async () => {\n          if (!confirm(\"이 SFX를 삭제할까요?\")) return;\n          if (evt.assetId) await deleteAssetSafely(evt.assetId, ep.id);\n          cut.audioEvents = cut.audioEvents.filter((e) => e.id !== evt.id);\n          recalcAudioModeDurations(ep);\n          invalidateTimelineReview(ep);\n          invalidatePreviewReview(ep);\n          await ctx.save({ cuts });\n          expandedIds.add(cut.id);\n          renderCutAudioList();\n        },\n      });\n      mount.appendChild(row);\n    });\n  }\n\n  function renderSilenceList(mount, cut, n) {\n    mount.innerHTML = \"\";\n    const events = (cut.audioEvents || []).filter((e) => e.type === \"silence\");\n    if (!events.length) {\n      mount.appendChild(el(`<p class=\"hint\" style=\"margin:0;\">등록된 정적이 없어요.</p>`));\n      return;\n    }\n    events.forEach((evt) => {\n      const row = el(`\n        <div class=\"dialogue-row\">\n          <label style=\"margin:0;width:44px;\">시작</label>\n          <input type=\"number\" step=\"0.1\" data-start value=\"${evt.start ?? 0}\" style=\"width:70px;\" />\n          <label style=\"margin:0;width:60px;\">지속시간</label>\n          <input type=\"number\" step=\"0.1\" data-duration value=\"${evt.duration ?? 1}\" style=\"width:70px;\" />\n          <button class=\"btn danger small\" data-remove>삭제</button>\n        </div>\n      `);\n      row.querySelector(\"[data-start]\").addEventListener(\"blur\", async (e) => {\n        evt.start = Number(e.target.value) || 0;\n        recalcAudioModeDurations(ep);\n        invalidateTimelineReview(ep);\n        invalidatePreviewReview(ep);\n        await ctx.save({ cuts });\n      });\n      row.querySelector(\"[data-duration]\").addEventListener(\"blur\", async (e) => {\n        evt.duration = Number(e.target.value) || 0;\n        recalcAudioModeDurations(ep);\n        invalidateTimelineReview(ep);\n        invalidatePreviewReview(ep);\n        await ctx.save({ cuts });\n      });\n      row.querySelector(\"[data-remove]\").onclick = async () => {\n        if (!confirm(\"이 정적을 삭제할까요?\")) return;\n        cut.audioEvents = cut.audioEvents.filter((e) => e.id !== evt.id);\n        recalcAudioModeDurations(ep);\n        invalidateTimelineReview(ep);\n        invalidatePreviewReview(ep);\n        await ctx.save({ cuts });\n        expandedIds.add(cut.id);\n        renderCutAudioList();\n      };\n      mount.appendChild(row);\n    });\n  }\n\n  // narration/dialogue/sfx 공용 행 렌더러 — 첨부/교체/삭제 + volume/fadeIn/fadeOut(+ sfx는 이름/필수 여부)\n  function eventRow({ cut, evt, title, preview, attachLabel, deletable, n, extraFields, onRemoveEvent }) {\n    const node = el(`\n      <div class=\"card\" style=\"margin-bottom:8px;background:var(--bg-card2);\">\n        <div class=\"cut-image-title\" style=\"margin-bottom:6px;\">${escapeHtml(title)}</div>\n        ${preview ? `<p class=\"hint\" style=\"margin:0 0 6px;\">${escapeHtml(preview)}</p>` : \"\"}\n        ${evt.assetId ? `<div data-player></div>` : \"\"}\n        <div class=\"btn-row\">\n          <button class=\"btn secondary small\" data-attach>${escapeHtml(attachLabel)}</button>\n          ${evt.assetId && deletable ? `<button class=\"btn danger small\" data-delete-asset>음성 삭제</button>` : \"\"}\n          ${onRemoveEvent ? `<button class=\"btn danger small\" data-remove-event>이벤트 삭제</button>` : \"\"}\n        </div>\n        <input type=\"file\" accept=\"audio/*\" data-file-input style=\"display:none;\" />\n        ${\n          extraFields\n            ? `\n        <label>이름</label>\n        <input type=\"text\" data-name value=\"${attrText(evt.name)}\" placeholder=\"예: telephone_ring\" />\n        <label style=\"display:flex;align-items:center;gap:6px;\">\n          <input type=\"checkbox\" data-required ${evt.required ? \"checked\" : \"\"} style=\"width:auto;\" /> 이 SFX는 꼭 필요해요(필수)\n        </label>\n        `\n            : \"\"\n        }\n        <div style=\"display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;\">\n          <div><label style=\"margin:0;\">시작(초)</label><input type=\"number\" step=\"0.1\" data-start value=\"${evt.start ?? 0}\" style=\"width:70px;\" /></div>\n          <div><label style=\"margin:0;\">길이(초)</label><input type=\"number\" step=\"0.1\" data-duration value=\"${evt.duration ?? \"\"}\" style=\"width:70px;\" /></div>\n          <div><label style=\"margin:0;\">볼륨</label><input type=\"number\" step=\"0.05\" min=\"0\" max=\"1\" data-volume value=\"${evt.volume ?? 1}\" style=\"width:70px;\" /></div>\n          <div><label style=\"margin:0;\">Fade In</label><input type=\"number\" step=\"0.1\" min=\"0\" data-fadein value=\"${evt.fadeIn ?? 0}\" style=\"width:70px;\" /></div>\n          <div><label style=\"margin:0;\">Fade Out</label><input type=\"number\" step=\"0.1\" min=\"0\" data-fadeout value=\"${evt.fadeOut ?? 0}\" style=\"width:70px;\" /></div>\n        </div>\n      </div>\n    `);\n\n    if (evt.assetId) {\n      getAssetObjectUrl(evt.assetId).then((url) => {\n        const holder = node.querySelector(\"[data-player]\");\n        if (holder && url) holder.innerHTML = `<audio controls src=\"${url}\" style=\"width:100%;\"></audio>`;\n      });\n    }\n\n    const fileInput = node.querySelector(\"[data-file-input]\");\n    node.querySelector(\"[data-attach]\").onclick = () => fileInput.click();\n    fileInput.onchange = async (e) => {\n      const file = e.target.files[0];\n      if (!file) return;\n      if (!confirmOversizedFile(file)) return;\n      try {\n        await attachEventAudio(cut, evt, file);\n        toast(`CUT ${n} \"${title}\" 음성을 등록했어요`);\n        ctx.reRender();\n      } catch (err) {\n        toastAssetSaveError(err);\n      }\n    };\n\n    const delAssetBtn = node.querySelector(\"[data-delete-asset]\");\n    if (delAssetBtn) {\n      delAssetBtn.onclick = async () => {\n        if (!confirm(\"이 음성 파일을 삭제할까요?\")) return;\n        await deleteEventAudioAsset(cut, evt);\n        toast(\"삭제했어요\");\n        ctx.reRender();\n      };\n    }\n\n    const removeEventBtn = node.querySelector(\"[data-remove-event]\");\n    if (removeEventBtn && onRemoveEvent) {\n      removeEventBtn.onclick = onRemoveEvent;\n    }\n\n    const nameInput = node.querySelector(\"[data-name]\");\n    if (nameInput) {\n      nameInput.addEventListener(\"blur\", async () => {\n        evt.name = nameInput.value;\n        await ctx.save({ cuts });\n      });\n    }\n    const requiredInput = node.querySelector(\"[data-required]\");\n    if (requiredInput) {\n      requiredInput.addEventListener(\"change\", async () => {\n        evt.required = requiredInput.checked;\n        await ctx.save({ cuts });\n      });\n    }\n\n    node.querySelector(\"[data-start]\").addEventListener(\"blur\", async (e) => {\n      evt.start = Number(e.target.value) || 0;\n      recalcAudioModeDurations(ep);\n      invalidateTimelineReview(ep);\n      invalidatePreviewReview(ep);\n      await ctx.save({ cuts });\n    });\n    node.querySelector(\"[data-duration]\").addEventListener(\"blur\", async (e) => {\n      evt.duration = e.target.value === \"\" ? null : Number(e.target.value); // 수동 수정 = 최종 우선(sourceDuration은 보존)\n      recalcAudioModeDurations(ep);\n      invalidateTimelineReview(ep);\n      invalidatePreviewReview(ep);\n      await ctx.save({ cuts });\n    });\n    node.querySelector(\"[data-volume]\").addEventListener(\"blur\", async (e) => {\n      evt.volume = Number(e.target.value);\n      await ctx.save({ cuts });\n    });\n    node.querySelector(\"[data-fadein]\").addEventListener(\"blur\", async (e) => {\n      evt.fadeIn = Number(e.target.value) || 0;\n      await ctx.save({ cuts });\n    });\n    node.querySelector(\"[data-fadeout]\").addEventListener(\"blur\", async (e) => {\n      evt.fadeOut = Number(e.target.value) || 0;\n      await ctx.save({ cuts });\n    });\n\n    return node;\n  }\n}\n\n// ---------------------------------------------------------------------------\n// 헬퍼(모듈 스코프)\n// ---------------------------------------------------------------------------\n\n// HTMLAudioElement의 metadata 로딩을 이용해 실제 오디오 길이를 자동 측정한다.\n// 측정 실패(디코딩 불가 등)하면 null을 반환하고, 사용자가 직접 입력하게 둔다.\nfunction measureAudioDuration(file) {\n  return new Promise((resolve) => {\n    let settled = false;\n    const url = URL.createObjectURL(file);\n    const audio = new Audio();\n    const finish = (value) => {\n      if (settled) return;\n      settled = true;\n      URL.revokeObjectURL(url);\n      resolve(value);\n    };\n    audio.preload = \"metadata\";\n    audio.onloadedmetadata = () => finish(isFinite(audio.duration) && audio.duration > 0 ? audio.duration : null);\n    audio.onerror = () => finish(null);\n    // 일부 브라우저/포맷에서 metadata 이벤트가 안 올 수 있어 안전장치로 타임아웃을 둔다.\n    setTimeout(() => finish(null), 4000);\n    audio.src = url;\n  });\n}\n\n// rc.3: 통합 나레이션 모드에서는 \"나레이션 파일 1개 + CUT마다 시작 마커\"가 슬롯이다 —\n// CUT마다 개별 나레이션 파일이 필요한 것처럼 세지 않는다(대사/SFX는 모드와 무관하게 그대로).\nfunction buildNarrationScript(cuts) {\n  return (cuts || [])\n    .map((cut) => String(cut?.narration || \"\").trim())\n    .filter(Boolean)\n    .join(\"\\n\\n\");\n}\n\nfunction extractCutSpeaker(cut) {\n  if (!cut) return \"\";\n  const direct = String(cut.voiceSpeaker || cut.speaker || \"\").trim();\n  if (direct) return direct;\n  const note = String(cut.directorNote || \"\");\n  const m = note.match(/(?:^|·|\\n)\\s*speaker\\s*:\\s*([^·\\n]+)/i);\n  return m ? String(m[1] || \"\").trim() : \"\";\n}\n\nfunction buildSpeakerTtsBlocks(cuts = []) {\n  const blocks = [];\n  cuts.forEach((cut, index) => {\n    const text = String(cut?.narration || \"\").trim();\n    if (!text) return;\n    const speaker = extractCutSpeaker(cut) || \"화자 미지정\";\n    const last = blocks[blocks.length - 1];\n    if (last && last.speaker === speaker) {\n      last.cutEnd = index + 1;\n      last.text += \"\\n\" + text;\n      last.cutNumbers.push(index + 1);\n    } else {\n      blocks.push({\n        speaker,\n        cutStart: index + 1,\n        cutEnd: index + 1,\n        cutNumbers: [index + 1],\n        text,\n      });\n    }\n  });\n  return blocks;\n}\n\nfunction speakerBlockLabel(block) {\n  return block.cutStart === block.cutEnd\n    ? `CUT ${block.cutStart}`\n    : `CUT ${block.cutStart}~${block.cutEnd}`;\n}\n\n\nfunction countRequiredAudioSlots(ep) {\n  let total = 0;\n  const cuts = ep.cuts || [];\n  if (ep.audioMode === \"master_narration\") {\n    if (cuts.length) total += 1 + Math.max(0, cuts.length - 1); // 파일 1개 + (CUT1 제외) 마커\n  } else {\n    cuts.forEach((cut) => {\n      if (cut.narration && cut.narration.trim()) total++;\n    });\n  }\n  cuts.forEach((cut) => {\n    total += (cut.dialogueLines || []).filter((l) => l?.text && l.text.trim()).length;\n    total += (cut.audioEvents || []).filter((e) => e.type === \"sfx\" && e.required).length;\n  });\n  return total;\n}\n\nfunction cutAudioSummaryLine(cut, audioMode) {\n  const events = cut.audioEvents || [];\n  let voiceTotal = 0;\n  let voiceDone = 0;\n  if (audioMode !== \"master_narration\" && cut.narration && cut.narration.trim()) {\n    voiceTotal++;\n    if (events.some((e) => e.type === \"narration\" && e.assetId)) voiceDone++;\n  }\n  (cut.dialogueLines || [])\n    .filter((l) => l?.text && l.text.trim())\n    .forEach((line) => {\n      voiceTotal++;\n      const evt = events.find((e) => e.type === \"dialogue\" && e.sourceDialogueId === line.id);\n      if (evt && evt.assetId) voiceDone++;\n    });\n  const sfxCount = events.filter((e) => e.type === \"sfx\").length;\n  const silenceCount = events.filter((e) => e.type === \"silence\").length;\n  // rc.4(코드 리뷰 후속 수정) — master_narration 모드에서는 CUT 요약 줄도 fmtMeasured()와\n  // 동일하게 resolveCutDuration()(마커 기반 Single Source of Truth)을 보여준다. per_cut\n  // 모드는 기 직을 두지 않는다.\n// - CUT 내부 audioEvent.start는 항상 CUT 상대시간 그대로 저장한다. 화면에 표시할 때만\n//   timeline.js가 전역시간으로 변환하고, 저장은 항상 원래(상대시간) 필드에 한다.\n\nimport {\n  MOTION_TYPES,\n  TRANSITION_TYPES,\n  BGM_ACTIONS,\n  applyMotionPreset,\n  setCutTransition,\n  reindexCuts,\n  invalidateTimelineReview,\n  invalidatePreviewReview,\n  recalcAudioModeDurations,\n} from \"../model.js\";\nimport { buildTimeline, getTimelineWarnings, describeCutDuration, getEpisodeDuration, isMasterNarrationMode } from \"../timeline.js\";\nimport { getNextActions } from \"../nextActions.js\";\nimport { el, escapeHtml, toast } from \"../util.js\";\nimport { applyAutoVisualBeats, visualBeatSummary, contentPresetLabel } from \"../visualBeats.js\";\n\nconst BGM_ACTION_LABEL = {\n  continue: \"계속 재생\",\n  lower: \"볼륨 낮추기\",\n  raise: \"볼륨 올리기\",\n  stop: \"정지\",\n  fade_out: \"페이드 아웃\",\n};\n\nconst MOTION_LABEL = {\n  AUTO_BEATS: \"자동 영상 연출\",\n  STATIC: \"고정\",\n  PUSH_IN_SLOW: \"천천히 줌인\",\n  PUSH_IN: \"줌인\",\n  PUNCH_IN: \"빠른 줌인(펀치인)\",\n  ZOOM_OUT: \"줌아웃\",\n  PAN_LEFT: \"왼쪽으로 팬\",\n  PAN_RIGHT: \"오른쪽으로 팬\",\n  PAN_UP: \"위로 팬\",\n  PAN_DOWN: \"아래로 팬\",\n  CUSTOM: \"커스텀\",\n};\n\nconst FIT_MODE = \"fit\";\nconst ZOOM_MODE = \"zoom\";\nconst ZOOM_PX_PER_SEC = 46;\nconst MIN_PX_PER_SEC = 6;\nconst TRACK_HEIGHT = 30;\n\nexport async function render(root, ep, ctx) {\n  const cuts = ep.cuts || [];\n\n  // Alpha60 — 경제그루터기 기본 원칙:\n  // 정지 이미지 나열을 기본값으로 두지 않는다. 사용자가 별도 연출을 적용하지 않은\n  // economy_current 쇼츠라면 기본 강도의 자동 줌/팬/시각 비트를 1회 자동 적용한다.\n  if (ep.channelKey === \"economy_current\" && cuts.length && !visualBeatSummary(cuts).beatCount) {\n    applyAutoVisualBeats(\n      cuts,\n      (cut)=>describeCutDuration(cut, ep.audioMode).resolved,\n      { style:\"basic\", contentMode:\"economy\" }\n    );\n    invalidateTimelineReview(ep);\n    invalidatePreviewReview(ep);\n    try { await ctx.save({ cuts }); } catch (e) {}\n  }\n\n  const expandedIds = new Set();\n  let zoomLevel = FIT_MODE;\n\n  const timelineActions = getNextActions(ep).filter((a) => a.step === \"timeline\");\n  const episodeDuration = getEpisodeDuration(ep);\n\n  const initialBlockers = getTimelineWarnings(ep).filter((w) => w.severity === \"blocker\");\n  const timelineReadyForReview = cuts.length > 0 && initialBlockers.length === 0;\n\n  root.innerHTML = `\n    <div class=\"card\">\n      <h3>타임라인</h3>\n      <p class=\"hint\"><strong>전체 영상 길이</strong> — ${fmtSec(episodeDuration)} · CUT ${cuts.length}개</p>\n      <p class=\"hint\">기본 제작에서는 자동으로 계산된 흐름을 확인한 뒤 확정만 하면 됩니다. 세부 모션·전환·BGM 시간 조정이 필요할 때만 아래 고급 편집을 열어주세요.</p>\n      <div class=\"auto-visual-beats-box\" style=\"margin-top:10px;\">\n        <div class=\"hint\" style=\"margin-bottom:6px;\"><strong>콘텐츠 흐름</strong></div>\n        <div class=\"btn-row\" id=\"visual-content-modes\" style=\"margin-bottom:10px;flex-wrap:wrap;\">\n          <button class=\"btn secondary\" data-content-mode=\"news\" type=\"button\">뉴스</button>\n          <button class=\"btn secondary\" data-content-mode=\"economy\" type=\"button\">경제</button>\n          <button class=\"btn secondary\" data-content-mode=\"politics\" type=\"button\">정치·시사</button>\n          <button class=\"btn secondary\" data-content-mode=\"shopping\" type=\"button\">쇼핑쇼츠</button>\n          <button class=\"btn secondary\" data-content-mode=\"info\" type=\"button\">정보·지식</button>\n          <button class=\"btn secondary\" data-content-mode=\"humor\" type=\"button\">유머</button>\n          <button class=\"btn secondary\" data-content-mode=\"sports\" type=\"button\">스포츠</button>\n        </div>\n        <div class=\"hint\" style=\"margin-bottom:6px;\"><strong>연출 강도</strong></div>\n        <div class=\"btn-row\" style=\"margin-bottom:8px;\">\n          <button class=\"btn secondary\" id=\"visual-style-basic\" type=\"button\">기본</button>\n          <button class=\"btn secondary\" id=\"visual-style-dramatic\" type=\"button\">드라마틱</button>\n          <button class=\"btn secondary\" id=\"visual-style-dynamic\" type=\"button\">다이내믹</button>\n        </div>\n        <button class=\"btn secondary\" id=\"auto-visual-beats\" style=\"width:100%;\">✨ 선택한 자동 영상 연출 적용</button>\n        <p class=\"hint\" id=\"auto-visual-beats-summary\" style=\"margin:7px 0 0;\">콘텐츠 성격과 연출 강도를 조합해 자동 연출합니다.</p>\n      </div>\n      <button class=\"btn\" id=\"timeline-primary-action\" style=\"width:100%;margin-top:10px;\">\n        ${\n          !timelineReadyForReview\n            ? `⚠ 타임라인 막힘 ${initialBlockers.length}건 확인`\n            : !ep.timelineReviewedAt\n              ? \"✓ 이 타임라인으로 확정\"\n              : \"⑤ 미리보기 / QC로 이동 →\"\n        }\n      </button>\n      <p class=\"hint\" style=\"margin-top:10px;\">\n        ${\n          !timelineReadyForReview\n            ? \"필수 시간이 아직 정해지지 않은 CUT이 있어요. 아래 세부 편집에서 표시된 항목만 해결하면 됩니다.\"\n            : !ep.timelineReviewedAt\n              ? \"자동 계산 상태가 준비됐습니다. 전체 흐름이 괜찮으면 한 번 눌러 확정하세요.\"\n              : \"타임라인 검토 완료 · 이제 실제 미리보기와 QC를 확인하면 됩니다.\"\n        }\n      </p>\n    </div>\n\n    <div class=\"card\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;\">\n        <h3 style=\"margin:0;\">전체 흐름 미리보기</h3>\n        <div class=\"btn-row\" style=\"flex:0 0 auto;\">\n          <button class=\"btn secondary small\" id=\"zoom-fit\">전체 보기</button>\n          <button class=\"btn secondary small\" id=\"zoom-in\">확대 보기</button>\n        </div>\n      </div>\n      <div id=\"tl-visual\"></div>\n    </div>\n\n    <details class=\"image-more-tools\" id=\"timeline-advanced-tools\">\n      <summary>세부 타임라인 편집 / 고급 도구</summary>\n      <div style=\"margin-top:12px;\">\n        ${\n          timelineActions.length\n            ? `<div class=\"card\"><h3>남은 작업</h3><ul class=\"next-action-list\">${timelineActions\n                 .slice(0, 6)\n                 .map((a) => `<li><span class=\"pill-inline ${a.priority}\">${priorityLabel(a.priority)}</span> ${escapeHtml(a.message)}</li>`)\n                 .join(\"\")}${timelineActions.length > 6 ? `<li class=\"hint\">외 ${timelineActions.length - 6}건...</li>` : \"\"}</ul></div>`\n            : \"\"\n        }\n        <div class=\"card\" id=\"bgm-tl-card\"></div>\n        <div id=\"cut-timeline-list\"></div>\n        <div id=\"review-card-mount\"></div>\n      </div>\n    </details>\n  `;\n\n  const autoVisualBtn = root.querySelector(\"#auto-visual-beats\");\n  const basicStyleBtn = root.querySelector(\"#visual-style-basic\");\n  const dramaticStyleBtn = root.querySelector(\"#visual-style-dramatic\");\n  const dynamicStyleBtn = root.querySelector(\"#visual-style-dynamic\");\n  const contentModeBtns = [...root.querySelectorAll(\"[data-content-mode]\")];\n  const autoVisualSummary = root.querySelector(\"#auto-visual-beats-summary\");\n  const existingVisual = visualBeatSummary(cuts);\n  let selectedVisualStyle = existingVisual.style || \"basic\";\n  const channelDefaultContentMode = ep.channelKey === \"economy_current\" ? \"economy\" : ep.channelKey === \"sports\" ? \"sports\" : \"news\";\n  let selectedContentMode = existingVisual.beatCount ? (existingVisual.contentMode || channelDefaultContentMode) : channelDefaultContentMode;\n  const refreshVisualStyleButtons = () => {\n    basicStyleBtn?.classList.toggle(\"active-zoom\", selectedVisualStyle===\"basic\");\n    dramaticStyleBtn?.classList.toggle(\"active-zoom\", selectedVisualStyle===\"dramatic\");\n    dynamicStyleBtn?.classList.toggle(\"active-zoom\", selectedVisualStyle===\"dynamic\");\n    contentModeBtns.forEach(b=>b.classList.toggle(\"active-zoom\",b.dataset.contentMode===selectedContentMode));\n  };\n  const refreshAutoVisualSummary = () => {\n    if (!autoVisualSummary) return;\n    const summary=visualBeatSummary(cuts);\n    autoVisualSummary.textContent = summary.beatCount\n      ? `자동 연출 적용됨 · ${summary.contentLabel} / ${summary.style===\"dynamic\"?\"다이내믹\":summary.style===\"dramatic\"?\"드라마틱\":\"기본\"} · ${summary.autoCuts}개 이미지에서 총 ${summary.beatCount}개의 시각 변화`\n      : `${contentPresetLabel(selectedContentMode)} 흐름 + ${selectedVisualStyle===\"dynamic\"?\"다이내믹\":selectedVisualStyle===\"dramatic\"?\"드라마틱\":\"기본\"} 강도로 적용합니다.`;\n  };\n  basicStyleBtn?.addEventListener(\"click\",()=>{selectedVisualStyle=\"basic\";refreshVisualStyleButtons();refreshAutoVisualSummary();});\n  dramaticStyleBtn?.addEventListener(\"click\",()=>{selectedVisualStyle=\"dramatic\";refreshVisualStyleButtons();refreshAutoVisualSummary();});\n  dynamicStyleBtn?.addEventListener(\"click\",()=>{selectedVisualStyle=\"dynamic\";refreshVisualStyleButtons();refreshAutoVisualSummary();});\n  contentModeBtns.forEach(b=>b.addEventListener(\"click\",()=>{selectedContentMode=b.dataset.contentMode||\"news\";refreshVisualStyleButtons();refreshAutoVisualSummary();}));\n  refreshVisualStyleButtons(); refreshAutoVisualSummary();\n  if(autoVisualBtn){\n    autoVisualBtn.onclick=async()=>{\n      if(!cuts.length)return;\n      [autoVisualBtn,basicStyleBtn,dramaticStyleBtn,dynamicStyleBtn,...contentModeBtns].filter(Boolean).forEach(b=>b.disabled=true);\n      try{\n        const result=applyAutoVisualBeats(cuts,(cut)=>describeCutDuration(cut,ep.audioMode).resolved,{style:selectedVisualStyle,contentMode:selectedContentMode});\n        invalidateTimelineReview(ep); invalidatePreviewReview(ep);\n        await ctx.save({cuts}); refreshAutoVisualSummary();\n        toast(`${result.contentLabel} / ${result.style===\"dynamic\"?\"다이내믹\":result.style===\"dramatic\"?\"드라마틱\":\"기본\"} · ${result.beatCount}개 시각 변화`);\n        renderTimeline(); renderCutList(); renderReviewCard();\n      }finally{\n        [autoVisualBtn,basicStyleBtn,dramaticStyleBtn,dynamicStyleBtn,...contentModeBtns].filter(Boolean).forEach(b=>b.disabled=false);\n      }\n    };\n  }\n\n  const primaryTimelineBtn = root.querySelector(\"#timeline-primary-action\");\n  if (primaryTimelineBtn) {\n    primaryTimelineBtn.onclick = async () => {\n      const blockersNow = getTimelineWarnings(ep).filter((w) => w.severity === \"blocker\");\n      if (!cuts.length || blockersNow.length) {\n        const advanced = root.querySelector(\"#timeline-advanced-tools\");\n        if (advanced) {\n          advanced.open = true;\n          advanced.scrollIntoView({ behavior: \"smooth\", block: \"start\" });\n        }\n        return;\n      }\n      if (!ep.timelineReviewedAt) {\n        ep.timelineReviewedAt = Date.now();\n        await ctx.save({ timelineReviewedAt: ep.timelineReviewedAt });\n        toast(\"타임라인을 확정했어요\");\n        ctx.reRender();\n        return;\n      }\n      location.hash = `#/episode/${ep.id}/preview`;\n    };\n  }\n\n  root.querySelector(\"#zoom-fit\").onclick = () => {\n    zoomLevel = FIT_MODE;\n    renderVisual();\n  };\n  root.querySelector(\"#zoom-in\").onclick = () => {\n    zoomLevel = ZOOM_MODE;\n    renderVisual();\n  };\n\n  renderVisual();\n  renderBgmCard();\n  renderCutList();\n\n  // 검토 완료 버튼은 Step Assistant 카드 안에 있지 않고(막히는 게 있을 때는 무의미하므로)\n  // 남은 작업이 없을 때만 자연스럽게 보이도록 카드 목록 흐름 안에 별도로 붙인다.\n  renderReviewCard();\n\n  // ---------------------------------------------------------------------\n  // Phase 5(미리보기)가 재사용할 수 있는 최소 playhead 인터페이스.\n  // 아직 실제 재생은 없지만(\"Phase 4에서 실제 영상 재생 불필요\"), 나중에 다시 뜯어고치지 않도록\n  // 시간(초) → 화면 위 세로선 위치로 옮기는 함수만 미리 만들어 root에 달아둔다.\n  // ---------------------------------------------------------------------\n  root.setTimelinePlayhead = (seconds) => {\n    const playhead = root.querySelector(\"#tl-playhead\");\n    const wrap = root.querySelector(\"#tl-scroll\");\n    if (!playhead || !wrap) return;\n    const pxPerSec = currentPxPerSec();\n    playhead.style.display = seconds == null ? \"none\" : \"block\";\n    if (seconds != null) playhead.style.left = `${seconds * pxPerSec}px`;\n  };\n\n  // ---------------------------------------------------------------------\n  // 시각화(트랙) 렌더\n  // ---------------------------------------------------------------------\n\n  function currentPxPerSec() {\n    const wrap = root.querySelector(\"#tl-scroll-outer\");\n    const containerWidth = wrap ? wrap.clientWidth : 320;\n    if (zoomLevel === ZOOM_MODE) return ZOOM_PX_PER_SEC;\n    if (episodeDuration <= 0) return MIN_PX_PER_SEC;\n    return Math.max(MIN_PX_PER_SEC, containerWidth / episodeDuration);\n  }\n\n  function renderVisual() {\n    const mount = root.querySelector(\"#tl-visual\");\n    root.querySelector(\"#zoom-fit\").classList.toggle(\"active-zoom\", zoomLevel === FIT_MODE);\n    root.querySelector(\"#zoom-in\").classList.toggle(\"active-zoom\", zoomLevel === ZOOM_MODE);\n\n    if (!cuts.length) {\n      mount.innerHTML = `<p class=\"hint\">아직 CUT이 없어요. V4 Story Writer에서 먼저 에피소드를 생성해주세요.</p>`;\n      return;\n    }\n    if (episodeDuration <= 0) {\n      mount.innerHTML = `<p class=\"hint\">아직 재생시간이 정해진 CUT이 없어요 — duration을 정하면 여기에 흐름이 표시됩니다.</p>`;\n      return;\n    }\n\n    const timeline = buildTimeline(ep);\n    mount.innerHTML = `<div id=\"tl-scroll-outer\" style=\"overflow-x:auto;\">\n      <div id=\"tl-scroll\" style=\"position:relative;\"></div>\n    </div>`;\n\n    const scroll = mount.querySelector(\"#tl-scroll\");\n    const pxPerSec = currentPxPerSec();\n    const totalWidth = Math.max(1, episodeDuration * pxPerSec);\n    scroll.style.width = `${totalWidth}px`;\n    scroll.style.minWidth = \"100%\";\n\n    scroll.appendChild(rulerRow(episodeDuration, pxPerSec, totalWidth));\n    scroll.appendChild(\n      trackRow(\n        \"VIDEO\",\n        timeline.tracks.video.map((b) => ({\n          left: b.start * pxPerSec,\n          width: Math.max(2, b.duration * pxPerSec),\n          label: `CUT ${b.n}`,\n          cls: \"video\",\n          cutIndex: b.index,\n        })),\n        totalWidth\n      )\n    );\n    scroll.appendChild(\n      trackRow(\n        \"VOICE\",\n        timeline.tracks.voice.map((e) => ({\n          left: e.globalStart * pxPerSec,\n          width: Math.max(2, (e.globalEnd - e.globalStart) * pxPerSec),\n          label: e.event.master ? \"마스터 나레이션\" : e.event.type === \"narration\" ? \"나레이션\" : e.event.speaker || \"대사\",\n          cls: \"voice\",\n          cutIndex: e.cutIndex,\n          master: !!e.event.master,\n        })),\n        totalWidth\n      )\n    );\n    scroll.appendChild(\n      trackRow(\n        \"SFX\",\n        timeline.tracks.sfx.map((e) => ({\n          left: e.globalStart * pxPerSec,\n          width: Math.max(2, (e.globalEnd - e.globalStart) * pxPerSec),\n          label: e.event.name || \"SFX\",\n          cls: \"sfx\",\n          cutIndex: e.cutIndex,\n        })),\n        totalWidth\n      )\n    );\n    scroll.appendChild(\n      trackRow(\n        \"BGM\",\n        timeline.tracks.bgm.map((b) => ({\n          left: b.globalStart * pxPerSec,\n          width: Math.max(2, (b.globalEnd - b.globalStart) * pxPerSec),\n          label: \"BGM\",\n          cls: \"bgm\",\n          cutIndex: null,\n        })),\n        totalWidth\n      )\n    );\n    scroll.appendChild(\n      trackRow(\n        \"SUBTITLE\",\n        timeline.tracks.subtitle.map((e) => ({\n          left: e.globalStart * pxPerSec,\n          width: Math.max(2, (e.globalEnd - e.globalStart) * pxPerSec),\n          label: \"자막\",\n          cls: \"subtitle\",\n          cutIndex: e.cutIndex,\n        })),\n        totalWidth\n      )\n    );\n\n    const playhead = el(`<div id=\"tl-playhead\" class=\"tl-playhead\" style=\"display:none;\"></div>`);\n    scroll.appendChild(playhead);\n  }\n\n  function rulerRow(duration, pxPerSec, totalWidth) {\n    const row = el(`<div class=\"tl-track\"><div class=\"tl-track-label\">시간</div><div class=\"tl-track-lane tl-ruler\" style=\"width:${totalWidth}px;\"></div></div>`);\n    const lane = row.querySelector(\".tl-track-lane\");\n    const step = pxPerSec >= 30 ? 1 : pxPerSec >= 12 ? 5 : 10;\n    for (let t = 0; t <= duration + 0.001; t += step) {\n      const tick = el(`<div class=\"tl-tick\" style=\"left:${t * pxPerSec}px;\">${Math.round(t)}s</div>`);\n      lane.appendChild(tick);\n    }\n    return row;\n  }\n\n  function trackRow(label, blocks, totalWidth) {\n    const row = el(`<div class=\"tl-track\"><div class=\"tl-track-label\">${label}</div><div class=\"tl-track-lane\" style=\"width:${totalWidth}px;\"></div></div>`);\n    const lane = row.querySelector(\".tl-track-lane\");\n    blocks.forEach((b) => {\n      const node = el(`<button type=\"button\" class=\"tl-block ${b.cls}\" style=\"left:${b.left}px;width:${b.width}px;\">${escapeHtml(truncate(b.label, 10))}</button>`);\n      if (b.master) {\n        node.onclick = () => toast(\"마스터 나레이션은 ④ 오디오 단계에서 관리해요\");\n      } else if (b.cutIndex != null) {\n        node.onclick = () => jumpToCut(b.cutIndex);\n      } else {\n        node.onclick = () => root.querySelector(\"#bgm-tl-card\")?.scrollIntoView({ behavior: \"smooth\", block: \"start\" });\n      }\n      lane.appendChild(node);\n    });\n    if (!blocks.length) lane.appendChild(el(`<div class=\"tl-track-empty\">–</div>`));\n    return row;\n  }\n\n  function jumpToCut(index) {\n    const cut = cuts[index];\n    if (!cut) return;\n    expandedIds.add(cut.id);\n    renderCutList();\n    const card = root.querySelector(`[data-cut-card=\"${cut.id}\"]`);\n    if (card) card.scrollIntoView({ behavior: \"smooth\", block: \"start\" });\n  }\n\n  // ---------------------------------------------------------------------\n  // BGM(episode 단위) — 파일 첨부/교체/삭제는 ④ 오디오 화면 소관, 여기서는 start/end/volume만.\n  // ---------------------------------------------------------------------\n\n  function renderBgmCard() {\n    const mount = root.querySelector(\"#bgm-tl-card\");\n    const bgm = ep.bgm || { assetId: null, start: 0, end: null, volume: 1, fadeIn: 0, fadeOut: 0, fadeCurve: \"linear\", cutActions: {} };\n    mount.innerHTML = `\n      <h3>BGM 타이밍</h3>\n      ${\n        bgm.assetId\n          ? `\n      <label>시작(초)</label>\n      <input type=\"number\" step=\"0.1\" data-bgm-f=\"start\" value=\"${bgm.start ?? 0}\" />\n      <label>끝(초, 비우면 전체 영상 끝까지)</label>\n      <input type=\"number\" step=\"0.1\" data-bgm-f=\"end\" value=\"${bgm.end ?? \"\"}\" />\n      <label>볼륨(0~1)</label>\n      <input type=\"number\" step=\"0.05\" min=\"0\" max=\"1\" data-bgm-f=\"volume\" value=\"${bgm.volume ?? 1}\" />\n      <label>Fade In(초) — Preview 재생 시 시작 지점에서 서서히 커짐</label>\n      <input type=\"number\" step=\"0.1\" min=\"0\" data-bgm-f=\"fadeIn\" value=\"${bgm.fadeIn ?? 0}\" />\n      <label>Fade Out(초) — Preview 재생 시 종료 지점에서 서서히 작아짐</label>\n      <input type=\"number\" step=\"0.1\" min=\"0\" data-bgm-f=\"fadeOut\" value=\"${bgm.fadeOut ?? 0}\" />\n      <p class=\"hint\">지금은 linear(선형) fade만 지원해요.</p>\n      `\n          : `<p class=\"hint\">아직 BGM이 없어요 — ④ 오디오 단계에서 먼저 첨부해주세요.</p>`\n      }\n    `;\n    mount.querySelectorAll(\"[data-bgm-f]\").forEach((input) => {\n      input.addEventListener(\"blur\", async () => {\n        const f = input.dataset.bgmF;\n        const v = input.value === \"\" ? (f === \"end\" ? null : 0) : Number(input.value);\n        ep.bgm = { ...(ep.bgm || bgm), [f]: v };\n        invalidateTimelineReview(ep);\n        invalidatePreviewReview(ep);\n        await ctx.save({ bgm: ep.bgm });\n        renderReviewCard();\n      });\n    });\n  }\n\n  // ---------------------------------------------------------------------\n  // CUT별 편집 카드(요약 → 탭 확장) — Story/Audio와 동일한 패턴.\n  // ---------------------------------------------------------------------\n\n  function renderCutList() {\n    const list = root.querySelector(\"#cut-timeline-list\");\n    list.innerHTML = \"\";\n    if (!cuts.length) {\n      list.appendChild(el(`<div class=\"empty-state\">아직 CUT이 없어요.</div>`));\n      return;\n    }\n    cuts.forEach((cut, i) => list.appendChild(cutCard(cut, i, cuts.length)));\n  }\n\n  function cutCard(cut, i, total) {\n    const n = i + 1;\n    const expanded = expandedIds.has(cut.id);\n    const node = el(`\n      <div class=\"cut-card\" data-cut-card=\"${cut.id}\">\n        <div class=\"cut-card-head\">\n          <button type=\"button\" class=\"cut-card-summary\" data-toggle>\n            <span class=\"cut-num\">CUT ${n}</span>\n            <span class=\"cut-summary-text\">${escapeHtml(cutSummaryLine(cut))}</span>\n          </button>\n        </div>\n        <div class=\"cut-card-controls\">\n          <button class=\"btn ghost small\" data-act=\"up\" ${i === 0 ? \"disabled\" : \"\"}>▲</button>\n          <button class=\"btn ghost small\" data-act=\"down\" ${i === total - 1 ? \"disabled\" : \"\"}>▼</button>\n        </div>\n        <div class=\"cut-card-body\" data-body></div>\n      </div>\n    `);\n\n    node.querySelector(\"[data-toggle]\").onclick = () => {\n      if (expandedIds.has(cut.id)) expandedIds.delete(cut.id);\n      else expandedIds.add(cut.id);\n      renderCutList();\n    };\n\n    // CUT 순서 변경 — Story STEP과 정확히 같은 배열(ep.cuts)을 바꾼다. Timeline 전용 순서\n    // 배열을 따로 만들지 않는다. 안정적인 id(cut.id)는 건드리지 않는다.\n    node.querySelector('[data-act=\"up\"]').onclick = async () => {\n      if (i === 0) return;\n      const arr = ep.cuts;\n      [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];\n      reindexCuts(arr);\n      invalidateTimelineReview(ep);\n      invalidatePreviewReview(ep);\n      await ctx.save({ cuts: arr });\n      ctx.reRender();\n    };\n    node.querySelector('[data-act=\"down\"]').onclick = async () => {\n      if (i === total - 1) return;\n      const arr = ep.cuts;\n      [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];\n      reindexCuts(arr);\n      invalidateTimelineReview(ep);\n      invalidatePreviewReview(ep);\n      await ctx.save({ cuts: arr });\n      ctx.reRender();\n    };\n\n    if (expanded) {\n      node.querySelector(\"[data-body]\").appendChild(cutEditor(cut, n));\n    }\n    return node;\n  }\n\n  function cutEditor(cut, n) {\n    const wrap = el(`<div class=\"cut-editor\"></div>`);\n\n    wrap.appendChild(durationBlock(cut));\n    wrap.appendChild(motionBlock(cut));\n    wrap.appendChild(transitionBlock(cut));\n    wrap.appendChild(subtitleBlock(cut));\n    wrap.appendChild(bgmActionBlock(cut));\n\n    // rc.4(코드 리뷰 후속 수정) — Master Narration 모드에서는 CUT별 narration audioEvent가\n    // 비활성 보존 데이터다(episode.cuts 원본은 건드리지 않음). 이 CUT 상세 편집기의 \"오디오\n    // 이벤트 위치(시작/길이)\" 목록에서도 노출/편집 대상에서 제외해야 buildTimeline()의 VOICE\n    // 트랙 필터링·getTimelineWarnings()의 경고 필터링과 판정이 일치한다 — 그러지 않으면\n    // 사용자가 여기서 옛 나레이션의 시작/길이를 편집할 수 있는 것처럼 보이지만 실제로는 아무\n    // 재생/경고/production.json에도 반영되지 않는 혼란스러운 상태가 된다. Dialogue/SFX는\n    // 오디오 방식과 무관하게 그대로 노출된다. per_cut으로 되돌아가면 이 필터가 통과하지 않게\n    // 되어 다시 정상적으로 노출된다.\n    const audioEvents = (cut.audioEvents || []).filter((e) => e.type !== undefined && !(isMasterNarrationMode(ep) && e.type === \"narration\"));\n    if (audioEvents.length) {\n      wrap.appendChild(el(`<label style=\"margin-top:14px;\">오디오 이벤트 위치(시작/길이)</label>`));\n      audioEvents.forEach((evt) => wrap.appendChild(eventPositionRow(cut, evt)));\n    }\n\n    const cutWarnings = getTimelineWarnings(ep).filter((w) => w.cutIndex === n - 1);\n    if (cutWarnings.length) {\n      wrap.appendChild(\n        el(\n          `<div class=\"tl-warn-box\">${cutWarnings.map((w) => `<p class=\"hint\" style=\"color:var(--danger);margin:4px 0;\">⚠ ${escapeHtml(w.message)}</p>`).join(\"\")}</div>`\n        )\n      );\n    }\n\n    return wrap;\n  }\n\n  function durationBlock(cut) {\n    const info = describeCutDuration(cut, ep.audioMode);\n    const measuredLabel = info.source === \"master\" ? \"마스터 나레이션 타이밍\" : \"실측\";\n    const box = el(`\n      <div>\n        <label>CUT 길이(초) — manual &gt; measured &gt; estimated 순으로 최종 결정됨</label>\n        <p class=\"hint\" style=\"margin:2px 0 8px;\">\n          최종 ${info.resolved != null ? fmtSec(info.resolved) : \"미정\"}\n          ${info.measured != null ? ` · ${measuredLabel} ${fmtSec(info.measured)}` : \"\"}\n          ${info.estimated != null ? ` · 추정 ${fmtSec(info.estimated)}` : \"\"}\n        </p>\n        ${quickNumberField({ value: cut.duration.manual, placeholder: \"직접 입력(비우면 자동값 사용)\" })}\n      </div>\n    `);\n    wireQuickNumberField(box, async (v) => {\n      cut.duration.manual = v;\n      invalidateTimelineReview(ep);\n      invalidatePreviewReview(ep);\n      await ctx.save({ cuts });\n      refreshAfterEdit(cut);\n    });\n    return box;\n  }\n\n  function motionBlock(cut) {\n    cut.motion = cut.motion || { type: \"STATIC\", startScale: 1, endScale: 1, panX: 0, panY: 0, easing: \"linear\" };\n    const box = el(`\n      <div>\n        <label>Image Motion</label>\n        <select data-motion-type>\n          ${MOTION_TYPES.map((m) => `<option value=\"${m}\" ${m === cut.motion.type ? \"selected\" : \"\"}>${MOTION_LABEL[m] || m}</option>`).join(\"\")}\n        </select>\n        <details style=\"margin-top:6px;\">\n          <summary class=\"hint\" style=\"cursor:pointer;\">상세 설정(scale/pan/easing)</summary>\n          <div style=\"display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;\">\n            <div><label style=\"margin:0;\">시작 배율</label><input type=\"number\" step=\"0.01\" data-motion-f=\"startScale\" value=\"${cut.motion.startScale}\" style=\"width:76px;\" /></div>\n            <div><label style=\"margin:0;\">끝 배율</label><input type=\"number\" step=\"0.01\" data-motion-f=\"endScale\" value=\"${cut.motion.endScale}\" style=\"width:76px;\" /></div>\n            <div><label style=\"margin:0;\">Pan X</label><input type=\"number\" step=\"0.01\" data-motion-f=\"panX\" value=\"${cut.motion.panX}\" style=\"width:76px;\" /></div>\n            <div><label style=\"margin:0;\">Pan Y</label><input type=\"number\" step=\"0.01\" data-motion-f=\"panY\" value=\"${cut.motion.panY}\" style=\"width:76px;\" /></div>\n            <div><label style=\"margin:0;\">Easing</label><input type=\"text\" data-motion-f=\"easing\" value=\"${escapeHtml(cut.motion.easing || \"\")}\" style=\"width:96px;\" /></div>\n          </div>\n        </details>\n      </div>\n    `);\n    box.querySelector(\"[data-motion-type]\").onchange = async (e) => {\n      applyMotionPreset(cut, e.target.value);\n      invalidateTimelineReview(ep);\n      invalidatePreviewReview(ep);\n      await ctx.save({ cuts });\n      refreshAfterEdit(cut);\n    };\n    box.querySelectorAll(\"[data-motion-f]\").forEach((input) => {\n      input.addEventListener(\"blur\", async () => {\n        const f = input.dataset.motionF;\n        cut.motion[f] = f === \"easing\" ? input.value : Number(input.value) || 0;\n        invalidateTimelineReview(ep);\n        invalidatePreviewReview(ep);\n        await ctx.save({ cuts });\n        renderReviewCard();\n      });\n    });\n    return box;\n  }\n\n  function transitionBlock(cut) {\n    const box = el(`\n      <div>\n        <label>Transition</label>\n        <select data-transition-type>\n          ${TRANSITION_TYPES.map((t) => `<option value=\"${t}\" ${t === cut.transition ? \"selected\" : \"\"}>${t}</option>`).join(\"\")}\n        </select>\n        <label>Transition 길이(초) — HARD_CUT은 항상 0</label>\n        <input type=\"number\" step=\"0.05\" min=\"0\" data-transition-duration value=\"${cut.transitionDuration ?? 0}\" ${cut.transition === \"HARD_CUT\" ? \"disabled\" : \"\"} />\n      </div>\n    `);\n    box.querySelector(\"[data-transition-type]\").onchange = async (e) => {\n      setCutTransition(cut, e.target.value, cut.transitionDuration);\n      invalidateTimelineReview(ep);\n      invalidatePreviewReview(ep);\n      await ctx.save({ cuts });\n      refreshAfterEdit(cut);\n    };\n    box.querySelector(\"[data-transition-duration]\").addEventListener(\"blur\", async (e) => {\n      setCutTransition(cut, cut.transition, e.target.value);\n      invalidateTimelineReview(ep);\n      invalidatePreviewReview(ep);\n      await ctx.save({ cuts });\n      renderReviewCard();\n    });\n    return box;\n  }\n\n  function subtitleBlock(cut) {\n    cut.subtitle = cut.subtitle || { dialogue: true, narration: true };\n    const box = el(`\n      <div>\n        <label>자막(Subtitle)</label>\n        <label style=\"display:flex;align-items:center;gap:6px;margin:6px 0;\">\n          <input type=\"checkbox\" data-sub=\"narration\" ${cut.subtitle.narration ? \"checked\" : \"\"} style=\"width:auto;\" /> 나레이션 자막\n        </label>\n        <label style=\"display:flex;align-items:center;gap:6px;margin:6px 0;\">\n          <input type=\"checkbox\" data-sub=\"dialogue\" ${cut.subtitle.dialogue ? \"checked\" : \"\"} style=\"width:auto;\" /> 대사 자막\n        </label>\n      </div>\n    `);\n    box.querySelectorAll(\"[data-sub]\").forEach((input) => {\n      input.addEventListener(\"change\", async () => {\n        cut.subtitle[input.dataset.sub] = input.checked;\n        invalidateTimelineReview(ep);\n        invalidatePreviewReview(ep);\n        await ctx.save({ cuts });\n        renderVisual();\n        renderReviewCard();\n      });\n    });\n    return box;\n  }\n\n  function bgmActionBlock(cut) {\n    const current = (ep.bgm && ep.bgm.cutActions && ep.bgm.cutActions[cut.id]) || \"continue\";\n    const box = el(`\n      <div>\n        <label>BGM 동작(이 CUT에서)</label>\n        <select data-bgm-action>\n          ${BGM_ACTIONS.map((a) => `<option value=\"${a}\" ${a === current ? \"selected\" : \"\"}>${BGM_ACTION_LABEL[a]}</option>`).join(\"\")}\n        </select>\n      </div>\n    `);\n    box.querySelector(\"[data-bgm-action]\").onchange = async (e) => {\n      ep.bgm = ep.bgm || { assetId: null, start: 0, end: null, volume: 1, cutActions: {} };\n      ep.bgm.cutActions = ep.bgm.cutActions || {};\n      ep.bgm.cutActions[cut.id] = e.target.value;\n      invalidateTimelineReview(ep);\n      invalidatePreviewReview(ep);\n      await ctx.save({ bgm: ep.bgm });\n      renderReviewCard();\n    };\n    return box;\n  }\n\n  function eventPositionRow(cut, evt) {\n    const label = eventLabel(evt);\n    const row = el(`\n      <div class=\"tl-event-row\">\n        <div class=\"cut-image-title\" style=\"margin-bottom:4px;\">${escapeHtml(label)}</div>\n        <div style=\"display:flex;gap:14px;flex-wrap:wrap;\">\n          <div>\n            <label style=\"margin:0 0 4px;\">시작(초)</label>\n            ${quickNumberField({ value: evt.start ?? 0, dataAttr: \"data-evt-start\" })}\n          </div>\n          <div>\n            <label style=\"margin:0 0 4px;\">길이(초)${evt.sourceDuration != null ? ` · 원본 실측 ${fmtSec(evt.sourceDuration)}` : \"\"}</label>\n            ${quickNumberField({ value: evt.duration, dataAttr: \"data-evt-duration\" })}\n          </div>\n        </div>\n      </div>\n    `);\n    // rc.4(코드 리뷰 후속 수정) — 이 행은 대사/SFX audioEvent의 시작/길이를 편집한다(master\n    // 모드의 비활성 narration은 이미 이 목록 자체에서 제외됨). recalcMeasuredDuration(cut)을\n    // 직접 부르면 master_narration 모드에서도 CUT duration이 audioEvent 길이 기준으로\n    // 덮어써져 마커 기반 duration이 깨진다 — cutAudioStep.js와 동일한 원칙으로 mode-aware\n    // 진입점인 recalcAudioModeDurations(ep) 하나만 호출한다.\n    wireQuickNumberField(row.querySelector(\"[data-evt-start]\").closest(\".tl-qn\"), async (v) => {\n      evt.start = v ?? 0;\n      recalcAudioModeDurations(ep);\n      invalidateTimelineReview(ep);\n      invalidatePreviewReview(ep);\n      await ctx.save({ cuts });\n      refreshAfterEdit(cut);\n    });\n    wireQuickNumberField(row.querySelector(\"[data-evt-duration]\").closest(\".tl-qn\"), async (v) => {\n      evt.duration = v; // 수동 편집 — sourceDuration(원본 실측값)은 보존된다\n      recalcAudioModeDurations(ep);\n      invalidateTimelineReview(ep);\n      invalidatePreviewReview(ep);\n      await ctx.save({ cuts });\n      refreshAfterEdit(cut);\n    });\n    return row;\n  }\n\n  // ---------------------------------------------------------------------\n  // 검토 완료 카드\n  // ---------------------------------------------------------------------\n\n  function renderReviewCard() {\n    const mount = root.querySelector(\"#review-card-mount\");\n    if (!mount) return;\n    if (!cuts.length) {\n      mount.innerHTML = \"\";\n      return;\n    }\n    // local 편집(=ctx.reRender 없이 부분 갱신) 이후에도 정확해야 하므로, 진입 시 스냅샷이\n    // 아니라 매번 새로 계산한다 — 편집→invalidateTimelineReview()→여기 재호출이 항상 맞물린다.\n    const freshBlockerCount = getTimelineWarnings(ep).filter((w) => w.severity === \"blocker\").length;\n    mount.innerHTML = `<div class=\"card\"></div>`;\n    const card = mount.querySelector(\".card\");\n    if (freshBlockerCount > 0) {\n      card.innerHTML = `<h3>검토 완료</h3><p class=\"hint\">막힘 항목이 ${freshBlockerCount}건 있어요 — 먼저 해결해야 검토 완료를 표시할 수 있어요.</p>`;\n    } else if (ep.timelineReviewedAt) {\n      card.innerHTML = `<h3>검토 완료</h3><p class=\"hint\">✅ 검토 완료로 표시됨. 이후 CUT/오디오/타임라인 데이터를 바꾸면 다시 검토가 필요해요.</p>`;\n    } else {\n      card.innerHTML = `<h3>검토 완료</h3><p class=\"hint\">자동 계산만으로는 완료로 치지 않아요 — 흐름을 실제로 확인했다면 아래 버튼을 눌러주세요.</p>\n        <button class=\"btn\" id=\"mark-reviewed\" style=\"margin-top:8px;\">타임라인 검토 완료로 표시</button>`;\n      card.querySelector(\"#mark-reviewed\").onclick = async () => {\n        ep.timelineReviewedAt = Date.now();\n        await ctx.save({ timelineReviewedAt: ep.timelineReviewedAt });\n        toast(\"검토 완료로 표시했어요\");\n        ctx.reRender();\n      };\n    }\n  }\n\n  function refreshAfterEdit(cut) {\n    expandedIds.add(cut.id);\n    renderVisual();\n    renderCutList();\n    renderReviewCard();\n  }\n}\n\n// ---------------------------------------------------------------------------\n// 빠른 조정 숫자 입력 — [-0.5][-0.1] [숫자입력] [+0.1][+0.5]\n// ---------------------------------------------------------------------------\n\nfunction quickNumberField({ value, placeholder, dataAttr }) {\n  const attr = dataAttr ? ` ${dataAttr}` : \"\";\n  return `\n    <div class=\"tl-qn\"${attr}>\n      <button type=\"button\" class=\"btn ghost small\" data-qn-step=\"-0.5\">−0.5</button>\n      <button type=\"button\" class=\"btn ghost small\" data-qn-step=\"-0.1\">−0.1</button>\n      <input type=\"number\" step=\"0.1\" class=\"tl-qn-input\" value=\"${value ?? \"\"}\" placeholder=\"${placeholder || \"\"}\" />\n      <button type=\"button\" class=\"btn ghost small\" data-qn-step=\"0.1\">+0.1</button>\n      <button type=\"button\" class=\"btn ghost small\" data-qn-step=\"0.5\">+0.5</button>\n    </div>\n  `;\n}\n\nfunction wireQuickNumberField(box, onChange) {\n  if (!box) return;\n  const input = box.querySelector(\".tl-qn-input\");\n  const commit = () => {\n    const v = input.value === \"\" ? null : Number(input.value);\n    onChange(v);\n  };\n  input.addEventListener(\"blur\", commit);\n  box.querySelectorAll(\"[data-qn-step]\").forEach((btn) => {\n    btn.onclick = () => {\n      const delta = Number(btn.dataset.qnStep);\n      const current = input.value === \"\" ? 0 : Number(input.value);\n      const next = Math.max(0, Math.round((current + delta) * 100) / 100);\n      input.value = String(next);\n      commit();\n    };\n  });\n}\n\n// ---------------------------------------------------------------------------\n// 그 외 헬퍼\n// ---------------------------------------------------------------------------\n\nfunction eventLabel(evt) {\n  if (evt.type === \"narration\") return \"나레이션\";\n  if (evt.type === \"dialogue\") return evt.speaker ? `${evt.speaker} \"${truncate(evt.text, 16)}\"` : `대사 \"${truncate(evt.text, 16)}\"`;\n  if (evt.type === \"sfx\") return `SFX ${evt.name || \"(이름 없음)\"}`;\n  if (evt.type === \"silence\") return \"정적\";\n  return evt.type;\n}\n\nfunction cutSummaryLine(cut) {\n  const info = { manual: cut.duration?.manual, measured: cut.duration?.measured, estimated: cut.duration?.estimated };\n  const resolved = info.manual ?? info.measured ?? info.estimated;\n  const durText = resolved != null ? `${fmtSec(resolved)}` : \"미정\";\n  const motionLabel = MOTION_LABEL[cut.motion?.type] || cut.motion?.type || \"STATIC\";\n  return `${durText} · ${motionLabel} · ${cut.transition || \"HARD_CUT\"}`;\n}\n\nfunction fmtSec(n) {\n  return `${Math.round(n * 10) / 10}초`;\n}\n\nfunction truncate(s, n) {\n  const t = String(s || \"\").trim();\n  return t.length > n ? t.slice(0, n) + \"…\" : t;\n}\n\nfunction priorityLabel(p) {\n  return { blocker: \"필수·막힘\", required: \"필수\", recommended: \"권장\", optional: \"선택\" }[p] || p;\n}\n","js_v420a12/renderSemantics.js":"// V3 Alpha 3 — Preview와 Renderer가 공유하는 시각 의미 계산.\n// CSS Preview와 Canvas Renderer가 서로 다른 수식을 갖지 않도록 motion/transition을 순수 함수로 고정한다.\n\nexport function clamp01(v) { return Math.max(0, Math.min(1, Number(v) || 0)); }\n\nexport function easeProgress(t, name = \"linear\") {\n  t = clamp01(t);\n  if (name === \"ease-in\") return t * t;\n  if (name === \"ease-out\") return 1 - (1 - t) * (1 - t);\n  if (name === \"ease-in-out\") return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;\n  return t;\n}\n\nexport function motionState(motion = {}, localTime = 0, duration = 0) {\n  const beats = Array.isArray(motion.visualBeats) ? motion.visualBeats : [];\n  if (motion.type === \"AUTO_BEATS\" && beats.length) {\n    const t = Math.max(0, Number(localTime) || 0);\n    let beat = beats.find((b, i) => t >= Number(b.start || 0) && (t < Number(b.start || 0) + Number(b.duration || 0) || i === beats.length - 1));\n    if (!beat) beat = beats[beats.length - 1];\n    const bt = Math.max(0, t - Number(beat.start || 0));\n    const bd = Math.max(0.001, Number(beat.duration || 0));\n    const p = easeProgress(clamp01(bt / bd), beat.easing || \"ease-in-out\");\n    const startScale = Number(beat.startScale ?? 1);\n    const endScale = Number(beat.endScale ?? startScale);\n    const startPanX = Number(beat.startPanX ?? 0);\n    const endPanX = Number(beat.endPanX ?? startPanX);\n    const startPanY = Number(beat.startPanY ?? 0);\n    const endPanY = Number(beat.endPanY ?? startPanY);\n    return {\n      progress: p,\n      scale: startScale + (endScale - startScale) * p,\n      panX: startPanX + (endPanX - startPanX) * p,\n      panY: startPanY + (endPanY - startPanY) * p,\n      beatLabel: beat.label || \"\",\n    };\n  }\n\n  const p0 = duration > 0 ? clamp01(localTime / duration) : 0;\n  const p = easeProgress(p0, motion.easing || \"linear\");\n  const startScale = Number(motion.startScale ?? 1);\n  const endScale = Number(motion.endScale ?? 1);\n  return {\n    progress: p,\n    scale: startScale + (endScale - startScale) * p,\n    panX: Number(motion.panX || 0) * p,\n    panY: Number(motion.panY || 0) * p,\n  };\n}\n\n// transition progress와 합성 alpha를 한 곳에서 정의한다.\n// FADE는 current -> black -> next, DISSOLVE는 current 위에 next를 올린다.\nexport function transitionState(type = \"HARD_CUT\", localTime = 0, cutDuration = 0, transitionDuration = 0, hasNext = true) {\n  const dur = Math.max(0, Math.min(Number(transitionDuration || 0), Number(cutDuration || 0)));\n  const active = !!hasNext && dur > 0 && type !== \"HARD_CUT\" && localTime >= cutDuration - dur;\n  if (!active) return { active:false, progress:0, nextAlpha:0, blackAlpha:0 };\n  const progress = clamp01((localTime - (cutDuration - dur)) / dur);\n  if (type === \"DISSOLVE\") return { active:true, progress, nextAlpha:progress, blackAlpha:0 };\n  if (type === \"FADE\") {\n    if (progress < 0.5) return { active:true, progress, nextAlpha:0, blackAlpha:progress / 0.5 };\n    const q = (progress - 0.5) / 0.5;\n    return { active:true, progress, nextAlpha:q, blackAlpha:1 - q };\n  }\n  return { active:false, progress:0, nextAlpha:0, blackAlpha:0 };\n}\n","js_v420a12/captions.js":"// V4 Beta 22 — shared caption pagination for Preview + final Canvas Renderer.\n// Pages are balanced so the last page never becomes a tiny orphan such as “습니다.”.\n// Long Korean narration is paged before rendering; Preview must never hide overflow.\n\nfunction fontPxFromContext(ctx) {\n  const m = /(?:^|\\s)(\\d+(?:\\.\\d+)?)px(?:\\s|\\/)/.exec(String(ctx?.font || \"\"));\n  return m ? Number(m[1]) : 16;\n}\n\nfunction isWideCjk(ch) {\n  return /[\\u1100-\\u11ff\\u2e80-\\u9fff\\uac00-\\ud7af\\uff01-\\uff60]/u.test(ch);\n}\n\nfunction charAdvance(ctx, ch, fontPx) {\n  const measured = Number(ctx.measureText(ch).width || 0);\n  // Android/Canvas may temporarily measure Korean with a fallback font that is\n  // either too narrow OR much too wide versus the DOM/final renderer. Beta19 only\n  // guarded the narrow side, which could make a 100% caption width behave like\n  // ~60–70% on some Samsung devices. Keep CJK advance in a realistic 0.82–1.02em\n  // band so “100%” actually uses almost the full video width without overflowing.\n  if (isWideCjk(ch)) return Math.min(Math.max(measured, fontPx * 0.82), fontPx * 1.02);\n  if (/\\s/u.test(ch)) return Math.max(measured, fontPx * 0.28);\n  return Math.max(measured, fontPx * 0.22);\n}\n\nexport function wrapCaptionLines(ctx, text, maxWidth) {\n  const src = String(text || \"\").replace(/\\s+/g, \" \").trim();\n  if (!src) return [];\n  const fontPx = fontPxFromContext(ctx);\n  const safeWidth = Math.max(1, Number(maxWidth || 1) * 0.97); // stroke/rounding margin\n  const lines = [];\n  let line = \"\";\n  let lineWidth = 0;\n  for (const ch of Array.from(src)) {\n    const adv = charAdvance(ctx, ch, fontPx);\n    if (line && lineWidth + adv > safeWidth) {\n      lines.push(line.trim());\n      line = ch === \" \" ? \"\" : ch;\n      lineWidth = ch === \" \" ? 0 : adv;\n    } else {\n      line += ch;\n      lineWidth += adv;\n    }\n  }\n  if (line.trim()) lines.push(line.trim());\n  return lines;\n}\n\nexport function buildCaptionPages(ctx, text, style = {}, width = 1080) {\n  const maxLines = Math.max(1, Number(style.maxLines || 2));\n  const maxWidth = width * Number(style.maxWidthPct || 72) / 100;\n  const lines = wrapCaptionLines(ctx, text, maxWidth);\n  if (!lines.length) return [];\n  // Use the minimum page count needed for maxLines, then distribute wrapped\n  // lines as evenly as possible across those pages. Example: 4 lines with\n  // maxLines=3 becomes 2+2 instead of 3+1. This prevents a final orphan line\n  // (e.g. only “습니다.”) from occupying half of a CUT's display time.\n  const pageCount = Math.max(1, Math.ceil(lines.length / maxLines));\n  const base = Math.floor(lines.length / pageCount);\n  const extra = lines.length % pageCount;\n  const pages = [];\n  let cursor = 0;\n  for (let page = 0; page < pageCount; page++) {\n    const size = base + (page < extra ? 1 : 0);\n    pages.push(lines.slice(cursor, cursor + size).join(\"\\n\"));\n    cursor += size;\n  }\n  return pages;\n}\n\nexport function captionPageAtTime(ctx, text, start, end, t, style = {}, width = 1080) {\n  const pages = buildCaptionPages(ctx, text, style, width);\n  if (!pages.length) return { text: \"\", pageIndex: 0, pageCount: 0 };\n  if (pages.length === 1) return { text: pages[0], pageIndex: 0, pageCount: 1 };\n  const dur = Math.max(0.001, Number(end || 0) - Number(start || 0));\n  const progress = Math.min(0.999999, Math.max(0, (Number(t || 0) - Number(start || 0)) / dur));\n  const pageIndex = Math.min(pages.length - 1, Math.floor(progress * pages.length));\n  return { text: pages[pageIndex], pageIndex, pageCount: pages.length };\n}\n","js_v420a12/views/previewStep.js":"// STEP ⑥ 미리보기 / QC — Timeline이 정의한 \"언제 무엇이 일어나는가\"를 실제 시간 흐름으로\n// 재생해보고, \"이대로 영상을 만들어도 되는가?\"를 판단하는 화면.\n//\n// 원칙(매우 중요):\n// - 이 화면은 Story/Image/Audio/Timeline이 이미 만든 episode.cuts(motion/transition/duration/\n//   audioEvents/subtitle) / episode.bgm을 그대로 재생할 뿐이다. Preview 전용 duration/motion/\n//   audio 값을 새로 만들지 않는다(Single Source of Truth) — Timeline에서 보이는 길이와\n//   Preview에서 재생되는 길이가 반드시 같다.\n// - 시간 계산(전역 시작/전체 길이/활성 CUT/BGM 볼륨 envelope)은 전부 timeline.js(순수 함수)에\n//   위임한다 — 이 파일에 독자적인 시간 계산 로직을 두지 않는다.\n// - 자막 텍스트의 원본은 audioEvent가 아니라 Story 레이어(cut.narration / dialogueLines.text)다\n//   — audioEvent는 타이밍(시작/길이)만 갖고 있을 뿐, 표시 문구는 항상 원본에서 읽는다.\n// - Pixel-perfect FFmpeg 재현이 목표가 아니다 — CUT 시작/종료, 전체 길이, 모션 방향/속도 체감,\n//   전환 종류/길이, 음성/SFX/BGM 시작, 자막 표시를 사람이 판단할 수 있을 정도로 재현하면 된다.\n\nimport { buildTimeline, getEpisodeDuration, getActiveCutIndex, getCutGlobalRange, getBgmEnvelopeVolume, describeCutDuration } from \"../timeline.js\";\nimport { getQcResults, summarizeQc, QC_SEVERITY } from \"../qc.js\";\nimport { getNextActions } from \"../nextActions.js\";\nimport { getAssetObjectUrl .pageCount-a.pageCount || b.text.length-a.text.length)[0] || {cutIndex:0,text:\"자막 샘플\",pageCount:1,pages:[\"자막 샘플\"],longestPage:\"자막 샘플\"};\n  return { texts, measured, split, worst, fontPx };\n}\n\nexport async function render(root, ep, ctx) {\n  const cuts = ep.cuts || [];\n  const timeline = buildTimeline(ep);\n  const totalDuration = getEpisodeDuration(ep);\n  const nextActions = getNextActions(ep).filter((a) => a.step === \"preview\");\n\n  const initialQcSummary = summarizeQc(getQcResults(ep));\n\n  root.innerHTML = `\n    <div class=\"card\">\n      <h3>미리보기 / QC</h3>\n      <p class=\"hint\"><strong>전체 영상 길이</strong> — ${fmtClock(totalDuration)} · CUT ${cuts.length}개</p>\n      <p class=\"hint\">기본 제작에서는 영상을 한 번 확인하고 QC의 ERROR만 없으면 최종 제작 단계로 넘어가면 됩니다.</p>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;\">\n        <div class=\"qc-item qc-error\" style=\"text-align:center;\"><strong>ERROR</strong><br>${initialQcSummary.errorCount}</div>\n        <div class=\"qc-item qc-warning\" style=\"text-align:center;\"><strong>WARNING</strong><br>${initialQcSummary.warningCount}</div>\n        <div class=\"qc-item qc-info\" style=\"text-align:center;\"><strong>INFO</strong><br>${initialQcSummary.infoCount}</div>\n      </div>\n      ${nextActions.length ? `<p class=\"hint\" style=\"margin-top:10px;\">남은 작업 ${nextActions.length}건 · ERROR가 있으면 아래 상세 QC에서 해당 CUT으로 바로 이동할 수 있어요.</p>` : `<p class=\"hint\" style=\"margin-top:10px;\">QC상 막히는 작업이 없습니다.</p>`}\n    </div>\n\n    <div class=\"card\" id=\"pv-empty\" style=\"display:${cuts.length ? \"none\" : \"\"};\">\n      <div class=\"empty-state\">아직 CUT이 없어요. V4 Story Writer에서 먼저 에피소드를 생성해주세요.</div>\n    </div>\n\n    <div class=\"card\" id=\"pv-player-card\" style=\"display:${cuts.length ? \"\" : \"none\"};\">\n      <div class=\"preview-canvas-wrap\">\n        <div class=\"preview-canvas\" id=\"pv-canvas\">\n          <img class=\"preview-img\" id=\"preview-img-a\" alt=\"\" />\n
