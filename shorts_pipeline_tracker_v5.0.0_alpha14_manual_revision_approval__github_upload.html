.length\n          ? `<b>이미지 ${attached}/${cuts.length} 첨부 완료</b> · 다음 단계로 이동할 수 있습니다.`\n          : `<b>이미지 제작 진행 ${attached}/${cuts.length}</b> · 복사할 미첨부 프롬프트가 없습니다.`;\n    }\n    if (btn) btn.disabled = nextIndex < 0;\n    if (attachBtn) attachBtn.disabled = nextIndex < 0;\n    if (audioBtn) audioBtn.style.display = attached === cuts.length && cuts.length ? \"flex\" : \"none\";\n  }\n\n  const nextPromptBtn = root.querySelector(\"#copy-next-missing-prompt\");\n  if (nextPromptBtn) nextPromptBtn.onclick = async () => {\n    const index = nextMissingPromptIndex();\n    if (index < 0) return;\n    await copyText(promptText(cuts[index], index));\n    toast(`CUT ${index + 1} 스타일+글로벌+개별 완성 프롬프트를 복사했어요 · 한 장씩 등록할 때는 파일명 변경이 필요 없어요`);\n    const card = root.querySelector(`[data-cut-image-index=\"${index}\"]`);\n    if (card) card.scrollIntoView({ behavior: \"smooth\", block: \"center\" });\n  };\n\n  const nextImageBtn = root.querySelector(\"#attach-next-missing-image\");\n  const nextImageInput = root.querySelector(\"#next-image-input\");\n  if (nextImageBtn && nextImageInput) {\n    nextImageBtn.onclick = () => {\n      const index = nextMissingPromptIndex();\n      if (index < 0) {\n        toast(\"이미지가 필요한 CUT이 없어요\");\n        return;\n      }\n      nextImageInput.value = \"\";\n      nextImageInput.click();\n    };\n    nextImageInput.onchange = async (e) => {\n      const file = e.target.files?.[0];\n      if (!file) return;\n      const index = nextMissingPromptIndex();\n      if (index < 0) return;\n      if (!confirmOversizedFile(file)) return;\n      try {\n        await attachImage(cuts[index], file);\n        const nextIndex = nextMissingPromptIndex();\n        toast(nextIndex >= 0\n          ? `CUT ${index + 1} 이미지 등록 완료 · 다음은 CUT ${nextIndex + 1}`\n          : `CUT ${index + 1} 이미지 등록 완료 · 모든 CUT 이미지가 첨부됐어요`);\n        await reRenderKeepingViewport();\n      } catch (err) {\n        toastAssetSaveError(err);\n      }\n    };\n  }\n\n  const generateNextBtn = root.querySelector(\"#generate-next-missing-image\");\n  if (generateNextBtn) {\n    generateNextBtn.onclick = async () => {\n      if (generationBusy) return;\n      const index = nextMissingPromptIndex();\n      if (index < 0) { toast(\"자동 생성할 CUT이 없어요\"); return; }\n      const cut = cuts[index];\n      setGenerationBusy(true, generateNextBtn, `CUT ${index + 1} 생성 중…`);\n      cut.image.status = \"생성중\";\n      try {\n        const result = await generateCutImage({\n          prompt:promptText(cut,index),\n          aspectRatio:\"9:16\",\n          imageSize:\"1K\",\n          cutIndex:index,\n        });\n        await attachGeneratedBlob(cut, result.blob, index, result.modelId);\n        toast(`CUT ${index + 1} Nano Banana 이미지 생성·등록 완료`);\n        await reRenderKeepingViewport();\n      } catch (err) {\n        cut.image.status = cut.image.assetId ? \"검수필요\" : \"미생성\";\n        setGenerationBusy(false, generateNextBtn);\n        showImageGenerationError(index + 1, err, () => generateNextBtn.click());\n      }\n    };\n  }\n\n  root.querySelectorAll(\"[data-generate], #generate-next-missing-image\").forEach((btn) => {\n    btn.dataset.baseDisabled = btn.disabled ? \"1\" : \"0\";\n  });\n\n  updateImageQueueStatus();\n\n  const allPromptText = buildPromptPack(cuts);\n  const copyAllBtn = root.querySelector(\"#copy-all-image-prompts\");\n  if (copyAllBtn) copyAllBtn.onclick = async () => {\n    await copyText(allPromptText);\n    toast(\"전체 스타일+글로벌+개별 완성 프롬프트를 복사했어요\");\n  };\n  const downloadPromptBtn = root.querySelector(\"#download-image-prompt-pack\");\n  if (downloadPromptBtn) downloadPromptBtn.onclick = () => {\n    downloadText(`image_prompts_${safeFilePart(ep.title || ep.id)}.txt`, allPromptText, \"text/plain;charset=utf-8\");\n    toast(\"이미지 프롬프트 묶음을 저장했어요\");\n  };\n\n  const batchInput = root.querySelector(\"#batch-input\");\n  batchInput.onchange = (e) => {\n    const files = Array.from(e.target.files);\n    pendingFiles = new Map(files.map((f) => [f.name, f]));\n    const result = matchFilesToCuts(files.map((f) => f.name), cuts.length);\n    applySequentialFallback(result);\n    renderBatchPreview(result);\n  };\n\n  // 스마트폰 갤러리/카메라 파일명(예: 1000051341.png)은 CUT 번호가 없어서\n  // 기존 cut01.png 규칙으로는 매칭할 수 없다. 이런 파일은 사람이 일일이 이름을\n  // 바꾸지 않아도 되도록, 명시적으로 인식된 CUT을 우선 보존한 뒤 남은 파일을\n  // 파일명 자연 정렬 순서대로 아직 비어 있는 CUT에 제안 매칭한다. 실제 저장은\n  // 기존과 동일하게 [매칭 확정]을 눌러야만 이루어진다.\n  function applySequentialFallback(result) {\n    if (!result?.unmatched?.length || !cuts.length) return;\n\n    const claimed = new Set((result.matches || []).map((m) => m.cutIndex));\n    const remaining = cuts\n      .map((cut, cutIndex) => ({ cut, cutIndex }))\n      .filter(({ cutIndex }) => !claimed.has(cutIndex))\n      // 새 이미지가 없는 CUT을 우선 채우고, 그래도 파일이 남으면 기존 이미지 CUT도 뒤에서 교체 후보가 된다.\n      .sort((a, b) => Number(!!a.cut.image?.assetId) - Number(!!b.cut.image?.assetId) || a.cutIndex - b.cutIndex);\n\n    const names = [...result.unmatched].sort((a, b) =>\n      String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: \"base\" })\n    );\n    const fallbackCount = Math.min(names.length, remaining.length);\n    if (!fallbackCount) return;\n\n    const used = new Set();\n    for (let i = 0; i < fallbackCount; i++) {\n      const fileName = names[i];\n      const cutIndex = remaining[i].cutIndex;\n      result.matches.push({\n        fileName,\n        cutNumber: cutIndex + 1,\n        cutIndex,\n        matchMode: \"sequential-fallback\"\n      });\n      used.add(fileName);\n    }\n    result.matches.sort((a, b) => a.cutNumber - b.cutNumber);\n    result.unmatched = result.unmatched.filter((name) => !used.has(name));\n    result.usedSequentialFallback = true;\n  }\n\n  await renderCutImageList();\n\n  // ---------------------------------------------------------------------\n\n  function safeFilePart(value) {\n    return String(value || \"episode\").trim().replace(/[\\\\/:*?\"<>|]+/g, \"_\").replace(/\\s+/g, \"_\").slice(0, 60) || \"episode\";\n  }\n\n  function seamlessLoopPromptGuard(cut, index) {\n    const cuts = ep.cuts || [];\n    if (!cuts.length) return \"\";\n    const plan = ep.automationPlan?.seamlessLoop;\n    const requiredEconomyShorts = ep.channelKey === \"economy_current\" && (ep.contentFormat || \"shorts\") === \"shorts\";\n    const enabled = requiredEconomyShorts || plan?.enabled !== false;\n    if (!enabled) return \"\";\n\n    const first = index === 0;\n    const last = index === cuts.length - 1;\n    if (!first && !last) return \"\";\n\n    const lines = [\"[V5 SEAMLESS LOOP GUARD — Tracker 자동 적용]\"];\n    if (first) {\n      lines.push(\n        \"- 이 CUT은 마지막 CUT과 하나의 루프 쌍이다.\",\n        \"- 마지막 CUT의 공간·배경·캐릭터 배치와 자연스럽게 이어지는 시작 구도를 만든다.\",\n        \"- 시작인지 끝인지 순간적으로 헷갈릴 정도로 연결감은 주되, 완전 복제처럼 보이지 않게 카메라 거리/시선을 조금 다르게 한다.\",\n        \"- 연결 대사를 그대로 자막처럼 이미지에 넣지 않는다.\"\n      );\n    }\n    if (last) {\n      lines.push(\n        \"- 이 CUT은 첫 CUT로 다시 이어지는 루프 마감 장면이다.\",\n        \"- 첫 CUT과 같은 공간/세계관/주요 캐릭터 방향을 유지한다.\",\n        \"- 마지막 프레임이 첫 CUT 첫 프레임으로 넘어갈 때 갑작스러운 공간 점프가 느껴지지 않게 한다.\",\n        \"- CTA를 넣더라도 첫 CUT의 시작 훅과 연결 가능한 동작/시선/대기 상황을 남긴다.\"\n      );\n    }\n    return lines.join(\"\\\\n\");\n  }\n\n  function economyAutoPromptGuard(cut, index) {\n    if (!isEconomyEpisode) return \"\";\n    const meta = `${String(cut?.situation || \"\")} ${String(cut?.directorNote || \"\")} ${String(cut?.purpose || \"\")}`.toLowerCase();\n    const isTransition = /scene\\s*:\\s*transition|scenetype\\s*:\\s*transition|뭉게|하늘|전환/.test(meta);\n    const isImagination = /scene\\s*:\\s*imagination|scenetype\\s*:\\s*imagination|상상|설명/.test(meta) && !isTransition;\n    const isEnding = /reality_ending|reality_cta|줄 서|구독|좋아요|대기줄/.test(meta);\n    const isReality = !isTransition && !isImagination;\n    const lines = [\"[ECONOMY AUTO SCENE GUARD — Tracker 자동 적용]\"];\n    if (isTransition) {\n      lines.push(\n        \"- 현실형 그루와 방문자의 공식 Reference를 우선하고, 둘의 현실 성인 비율을 유지한다.\",\n        \"- 그루의 으음~ → 하늘 응시 → 오른손 검지 → 방문자가 시선을 따라봄 → 몽글몽글한 구름이 확대되어 상단과 화면 가장자리를 덮는 흐름을 명확히 만든다.\",\n        \"- 구름은 단순한 작은 생각구름 점선이 아니라 다음 SD 상상세계로 화면을 연결하는 billowing fluffy cloud transition이어야 한다.\"\n      );\n    } else if (isImagination) {\n      lines.push(\n        \"- 공식 SD 그루 전면 Reference + 이번 상담객 SD 전면 Reference를 기본으로 함께 사용한다. 각도/포즈 시트는 필요한 경우에만 보조로 사용한다.\",\n        \"- 핵심 경제 장치/비유는 1개만 크게 사용한다. 여러 계산기·저울·그래프·표·블록을 동시에 넣지 않는다.\",\n        \"- 원인 행동 → 핵심 장치 변화 → 상담객의 결과/반응이 한 장면에서 순서 없이도 즉시 읽혀야 한다.\",\n        \"- 그루는 변화의 원인을 직접 조작/지시하고, 상담객은 그 결과를 직접 겪거나 확인한다. 역할이 겹치거나 모호하면 실패다.\",\n        \"- 구름을 바닥·전경·화면 가장자리·일부 배경에 배치해 상상세계임을 분명히 하되 핵심 장치를 가리지 않는다.\",\n        \"- 이미지 내부에 한글/영어/숫자/%/UI/표지판뿐 아니라 깨진 글자·가짜 라벨·의미 없는 문자 형태도 만들지 않는다. 소품은 무문자 형태를 우선한다.\",\n        \"- 모바일 시각 우선순위는 핵심 장치 1개 > 원인 행동 캐릭터 > 결과를 겪는 캐릭터. 배경 장식은 최소화한다.\"\n      );\n    } else if (isEnding) {\n      lines.push(\n        \"- 현실의 나무 그루터기 공간을 유지한다. 상담객은 상담을 끝내고 떠나며 대기줄에 다시 섞이지 않는다.\",\n        \"- 대기줄의 HEAD는 반드시 그루 쪽이고 줄은 그루 뒤쪽으로 이어진다. 군중 과밀 금지.\",\n        \"- CTA 마지막 장면은 그루가 입가에 손을 살짝 모아 비밀말처럼 말하는 장난스러운 반미소를 유지한다.\"\n      );\n    } else if (isReality) {\n      lines.push(\n        \"- 공식 현실형 그루 Reference + 이번 상담객 현실형 Reference를 우선한다.\",\n        \"- 그루는 나무 그루터기에 앉아 상담한다. 책상/사무실/은행 창구로 바꾸지 않는다.\",\n        \"- 성인 방문자는 그루와 정상적인 성인 체격으로 표현한다. 그루가 앉고 방문자가 서 있으면 방문자의 머리가 자연스럽게 더 높게 온다.\"\n      );\n    }\n    return lines.join(\"\\n\");\n  }\n\n  function promptText(cut, index) {\n    const n = index + 1;\n    const prompt = String(cut.productionPrompt || \"\").trim();\n    const loopGuard = seamlessLoopPromptGuard(cut, index);\n    const autoGuard = economyAutoPromptGuard(cut, index);\n    const cutPrompt = [loopGuard, autoGuard, prompt].filter(Boolean).join(\"\\n\\n\");\n    const merged = mergeVisualPrompt(channelStyleBible, ep.globalVisualBible, cutPrompt, index);\n    return [\n      `CUT ${String(n).padStart(2, \"0\")}`,\n      `권장 파일명: cut${String(n).padStart(2, \"0\")}.png`,\n      \"\",\n      merged\n    ].join(\"\\n\");\n  }\n\n  function buildPromptPack(items) {\n    return items\n      .map((cut, index) => promptText(cut, index))\n      .filter((block) => !block.endsWith(\"(이미지 프롬프트 없음)\"))\n      .join(\"\\n\\n--------------------\\n\\n\");\n  }\n\n  function renderBatchPreview(result) {\n    const box = root.querySelector(\"#batch-preview\");\n    const nothing = !result.matches.length && !result.unmatched.length && !result.duplicates.length && !result.outOfRange.length;\n    if (nothing) {\n      box.innerHTML = \"\";\n      return;\n    }\n    box.innerHTML = `\n      <div class=\"card\" style=\"margin-top:10px;\">\n        <h3>매칭 미리보기</h3>\n        ${\n          result.usedSequentialFallback\n            ? `<p class=\"hint\" style=\"color:var(--accent);\"><b>자동 순서 매칭 사용</b> · 갤러리 파일명에 CUT 번호가 없어 파일명 숫자/이름 오름차순으로 남은 CUT에 연결을 제안했어요. 아래 순서를 확인한 뒤 [매칭 확정]을 눌러주세요.</p>`\n            : \"\"\n        }\n        ${\n          result.matches.length\n            ? `<p class=\"hint\">매칭됨 (${result.matches.length}개)</p>\n               <table class=\"dur-table\"><tbody>\n                 ${result.matches\n                   .map(\n                     (m) =>\n                       `<tr><td>${escapeHtml(m.fileName)}${m.matchMode === \"sequential-fallback\" ? ' <span class=\"pill-inline\">순서매칭</span>' : \"\"}</td><td class=\"num\">→ CUT ${m.cutNumber}${\n                         cuts[m.cutIndex]?.image?.assetId ? \" (기존 이미지를 교체해요)\" : \"\"\n                       }</td></tr>`\n                   )\n                   .join(\"\")}\n               </tbody></table>`\n            : `<p class=\"hint\">확정 가능한 매칭이 없어요.</p>`\n        }\n        ${\n          result.duplicates.length\n            ? `<p class=\"hint\" style=\"color:var(--danger);\">같은 CUT 번호로 인식된 파일이 여러 개예요 — 하나만 남기고 다시 선택해주세요: ${result.duplicates\n                .map((d) => `CUT ${d.cutNumber}(${d.fileNames.map(escapeHtml).join(\", \")})`)\n                .join(\" / \")}</p>`\n            : \"\"\n        }\n        ${\n          result.outOfRange.length\n            ? `<p class=\"hint\" style=\"color:var(--danger);\">존재하지 않는 CUT 번호예요: ${result.outOfRange\n                .map((o) => `${escapeHtml(o.fileName)}→CUT ${o.cutNumber}`)\n                .join(\", \")}</p>`\n            : \"\"\n        }\n        ${\n          result.unmatched.length\n            ? `<p class=\"hint\">파일명을 인식하지 못했어요(수동으로 등록해주세요): ${result.unmatched.map(escapeHtml).join(\", \")}</p>`\n            : \"\"\n        }\n        <button class=\"btn\" id=\"confirm-batch\" style=\"margin-top:8px;\" ${result.matches.length ? \"\" : \"disabled\"}>\n          매칭 확정 (${result.matches.length}개 연결)\n        </button>\n      </div>\n    `;\n    const btn = box.querySelector(\"#confirm-batch\");\n    if (btn) {\n      btn.onclick = async () => {\n        // 파일마다 confirm()을 띄우면 배치 확정이 팝업 폭탄이 된다 — 50MB 초과 파일이\n        // 있으면 한 번만 물어보고, 계속하면 전부 그대로 진행한다(50MB는 이미지/오디오\n        // 공통 기준 — db.isOversizedAsset 하나만 참조).\n        const oversized = result.matches\n          .map((m) => pendingFiles?.get(m.fileName))\n          .filter((f) => f && isOversizedAsset(f));\n        if (oversized.length) {\n          const proceed = confirm(\n            `${oversized.length}개 파일이 50MB를 초과합니다.\\n기기 저장공간과 백업 크기가 커질 수 있습니다.\\n그래도 전부 첨부하시겠습니까?`\n          );\n          if (!proceed) return;\n        }\n        let failCount = 0;\n        for (const m of result.matches) {\n          const cut = cuts[m.cutIndex];\n          const file = pendingFiles?.get(m.fileName);\n          if (!cut || !file) continue;\n          try {\n            await attachImage(cut, file);\n          } catch (err) {\n            failCount++;\n            toastAssetSaveError(err);\n          }\n        }\n        if (failCount === 0) toast(`${result.matches.length}개 CUT에 이미지를 연결했어요`);\n        else toast(`${result.matches.length - failCount}개 연결, ${failCount}개 실패`);\n        pendingFiles = null;\n        await reRenderKeepingViewport();\n      };\n    }\n  }\n\n  async function attachImage(cut, file) {\n    const oldAssetId = cut.image.assetId;\n    if (oldAssetId) {\n      await deleteAssetSafely(oldAssetId, ep.id); // 참조무결성 삭제 — Phase 1 구조 그대로 재사용\n      forgetAssetObjectUrl(oldAssetId);\n    }\n    const asset = await putAsset({ episodeId: ep.id, kind: \"image\", role: `cut_${cut.id}_image`, blob: file, originalFileName: file.name });\n    cut.image.assetId = asset.id;\n    cut.image.status = \"검수필요\"; // 첫 첨부/교체 모두 검수필요로 되돌린다\n    cut.image.qcNote = \"\";\n    cut.image.retryReason = \"\";\n    invalidatePreviewReview(ep); // Preview 화면에 실제로 보이는 이미지가 바뀌었다 — 재검토 필요\n    await ctx.save({ cuts });\n    updateImageQueueStatus();\n  }\n\n  async function attachGeneratedBlob(cut, blob, index, modelId) {\n    const oldAssetId = cut.image.assetId;\n    if (oldAssetId) {\n      await deleteAssetSafely(oldAssetId, ep.id);\n      forgetAssetObjectUrl(oldAssetId);\n    }\n    const ext = blob.type === \"image/jpeg\" ? \"jpg\" : \"png\";\n    const asset = await putAsset({\n      episodeId: ep.id,\n      kind: \"image\",\n      role: `cut_${cut.id}_image`,\n      blob,\n      originalFileName: `cut${String(index + 1).padStart(2, \"0\")}_nano_banana.${ext}`,\n    });\n    cut.image.assetId = asset.id;\n    cut.image.status = \"검수필요\";\n    cut.image.generator = \"Gemini\";\n    cut.image.qcNote = \"\";\n    cut.image.retryReason = \"\";\n    cut.image.generationMeta = { provider:\"gemini\", modelId:modelId || \"gemini-3.1-flash-image\", generatedAt:Date.now() };\n    invalidatePreviewReview(ep);\n    await ctx.save({ cuts });\n    updateImageQueueStatus();\n  }\n\n  async function deleteImage(cut) {\n    if (!cut.image.assetId) return;\n    await deleteAssetSafely(cut.image.assetId, ep.id);\n    forgetAssetObjectUrl(cut.image.assetId);\n    cut.image.assetId = null;\n    cut.image.status = \"미생성\";\n    cut.image.qcNote = \"\";\n    cut.image.retryReason = \"\";\n    invalidatePreviewReview(ep);\n    await ctx.save({ cuts });\n    updateImageQueueStatus();\n  }\n\n  async function renderCutImageList() {\n    const list = root.querySelector(\"#cut-image-list\");\n    list.innerHTML = \"\";\n    if (!cuts.length) {\n      list.appendChild(el(`<div class=\"empty-state\">아직 CUT이 없어요.<br/>V4 Story Writer에서 에피소드를 생성하거나 고급 CUT 편집에서 CUT을 추가해주세요.</div>`));\n      return;\n    }\n    for (let i = 0; i < cuts.length; i++) {\n      list.appendChild(await cutImageRow(cuts[i], i));\n    }\n  }\n\n  async function cutImageRow(cut, i) {\n    const n = i + 1;\n    const url = cut.image.assetId ? await getAssetObjectUrl(cut.image.assetId) : null;\n    const hasImage = !!cut.image.assetId;\n    const videoUrl = cut.video?.assetId ? await getAssetObjectUrl(cut.video.assetId) : null;\n    const hasVideo = !!cut.video?.assetId;\n    const usingVideo = cut.mediaType === \"video\" && hasVideo;\n\n    const node = el(`\n      <div class=\"card cut-image-row\" data-cut-image-index=\"${i}\">\n        <div class=\"cut-image-flex\">\n          <div class=\"cut-image-thumb\">${usingVideo && videoUrl ? `<video src=\"${videoUrl}\" muted playsinline preload=\"metadata\" style=\"width:100%;height:100%;object-fit:cover;\"></video>` : url ? `<img src=\"${url}\" />` : `<span class=\"empty-label\">미디어 없음</span>`}</div>\n          <div class=\"cut-image-info\">\n            <div class=\"cut-image-title\">CUT ${n} <span class=\"pill-inline ${usingVideo ? \"status-pass\" : imageStatusClass(cut)}\">${usingVideo ? `Flow 영상 · ${Number(cut.video.duration || 0).toFixed(1)}초` : escapeHtml(hasImage ? cut.image.status : (String(cut.productionPrompt || \"\").trim() ? \"제작대기\" : \"미생성\"))}</span></div>\n            <div class=\"hint\" style=\"margin:4px 0 4px;\">${String(cut.productionPrompt || \"\").trim() ? \"✅ 스타일+글로벌+개별 완성 프롬프트 준비됨\" : \"⚠️ 이미지 프롬프트 없음\"}</div>\n            <div class=\"hint\" style=\"margin:0 0 8px;\">권장 파일명: <b>cut${String(n).padStart(2, \"0\")}.png</b></div>\n            <div class=\"btn-row\" style=\"flex-wrap:wrap;\">\n              <button class=\"btn secondary small\" data-copy-prompt ${String(cut.productionPrompt || \"\").trim() ? \"\" : \"disabled\"}>📋 완성 프롬프트 복사</button>\n              <button class=\"btn secondary small\" data-attach>${hasImage ? \"이미지 교체\" : \"이미지 첨부\"}</button>\n              <button class=\"btn secondary small\" data-generate ${imageProviderReady(loadImageProviderSettings()) && String(cut.productionPrompt || \"\").trim() ? \"\" : \"disabled\"}>🍌 자동 생성</button>\n              ${hasImage ? `<button class=\"btn danger small\" data-delete>이미지 삭제</button>` : \"\"}\n              <button class=\"btn secondary small\" data-video-attach>🎬 ${hasVideo ? \"Flow 영상 교체\" : \"Flow 영상 첨부\"}</button>\n              ${hasVideo ? `<button class=\"btn secondary small\" data-use-image>🖼 이미지로 사용</button><button class=\"btn danger small\" data-video-delete>영상 삭제</button>` : \"\"}\n            </div>\n            <div class=\"hint\" style=\"margin-top:6px;\">${usingVideo ? \"✅ 이 CUT은 Flow 영상을 우선 사용합니다. 원본 이미지는 fallback으로 보존됩니다.\" : hasVideo ? \"Flow 영상이 첨부되어 있지만 현재는 이미지를 사용 중입니다.\" : \"Flow MP4는 선택사항입니다. 없으면 기존 이미지 + Tracker 모션으로 렌더합니다.\"}</div>\n            <input type=\"file\" accept=\"image/*\" data-file-input style=\"display:none;\" />\n            <input type=\"file\" accept=\"video/mp4,video/*\" data-video-input style=\"display:none;\" />\n          </div>\n        </div>\n\n        ${\n          hasImage\n            ? `\n        <label style=\"margin-top:10px;\">생성 AI (generator)</label>\n        <select data-generator>\n          <option value=\"\">(미지정)</option>\n          ${IMAGE_GENERATORS.map((g) => `<option value=\"${g}\" ${cut.image.generator === g ? \"selected\" : \"\"}>${g}</option>`).join(\"\")}\n        </select>\n\n        <label>상태</label>\n        <div class=\"btn-row\" style=\"flex-wrap:wrap;\">\n          ${IMAGE_STATUS_SELECTABLE.map(\n            (s) => `<button type=\"button\" class=\"btn small ${cut.image.status === s ? \"\" : \"secondary\"}\" data-status=\"${s}\">${s}</button>`\n          ).join(\"\")}\n        </div>\n\n        <label>QC 메모</label>\n        <textarea data-qc rows=\"2\" placeholder=\"검수 메모(선택)\">${attr(cut.image.qcNote)}</textarea>\n\n        ${\n          cut.image.status === \"RETRY\"\n            ? `\n        <label>RETRY 이유</label>\n        <select data-retry-reason>\n          <option value=\"\">(선택 안함)</option>\n          ${RETRY_REASONS.map((r) => `<option value=\"${r}\" ${cut.image.retryReason === r ? \"selected\" : \"\"}>${r}</option>`).join(\"\")}\n        </select>\n        `\n            : \"\"\n        }\n        `\n            : \"\"\n        }\n      </div>\n    `);\n\n    const videoAttachBtn = node.querySelector(\"[data-video-attach]\");\n    const videoInput = node.querySelector(\"[data-video-input]\");\n    if (videoAttachBtn && videoInput) {\n      videoAttachBtn.onclick = () => videoInput.click();\n      videoInput.onchange = async () => {\n        const file = videoInput.files?.[0];\n        if (!file) return;\n        if (isOversizedAsset(file)) {\n          const ok = await confirmOversizedFile(file);\n          if (!ok) { videoInput.value = \"\"; return; }\n        }\n        try {\n          const oldId = cut.video?.assetId || null;\n          const duration = await probeVideoDuration(file);\n          const asset = await putAsset({ episodeId: ep.id, kind: \"video\", role: `cut_${cut.id}_video`, blob: file, originalFileName: file.name });\n          cut.video = { assetId: asset.id, duration, trimStart: 0, trimEnd: duration, mute: true };\n          cut.mediaType = \"video\";\n          if (oldId && oldId !== asset.id) { await deleteAssetSafely(oldId, ep.id); forgetAssetObjectUrl(oldId); }\n          invalidatePreviewReview(ep);\n          await ctx.save({ cuts });\n          toast(`CUT ${n} Flow 영상 등록 완료${duration ? ` · ${duration.toFixed(2)}초` : \"\"}`);\n          await renderCutImageList();\n        } catch (err) { toastAssetSaveError(err); } finally { videoInput.value = \"\"; }\n      };\n    }\n    const useImageBtn = node.querySelector(\"[data-use-image]\");\n    if (useImageBtn) useImageBtn.onclick = async () => { cut.mediaType = \"image\"; invalidatePreviewReview(ep); await ctx.save({ cuts }); await renderCutImageList(); };\n    const videoDeleteBtn = node.querySelector(\"[data-video-delete]\");\n    if (videoDeleteBtn) videoDeleteBtn.onclick = async () => {\n      const oldId = cut.video?.assetId;\n      if (oldId) { await deleteAssetSafely(oldId, ep.id); forgetAssetObjectUrl(oldId); }\n      cut.video = { assetId:null, duration:null, trimStart:0, trimEnd:null, mute:true };\n      cut.mediaType = \"image\";\n      invalidatePreviewReview(ep);\n      await ctx.save({ cuts });\n      toast(`CUT ${n} Flow 영상을 삭제했어요`);\n      await renderCutImageList();\n    };\n\n    const copyPromptBtn = node.querySelector(\"[data-copy-prompt]\");\n    if (copyPromptBtn) copyPromptBtn.onclick = async () => {\n      await copyText(promptText(cut, i));\n      toast(`CUT ${n} 스타일+글로벌+개별 완성 프롬프트를 복사했어요`);\n    };\n\n    const generateBtn = node.querySelector(\"[data-generate]\");\n    if (generateBtn) {\n      generateBtn.dataset.baseDisabled = generateBtn.disabled ? \"1\" : \"0\";\n      generateBtn.onclick = async () => {\n        if (generationBusy) return;\n        setGenerationBusy(true, generateBtn, \"생성 중…\");\n        try {\n          cut.image.status = \"생성중\";\n          const result = await generateCutImage({\n            prompt:promptText(cut,i),\n            aspectRatio:\"9:16\",\n            imageSize:\"1K\",\n            cutIndex:i,\n          });\n          await attachGeneratedBlob(cut, result.blob, i, result.modelId);\n          toast(`CUT ${n} Nano Banana 이미지 생성·등록 완료`);\n          await reRenderKeepingViewport();\n        } catch (err) {\n          cut.image.status = hasImage ? \"검수필요\" : \"미생성\";\n          setGenerationBusy(false, generateBtn);\n          showImageGenerationError(n, err, () => generateBtn.click());\n        }\n      };\n    }\n\n    const fileInput = node.querySelector(\"[data-file-input]\");\n    node.querySelector(\"[data-attach]\").onclick = () => fileInput.click();\n    fileInput.onchange = async (e) => {\n      const file = e.target.files[0];\n      if (!file) return;\n      if (!confirmOversizedFile(file)) return;\n      try {\n        await attachImage(cut, file);\n        toast(`CUT ${n} 이미지를 등록했어요`);\n        await reRenderKeepingViewport();\n      } catch (err) {\n        toastAssetSaveError(err);\n      }\n    };\n\n    const delBtn = node.querySelector(\"[data-delete]\");\n    if (delBtn) {\n      delBtn.onclick = async () => {\n        if (!confirm(`CUT ${n} 이미지를 삭제할까요?`)) return;\n        const viewportState = captureViewportState();\n        await deleteImage(cut);\n        toast(\"삭제했어요\");\n        await reRenderKeepingViewport(viewportState);\n      };\n    }\n\n    const genSelect = node.querySelector(\"[data-generator]\");\n    if (genSelect) {\n      genSelect.onchange = async () => {\n        cut.image.generator = genSelect.value;\n        await ctx.save({ cuts });\n      };\n    }\n\n    node.querySelectorAll(\"[data-status]\").forEach((btn) => {\n      btn.onclick = async () => {\n        cut.image.status = btn.dataset.status;\n        if (cut.image.status !== \"RETRY\") cut.image.retryReason = \"\";\n        invalidatePreviewReview(ep); // QC 패널에 보이는 이미지 검수 상태가 바뀌었다 — 재검토 필요\n\n        // Beta 6: PASS/확정 후 전체 화면이 다시 그려지면서 맨 위로 튀는 모바일 UX를 제거한다.\n        // 승인한 CUT 다음에 아직 승인되지 않은 이미지가 있으면 그 카드로 자동 이동한다.\n        // RETRY/검수필요처럼 같은 CUT에서 후속 작업이 필요한 상태면 현재 카드 위치를 유지한다.\n        const approved = cut.image.status === \"PASS\" || cut.image.status === \"확정\";\n        let focusIndex = i;\n        if (approved) {\n          const next = cuts.findIndex((candidate, idx) =>\n            idx > i &&\n            candidate.image?.assetId &&\n            candidate.image?.status !== \"PASS\" &&\n            candidate.image?.status !== \"확정\"\n          );\n          if (next >= 0) focusIndex = next;\n        }\n\n        await ctx.save({ cuts });\n\n        if (approved) {\n          // Beta 7: PASS/확정은 전체 STEP을 다시 렌더링하지 않는다.\n          // 전체 reRender()가 episode 상단/STEP 칩까지 다시 만들면서 Android Chrome에서\n          // 화면이 위로 튄 뒤 다음 CUT까지 길게 smooth-scroll 되는 현상이 있었다.\n          // 승인 상태는 현재 카드 안에서 즉시 갱신하고, 상단 진행/QC 요약만 경량 갱신한다.\n          const pill = node.querySelector(\".pill-inline\");\n          if (pill) {\n            pill.textContent = cut.image.status;\n            pill.className = `pill-inline ${imageStatusClass(cut)}`;\n          }\n          node.querySelectorAll(\"[data-status]\").forEach((statusBtn) => {\n            statusBtn.classList.toggle(\"secondary\", statusBtn.dataset.status !== cut.image.status);\n          });\n          if (ctx.refreshShell) await ctx.refreshShell();\n\n          // 다음 검수 CUT이 화면 밖에 있을 때만 필요한 최소 거리만 즉시 이동한다.\n          // 이미 보이는 경우에는 아예 화면이 움직이지 않는다.\n          if (focusIndex !== i) {\n            requestAnimationFrame(() => {\n              const target = document.querySelector(`[data-cut-image-index=\"${focusIndex}\"]`);\n              if (target) target.scrollIntoView({ behavior: \"auto\", block: \"nearest\" });\n            });\n          }\n          return;\n        }\n\n        // 카드 구조가 달라져도 사용자가 보고 있던 화면 위치를 유지한다.\n        await reRenderKeepingViewport();\n      };\n    });\n\n    const qcInput = node.querySelector(\"[data-qc]\");\n    if (qcInput) {\n      qcInput.addEventListener(\"blur\", async () => {\n        cut.image.qcNote = qcInput.value;\n        await ctx.save({ cuts });\n      });\n    }\n\n    const retrySelect = node.querySelector(\"[data-retry-reason]\");\n    if (retrySelect) {\n      retrySelect.onchange = async () => {\n        cut.image.retryReason = retrySelect.value;\n        await ctx.save({ cuts });\n      };\n    }\n\n    return node;\n  }\n}\n\nfunction imageStatusClass(cut) {\n  const status = cut.image?.assetId ? cut.image.status : \"미생성\";\n  if (status === \"PASS\" || status === \"확정\") return \"recommended\";\n  if (status === \"RETRY\") return \"blocker\";\n  if (status === \"검수필요\" || status === \"생성중\") return \"required\";\n  return \"optional\";\n}\n\nfunction attr(s) {\n  return String(s ?? \"\")\n    .replace(/&/g, \"&amp;\")\n    .replace(/</g, \"&lt;\")\n    .replace(/\"/g, \"&quot;\");\n}\n","js_v420a12/audioMatch.js":"// 오디오 일괄등록 파일명 자동매칭 — 순수 함수, 아무것도 저장하지 않는다.\n// 이미지 일괄등록(imageMatch.js)과 동일한 원칙: 앵커(^...$) 패턴만 인식하고,\n// 확정 전에는 반드시 \"파일 → 예상 대상\" 미리보기를 먼저 보여준 뒤 사용자가\n// [매칭 확정]을 눌러야 실제로 연결된다(호출부의 책임).\n//\n// 지원하는 1차 패턴(모두 대소문자 무관, cut 접두어는 있어도/없어도 됨):\n//   cut01_narration.wav / cut_01_narration.wav / cut01-narration.wav / 01_narration.wav\n//     → CUT 번호 + 나레이션\n//   cut01_dialogue01.wav / cut01_dialogue_02.wav / 01_dialogue_01.wav\n//     → CUT 번호 + 대사 순번(1-based, 그 CUT의 dialogueLines 순서를 가리킴)\n//   cut03_sfx01.wav / cut03_sfx.wav / 03_sfx01.wav\n//     → CUT 번호 + SFX(항상 새 이벤트로 추가 — 같은 CUT에 여러 개 있어도 정상)\n//\n// 화자 이름 기반 파일명(예: 남자_01.wav, 귀신_02.wav)은 어느 CUT/대사인지 모호할 수 있으므로\n// 절대 자동 확정하지 않는다 — speakerCandidates로 따로 모아 \"후보\"로만 보여준다.\n\nconst EXT = \"(?:wav|mp3|m4a|aac|ogg|opus)\";\nconst TYPED_RE = new RegExp(`^(?:cut[\\\\s_-]?)?(\\\\d{1,3})[\\\\s_-]?(narration|dialogue|sfx)(?:[\\\\s_-]?(\\\\d{1,3}))?\\\\.${EXT}$`, \"i\");\nconst SPEAKER_RE = new RegExp(`^[^\\\\d\\\\s][\\\\w가-힣]*[\\\\s_-](\\\\d{1,3})\\\\.${EXT}$`, \"i\");\n\nfunction parseAudioFileName(fileName) {\n  const name = String(fileName || \"\").trim();\n  const m = name.match(TYPED_RE);\n  if (!m) return null;\n  return { cutNumber: Number(m[1]), type: m[2].toLowerCase(), subIndex: m[3] ? Number(m[3]) : null };\n}\n\nfunction looksLikeSpeakerPattern(fileName) {\n  return SPEAKER_RE.test(String(fileName || \"\").trim());\n}\n\nfunction pushToGroup(map, key, item) {\n  if (!map.has(key)) map.set(key, []);\n  map.get(key).push(item);\n}\n\n// cuts: ep.cuts 배열(dialogueLines에 안정적 id가 있어야 dialogue 매칭이 정확하다 —\n// migration.js가 Phase 2까지의 기존 데이터에도 non-destructive하게 id를 채워준다).\n//\n// 반환:\n//   matches:         [{ fileName, cutNumber, cutIndex, type, dialogueIndex?, dialogueLineId? }]\n//   unmatched:       [fileName, ...]                          — 패턴 자체를 인식 못함\n//   outOfRange:      [{ fileName, cutNumber }]                — 그런 CUT이 없음\n//   invalidDialogue: [{ fileName, cutNumber, dialogueIndex }] — CUT은 있지만 그 순번의 대사가 없음\n//   duplicates:      [{ key, fileNames: [...] }]              — 같은 자리(나레이션/특정 대사)를 가리키는 파일이 여러 개\n//   speakerCandidates: [fileName, ...]                        — 화자 이름 패턴으로 보이지만 자동 확정하지 않음\nexport function matchAudioFilesToCuts(fileNames, cuts) {\n  const list = cuts || [];\n  const unmatched = [];\n  const outOfRange = [];\n  const invalidDialogue = [];\n  const speakerCandidates = [];\n  const slotGroups = new Map(); // \"슬롯\" 기반(나레이션/대사)만 중복 검사 대상 — SFX는 여러 개가 정상이라 제외\n  const sfxMatches = [];\n\n  (fileNames || []).forEach((fileName) => {\n    const parsed = parseAudioFileName(fileName);\n    if (!parsed) {\n      if (looksLikeSpeakerPattern(fileName)) speakerCandidates.push(fileName);\n      else unmatched.push(fileName);\n      return;\n    }\n\n    const { cutNumber, type, subIndex } = parsed;\n    const cutIndex = cutNumber - 1;\n    if (cutIndex < 0 || cutIndex >= list.length) {\n      outOfRange.push({ fileName, cutNumber });\n      return;\n    }\n    const cut = list[cutIndex];\n\n    if (type === \"narration\") {\n      pushToGroup(slotGroups, `${cutNumber}:narration`, { fileName, cutNumber, cutIndex, type });\n    } else if (type === \"dialogue\") {\n      const dialogueIndex = subIndex || 1;\n      const line = (cut.dialogueLines || [])[dialogueIndex - 1];\n      if (!line) {\n        invalidDialogue.push({ fileName, cutNumber, dialogueIndex });\n        return;\n      }\n      pushToGroup(slotGroups, `${cutNumber}:dialogue:${dialogueIndex}`, {\n        fileName,\n        cutNumber,\n        cutIndex,\n        type,\n        dialogueIndex,\n        dialogueLineId: line.id,\n      });\n    } else if (type === \"sfx\") {\n      sfxMatches.push({ fileName, cutNumber, cutIndex, type: \"sfx\" });\n    }\n  });\n\n  const matches = [...sfxMatches];\n  const duplicates = [];\n  slotGroups.forEach((items, key) => {\n    if (items.length > 1) duplicates.push({ key, fileNames: items.map((it) => it.fileName) });\n    else matches.push(items[0]);\n  });\n\n  matches.sort((a, b) => a.cutNumber - b.cutNumber);\n  return { matches, unmatched, outOfRange, invalidDialogue, duplicates, speakerCandidates };\n}\n","js_v420a12/views/cutAudioStep.js":"// STEP ④ 오디오 — CUT별 나레이션/대사/SFX/정적(silence) 오디오 이벤트 관리 + BGM + 일괄등록.\n//\n// 원칙:\n// - dialogueLines(STEP2, 대본)와 audioEvents(STEP4, 편집 타임라인)는 별도 배열이다.\n//   대사 음성은 audioEvent.sourceDialogueId로 STEP2의 dialogueLine.id를 가리켜 연결한다\n//   (순서 index로 연결하지 않는다 — 대사를 나중에 추가/삭제해도 기존 연결이 깨지지 않는다).\n// - 이미지와 마찬가지로 삭제/교체는 반드시 db.deleteAssetSafely()를 거친다.\n// - duration은 파일을 첨부/교체할 때마다 브라우저 metadata로 자동 측정하고, 사용자가 직접\n//   숫자를 수정하면 그 값이 최종 우선이다(다시 파일을 교체하면 또 자동 측정으로 갱신됨).\n// - CUT의 duration.measured는 per_cut 모드에서는 \"이 CUT의 모든 오디오 이벤트 중 가장 늦게\n//   끝나는 지점\"(model.recalcMeasuredDuration), master_narration 모드에서는 \"마스터 나레이션\n//   CUT 시작 마커 간 차이\"(model.recalcMasterNarrationDurations)로 계산 방식이 서로 다르다.\n//   rc.4(코드 리뷰 후속 수정) — 이 화면의 오디오 이벤트 변경 경로는 어느 쪽이든 반드시\n//   mode-aware 진입점인 model.recalcAudioModeDurations(ep) 하나만 호출한다 — 직접\n//   recalcMeasuredDuration(cut)을 호출하면 master_narration 모드에서도 CUT duration이\n//   audioEvent 길이 기준으로 덮어써져 마커 기반 duration이 깨진다.\n// - 화면 자체는 완료/블로커를 판정하지 않는다 — nextActions.js(getNextActions)가 계산한\n//   결과를 그대로 보여줄 뿐이다(Step Assistant 카드, CUT별 요약).\n\nimport {\n  newAudioEvent,\n  computeMeasuredDuration,\n  BGM_ACTIONS,\n  applyMeasuredDuration,\n  invalidateTimelineReview,\n  invalidatePreviewReview,\n  getMasterStart,\n  recalcAudioModeDurations,\n  resolveCutDuration,\n} from \"../model.js\";\nimport { putAsset, getAsset, deleteAssetSafely, isOversizedAsset, getEpisodeStorageUsage, getStorageEstimate } from \"../db.js\";\nimport { getAssetObjectUrl, forgetAssetObjectUrl } from \"../assetUrl.js\";\nimport { matchAudioFilesToCuts } from \"../audioMatch.js\";\nimport { getNextActions } from \"../nextActions.js\";\nimport { el, toast, copyText, escapeHtml, confirmOversizedFile, toastAssetSaveError, fmtBytes } from \"../util.js\";\n\nconst BGM_ACTION_LABEL = {\n  continue: \"계속 재생\",\n  lower: \"볼륨 낮추기\",\n  raise: \"볼륨 올리기\",\n  stop: \"정지\",\n  fade_out: \"페이드 아웃\",\n};\n\n// v2.1-rc.1 — 이 화면은 hashchange 없이도(예: 오디오 방식 라디오 전환 시 ctx.reRender()) 여러\n// 번 다시 마운트될 수 있다. render()가 호출될 때마다 새 keydown 리스너 클로저가 만들어지므로,\n// 모듈 스코프에 \"지금 활성 상태인 해제 함수\"를 하나만 들고 있다가 다음 render()가 시작될 때\n// 이전 것부터 반드시 해제한다 — 그렇지 않으면 document에 keydown 리스너가 계속 누적되어\n// 과거 render() 호출의 stale cuts/masterAudioEl을 참조하는 좀비 핸들러가 남는다.\nlet activeQuickModeUnbind = null;\n\nexport async function render(root, ep, ctx) {\n  const cuts = ep.cuts || [];\n  const expandedIds = new Set();\n  let pendingAudioFiles = null; // Map<fileName, File> — 배치 확정 전까지 저장하지 않는다.\n  let masterAudioEl = null; // 통합 나레이션 마킹 중 재생을 이어가기 위해 마커 리스트만 부분 갱신(전체 reRender 안 함)\n  // Beta 12 — Quick Sync는 CUT1부터 확인 가능하다. CUT1 시작은 0.00초 고정이지만\n  // 앞 CUT 대사를 들어야 다음 CUT의 정확한 시작점을 잡을 수 있으므로 정보/재생 대상에는 포함한다.\n  // 이후에는 재생/스크럽 currentTime에 맞춰 active CUT이 자동으로 따라간다.\n  let quickModeIndex = cuts.length ? 0 : 0;\n  let quickAutoFollow = true;\n  let quickRenderGuard = false;\n  let quickScrubbing = false;\n  // Beta 14 — 잘못 기록한 경계를 되돌릴 수 있도록, 방금 적용/직접 선택한 CUT은\n  // 직전 CUT 구간까지 \"수정 대상\"으로 유지한다. 이 잠금은 더 앞 구간이나 다음 CUT으로\n  // 이동하면 자동 해제된다.\n  let quickCorrectionIndex = null;\n  let keyboardShortcutsBound = false;\n\n  const audioActions = getNextActions(ep).filter((a) => a.step === \"cutAudio\" && a.priority !== \"optional\");\n  const totalSlots = countRequiredAudioSlots(ep);\n  const doneSlots = Math.max(0, totalSlots - audioActions.length);\n\n  const usageBytes = await getEpisodeStorageUsage(ep.id);\n  const estimate = await getStorageEstimate();\n  const hasMasterNarration = !!ep.masterNarration?.assetId;\n  const markedCutCount = cuts.length\n    ? cuts.filter((cut, index) => index === 0 || getMasterStart(cut, index) != null).length\n    : 0;\n  const allMasterMarkersReady = ep.audioMode === \"master_narration\" && hasMasterNarration && cuts.length > 0 && markedCutCount === cuts.length;\n  const audioStepReady = audioActions.length === 0;\n  const narrationScript = buildNarrationScript(cuts);\n  const speakerTtsBlocks = buildSpeakerTtsBlocks(cuts);\n  const distinctSpeakers = [...new Set(speakerTtsBlocks.map((b) => b.speaker).filter(Boolean))];\n\n  root.innerHTML = `\n    <div class=\"card\">\n      <h3>오디오 제작</h3>\n      <p class=\"hint\">기본 방식은 <b>전체 나레이션 파일 1개</b>를 넣고 CUT 시작 지점만 맞추는 방식입니다. CUT마다 음성 파일을 따로 만들 필요가 없습니다.</p>\n      <div class=\"card\" style=\"margin:12px 0 0;padding:14px;\">\n        <h3 style=\"margin-top:0;\">📝 CapCut용 전체 나레이션 대본</h3>\n        <p class=\"hint\" style=\"margin-bottom:10px;\">AI Story의 CUT 나레이션을 순서대로 합친 TTS용 대본입니다. 먼저 복사해서 CapCut에 붙여넣고 음성을 만든 뒤, 아래에서 완성된 파일을 첨부하세요.</p>\n        <button class=\"btn\" id=\"copy-master-narration-script\" style=\"width:100%;\" ${narrationScript ? \"\" : \"disabled\"}>📋 전체 나레이션 대본 복사</button>\n        <details style=\"margin-top:10px;\">\n          <summary>대본 미리보기</summary>\n          <div class=\"hint\" style=\"white-space:pre-wrap;margin-top:10px;max-height:260px;overflow:auto;\">${narrationScript ? escapeHtml(narrationScript) : \"복사할 나레이션 문장이 없습니다.\"}</div>\n        </details>\n      </div>\n      ${\n        speakerTtsBlocks.length\n          ? `<div class=\"card\" style=\"margin:12px 0 0;padding:14px;\">\n              <h3 style=\"margin-top:0;\">🗣 CapCut용 화자 구간 TTS 대본</h3>\n              <p class=\"hint\" style=\"margin-bottom:10px;\">\n                Claude 대본의 화자 정보를 기준으로 <b>연속된 같은 화자 CUT을 한 구간으로 묶었습니다.</b>\n                각 구간을 CapCut에서 해당 목소리로 TTS 생성한 뒤 순서대로 이어 붙이고, 완성된 전체 오디오를 아래 <b>🎙 전체 나레이션 바로 첨부</b>로 넣으세요.\n                ${distinctSpeakers.length > 1 ? ` · 감지 화자 ${distinctSpeakers.length}명` : \"\"}\n              </p>\n              <div style=\"display:grid;gap:8px;\">\n                ${speakerTtsBlocks.map((b, i) => `\n                  <div class=\"dialogue-row\" style=\"display:block;\">\n                    <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:center;\">\n                      <strong>${escapeHtml(b.speaker)} · ${speakerBlockLabel(b)}</strong>\n                      <button class=\"btn secondary small\" type=\"button\" data-copy-speaker-block=\"${i}\">📋 이 구간 대본 복사</button>\n                    </div>\n                    <div class=\"hint\" style=\"white-space:pre-wrap;margin-top:6px;\">${escapeHtml(b.text)}</div>\n                  </div>\n                `).join(\"\")}\n              </div>\n              <details style=\"margin-top:10px;\">\n                <summary>2화자 CapCut 제작 순서</summary>\n                <div class=\"hint\" style=\"margin-top:8px;white-space:pre-wrap;\">1. 위 구간을 위에서부터 순서대로 복사\n2. CapCut에서 각 구간을 텍스트로 만들고 화자에 맞는 TTS 목소리 적용\n3. 구간들을 CUT 순서대로 빈틈 없이 이어 붙이기\n4. 전체 음성을 하나의 오디오 파일로 내보내기\n5. Tracker로 돌아와 “🎙 전체 나레이션 바로 첨부” 선택</div>\n              </details>\n            </div>`\n          : \"\"\n      }\n      <button class=\"btn\" id=\"audio-primary-action\" style=\"width:100%;margin-top:10px;\">\n        ${\n          ep.audioMode !== \"master_narration\"\n            ? \"🎛 고급 오디오 작업 계속\"\n            : !hasMasterNarration\n              ? \"🎙 전체 나레이션 바로 첨부\"\n              : !allMasterMarkersReady\n                ? `▶ CUT 타이밍 계속 맞추기 (${markedCutCount}/${cuts.length})`\n                : audioStepReady\n                  ? \"④ 타임라인 단계로 이동 →\"\n                  : \"✓ 필수 오디오 남은 항목 확인\"\n        }\n      </button>\n      <p class=\"hint\" style=\"margin-top:10px;\">\n        ${\n          ep.audioMode === \"master_narration\"\n            ? !hasMasterNarration\n              ? \"다음 할 일: CapCut 등에서 만든 전체 나레이션 파일을 그대로 선택하세요. 파일명은 상관없습니다.\"\n              : !allMasterMarkersReady\n                ? `전체 나레이션 첨부 완료 · CUT 시작점 ${markedCutCount}/${cuts.length} 기록`\n                : audioStepReady\n                  ? \"오디오 필수 작업 완료 · 타임라인으로 넘어갈 수 있습니다.\"\n                  : `CUT 타이밍 완료 · 남은 필수 오디오 ${audioActions.length}건`\n            : `고급 CUT별 오디오 모드 · 필수 오디오 ${doneSlots}/${totalSlots}`\n        }\n      </p>\n      <details class=\"image-more-tools\" style=\"margin-top:10px;\">\n        <summary>세부 상태 / 고급 오디오 도구</summary>\n        <div style=\"margin-top:10px;\">\n          <p class=\"hint\"><strong>진행률</strong> — ${doneSlots} / ${totalSlots} 필수 오디오 준비</p>\n          ${\n            audioActions.length\n              ? `<p class=\"hint\"><strong>남은 작업</strong></p>\n                 <ul class=\"next-action-list\">${audioActions\n                   .slice(0, 6)\n                   .map((a) => `<li><span class=\"pill-inline ${a.priority}\">${a.priority === \"blocker\" ? \"필수·막힘\" : \"필수\"}</span> ${escapeHtml(a.message)}</li>`)\n                   .join(\"\")}${audioActions.length > 6 ? `<li class=\"hint\">외 ${audioActions.length - 6}건...</li>` : \"\"}</ul>`\n              : `<p class=\"hint\"><strong>남은 작업</strong> — 없음</p>`\n          }\n          <p class=\"hint\">이 에피소드 저장 용량 ${fmtBytes(usageBytes)}${estimate && estimate.quota ? ` · 기기 저장공간 ${fmtBytes(estimate.usage || 0)} / ${fmtBytes(estimate.quota)}` : \"\"}</p>\n          <hr style=\"border:0;border-top:1px solid var(--line);margin:14px 0;\" />\n          <h3 style=\"margin-top:0;\">오디오 방식</h3>\n          <div class=\"btn-row\" style=\"gap:16px;flex-wrap:wrap;\">\n            <label style=\"display:flex;align-items:center;gap:6px;width:auto;margin:0;\">\n              <input type=\"radio\" name=\"audio-mode\" value=\"master_narration\" data-audio-mode style=\"width:auto;\" ${ep.audioMode === \"master_narration\" ? \"checked\" : \"\"} /> 통합 나레이션 (기본 · 권장)\n            </label>\n            <label style=\"display:flex;align-items:center;gap:6px;width:auto;margin:0;\">\n              <input type=\"radio\" name=\"audio-mode\" value=\"per_cut\" data-audio-mode style=\"width:auto;\" ${ep.audioMode === \"per_cut\" ? \"checked\" : \"\"} /> CUT별 개별 오디오 (고급)\n            </label>\n          </div>\n          <p class=\"hint\">대사/SFX/BGM을 세부적으로 관리할 때만 고급 기능을 사용하면 됩니다.</p>\n        </div>\n      </details>\n    </div>\n\n    <div id=\"master-narration-card\"></div>\n\n    <details class=\"image-more-tools card\">\n      <summary>선택 기능 · BGM / 오디오 일괄 등록</summary>\n      <div style=\"margin-top:12px;\">\n        <h3>BGM</h3>\n        <div id=\"bgm-slot\"></div>\n        <hr style=\"border:0;border-top:1px solid var(--line);margin:14px 0;\" />\n        <h3>오디오 일괄 등록</h3>\n        <p class=\"hint\">여러 파일을 한 번에 등록할 때만 사용하세요. 파일명으로 CUT/대사/SFX를 자동 인식합니다.</p>\n        <input type=\"file\" accept=\"audio/*\" multiple id=\"audio-batch-input\" class=\"btn secondary\" style=\"padding:10px;\" />\n        <div id=\"audio-batch-preview\"></div>\n      </div>\n    </details>\n\n    <div id=\"cut-audio-list\"></div>\n  `;\n\n  const narrationCopyBtn = root.querySelector(\"#copy-master-narration-script\");\n  if (narrationCopyBtn) {\n    narrationCopyBtn.onclick = async () => {\n      if (!narrationScript) return;\n      await copyText(narrationScript);\n      toast(\"CapCut용 전체 나레이션 대본을 복사했어요\");\n    };\n  }\n\n  root.querySelectorAll(\"[data-audio-mode]\").forEach((input) => {\n    input.onchange = async (e) => {\n      if (!e.target.checked) return;\n      ep.audioMode = e.target.value;\n      recalcAudioModeDurations(ep);\n      invalidateTimelineReview(ep);\n      invalidatePreviewReview(ep);\n      await ctx.save({ audioMode: ep.audioMode, cuts });\n      toast(ep.audioMode === \"master_narration\" ? \"통합 나레이션 모드로 전환했어요\" : \"CUT별 개별 오디오(고급) 모드로 전환했어요\");\n      ctx.reRender();\n    };\n  });\n\n  await renderMasterNarrationCard();\n  await renderBgmSlot();\n  await renderCutAudioList();\n\n  root.querySelectorAll(\"[data-copy-speaker-block]\").forEach((btn) => {\n    btn.onclick = async () => {\n      const block = speakerTtsBlocks[Number(btn.dataset.copySpeakerBlock)];\n      if (!block?.text) return;\n      try {\n        await navigator.clipboard.writeText(block.text);\n        toast(`${block.speaker} · ${speakerBlockLabel(block)} 대본을 복사했어요`);\n      } catch (_) {\n        toast(\"클립보드 복사에 실패했습니다\");\n      }\n    };\n  });\n\n  const primaryAudioBtn = root.querySelector(\"#audio-primary-action\");\n  if (primaryAudioBtn) {\n    primaryAudioBtn.onclick = () => {\n      if (ep.audioMode !== \"master_narration\") {\n        root.querySelector(\"#cut-audio-list\")?.scrollIntoView({ behavior: \"smooth\", block: \"start\" });\n        return;\n      }\n      if (!hasMasterNarration) {\n        root.querySelector(\"[data-master-attach]\")?.click();\n        return;\n      }\n      if (!allMasterMarkersReady) {\n        root.querySelector(\"#quick-sync-bar-mount\")?.scrollIntoView({ behavior: \"smooth\", block: \"center\" });\n        return;\n      }\n      if (audioStepReady) {\n        location.hash = `#/episode/${ep.id}/timeline`;\n        return;\n      }\n      root.querySelector(\"#cut-audio-list\")?.scrollIntoView({ behavior: \"smooth\", block: \"start\" });\n    };\n  }\n\n  const batchInput = root.querySelector(\"#audio-batch-input\");\n  batchInput.onchange = (e) => {\n    const files = Array.from(e.target.files);\n    pendingAudioFiles = new Map(files.map((f) => [f.name, f]));\n    const result = matchAudioFilesToCuts(files.map((f) => f.name), cuts);\n    renderBatchPreview(result);\n  };\n\n  // ---------------------------------------------------------------------\n  // 통합 나레이션(Master Narration Mode, rc.3) — 실제 사용자 Workflow(CapCut 등에서 화자\n  // 하나로 만든 전체 나레이션 파일 1개 + CUT 시작 지점 마킹)를 그대로 반영한다. 파일명은\n  // 절대 분석하지 않는다 — 이 슬롯에 첨부했다는 것 자체가 이미 \"이 파일이 전체 나레이션\"이라는\n  // 컨텍스트다(CUT별 개별 오디오의 배치 자동매칭과는 완전히 다른 경로).\n  // ---------------------------------------------------------------------\n\n  async function renderMasterNarrationCard() {\n    const mount = root.querySelector(\"#master-narration-card\");\n    if (ep.audioMode !== \"master_narration\") {\n      mount.innerHTML = \"\";\n      masterAudioEl = null;\n      unbindKeyboardShortcuts();\n      return;\n    }\n    const mn = ep.masterNarration || { assetId: null, duration: null };\n    const url = mn.assetId ? await getAssetObjectUrl(mn.assetId) : null;\n    mount.innerHTML = `\n      <input type=\"file\" accept=\"audio/*\" data-master-input style=\"display:none;\" />\n      <button data-master-attach style=\"display:none;\" aria-hidden=\"true\" tabindex=\"-1\"></button>\n      ${\n        url\n          ? `<audio id=\"master-audio-player\" src=\"${url}\" preload=\"metadata\" style=\"display:none;\"></audio>\n             <div class=\"card\">\n               <h3>이미지별 나레이션 배분</h3>\n               <p class=\"hint\">CUT1부터 앞뒤로 직접 확인할 수 있고, 재생/타임바 위치에 맞는 CUT이 자동으로 이 자리에 바뀝니다. 이전 CUT 대사와 현재 CUT 이미지·대본을 함께 보며 시작점만 맞추세요.</p>\n               <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:center;margin:0 0 8px;flex-wrap:wrap;\">\n                 <span class=\"hint\" style=\"margin:0;\">전체 나레이션 ${mn.duration != null ? mn.duration.toFixed(1) + \"초\" : \"길이 확인 중\"}</span>\n               </div>\n               <button class=\"btn\" data-auto-silence-sync style=\"width:100%;margin-bottom:7px;\">⚡ 음성 쉼 구간으로 CUT 자동 맞춤</button>\n               ${distinctSpeakers.length >= 2 ? `<button class=\"btn\" data-auto-speaker-reorder style=\"width:100%;margin-bottom:7px;\">🔀 화자별로 만든 더빙 자동 재배열</button>` : \"\"}\n               <button class=\"btn secondary\" data-auto-distribute style=\"width:100%;margin-bottom:7px;\">↻ 대본 분량 기준 자동 배분</button>\n               <p class=\"hint\" data-auto-sync-note style=\"margin:0 0 10px;\">권장: 음성의 실제 쉼 구간을 분석하고, 다음 대사가 나오기 직전 쉼 구간 안에서 화면을 먼저 전환합니다. <b>화자별로 TTS를 몰아서 만든 파일</b>은 위 재배열 버튼으로 대본 순서로 다시 정렬할 수 있습니다. 짧은 첫 응답(예: “아니”)은 다음 CUT 시작에 붙도록 자동 보정합니다.</p>\n               <div id=\"quick-sync-bar-mount\"></div>\n               <details style=\"margin-top:10px;\">\n                 <summary>나레이션 파일 관리</summary>\n                 <div class=\"btn-row\" style=\"margin-top:10px;\">\n                   <button class=\"btn secondary small\" data-master-replace>나레이션 교체</button>\n                   <button class=\"btn danger small\" data-master-delete>삭제</button>\n                 </div>\n               </details>\n             </div>`\n          : \"\"\n      }\n    `;\n    masterAudioEl = mount.querySelector(\"#master-audio-player\") || null;\n\n    const fileInput = mount.querySelector(\"[data-master-input]\");\n    mount.querySelector(\"[data-master-attach]\").onclick = () => fileInput.click();\n    const replaceBtn = mount.querySelector(\"[data-master-replace]\");\n    if (replaceBtn) replaceBtn.onclick = () => fileInput.click();\n    fileInput.onchange = async (e) => {\n      const file = e.target.files[0];\n      if (!file) return;\n      if (!confirmOversizedFile(file)) return;\n      try {\n        await attachMasterNarration(file);\n        toast(\"전체 나레이션을 등록했어요\");\n        ctx.reRender();\n      } catch (err) {\n        toastAssetSaveError(err);\n      }\n    };\n    const delBtn = mount.querySelector(\"[data-master-delete]\");\n    if (delBtn) {\n      delBtn.onclick = async () => {\n        if (!confirm(\"전체 나레이션 파일을 삭제할까요? CUT 시작 마커는 그대로 남아있어요.\")) return;\n        await deleteAssetSafely(mn.assetId, ep.id);\n        forgetAssetObjectUrl(mn.assetId);\n        ep.masterNarration = { assetId: null, duration: mn.duration };\n        recalcAudioModeDurations(ep);\n        invalidateTimelineReview(ep);\n        invalidatePreviewReview(ep);\n        await ctx.save({ masterNarration: ep.masterNarration, cuts });\n        toast(\"삭제했어요\");\n        ctx.reRender();\n      };\n    }\n\n    const autoSilenceBtn = mount.querySelector(\"[data-auto-silence-sync]\");\n    if (autoSilenceBtn) autoSilenceBtn.onclick = reAutoSilenceSyncMasterStarts;\n    const reorderBtn = mount.querySelector(\"[data-auto-speaker-reorder]\");\n    if (reorderBtn) reorderBtn.onclick = reAutoReorderSpeakerGroupedMaster;\n    const autoBtn = mount.querySelector(\"[data-auto-distribute]\");\n    if (autoBtn) autoBtn.onclick = reAutoDistributeMasterStarts;\n\n    renderQuickSyncBar();\n    bindKeyboardShortcuts();\n  }\n\n  async function attachMasterNarration(file) {\n    const oldAssetId = ep.masterNarration && ep.masterNarration.assetId;\n    if (oldAssetId) {\n      await deleteAssetSafely(oldAssetId, ep.id);\n      forgetAssetObjectUrl(oldAssetId);\n    }\n    const asset = await putAsset({ episodeId: ep.id, kind: \"audio\", role: \"master_narration\", blob: file, originalFileName: file.name });\n    const measured = await measureAudioDuration(file);\n    ep.masterNarration = { assetId: asset.id, duration: measured };\n    const hasUserMarkers = cuts.some((cut, index) => index > 0 && getMasterStart(cut, index) != null);\n    if (!hasUserMarkers && measured && measured > 0) {\n      try {\n        const result = await autoAlignMasterStartsFromBlob(file, measured);\n        ep.autoTiming = { mode: \"silence_aware_visual_lead_v2\", appliedAt: Date.now(), matchedBoundaries: result.matched, fallbackBoundaries: result.fallback, totalBoundaries: Math.max(0, cuts.length - 1) };\n      } catch (err) {\n        autoDistributeMasterStarts(measured);\n        ep.autoTiming = { mode: \"text_weight_fallback_v1\", appliedAt: Date.now(), matchedBoundaries: 0, fallbackBoundaries: Math.max(0, cuts.length - 1), totalBoundaries: Math.max(0, cuts.length - 1) };\n      }\n    }\n    recalcAudioModeDurations(ep);\n    invalidateTimelineReview(ep);\n    invalidatePreviewReview(ep);\n    await ctx.save({ masterNarration: ep.masterNarration, cuts, autoTiming: ep.autoTiming || null });\n  }\n\n  function narrationWeight(cut) {\n    const text = String(cut?.narration || \"\").replace(/\\s+/g, \" -width:0;\">\n              ${prevCut ? `<div class=\"hint\" style=\"margin:0 0 6px;padding:7px 8px;border-radius:8px;background:var(--surface2);opacity:.82;\"><b>이전 CUT ${idx} 끝 참고</b><br>${escapeHtml(String(prevCut.narration || \"(나레이션 없음)\"))}</div>` : \"\"}\n              <div style=\"font-size:14px;line-height:1.5;margin:0 0 8px;\"><b>현재 CUT 대사</b><br>${escapeHtml(String(cut.narration || \"(나레이션 없음)\"))}</div>\n              <div class=\"hint\" style=\"margin:0;\">예상 길이 ${duration != null ? duration.toFixed(2) + \"초\" : \"계산 중\"}${idx === 0 ? \" · 시작점 0.00초 고정\" : ` · 이전 CUT은 ${prevEnd.toFixed(2)}초 전까지`}</div>\n            </div>\n          </div>\n        </div>\n\n        <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:10px;\">\n          <span class=\"hint\" style=\"margin:0;\">현재 재생 시점</span>\n          <strong data-qs-current-time>${current.toFixed(2)}초</strong>\n        </div>\n        <button type=\"button\" class=\"btn\" data-qs-apply style=\"width:100%;margin-top:8px;background:var(--accent2);\" ${idx === 0 ? \"disabled\" : \"\"}>${idx === 0 ? \"CUT 1 · 0.00초 고정\" : `현재 시점을 CUT ${idx + 1} 시작으로 적용`}</button>\n        ${idx > 0 && quickCorrectionIndex === idx ? `<div class=\"hint\" style=\"margin:6px 2px 0;text-align:center;\">경계 보정 중 · 직전 CUT 구간으로 되돌아가도 CUT ${idx + 1}을 다시 적용할 수 있어요.</div>` : \"\"}\n        <div class=\"qs-nudge\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;\">\n          <button type=\"button\" class=\"btn secondary small\" data-qs-nudge=\"-0.5\">-0.5초</button>\n          <button type=\"button\" class=\"btn secondary small\" data-qs-nudge=\"-0.1\">-0.1초</button>\n          <button type=\"button\" class=\"btn secondary small\" data-qs-nudge=\"0.1\">+0.1초</button>\n          <button type=\"button\" class=\"btn secondary small\" data-qs-nudge=\"0.5\">+0.5초</button>\n        </div>\n      </div>`;\n\n    const imageMount = mount.querySelector(\"[data-focus-cut
