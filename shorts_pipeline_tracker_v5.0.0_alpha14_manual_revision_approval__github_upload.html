<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>콘텐츠 제작 트래커 V4.2 Alpha 31</title><style>:root {
  --bg: #14161f;
  --bg-card: #1d2030;
  --bg-card2: #262a3d;
  --accent: #6e8cff;
  --accent2: #43d9ad;
  --danger: #ff6e6e;
  --text: #eef0f7;
  --text-dim: #9aa0b4;
  --border: #333850;
  --radius: 14px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  height: 100%;
}

#app {
  max-width: 560px;
  margin: 0 auto;
  padding: 16px 16px calc(84px + var(--safe-bottom));
  min-height: 100vh;
  min-height: 100dvh;
}

h1, h2, h3 { margin: 0 0 12px; line-height: 1.3; }
h1 { font-size: 20px; }
h2 { font-size: 17px; }
h3 { font-size: 14px; color: var(--text-dim); font-weight: 600; }
p { line-height: 1.5; color: var(--text-dim); }

.topbar {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px; padding-top: 4px;
}
.topbar .back { color: var(--accent); font-size: 15px; padding: 6px 4px; }
.topbar h1 { flex: 1; margin: 0; }

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
}

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--accent); color: #0c0e16;
  border: none; border-radius: 10px;
  padding: 12px 16px; font-size: 15px; font-weight: 700;
  cursor: pointer; width: 100%;
}
.btn.secondary { background: var(--bg-card2); color: var(--text); border: 1px solid var(--border); }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
.btn.small { width: auto; padding: 8px 12px; font-size: 13px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { flex: 1; }

label { display: block; font-size: 13px; color: var(--text-dim); margin: 12px 0 6px; }
label:first-child { margin-top: 0; }

input[type=text], input[type=number], input[type=date], textarea, select {
  width: 100%; background: var(--bg-card2); border: 1px solid var(--border);
  color: var(--text); border-radius: 10px; padding: 11px 12px; font-size: 15px;
  font-family: inherit;
}
textarea { resize: vertical; min-height: 70px; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); }

.episode-card {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px;
  cursor: pointer;
}
.episode-card .meta { flex: 1; min-width: 0; }
.episode-card .meta .title { font-weight: 700; font-size: 15px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.episode-card .meta .sub { font-size: 12px; color: var(--text-dim); }
.badge {
  display: inline-block; font-size: 11px; font-weight: 700;
  padding: 4px 9px; border-radius: 999px; background: var(--bg-card2);
  color: var(--accent2); border: 1px solid var(--border); white-space: nowrap;
}
.badge.horror { color: #ff8fa3; }

.steps-scroll {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 14px;
  -webkit-overflow-scrolling: touch;
}
.step-chip {
  flex: 0 0 auto; padding: 8px 13px; border-radius: 999px; font-size: 13px;
  background: var(--bg-card2); color: var(--text-dim); border: 1px solid var(--border);
  white-space: nowrap; cursor: pointer;
}
.step-chip.active { background: var(--accent); color: #0c0e16; border-color: var(--accent); font-weight: 700; }
.step-chip.done::after { content: " ✓"; }

.scene-item { border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: var(--bg-card2); }
.scene-item .scene-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.scene-item .scene-head .idx { font-weight: 800; color: var(--accent); font-size: 13px; }

table.dur-table { width: 100%; border-collapse: collapse; font-size: 13px; }
table.dur-table th, table.dur-table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
table.dur-table th { color: var(--text-dim); font-weight: 600; }
table.dur-table td.num { text-align: right; font-variant-numeric: tabular-nums; }

.img-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.img-slot {
  position: relative; aspect-ratio: 9/16; border-radius: 10px; overflow: hidden;
  background: var(--bg-card2); border: 2px solid var(--border); cursor: pointer;
}
.img-slot.selected { border-color: var(--accent); }
.img-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.img-slot .step-label {
  position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,.65);
  color: #fff; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px;
}
.img-slot .empty-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 12px; }

.player-box { background: var(--bg-card2); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
.player-box video, .player-box audio { width: 100%; border-radius: 8px; display: block; }
.time-readout { font-variant-numeric: tabular-nums; font-size: 28px; font-weight: 800; text-align: center; margin: 10px 0; color: var(--accent2); }
.scrub-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
.scrub-row .btn.small { min-width: 52px; }

.timeline { position: relative; height: 26px; background: var(--bg-card); border-radius: 6px; margin: 10px 0; }
.timeline .marker { position: absolute; top: 0; width: 2px; height: 100%; background: var(--accent2); }
.timeline .playhead { position: absolute; top: -4px; width: 2px; height: 34px; background: #fff; }

.marker-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.marker-row:last-child { border-bottom: none; }
.marker-row .txt { flex: 1; font-size: 13px; }
.marker-row .val { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--accent2); width: 62px; text-align: right; }

pre.code-block {
  background: #0c0e16; border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-word;
  max-height: 340px; overflow-y: auto;
}

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0;
  display: flex; justify-content: center; gap: 0;
  background: rgba(20,22,31,.92); backdrop-filter: blur(10px);
  border-top: 1px solid var(--border);
  padding: 8px 10px calc(8px + var(--safe-bottom));
  z-index: 10;
}
.tabbar-inner { display: flex; width: 100%; max-width: 560px; gap: 4px; }
.tabbar button {
  flex: 1; background: none; border: none; color: var(--text-dim);
  font-size: 11px; padding: 6px 4px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.tabbar button .icon { font-size: 19px; }
.tabbar button.active { color: var(--accent); }

.empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); }
.toast {
  position: fixed; left: 50%; bottom: calc(90px + var(--safe-bottom)); transform: translateX(-50%);
  background: #262a3d; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13px;
  border: 1px solid var(--border); z-index: 50; opacity: 0; transition: opacity .2s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

.persistent-error-overlay {
  position: fixed; inset: 0; z-index: 120;
  background: rgba(5,7,12,.72);
  display: flex; align-items: flex-end; justify-content: center;
  padding: 18px 14px calc(18px + var(--safe-bottom));
}
.persistent-error-card {
  width: min(680px, 100%);
  max-height: 72vh; overflow: auto;
  background: #202436; border: 1px solid var(--border);
  border-radius: 18px; padding: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,.45);
}
.persistent-error-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-bottom: 10px;
}
.persistent-error-message {
  white-space: pre-wrap; overflow-wrap: anywhere;
  font-size: 13px; line-height: 1.5;
  color: #fff; background: rgba(0,0,0,.18);
  border-radius: 12px; padding: 12px;
}

.color-swatches { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.swatch { width: 28px; height: 28px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; }
.swatch.selected { border-color: #fff; }

.hint { font-size: 12px; color: var(--text-dim); margin-top: 6px; }
.section-gap { margin-top: 22px; }

/* v2 — formatType 배지 / NextActionEngine 우선순위 배지 */
.pill-inline {
  display: inline-flex; align-items: center; font-size: 11px; font-weight: 700;
  padding: 3px 9px; border-radius: 999px; white-space: nowrap;
  background: var(--bg-card2); color: var(--text-dim); border: 1px solid var(--border);
}
.pill-inline.blocker { background: rgba(255,110,110,.15); color: var(--danger); border-color: rgba(255,110,110,.35); }
.pill-inline.required { background: rgba(110,140,255,.15); color: var(--accent); border-color: rgba(110,140,255,.35); }
.pill-inline.recommended { background: rgba(67,217,173,.15); color: var(--accent2); border-color: rgba(67,217,173,.35); }
.pill-inline.optional { background: var(--bg-card2); color: var(--text-dim); }
.pill-inline.accent { background: rgba(110,140,255,.15); color: var(--accent); border-color: rgba(110,140,255,.35); }
.pill-inline.info { background: rgba(67,217,173,.12); color: var(--accent2); border-color: rgba(67,217,173,.3); }

.next-action-list { margin: 0; padding-left: 0; list-style: none; }
.next-action-list li { display: flex; align-items: baseline; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.next-action-list li:last-child { border-bottom: none; }

.episode-card .next-hint { color: var(--accent2); margin-top: 2px; }

/* v2 Phase 2 — CUT 카드(요약→탭하여 펼치기), Reference 슬롯, CUT 이미지 관리 */
.cut-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px; margin-bottom: 10px;
}
.cut-card-head { display: flex; }
.cut-card-summary {
  flex: 1; display: flex; align-items: baseline; gap: 8px; min-width: 0;
  background: none; border: none; color: var(--text); text-align: left;
  padding: 4px 2px; font-size: 14px; cursor: pointer;
}
.cut-num { flex: 0 0 auto; font-weight: 800; color: var(--accent); font-size: 13px; }
.cut-summary-text {
  flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--text-dim); font-size: 13px;
}
.cut-card-controls { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.cut-card-controls .btn { flex: 0 0 auto; }
.cut-card-body { margin-top: 4px; }

.cut-editor { border-top: 1px solid var(--border); margin-top: 10px; padding-top: 10px; }

.dialogue-list { display: flex; flex-direction: column; gap: 6px; }
.dialogue-row { display: flex; gap: 6px; align-items: center; }
.dialogue-row input { width: auto; }
.dialogue-row input[data-dl-f="text"] { flex: 1; min-width: 0; }

.ref-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ref-slot { background: var(--bg-card2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
.ref-slot-label { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; }
.ref-slot-thumb {
  aspect-ratio: 9/16; border-radius: 8px; overflow: hidden; background: var(--bg);
  display: flex; align-items: center; justify-content: center; margin-bottom: 8px;
}
.ref-slot-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ref-slot-thumb .empty-label { color: var(--text-dim); font-size: 12px; }

.cut-image-row { margin-bottom: 10px; }
.cut-image-flex { display: flex; gap: 12px; }
.cut-image-thumb {
  flex: 0 0 92px; width: 92px; aspect-ratio: 9/16; border-radius: 10px; overflow: hidden;
  background: var(--bg-card2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
}
.cut-image-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cut-image-thumb .empty-label { color: var(--text-dim); font-size: 11px; text-align: center; padding: 4px; }
.cut-image-info { flex: 1; min-width: 0; }
.cut-image-title { font-weight: 700; font-size: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.cut-image-info .btn-row .btn { flex: 0 0 auto; }

/* ---- Phase 4: Timeline ---- */
.btn.secondary.active-zoom { background: var(--accent); color: #0c0e16; border-color: var(--accent); }

#tl-scroll-outer { overflow-x: auto; margin-top: 10px; -webkit-overflow-scrolling: touch; }
.tl-track { display: flex; align-items: stretch; min-height: 30px; border-bottom: 1px solid var(--border); }
.tl-track:last-child { border-bottom: none; }
.tl-track-label {
  flex: 0 0 62px; width: 62px; font-size: 11px; color: var(--text-dim); font-weight: 700;
  display: flex; align-items: center; padding: 4px 6px; position: sticky; left: 0;
  background: var(--bg-card); z-index: 2;
}
.tl-track-lane { position: relative; min-height: 30px; }
.tl-track-empty { position: absolute; left: 4px; top: 6px; font-size: 11px; color: var(--text-dim); }

.tl-ruler { min-height: 20px; }
.tl-tick {
  position: absolute; top: 0; font-size: 10px; color: var(--text-dim); border-left: 1px solid var(--border);
  padding-left: 3px; height: 20px; line-height: 20px; white-space: nowrap;
}

.tl-block {
  position: absolute; top: 3px; height: 24px; border-radius: 6px; border: none; cursor: pointer;
  font-size: 10px; color: #0c0e16; font-weight: 700; text-align: left; padding: 0 6px;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.tl-block.video { background: var(--accent); }
.tl-block.voice { background: var(--accent2); }
.tl-block.sfx { background: #ffb84d; }
.tl-block.bgm { background: #b48cff; }
.tl-block.subtitle { background: #7fe0ff; }

.tl-playhead {
  position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger); z-index: 3;
  pointer-events: none;
}

.tl-qn { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.tl-qn .tl-qn-input { width: 76px; flex: 0 0 auto; }
.tl-qn .btn { flex: 0 0 auto; padding: 6px 8px; min-width: 0; }

.tl-event-row { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; }
.tl-warn-box { margin-top: 10px; }

/* Phase 5 — Preview/QC 화면 */
.preview-canvas-wrap { display: flex; justify-content: center; }
.preview-canvas {
  position: relative; width: 100%; max-width: 300px; aspect-ratio: 9 / 16;
  background: #000; border-radius: 10px; overflow: hidden; border: 1px solid var(--border);
}
.preview-img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  transform-origin: center center; will-change: transform, opacity;
}
.preview-fade-black { position: absolute; inset: 0; background: #000; pointer-events: none; }
.preview-subtitle {
  position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%);
  max-width: 88%; text-align: center; color: #fff; font-size: 15px; line-height: 1.4;
  background: rgba(0, 0, 0, 0.62); padding: 6px 12px; border-radius: 8px;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8); pointer-events: none;
}
.preview-readout {
  display: flex; justify-content: space-between; align-items: center; margin-top: 10px;
  font-size: 13px; color: var(--text-dim); font-variant-numeric: tabular-nums;
}
.preview-transport { justify-content: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.pv-scrub { cursor: pointer; touch-action: none; }

.qc-group { margin-top: 4px; }
.qc-item {
  display: block; width: 100%; text-align: left; border: none; border-radius: 8px;
  padding: 8px 10px; margin: 4px 0; font-size: 13px; color: var(--text); background: var(--bg-card2);
  font-family: inherit; cursor: default;
}
button.qc-item { cursor: pointer; }
button.qc-item:active { opacity: 0.8; }
.qc-item.qc-error { background: rgba(255, 110, 110, 0.16); border: 1px solid rgba(255, 110, 110, 0.4); }
.qc-item.qc-warning { background: rgba(255, 184, 77, 0.14); border: 1px solid rgba(255, 184, 77, 0.4); }
.qc-item.qc-info { background: rgba(127, 224, 255, 0.1); border: 1px solid rgba(127, 224, 255, 0.3); }

details > summary { list-style: none; }
details > summary::-webkit-details-marker { display: none; }

/* Phase 6 — production.json 미리보기가 모바일 기본 화면을 압도하지 않도록 자체 스크롤 영역만 준다. */
.json-scroll { max-height: 340px; overflow: auto; margin-top: 6px; }

/* Phase 7 — Service Worker Update 안내 배너. 화면 하단 탭바 위에 고정하고, 사용자가 명시적으로
   [지금 적용]/[나중에]를 누르기 전에는 어떤 자동 동작도 하지 않는다. */
.update-banner {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(64px + var(--safe-bottom));
  z-index: 50;
  margin: 0 auto;
  max-width: 560px;
  background: var(--bg-card2);
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  box-shadow: 0 6px 24px rgba(0,0,0,.35);
}
.update-banner span { font-size: 13px; color: var(--text); }
.update-banner-actions { display: flex; gap: 8px; }
.update-banner-actions button {
  border: none; border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer;
  font-family: inherit;
}
#update-apply-btn { background: var(--accent); color: #0c0e16; font-weight: 600; }
#update-later-btn { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }

/* ---------------------------------------------------------------------------
   v2.1-rc.1 — Responsive/Adaptive UI (작업지시서 1-A)

   원칙: 기기명이 아니라 viewport 폭으로만 분기한다. js/viewport.js가 <html>에 붙이는
   data-breakpoint(phone/tablet/desktop)를 우선 쓰고, JS가 아직 안 붙었거나 실패한 경우를
   대비해 동일한 폭 기준의 min-width 미디어쿼리를 함께 둔다(progressive fallback — 둘 다
   같은 값이라 충돌하지 않는다). 기존 phone 레이아웃(위쪽 규칙들)은 그대로 base로 남기고,
   여기서는 "폭이 넓을 때만" 규칙을 추가한다 — 기존 좁은 화면 동작은 건드리지 않는다.

   Fold 접힘/펼침, Galaxy Tab/iPad, Windows/Mac, 브라우저 리사이즈는 전부 이 폭 기반
   규칙 하나로 동일하게 대응된다 — 별도 기기 분기가 없다.
--------------------------------------------------------------------------- */

:root[data-breakpoint="tablet"] #app { max-width: 920px; }
:root[data-breakpoint="desktop"] #app { max-width: 1440px; padding-left:24px; padding-right:24px; }
@media (min-width: 600px) { #app { max-width: 920px; } }
@media (min-width: 1200px) { #app { max-width: 1440px; } }

/* 이미지/레퍼런스 그리드 — 넓은 화면에서는 칸 수를 늘려 스크롤을 줄인다. */
:root[data-breakpoint="tablet"] .img-grid,
:root[data-breakpoint="desktop"] .img-grid {
  grid-template-columns: repeat(6, 1fr);
}
:root[data-breakpoint="desktop"] .img-grid {
  grid-template-columns: repeat(8, 1fr);
}
:root[data-breakpoint="tablet"] .ref-grid,
:root[data-breakpoint="desktop"] .ref-grid {
  grid-template-columns: repeat(4, 1fr);
}

/* CUT 이미지 편집 행 — 세로로 쌓이던 썸네일+정보를 가로 폭이 있을 때 더 낙낙하게. */
:root[data-breakpoint="tablet"] .cut-image-thumb,
:root[data-breakpoint="desktop"] .cut-image-thumb {
  flex: 0 0 140px; width: 140px;
}

/* Preview 캔버스 — 좁은 화면에서만 300px로 제한하던 것을 넓은 화면에서 키운다(9:16 비율 유지). */
:root[data-breakpoint="tablet"] .preview-canvas { max-width: 420px; }
:root[data-breakpoint="desktop"] .preview-canvas { max-width: 480px; }

/* Timeline 트랙 라벨 폭 등 — 넓은 화면에서 잘리는 텍스트가 줄어들도록 살짝 확장. */
:root[data-breakpoint="desktop"] .tl-track-label { flex-basis: 84px; width: 84px; }

/* 탭바 — 데스크톱 폭 브라우저 창에서도 폭 전체로 늘어지지 않게 중앙 정렬 폭 맞춤(#app과 동일). */
:root[data-breakpoint="tablet"] .tabbar-inner { max-width: 920px; }
:root[data-breakpoint="desktop"] .tabbar-inner { max-width: 1440px; }

/* orientation=landscape이면서 phone 폭(접히지 않은 좁은 화면을 눕힌 경우)일 때는 세로 공간이
   부족하므로 상단 topbar 여백만 살짝 줄여 STEP 콘텐츠가 보이는 영역을 넓힌다. 레이아웃 자체를
   1열→2열로 바꾸지는 않는다(작업지시서: "공간이 충분하면" 2열 — phone landscape는 세로 높이가
   빠듯해 실익보다 회귀 위험이 크다고 판단, tablet 이상 폭에서만 실제 grid 확장을 적용한다). */
:root[data-breakpoint="phone"][data-orientation="landscape"] .topbar {
  margin-bottom: 10px;
}

/* ---- Quick Sync Mode 고정 컨트롤 바 (작업지시서 1-B) ----
   sticky — 스크롤 컨테이너(#app, body)를 기준으로 화면 상단 근처에 붙는다. 모바일 하단
   tabbar/safe-area와 겹치지 않도록 top 고정을 쓴다(하단 고정은 기존 tabbar/update-banner와
   z-index/공간이 겹친다). */
.quick-sync-bar {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-bottom: 12px;
  box-shadow: 0 4px 14px rgba(0,0,0,.25);
}
.quick-sync-bar .qs-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px;
}
.quick-sync-bar .qs-cut-label { font-weight: 800; color: var(--accent); font-size: 14px; }
.quick-sync-bar .qs-controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.quick-sync-bar .qs-controls .btn { flex: 0 0 auto; width: auto; padding: 8px 10px; }
.quick-sync-bar .qs-nudge { display: flex; gap: 4px; }
.quick-sync-bar .qs-hint { margin: 6px 0 0; }

/* ---- Caption Style Preset 편집 패널 (작업지시서 1-C) ---- */
.caption-style-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.caption-style-grid label { margin: 0; }
:root[data-breakpoint="tablet"] .caption-style-grid,
:root[data-breakpoint="desktop"] .caption-style-grid {
  grid-template-columns: repeat(3, 1fr);
}
.caption-style-grid .full { grid-column: 1 / -1; }
input[type=color] { width: 100%; height: 38px; padding: 2px; background: var(--bg-card2); border: 1px solid var(--border); border-radius: 8px; }
input[type=range] { width: 100%; }

/* ---------------------------------------------------------------------------
   v2.1-rc.2 — 홈 화면 브랜드 Hero (작업지시서 2)

   원칙: 새 에피소드 만들기/최근 에피소드 목록 등 기존 주요 진입 UI를 가리지 않는다 — Hero는
   그 위에 겹치지 않고 topbar 아래에 문서 흐름대로 자리를 차지한다. 이미지 자체 비율(16:9)을
   aspect-ratio로 고정해 좌우 잘림이 생기지 않게 하고(가로 폭은 항상 컨테이너 폭과 일치),
   화면이 낮아 max-height가 강제로 개입하는 경우에만 위아래를 살짝 자르는 정도로 제한한다 —
   브랜드 문구(제목/부제)는 이미지 세로 중앙 밴드에 배치되어 있어 위아래 크롭에는 안전하다.
   기존 Responsive breakpoint(data-breakpoint) 규칙을 그대로 재사용하고 새 기기 분기를
   만들지 않는다. */
.home-hero {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  max-height: 150px;
  margin-bottom: 14px;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
  background: linear-gradient(160deg, #05060d 0%, #0a0e1c 45%, #0c0616 100%);
}
:root[data-breakpoint="tablet"] .home-hero {
  max-width: 640px;
  max-height: 220px;
  margin-left: auto;
  margin-right: auto;
}
:root[data-breakpoint="desktop"] .home-hero {
  max-width: 760px;
  max-height: 260px;
  margin-left: auto;
  margin-right: auto;
}
@media (min-width: 600px) {
  .home-hero { max-width: 640px; max-height: 220px; margin-left: auto; margin-right: auto; }
}
@media (min-width: 1200px) {
  .home-hero { max-width: 760px; max-height: 260px; }
}

/* 세로 공간이 빠듯한 경우(휴대폰을 눕혔을 때 등)는 폭 기준 breakpoint(phone/tablet/desktop)와
   무관하게 항상 압축한다 — 예: 800x360처럼 폭만 보면 tablet 취급되는 랜드스케이프 폰도 실제
   세로 공간은 360px뿐이라, 폭 기준 규칙만으로는 Hero가 "새 에피소드 만들기" 버튼을 화면 밖으로
   밀어낼 수 있다. 기기명이 아니라 실제 뷰포트 "높이" 값 하나로만 분기한다(작업지시서 1-A의
   viewport 기반 원칙을 브랜드 Hero에도 동일하게 적용) — 아래 세 breakpoint 규칙과 같은
   특이도(attribute+class)로 만들어 소스 순서상 마지막에 두는 것만으로 확실히 이긴다. */
@media (max-height: 420px) {
  :root[data-breakpoint="phone"] .home-hero,
  :root[data-breakpoint="tablet"] .home-hero,
  :root[data-breakpoint="desktop"] .home-hero,
  .home-hero {
    max-height: 72px;
    max-width: none;
    margin-bottom: 6px;
  }
}
.home-hero-img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}
/* home.js가 로드 실패 시 img.hidden=true로 뒤집는다 — 위와 같은 이유(author display:block이
   UA [hidden]{display:none}보다 우선함)로 명시적 재선언이 필요하다. */
.home-hero-img[hidden] { display: none; }
/* 이미지 로드 실패 시 home.js가 <img>를 hidden 처리하고 이 fallback을 보여준다 — 이미지
   없이도 브랜드 문구("쇼츠 트래커 / 아이디어부터 완성까지")가 실제 텍스트로 항상 보인다.
   주의: 아래 .home-hero-fallback { display:flex }가 author stylesheet 규칙이라서, 브라우저
   기본(UA stylesheet)의 [hidden]{display:none}보다 우선순위가 높다(author > UA는 특이도와
   무관하게 항상 이긴다) — [hidden] 상태에서도 display:flex가 그대로 적용되어 fallback이
   이미지 위에 겹쳐 보이는 버그가 있었다. hidden 상태를 명시적으로 다시 눌러준다. */
.home-hero-fallback {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  text-align: center;
  padding: 8px;
}
.home-hero-fallback[hidden] { display: none; }
.home-hero-fallback-title {
  font-size: 22px;
  font-weight: 800;
  background: linear-gradient(90deg, #7cf8ff 0%, #b28bff 45%, #ff7ce0 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.home-hero-fallback-sub {
  font-size: 13px;
  color: var(--text-dim);
}

/* v2.1-rc.3 — Caption font picker: 선택한 폰트를 실제 한글 샘플로 즉시 확인 */
.caption-font-sample {
  margin-top: 8px;
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg-card2);
  color: var(--text);
  font-size: 18px;
  font-weight: 700;
  line-height: 1.35;
  text-align: center;
  word-break: keep-all;
}

/* v2.1-rc.4 — Caption Style 통합 실시간 미리보기.
   실제 9:16 자막 좌표계를 축소해서 폰트뿐 아니라 색/굵기/외곽선/그림자/배경/정렬/위치를
   같은 샘플에서 확인한다. */
.caption-style-live-preview-wrap {
  margin: 12px 0 14px;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--bg-card2);
}
.caption-style-live-preview-stage {
  position: relative;
  width: min(46vw, 180px);
  max-width: 100%;
  aspect-ratio: 9 / 16;
  margin: 0 auto;
  overflow: hidden;
  border-radius: 10px;
  border: 1px solid var(--border);
  background:
    linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.18)),
    #171b27;
}
.caption-style-live-preview-text {
  position: absolute;
  display: -webkit-box;
  word-break: keep-all;
  overflow-wrap: anywhere;
  box-sizing: border-box;
}


/* v2.1-rc.5 — 모바일 자막 설정 중에도 미리보기를 계속 볼 수 있도록 sticky 처리.
   페이지 전체를 고정하지 않고 자막 스타일 카드 내부에서만 상단에 붙인다. */
.caption-style-live-preview-sticky {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 8px);
  z-index: 18;
  box-shadow: 0 10px 24px rgba(0,0,0,.22);
}
.caption-style-live-preview-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
.caption-style-live-preview-title {
  font-size: 13px;
  font-weight: 800;
  color: var(--text);
}
.caption-preview-toggle {
  flex: 0 0 auto;
  min-height: 30px;
  padding: 4px 10px;
}
.caption-style-live-preview-body[hidden] { display: none !important; }
.caption-style-live-preview-wrap.is-collapsed {
  padding-top: 8px;
  padding-bottom: 8px;
}
.caption-style-live-preview-wrap.is-collapsed .caption-style-live-preview-toolbar { margin-bottom: 0; }

/* phone에서는 sticky 상태가 설정 영역을 과하게 가리지 않도록 프리뷰를 더 작게 축소한다. */
:root[data-breakpoint="phone"] .caption-style-live-preview-sticky .caption-style-live-preview-stage {
  width: min(31vw, 124px);
}
:root[data-breakpoint="phone"] .caption-style-live-preview-sticky .caption-style-live-preview-hint {
  margin: 4px 0 0;
  text-align: center;
  font-size: 11px;
  line-height: 1.3;
}

/* tablet/desktop은 조작 영역이 넓어서 기존 크기를 유지한다. */
:root[data-breakpoint="tablet"] .caption-style-live-preview-sticky,
:root[data-breakpoint="desktop"] .caption-style-live-preview-sticky {
  top: 10px;
}

/* v4.0 Alpha 14 — 모바일 이미지 제작 작업바: 핵심 2개만 전면, 보조 도구는 접기 */
.image-primary-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.image-primary-actions .btn {
  width: 100%;
  min-width: 0;
  white-space: normal;
  line-height: 1.35;
}
.image-more-tools {
  margin-top: 10px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg-card2);
  overflow: hidden;
}
.image-more-tools summary {
  cursor: pointer;
  padding: 10px 12px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-dim);
  list-style: none;
}
.image-more-tools summary::-webkit-details-marker { display: none; }
.image-more-tools summary::after { content: " ▾"; }
.image-more-tools[open] summary::after { content: " ▴"; }
.image-secondary-actions {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  padding: 0 10px 10px;
}
@media (max-width: 390px) {
  .image-primary-actions { grid-template-columns: 1fr; }
}

/* v4.0 Beta 17 — 자막 경고/미리보기/핵심 컨트롤을 모바일 한 화면 안에 최대한 모은다. */
:root[data-breakpoint="phone"] .caption-quick-controls { gap: 8px; }
:root[data-breakpoint="phone"] .caption-style-live-preview-wrap { margin: 8px 0; padding: 8px; }
:root[data-breakpoint="phone"] .caption-style-live-preview-sticky .caption-style-live-preview-stage { width: min(25vw, 96px); }
:root[data-breakpoint="phone"] .caption-style-live-preview-sticky .caption-style-live-preview-hint { display:none; }


/* v4.1.0 Alpha 1 — capability-based input adaptation.
   특정 기기명이 아니라 coarse pointer 여부로 터치 타깃만 보강한다. */
@media (pointer: coarse) {
  .btn, .step-chip, .tabbar button { min-height: 44px; }
  input[type=text], input[type=number], input[type=date], textarea, select { min-height: 44px; }
}

/* v4.1.0 Alpha 3 — Mobile touch UX pass.
   데이터/렌더링 로직은 건드리지 않고 좁은 viewport와 coarse pointer에서만 조작성을 보강한다. */
:root[data-breakpoint="phone"] #app {
  padding-left: 12px;
  padding-right: 12px;
}
:root[data-breakpoint="phone"] .card {
  padding: 13px;
  margin-bottom: 12px;
}

/* 16px 미만 form font-size로 인한 모바일 브라우저 자동 확대를 피한다. */
:root[data-breakpoint="phone"] input[type=text],
:root[data-breakpoint="phone"] input[type=number],
:root[data-breakpoint="phone"] input[type=date],
:root[data-breakpoint="phone"] textarea,
:root[data-breakpoint="phone"] select {
  font-size: 16px;
}
:root[data-breakpoint="phone"] textarea { min-height: 88px; }

/* 휴대폰에서는 4열 이미지 슬롯이 너무 작아지므로 3열로 확대한다. */
:root[data-breakpoint="phone"] .img-grid { grid-template-columns: repeat(3, 1fr); }

/* 작은 보조 버튼도 손가락으로 누르기 충분한 높이를 확보한다. */
@media (pointer: coarse) {
  .btn.small,
  .quick-sync-bar .qs-controls .btn,
  .tl-qn .btn,
  .caption-preview-toggle {
    min-height: 44px;
  }
  input[type=range] {
    min-height: 44px;
    touch-action: pan-x;
  }

  /* Timeline은 시각 높이만 키워 기존 시간 계산/pxPerSec에는 영향이 없다. */
  .tl-track { min-height: 40px; }
  .tl-track-lane { min-height: 40px; }
  .tl-block {
    top: 4px;
    height: 32px;
    min-width: 28px;
    padding-left: 7px;
    padding-right: 7px;
  }
  .tl-track-empty { top: 11px; }
  .tl-ruler { min-height: 28px; }
  .tl-tick { height: 28px; line-height: 28px; }
  #tl-scroll-outer { overscroll-behavior-x: contain; }
}

/* 아주 좁은 휴대폰에서 퀵싱크 버튼이 화면 밖으로 밀리지 않도록 줄바꿈을 강제한다. */
:root[data-breakpoint="phone"] .quick-sync-bar .qs-controls {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
:root[data-breakpoint="phone"] .quick-sync-bar .qs-controls .btn {
  width: 100%;
  min-width: 0;
}
:root[data-breakpoint="phone"] .quick-sync-bar .qs-nudge {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}


/* v4.1.0 Alpha 6 — Mobile resume/navigation UX.
   모바일에서 다음 작업 CTA와 단계 레일을 쉽게 찾게 하되, 실제 STEP/저장/렌더링 로직은 바꾸지 않는다. */
#next-action-card .next-action-jump { margin-top: 8px; width: 100%; }
:root[data-breakpoint="phone"] .steps-scroll {
  position: sticky;
  top: 0;
  z-index: 16;
  margin-left: -12px;
  margin-right: -12px;
  padding: 8px 12px 9px;
  background: rgba(18, 21, 31, .96);
  border-bottom: 1px solid var(--border);
}


/* v4.1.0 Alpha 7 — Mobile Flow Bundle.
   긴 제작 화면에서 단계 레일/다음 할 일/상단 이동을 다시 찾느라 생기는 스크롤을 줄인다.
   데이터 저장 및 렌더링 로직은 변경하지 않는다. */
.mobile-episode-toolbar { display:none; }
.episode-card-side { display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex:0 0 auto; }
.episode-resume-label { font-size:11px; color:var(--accent); font-weight:700; white-space:nowrap; }

:root[data-breakpoint="phone"] #app {
  padding-bottom: calc(136px + var(--safe-bottom));
}
:root[data-breakpoint="phone"] .topbar h1 {
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
:root[data-breakpoint="phone"] #next-action-card {
  padding-top:11px;
  padding-bottom:11px;
}
:root[data-breakpoint="phone"] #next-action-card h3 { margin-bottom:7px; }
:root[data-breakpoint="phone"] #next-action-card .episode-progress-hint { margin-bottom:4px; }
:root[data-breakpoint="phone"] .episode-card { align-items:flex-start; gap:10px; }
:root[data-breakpoint="phone"] .episode-card .next-hint {
  margin-top:5px;
  color:var(--accent2);
  line-height:1.35;
}
:root[data-breakpoint="phone"] .episode-card-side { max-width:38%; }
:root[data-breakpoint="phone"] .episode-resume-label {
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
}

:root[data-breakpoint="phone"] .mobile-episode-toolbar {
  display:flex;
  position:fixed;
  left:12px;
  right:12px;
  bottom:calc(66px + var(--safe-bottom));
  z-index:18;
  max-width:536px;
  margin:0 auto;
  gap:8px;
  padding:7px;
  border:1px solid var(--border);
  border-radius:12px;
  background:rgba(29,32,48,.96);
  backdrop-filter:blur(10px);
  box-shadow:0 8px 26px rgba(0,0,0,.28);
}
:root[data-breakpoint="phone"] .mobile-tool-btn {
  min-height:42px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--bg-card2);
  color:var(--text);
  font:inherit;
  font-size:12px;
  font-weight:700;
  padding:8px 10px;
  cursor:pointer;
}
:root[data-breakpoint="phone"] .mobile-tool-btn:first-child { flex:0 0 74px; }
:root[data-breakpoint="phone"] .mobile-tool-btn.primary {
  flex:1 1 auto;
  min-width:0;
  background:var(--accent);
  color:#0c0e16;
  border-color:var(--accent);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
:root[data-breakpoint="phone"] .mobile-tool-done {
  flex:1 1 auto;
  display:flex;
  min-width:0;
  min-height:42px;
  align-items:center;
  justify-content:center;
  color:var(--accent2);
  font-size:12px;
  font-weight:700;
}

@media (max-height: 520px) and (pointer: coarse) {
  :root[data-breakpoint="phone"] .mobile-episode-toolbar { display:none; }
  :root[data-breakpoint="phone"] #app { padding-bottom:calc(84px + var(--safe-bottom)); }
}

/* Alpha 7 bundled follow-up — sticky stack collision guard.
   ①~⑥ STEP rail이 top:0에 붙은 상태에서 Quick Sync/자막 sticky preview가 같은 자리를 차지하지 않도록
   phone에서만 두 번째 sticky 층의 top offset을 확보한다. */
:root[data-breakpoint="phone"] {
  --mobile-step-rail-offset: 62px;
}
:root[data-breakpoint="phone"] .quick-sync-bar {
  top: var(--mobile-step-rail-offset);
  z-index: 12;
}
:root[data-breakpoint="phone"] .caption-style-live-preview-sticky {
  top: calc(var(--mobile-step-rail-offset) + env(safe-area-inset-top, 0px) + 8px);
  z-index: 13;
}
:root[data-breakpoint="phone"] #step-body .card,
:root[data-breakpoint="phone"] #step-body details {
  scroll-margin-top: calc(var(--mobile-step-rail-offset) + 10px);
}
@media (max-height: 520px) and (pointer: coarse) {
  :root[data-breakpoint="phone"] .quick-sync-bar { top: 0; }
  :root[data-breakpoint="phone"] .caption-style-live-preview-sticky { top: calc(env(safe-area-inset-top, 0px) + 8px); }
}


/* v4.1.0 Alpha 12 — unobtrusive save state */
.episode-save-state { font-size:12px; color:var(--muted); white-space:nowrap; padding:4px 2px; }
.episode-save-state[data-state="saving"] { opacity:.78; }
.episode-save-state[data-state="error"] { color:var(--danger); font-weight:700; }

/* ==========================================================================
   V4.2.0 Alpha 1 — Adaptive UI profiles
   Compact <600 / Tablet 600-1199 / Workstation >=1200
   ========================================================================== */

.ui-profile-chip {
  display:inline-flex;
  align-items:center;
  padding:4px 8px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--bg-card2);
  color:var(--accent2);
  font-size:11px;
  white-space:nowrap;
}

/* Tablet: iPad mini class. More room, but deliberately not PC/workstation density. */
:root[data-ui-profile="tablet"] #app {
  width:100%;
  max-width:920px;
  padding-left:20px;
  padding-right:20px;
}
:root[data-ui-profile="tablet"] .card { padding:18px; }
:root[data-ui-profile="tablet"] .img-grid { grid-template-columns:repeat(5,1fr); }
:root[data-ui-profile="tablet"][data-orientation="landscape"] .img-grid { grid-template-columns:repeat(6,1fr); }
:root[data-ui-profile="tablet"] .episode-workspace { display:block; }
:root[data-ui-profile="tablet"] .steps-scroll {
  position:sticky;
  top:0;
  z-index:6;
  background:rgba(20,22,31,.96);
  backdrop-filter:blur(10px);
  padding:8px 0 10px;
}
:root[data-ui-profile="tablet"] .preview-canvas { max-width:440px; }

/* Workstation: wide Galaxy Tab Ultra landscape / Windows-class viewport. */
:root[data-ui-profile="workstation"] #app {
  width:100%;
  max-width:1440px;
  padding-left:24px;
  padding-right:24px;
}
:root[data-ui-profile="workstation"] .episode-workspace {
  display:grid;
  grid-template-columns:190px minmax(0,1fr);
  gap:20px;
  align-items:start;
}
:root[data-ui-profile="workstation"] .episode-workspace > .steps-scroll {
  position:sticky;
  top:12px;
  display:flex;
  flex-direction:column;
  overflow:visible;
  gap:6px;
  margin:0;
  padding:10px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--bg-card);
}
:root[data-ui-profile="workstation"] .episode-workspace > .steps-scroll .step-chip {
  width:100%;
  white-space:normal;
  border-radius:10px;
  padding:10px 12px;
}
:root[data-ui-profile="workstation"] #step-body { min-width:0; }
:root[data-ui-profile="workstation"] .img-grid { grid-template-columns:repeat(8,1fr); }
:root[data-ui-profile="workstation"] .ref-grid { grid-template-columns:repeat(4,1fr); }
:root[data-ui-profile="workstation"] .caption-style-grid { grid-template-columns:repeat(4,1fr); }
:root[data-ui-profile="workstation"] .preview-canvas { max-width:520px; }
:root[data-ui-profile="workstation"] .mobile-episode-toolbar { display:none !important; }
:root[data-ui-profile="workstation"] .topbar { margin-bottom:18px; }
:root[data-ui-profile="workstation"] #next-action-card { max-width:none; }

/* Fallback without JS. Unique threshold keeps iPad mini landscape in Tablet layout. */
@media (min-width:1200px) {
  #app { max-width:1440px; }
}


/* ==========================================================================
   V4.2.0 Alpha 2 — Mobile production acceleration
   ========================================================================== */

/* Compact phone: keep the next-action information but reclaim vertical workspace. */
:root[data-ui-profile="compact"] #next-action-card {
  padding:10px 12px;
  margin-bottom:8px;
}
:root[data-ui-profile="compact"] #next-action-card h3 {

/* Bottom bar becomes a predictable previous/current/next production navigator. */

</style></head><body><div id="app"></div><nav id="tabbar" class="tabbar"></nav><script type="module">const M={"js_v420a12/model.js":"// 데이터 모델 & 기본값 팩토리\n//\n// v2: formatType(\"text_card\" | \"cut\")과 seriesType은 완전히 독립적인 축이다.\n// - text_card: 기존 v1 구조(scenes, narrationAudioName) — 100% 그대로 보존.\n// - cut: v2 신규 구조(cuts, globalVisualBible, styleReference 등).\n// 두 포맷을 하나의 필드셋으로 억지로 합치지 않고, 공통 필드만 공유한다.\n\n// ---- STEP 정의 (포맷별로 완전히 분리) ----\n\nexport const STEPS_TEXT_CARD = [\n  { key: \"plan\", label: \"① 기획\" },\n  { key: \"scenes\", label: \"② 대본/씬\" },\n  { key: \"duration\", label: \"③ 재생시간\" },\n  { key: \"images\", label: \"④ 이미지검수\" },\n  { key: \"narration\", label: \"⑤ 나레이션타이밍\" },\n  { key: \"export\", label: \"⑥ 내보내기\" },\n];\n\nexport const STEPS_CUT = [\n  { key: \"plan\", label: \"① 기획\" },\n  { key: \"cutImages\", label: \"② 이미지\" },\n  { key: \"cutAudio\", label: \"③ 오디오\" },\n  { key: \"timeline\", label: \"④ 타임라인\" },\n  { key: \"preview\", label: \"⑤ 미리보기/QC\" },\n  { key: \"cutExport\", label: \"⑥ 내보내기\" },\n];\n\n// Alpha 7: story/CUT은 자동 제작의 기본 흐름에서 제거하고 필요할 때만 여는 고급 편집 화면으로 유지한다.\n// 직접 URL #/episode/:id/story 로 접근할 수 있으며 이미지 단계의 '고급 CUT 편집' 버튼에서 진입한다.\n\n// 과거 코드 호환용 별칭 (예전에는 STEPS 하나만 있었음)\nexport const STEPS = STEPS_TEXT_CARD;\n\nexport function stepsFor(formatType) {\n  return formatType === \"cut\" ? STEPS_CUT : STEPS_TEXT_CARD;\n}\n\n\n// Alpha 17 — 채널, 배포 형식, 제작 강도는 기존 seriesType/formatType과 독립된 축이다.\nexport const CONTENT_CHANNELS = Object.freeze([\n  { key: \"unassigned\", label: \"미지정·기타\", description: \"나중에 채널 지정\" },\n  { key: \"senior_longform\", label: \"시니어 롱폼\", description: \"사연·인생·가족·감정형\" },\n  { key: \"economy_current\", label: \"경제·시사·정치\", description: \"근거와 사실 검증 중심\" },\n  { key: \"odd_today\", label: \"오늘도 이상하다\", description: \"유머·생활정보·일반 뉴스\" },\n  { key: \"sports\", label: \"스포츠\", description: \"경기·선수·기록·화제\" },\n]);\nexport const CONTENT_FORMATS = Object.freeze([\n  { key: \"shorts\", label: \"Shorts\" },\n  { key: \"longform\", label: \"Longform\" },\n]);\nexport const PRODUCTION_PROFILES = Object.freeze([\n  { key: \"fast\", label: \"FAST\", description: \"속도 우선 · 필요한 품질에 도달하면 빠르게 출고\" },\n  { key: \"standard\", label: \"STANDARD\", description: \"속도와 완성도의 균형 · 기본 권장\" },\n  { key: \"premium\", label: \"PREMIUM\", description: \"IP 일관성과 시각 완성도 우선\" },\n]);\nexport function contentChannelLabel(key) { return CONTENT_CHANNELS.find((x) => x.key === key)?.label || \"미지정·기타\"; }\nexport function contentFormatLabel(key) { return CONTENT_FORMATS.find((x) => x.key === key)?.label || \"Shorts\"; }\nexport function productionProfileLabel(key) { return PRODUCTION_PROFILES.find((x) => x.key === key)?.label || \"STANDARD\"; }\n\n\n// Alpha 12 — 제작 진행 상태와 기존 STEP 상태(ep.status)는 서로 다른 축이다.\n// lifecycleStatus는 홈 정리/보관/휴지통에만 사용하고 기존 STEP 진행 판정은 건드리지 않는다.\nexport const EPISODE_LIFECYCLE = Object.freeze({\n  draft: \"임시저장\",\n  ready: \"제작대기\",\n  in_progress: \"제작중\",\n  review: \"검수대기\",\n  publish_ready: \"발행대기\",\n  published: \"발행완료\",\n  on_hold: \"보류\",\n  trash: \"폐기\",\n});\n\nexport const EPISODE_LIFECYCLE_KEYS = Object.freeze(Object.keys(EPISODE_LIFECYCLE));\n\nexport function normalizeEpisodeLifecycle(value, legacyStatus = \"\") {\n  if (EPISODE_LIFECYCLE_KEYS.includes(value)) return value;\n  return legacyStatus === \"업로드완료\" ? \"published\" : \"in_progress\";\n}\n\nexport function episodeLifecycleLabel(value, legacyStatus = \"\") {\n  return EPISODE_LIFECYCLE[normalizeEpisodeLifecycle(value, legacyStatus)];\n}\n\nexport const STATUS_BY_STEP = {\n  plan: \"기획\",\n  scenes: \"대본작성\",\n  duration: \"대본작성\",\n  images: \"이미지검수\",\n  narration: \"나레이션동기화\",\n  export: \"확정\",\n};\n\nexport const STATUS_BY_STEP_CUT = {\n  plan: \"기획\",\n  story: \"스토리작성\",\n  cutImages: \"이미지검수\",\n  cutAudio: \"오디오작업\",\n  timeline: \"타임라인편집\",\n  preview: \"QC\",\n  cutExport: \"확정\",\n};\n\nexport function statusByStepFor(formatType) {\n  return formatType === \"cut\" ? STATUS_BY_STEP_CUT : STATUS_BY_STEP;\n}\n\nexport const BADGE_COLOR_PRESETS = [\n  { name: \"블루\", rgb: [60, 90, 200] },\n  { name: \"레드\", rgb: [180, 60, 40] },\n  { name: \"청록\", rgb: [40, 140, 170] },\n  { name: \"그린\", rgb: [30, 160, 120] },\n  { name: \"퍼플\", rgb: [100, 80, 180] },\n  { name: \"핑크\", rgb: [200, 70, 130] },\n  { name: \"옐로우\", rgb: [200, 160, 40] },\n  { name: \"화이트\", rgb: [220, 220, 230] },\n];\n\n// CUT의 장면 목적 프리셋 (자유 입력도 허용하므로 select 힌트용)\nexport const CUT_PURPOSES = [\"HOOK\", \"긴장\", \"발견\", \"반전\", \"개그\", \"엔딩\", \"기타\"];\n\nexport const MOTION_TYPES = [\n  \"AUTO_BEATS\",\n  \"STATIC\",\n  \"PUSH_IN_SLOW\",\n  \"PUSH_IN\",\n  \"PUNCH_IN\",\n  \"ZOOM_OUT\",\n  \"PAN_LEFT\",\n  \"PAN_RIGHT\",\n  \"PAN_UP\",\n  \"PAN_DOWN\",\n  \"CUSTOM\",\n];\n\nexport const TRANSITION_TYPES = [\"HARD_CUT\", \"FADE\", \"DISSOLVE\"];\n\n// Motion preset → 합리적인 기본값. 일반 사용자는 preset만 골라도 충분해야 하고,\n// CUSTOM을 고르거나 \"상세 설정\"을 열었을 때만 scale/pan을 직접 만진다.\n// panX/panY는 프레임 대비 상대 이동량(대략 -1~1 범위 참고값, 절대 픽셀이 아니다).\nexport const MOTION_PRESET_DEFAULTS = {\n  AUTO_BEATS: null,\n  STATIC: { startScale: 1, endScale: 1, panX: 0, panY: 0, easing: \"linear\" },\n  PUSH_IN_SLOW: { startScale: 1, endScale: 1.08, panX: 0, panY: 0, easing: \"ease-in-out\" },\n  PUSH_IN: { startScale: 1, endScale: 1.15, panX: 0, panY: 0, easing: \"ease-in-out\" },\n  PUNCH_IN: { startScale: 1, endScale: 1.3, panX: 0, panY: 0, easing: \"ease-out\" },\n  ZOOM_OUT: { startScale: 1.15, endScale: 1, panX: 0, panY: 0, easing: \"ease-in-out\" },\n  PAN_LEFT: { startScale: 1.1, endScale: 1.1, panX: -0.12, panY: 0, easing: \"linear\" },\n  PAN_RIGHT: { startScale: 1.1, endScale: 1.1, panX: 0.12, panY: 0, easing: \"linear\" },\n  PAN_UP: { startScale: 1.1, endScale: 1.1, panX: 0, panY: -0.12, easing: \"linear\" },\n  PAN_DOWN: { startScale: 1.1, endScale: 1.1, panX: 0, panY: 0.12, easing: \"linear\" },\n  // CUSTOM은 강제 기본값이 없다 — 사용자가 마지막으로 쓰던 값을 그대로 유지한다.\n  CUSTOM: null,\n};\n\nexport function applyMotionPreset(cut, presetType) {\n  cut.motion = cut.motion || {};\n  cut.motion.type = presetType;\n  if (presetType !== \"AUTO_BEATS\") delete cut.motion.visualBeats;\n  const defaults = MOTION_PRESET_DEFAULTS[presetType];\n  if (defaults) Object.assign(cut.motion, defaults);\n  return cut;\n}\n\n// 이미지 QC 상태. \"생성중\"은 데이터 호환을 위해 남겨두지만(값이 있어도 안전하게 처리),\n// Alpha 4부터 이미지 프록시가 연결된 경우 Nano Banana 생성을 호출할 수 있다. 생성중은 자동 상태로만 사용한다.\nexport const IMAGE_STATUSES = [\"미생성\", \"생성중\", \"검수필요\", \"PASS\", \"RETRY\", \"확정\"];\nexport const IMAGE_STATUS_SELECTABLE = [\"검수필요\", \"PASS\", \"RETRY\", \"확정\"];\nexport const IMAGE_APPROVED_STATUSES = [\"PASS\", \"확정\"];\nexport const IMAGE_GENERATORS = [\"Gemini\", \"Grok\", \"GPT\", \"기타\"];\nexport const RETRY_REASONS = [\"공간관계\", \"캐릭터 불일치\", \"표정\", \"구도\", \"스타일\", \"해부학\", \"기타\"];\n\nexport function isImageApproved(cut) {\n  return !!(cut?.image?.assetId && IMAGE_APPROVED_STATUSES.includes(cut.image.status));\n}\n\nexport function uid() {\n  return \"ep_\" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);\n}\n\nexport function cutUid() {\n  return \"cut_\" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36);\n}\n\nexport function dialogueUid() {\n  return \"dl_\" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36);\n}\n\nexport function audioEventUid() {\n  return \"aev_\" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36);\n}\n\n// ---- 오디오 이벤트(Phase 3) ----\n// CUT 내부 오디오는 narration/dialogue/sfx/silence를 하나의 공통 배열(audioEvents)로 관리한다.\n// 모든 이벤트가 동일한 flat shape을 갖되, 타입별로 의미 있게 쓰는 필드만 다르다:\n//   narration: assetId, text, volume, fadeIn/fadeOut\n//   dialogue:  assetId, speaker, text, voice, volume, fadeIn/fadeOut (+ sourceDialogueId로 STEP2 대사와 연결)\n//   sfx:       assetId, name, volume, fadeIn/fadeOut, required(선택 여부 — NextActionEngine 판정용)\n//   silence:   assetId 없음, duration 필수\n// start는 항상 \"CUT 시작 시점 기준 상대시간(초)\"이다.\nexport const AUDIO_EVENT_TYPES = [\"narration\", \"dialogue\", \"sfx\", \"silence\"];\n\nexport function newAudioEvent(type = \"sfx\") {\n  return {\n    id: audioEventUid(),\n    type,\n    start: 0,\n    duration: type === \"silence\" ? 1 : null, // silence는 duration 필수, 나머지는 파일 첨부 시 자동 측정됨\n    // sourceDuration = 파일 metadata에서 측정된 \"원본 그대로\"의 길이(첨부/교체할 때마다 갱신).\n    // duration = 실제 타임라인에 쓰이는 \"편집용\" 길이 — 처음 첨부 시 sourceDuration과 같은 값으로\n    // 시작하지만, Timeline에서 사용자가 따로 조정하면 duration만 바뀌고 sourceDuration은 보존된다\n    // (원본 측정값과 편집값이 서로 다른 개념임을 데이터로 명확히 구분).\n    sourceDuration: null,\n    assetId: null, // silence는 사용하지 않음\n    volume: 1,\n    fadeIn: 0,\n    fadeOut: 0,\n    // dialogue 전용 연결 필드 — narration/sfx/silence에서는 null\n    sourceDialogueId: null,\n    speaker: \"\",\n    text: \"\",\n    voice: \"\",\n    name: \"\", // sfx 전용\n    required: false, // sfx 전용 — true면 파일이 없을 때 NextActionEngine이 필요로 안내\n  };\n}\n\n// STEP 2의 dialogueLines(대본/창작 데이터)와 STEP 4의 audioEvents(실제 편집 타임라인 데이터)는\n// 별도 배열로 유지한다 — sourceDialogueId로만 연결한다(대사 순서 index로 연결하지 않는다).\nexport function newDialogueLine() {\n  return { id: dialogueUid(), speaker: \"\", text: \"\", offset: 0, voice: \"\" };\n}\n\nexport const BGM_ACTIONS = [\"continue\", \"lower\", \"raise\", \"stop\", \"fade_out\"];\n\nexport const AUDIO_WORKFLOWS = [\"attach_files\", \"external_tts\", \"none\"];\n\n// STEP 2(스토리) 완료 판정과 STEP 4(오디오)의 \"이 CUT에 나레이션/대사 콘텐츠가 있는가\" 판정이\n// 서로 다른 곳에서 각자 기준을 만들면 어긋나기 쉽다 — 한 곳(hasStoryContent)에서만 정의한다.\n// 대사는 speaker/voice/offset만 채워진 빈 행은 인정하지 않는다 — 실제 text가 있어야 한다.\nexport function hasStoryContent(cut) {\n  if (!cut) return false;\n  if (cut.narration && cut.narration.trim()) return true;\n  return (cut.dialogueLines || []).some((line) => line?.text && line.text.trim());\n}\n\n// CUT에 여러 오디오 이벤트가 있을 때 duration.measured는 \"가장 늦게 끝나는 이벤트의 끝 시각\"이다\n// (단순히 음성 파일 하나의 길이가 아니다). silence 이벤트도 포함한다.\n// duration이 아직 없는(파일 미첨부) 이벤트는 계산에서 제외한다.\nexport function computeMeasuredDuration(cut) {\n  const events = (cut?.audioEvents || []).filter((e) => e.duration != null);\n  if (!events.length) return null;\n  return Math.max(...events.map((e) => (e.start || 0) + e.duration));\n}\n\n// audioEvents가 바뀔 때마다 호출해서 duration.measured를 다시 계산해 넣는다.\n// manual > measured > estimated 우선순위 원칙은 그대로 유지된다(measured를 갱신할 뿐,\n// manual이 있으면 resolveCutDuration()에서 여전히 manual이 이긴다).\nexport function recalcMeasuredDuration(cut) {\n  if (!cut) return cut;\n  cut.duration = cut.duration || { manual: null, measured: null, estimated: null };\n  cut.duration.measured = computeMeasuredDuration(cut);\n  return cut;\n}\n\n// ---- text_card (레거시) 팩토리 — 기존 동작 그대로 보존 ----\n\nexport function newScene(i = 0) {\n  return {\n    badge: \"\",\n    panel: i === 0 || i % 3 === 0,\n    headline: \"\",\n    caption: \"\",\n    narration_line: \"\",\n    headline_size: null,\n    badge_color: [60, 90, 200],\n    bg_top: [12, 12, 22],\n    bg_bottom: [26, 28, 48],\n    countup: null,\n    extra_pad: 0,\n    measured_start: null,\n  };\n}\n\n// ---- cut (v2) 팩토리 — 신규 ----\n\nexport function newCut(i = 0) {\n  return {\n    id: cutUid(),\n    index: i,\n    purpose: \"\", // HOOK/긴장/발견/반전/개그/엔딩/기타 (CUT_PURPOSES 참고, 자유 입력 허용)\n    situation: \"\",\n    narration: \"\",\n    directorNote: \"\",\n    productionPrompt: \"\",\n    // rc.3(Master Narration Mode) — episode.audioMode === \"master_narration\"일 때만 의미를\n    // 갖는 필드. \"이 CUT이 통합 나레이션 파일 안에서 실제로 시작하는 지점(초)\"을 사용자가\n    // 재생하며 직접 마킹한 값이다. null이면 아직 마킹 안 함(단, index 0은 관례상 0초로 자동\n    // 취급 — getMasterStart() 참고). per_cut 모드에서는 그냥 쓰이지 않는 죽은 필드다.\n    masterStart: null,\n    dialogueLines: [], // [{ speaker, text, offset, voice }]\n    // Alpha 43 — Mixed Timeline. image는 항상 fallback 자산으로 보존하고, mediaType=video일 때만\n    // 외부 Flow MP4를 우선 사용한다. 기존 Episode는 migration에서 image 기본값을 받는다.\n    mediaType: \"image\", // image | video\n    video: { assetId: null, duration: null, trimStart: 0, trimEnd: null, mute: true },\n    image: {\n      assetId: null,\n      status: \"미생성\", // 미생성/생성중/검수필요/PASS/RETRY/확정\n      generator: \"\", // Gemini/Grok/GPT/기타\n      qcNote: \"\",\n      retryReason: \"\",\n    },\n    audioEvents: [], // [{ type: narration|dialogue|sfx|silence, ...}]\n    duration: {\n      manual: null, // 사용자가 직접 지정 — 최우선\n      measured: null, // 오디오 실측 — 차순위\n      estimated: null, // 글자수 기반 추정 — 참고값(최하위)\n    },\n    motion: {\n      type: \"STATIC\",\n      startScale: 1,\n      endScale: 1,\n      panX: 0,\n      panY: 0,\n      easing: \"linear\",\n    },\n    transition: \"HARD_CUT\",\n    transitionDuration: 0, // HARD_CUT은 항상 0. FADE/DISSOLVE에서만 의미 있는 값.\n    subtitle: { dialogue: true, narration: true },\n  };\n}\n\n// HARD_CUT은 항상 0초 — transition 타입을 바꿀 때 이 헬퍼로 강제한다(뷰마다 따로 구현하지 않도록).\nexport function setCutTransition(cut, type, duration) {\n  cut.transition = type;\n  cut.transitionDuration = type === \"HARD_CUT\" ? 0 : Math.max(0, Number(duration) || 0);\n  return cut;\n}\n\n// CUT 순서 변경/추가/삭제 후 index를 실제 배열 순서에 맞게 재계산한다.\n// 안정적인 id(cut.id)는 절대 건드리지 않는다 — asset 참조가 cutId를 키로 삼기 때문.\nexport function reindexCuts(cuts) {\n  cuts.forEach((c, i) => {\n    c.index = i;\n  });\n  return cuts;\n}\n\n// CUT 복제 — 텍스트/연출 필드는 그대로 복사하되, id는 새로 발급하고\n// 이미지/오디오/실측duration처럼 \"이 CUT 고유의 산출물\"은 복제하지 않고 초기화한다.\n// (이미지를 그대로 공유하면 한쪽에서 삭제할 때 참조무결성 처리가 다른 쪽까지 건드리게 되어 혼란스럽다.)\nexport function duplicateCut(cut) {\n  const clone = JSON.parse(JSON.stringify(cut));\n  clone.id = cutUid();\n  clone.mediaType = \"image\";\n  clone.video = { assetId: null, duration: null, trimStart: 0, trimEnd: null, mute: true };\n  clone.image = { assetId: null, status: \"미생성\", generator: \"\", qcNote: \"\", retryReason: \"\" };\n  clone.audioEvents = [];\n  clone.duration = { manual: null, measured: null, estimated: null };\n  // 복제된 CUT은 \"이 CUT 고유의 산출물\"이 아직 없는 새 CUT과 같다 — 마스터 나레이션 시작\n  // 마커도 이미지/오디오와 같은 원칙으로 초기화한다(원본의 마커를 그대로 물려받으면 두 CUT이\n  // 같은 시작점을 가리키게 되어 duration이 0/음수로 깨진다).\n  clone.masterStart = null;\n  return clone;\n}\n\n// duration 우선순위: manual > measured > estimated\nexport function resolveCutDuration(cut) {\n  const d = cut?.duration || {};\n  if (d.manual != null) return d.manual;\n  if (d.measured != null) return d.measured;\n  if (d.estimated != null) return d.estimated;\n  return null;\n}\n\n// ---- Master Narration Mode(rc.3) ----\n//\n// 실제 사용자 Workflow: GPT로 대본 확정 → CapCut에서 화자 하나로 전체 나레이션을 한 번에\n// 생성 → Tracker에 그 파일 1개를 등록 → 재생하면서 각 CUT이 실제로 시작하는 지점만 마킹 →\n// \"다음 마커 - 이 마커\" 로 CUT duration을 역산. CUT마다 별도 나레이션 파일을 만드는 것은\n// 기본 Workflow가 아니므로, 이 계산 결과를 cut.duration.measured에 그대로 써 넣어 기존\n// manual > measured > estimated 우선순위(resolveCutDuration)를 전혀 새로 만들지 않고 그대로\n// 재사용한다 — Timeline/Preview/production.json이 전부 resolveCutDuration() 하나만 보므로\n// \"서로 다른 duration을 계산\"할 여지 자체가 없다. describeCutDuration()(timeline.js)에서만\n// source를 \"measured\" 대신 \"master\"로 구분해 보여준다(우선순위/계산 결과는 동일).\n//\n// rc.4: CUT1(index 0)은 항상 0.00초로 고정한다 — 사용자가 다시 마킹해서 덮어쓸 수 없다(V2\n// 범위에서는 단순화). rc.3에서는 \"관례상 0초 자동 처리, 단 직접 마킹하면 그 값 우선\"으로\n// 두었는데, 이것이 Preview 재생 구조(합성 마스터 나레이션 블록의 globalStart가 항상 0이라는\n// 전제 — buildTimeline() 참고)와 충돌할 수 있다는 코드 리뷰 지적을 받아 규칙을 하나로\n// 통일했다. cut.masterStart 필드 자체는 지우지 않는다(과거에 이미 값이 저장돼 있어도 그냥\n// 무시할 뿐이다 — 비파괴적) — 다만 CUT1용 UI(cutAudioStep.js)에서 더 이상 마킹 버튼을\n// 노출하지 않으므로 앞으로 새로 저장될 일은 없다. intro/pre-roll offset이 필요해지면 이번\n// V2 범위가 아니라 별도 기능으로 설계한다.\nexport function getMasterStart(cut, index) {\n  if (index === 0) return 0;\n  return cut && cut.masterStart != null ? cut.masterStart : null;\n}\n\n// Master Narration의 CUT 시작 마커들로부터 각 CUT의 duration을 역산해 cut.duration.measured에\n// 채운다. 마커가 없거나(2번째 이후 CUT은 반드시 마킹 필요) 다음 마커가 현재 마커보다 앞서면\n// (순서가 뒤엉키면) 그 CUT은 계산하지 않고 null로 남긴다 — 억지로 값을 만들어내지 않는다,\n// NextActionEngine이 이 상태를 정직하게 blocker로 보고한다.\nexport function recalcMasterNarrationDurations(ep) {\n  if (!ep || ep.formatType !== \"cut\") return ep;\n  const cuts = ep.cuts || [];\n  const total = ep.masterNarration && ep.masterNarration.duration != null ? ep.masterNarration.duration : null;\n  const starts = cuts.map((c, i) => getMasterStart(c, i));\n  cuts.forEach((cut, i) => {\n    const start = starts[i];\n    let derived = null;\n    if (start != null) {\n      if (i < cuts.length - 1) {\n        const next = starts[i + 1];\n        if (next != null && next > start) derived = next - start;\n      } else if (total != null && total > start) {\n        derived = total - start;\n      }\n    }\n    cut.duration = cut.duration || { manual: null, measured: null, estimated: null };\n    cut.duration.measured = derived;\n  });\n  return ep;\n}\n\n// episode.audioMode(또는 그 모드에 영향을 주는 데이터: CUT 구성/마커/마스터 파일)가 바뀔\n// 때마다 이 함수 하나만 호출한다 — 두 모드가 서로 다른 곳에서 각자 cut.duration.measured를\n// 계산하다 어긋나는 일이 없도록 진입점을 하나로 통일한다. per_cut으로 전환/유지 중이면\n// 기존 recalcMeasuredDuration(오디오 이벤트 기반)으로, master_narration이면 마커 기반으로.\nexport function recalcAudioModeDurations(ep) {\n  if (!ep || ep.formatType !== \"cut\") return ep;\n  if (ep.audioMode === \"master_narration\") {\n    recalcMasterNarrationDurations(ep);\n  } else {\n    (ep.cuts || []).forEach((cut) => recalcMeasuredDuration(cut));\n  }\n  return ep;\n}\n\n// ---- episode 팩토리 ----\n// formatType 기본값은 \"cut\" — v2 신규 에피소드는 CUT형이 기본이다.\n// 기존 v1 레코드는 migration.js에서 formatType: \"text_card\"가 부여된다(여기서는 신규 생성만 다룬다).\n\nexport function newEpisode(seriesType = \"general_issue\", formatType = \"cut\") {\n  const now = Date.now();\n  const common = {\n    id: uid(),\n    seriesType,\n    formatType,\n    channelKey: \"unassigned\",\n    contentFormat: \"shorts\",\n    productionProfile: \"standard\",\n    // V5 Automation Core — 채널/형식별 반복 제작 규칙의 단일 상태.\n    automationPlan: {\n      schemaVersion: \"1.0\",\n      mode: \"auto_first\",\n      seamlessLoop: {\n        enabled: true,\n        requiredForEconomyShorts: true,\n        openingIntent: \"마지막 장면의 공간/상황과 자연스럽게 이어지는 시작\",\n        closingIntent: \"첫 장면으로 다시 이어져도 끝/시작 경계가 튀지 않는 마무리\"\n      },\n      longform: {\n        enabled: false,\n        targetMinutes: 20,\n        chapterCount: 7,\n        visualChangeSeconds: 18,\n        narrationMode: \"master_narration\",\n        autoQc: true,\n        autoStoryboard: true,\n        autoTimeline: true,\n        scenePlan: []\n      }\n    },\n    title: \"\",\n    date: \"\",\n    subject: \"\",\n    sources: [],\n    status: \"기획\",\n    lifecycleStatus: \"draft\",\n    lifecycleChangedAt: now,\n    trashedAt: null,\n    metaDescription: \"\",\n    metaHashtags: \"\",\n    metaTitleCandidates: \"\",\n    metaSelectedTitle: \"\",\n    metaTags: \"\",\n    metaPinnedComment: \"\",\n    metaThumbnail: \"\",\n    // V4 Alpha 20: CUT 이미지와 분리된 episode-level 썸네일 제작 상태\n    thumbnail: null,\n    createdAt: now,\n    updatedAt: now,\n  };\n\n  if (formatType === \"text_card\") {\n    return {\n      ...common,\n      scenes: Array.from({ length: 8 }, (_, i) => newScene(i)),\n      narrationAudioName: \"\",\n    };\n  }\n\n  // formatType === \"cut\"\n  return {\n    ...common,\n    thumbnail: { schemaVersion: \"1.0\", conceptId: \"auto\", resolvedConceptId: seriesType === \"two_year_intern\" ? \"character_focus\" : seriesType === \"horror\" ? \"curiosity\" : \"channel_default\", customConcept: \"\", headline: \"\", subline: \"\", sourceCutIndex: 0, prompt: \"\", assetId: null, status: \"planned\", updatedAt: null },\n    cuts: [], // CUT 개수 고정 없음 — 사용자가 자유롭게 추가\n    globalVisualBible: \"\",\n    styleReferenceAssetId: null,\n    characterReferenceAssetId: null,\n    // fadeIn/fadeOut(초)/fadeCurve(Phase 5) — 실제 볼륨 페이드는 Preview 재생에서만 쓰인다.\n    // 기존 데이터에 이 필드들이 없으면(Phase 4 이전 episode) migration.js가 0/\"linear\"로\n    // 안전하게 채운다 — 파괴적 변경 없음. fadeCurve는 지금은 \"linear\"만 실제로 동작하지만,\n    // 향후 ease-in/ease-out/custom을 추가할 수 있도록 문자열 필드로 미리 분리해둔다.\n    bgm: { assetId: null, start: 0, end: null, volume: 1, fadeIn: 0, fadeOut: 0, fadeCurve: \"linear\", cutActions: {} },\n    // 오디오를 어떻게 준비할지: 파일 직접 첨부(기본) / 외부 TTS로 대체 / 오디오 없음.\n    // 확장 가능하게 값만 두고, Phase 3에서는 \"attach_files\" 흐름만 실제로 구현한다.\n    audioWorkflow: \"attach_files\",\n    // rc.3(Master Narration Mode) — 실제 사용자 Workflow(CapCut 등에서 화자 하나로 통합\n    // 나레이션 1개를 만든 뒤, 그 파일 안에서 CUT 시작점만 마킹해 duration을 역산)를 반영한\n    // 오디오 준비 방식. \"master_narration\"(기본/권장 — 신규 CUT 에피소드) | \"per_cut\"(CUT마다\n    // 개별 나레이션 파일을 붙이는 기존 방식, Advanced Mode로 계속 지원). 기존(마이그레이션된)\n    // 에피소드는 이 필드가 원래 없었으므로 migration.js가 \"per_cut\"으로 채워 기존 동작을\n    // 그대로 보존한다(non-destructive) — 신규 에피소드만 여기서 기본값 master_narration을 받는다.\n    audioMode: \"master_narration\",\n    // audioMode===\"master_narration\"일 때만 쓰는 단일 파일 슬롯. 파일명은 절대 분석하지\n    // 않는다(사용자가 이미 \"전체 나레이션\" 슬롯에 첨부했다는 것 자체가 컨텍스트이므로).\n    masterNarration: { assetId: null, duration: null },\n    // Timeline을 사용자가 실제로 \"검토했다\"는 명시적 확인 시각(Phase 4) — null이면 미검토.\n    // 자동 계산(duration/경고 없음)만으로는 검토 완료로 치지 않는다. Timeline에 영향을 주는\n    // 데이터가 바뀌면 invalidateTimelineReview()로 다시 null로 되돌려 재검토를 요구한다.\n    timelineReviewedAt: null,\n    // Preview/QC(Phase 5)를 사용자가 실제로 \"검토했다\"는 명시적 확인 시각 — null이면 미검토.\n    // QC ERROR가 0건이라는 자동 판정만으로는 검토 완료로 치지 않는다. 실제 렌더 결과에 영향을\n    // 주는 데이터가 바뀌면 invalidatePreviewReview()로 다시 null로 되돌려 재검토를 요구한다.\n    previewReviewedAt: null,\n    // Phase 6: production.json 렌더 기본값 — 지금은 편집 화면이 없지만(조건 5번 \"향후 변경\n    // 가능하도록 구조를 고려\"), 나중에 설정 화면이 생기면 이 필드만 채우면 된다.\n    renderSettings: { width: 1080, height: 1920, fps: 30 },\n    // Phase 6: production.json을 마지막으로 \"생성\"(다운로드 또는 최종 확정)한 시각/그 시점의\n    // fingerprint. episode 안에 production.json 전체를 중복 저장하지 않는다(조건 20번) —\n    // 필요할 때 production.js가 다시 계산할 수 있으므로 이 최소 메타데이터만 남긴다.\n    lastProductionGeneratedAt: null,\n    lastProductionRevision: null,\n    // V4 Alpha 1 — AI Provider와 무관한 작업공간 상태. 실제 API 호출/키는 저장하지 않는다.\n    aiWorkspace: {\n      contractVersion: \"1.0\",\n      providerId: null,\n      modelId: \"\",\n      status: \"idle\",\n      lastTaskType: null,\n      lastRequestAt: null,\n      lastResultAt: null,\n      lastError: \"\",\n      promptInput: \"\",\n      lastResult: null,\n    },\n    // V4 Alpha 1 — Built-in 제작 Recipe 선택/적용 상태. 커스텀 Recipe 저장은 후속 Alpha 범위.\n   // v2.1-rc.3 — 모바일에서 고를 수 있는 한글 폰트 후보를 확장한다. 폰트 파일 자체를 앱에\n  // 번들하지 않는 원칙은 그대로 유지한다. 각 항목은 기기/브라우저에 해당 폰트가 있으면\n  // 그 폰트를 사용하고, 없으면 cssStack의 다음 안전 폰트로 자동 대체된다. previewStep.js가\n  // 실제 사용 가능 여부를 확인해 선택창과 미리보기에 표시한다.\n  // probeFamily: Font Loading API에서 실제 설치/사용 가능 여부를 확인할 대표 family 이름.\n  { id: \"kyobo_handwriting_2025\", label: \"교보손글씨2025\", cssStack: `\"교보손글씨2025\", \"Noto Sans CJK KR\", \"Noto Sans KR\", system-ui, sans-serif`, probeFamily: \"교보손글씨2025\", knownUnbundled: true },\n  { id: \"samsung_one_korean\", label: \"SamsungOne Korean\", cssStack: `\"SamsungOneKorean\", \"SamsungOne\", \"Noto Sans CJK KR\", system-ui, sans-serif`, probeFamily: \"SamsungOneKorean\", knownUnbundled: true },\n  { id: \"samsung_one\", label: \"SamsungOne\", cssStack: `\"SamsungOne\", \"Noto Sans CJK KR\", system-ui, sans-serif`, probeFamily: \"SamsungOne\", knownUnbundled: true },\n  { id: \"noto_sans_cjk_kr\", label: \"Noto Sans CJK KR\", cssStack: `\"Noto Sans CJK KR\", \"Noto Sans KR\", system-ui, sans-serif`, probeFamily: \"Noto Sans CJK KR\", knownUnbundled: true },\n  { id: \"noto_sans_kr\", label: \"Noto Sans KR\", cssStack: `\"Noto Sans KR\", \"Noto Sans CJK KR\", system-ui, sans-serif`, probeFamily: \"Noto Sans KR\", knownUnbundled: true },\n  { id: \"noto_serif_cjk_kr\", label: \"Noto Serif CJK KR\", cssStack: `\"Noto Serif CJK KR\", \"Noto Serif KR\", serif`, probeFamily: \"Noto Serif CJK KR\", knownUnbundled: true },\n  { id: \"noto_serif_kr\", label: \"Noto Serif KR\", cssStack: `\"Noto Serif KR\", \"Noto Serif CJK KR\", serif`, probeFamily: \"Noto Serif KR\", knownUnbundled: true },\n  { id: \"nanum_gothic\", label: \"나눔고딕\", cssStack: `\"NanumGothic\", \"나눔고딕\", \"Noto Sans CJK KR\", system-ui, sans-serif`, probeFamily: \"NanumGothic\", knownUnbundled: true },\n  { id: \"nanum_myeongjo\", label: \"나눔명조\", cssStack: `\"NanumMyeongjo\", \"나눔명조\", \"Noto Serif CJK KR\", serif`, probeFamily: \"NanumMyeongjo\", knownUnbundled: true },\n  { id: \"malgun_gothic\", label: \"맑은 고딕\", cssStack: `\"Malgun Gothic\", \"맑은 고딕\", \"Noto Sans CJK KR\", system-ui, sans-serif`, probeFamily: \"Malgun Gothic\", knownUnbundled: true },\n  { id: \"apple_sd_gothic_neo\", label: \"Apple SD Gothic Neo\", cssStack: `\"Apple SD Gothic Neo\", \"Noto Sans KR\", system-ui, sans-serif`, probeFamily: \"Apple SD Gothic Neo\", knownUnbundled: true },\n  { id: \"system_default\", label: \"시스템 기본 글꼴\", cssStack: `-apple-system, system-ui, \"Noto Sans CJK KR\", sans-serif`, probeFamily: null, knownUnbundled: false },\n];\nexport const DEFAULT_CAPTION_FONT_ID = \"kyobo_handwriting_2025\";\n\nexport const CAPTION_FONT_WEIGHTS = [400, 500, 600, 700, 800];\nexport const CAPTION_TEXT_ALIGNS = [\"left\", \"center\", \"right\"];\n\n// CHANNEL_TOP_CAPTION — 현재 채널 CapCut 레퍼런스를 그대로 옮긴 기본 프리셋(작업지시서 1-C\n// \"현재 채널 레퍼런스\" 항목 그대로): 상단 중앙, 흰 글자, 얇은 검정 외곽선, 최대 2줄, 폭\n// 70~75%, 상단 14~16% 위치, 배경 박스 없음, 은은한 그림자.\nexport function newCaptionStyle() {\n  return {\n    presetId: \"CHANNEL_TOP_CAPTION\",\n    fontId: DEFAULT_CAPTION_FONT_ID,\n    fontSizePct: 4.2, // canvas 폭(=9:16 프레임 폭) 대비 %. previewStep.js가 canvas 실제 px 폭에 곱해 px로 환산한다.\n    fontWeight: 700,\n    textAlign: \"center\",\n    topPct: 15, // 프레임 세로 기준 상단에서부터 %\n    horizontalAlign: \"center\", // \"center\" | \"left\" | \"right\" — center면 leftPct 무시\n    leftPct: 50,\n    maxWidthPct: 72, // 프레임 가로 기준 %\n    maxLines: 2,\n    lineHeight: 1.35,\n    textColor: \"#ffffff\",\n    strokeColor: \"#000000\",\n    strokeWidth: 1.5, // px 유사 단위(canvas 폭 대비 정규화는 previewStep.js가 처리)\n    shadow: true,\n    shadowIntensity: 0.5, // 0~1\n    backgroundBox: false,\n    backgroundColor: \"#000000\",\n    backgroundOpacity: 0.55,\n    backgroundRadius: 8,\n  };\n}\n\nconst CAPTION_STYLE_NUMERIC_RANGES = {\n  fontSizePct: [1, 15],\n  fontWeight: [100, 900],\n  topPct: [0, 95],\n  leftPct: [0, 100],\n  maxWidthPct: [20, 100],\n  maxLines: [1, 6],\n  lineHeight: [1, 2.5],\n  strokeWidth: [0, 8],\n  shadowIntensity: [0, 1],\n  backgroundOpacity: [0, 1],\n  backgroundRadius: [0, 40],\n};\n\nfunction clamp(n, min, max) {\n  return Math.max(min, Math.min(max, n));\n}\n\nfunction isHexColor(s) {\n  return typeof s === \"string\" && /^#[0-9a-fA-F]{6}$/.test(s);\n}\n\n// 프리셋으로 이름 붙여 저장된 미리 정의된 스타일 목록 — 지금은 기본 1개뿐이지만, 향후 채널별\n// 프리셋이 늘어나도 이 배열만 확장하면 된다(UI의 \"프리셋 선택\" 드롭다운이 이 배열을 그대로 씀).\nexport const CAPTION_STYLE_PRESETS = [{ id: \"CHANNEL_TOP_CAPTION\", label: \"채널 기본(상단 중앙)\", build: newCaptionStyle }];\n\n// episode.captionStyle을 안전하게 읽는 단일 진입점. 아래 세 경우 모두 안전한 완전한 객체를\n// 반환한다 — 호출부(previewStep.js)가 매번 null 체크/필드별 기본값을 반복하지 않아도 된다:\n//   1) 필드 자체가 없는 기존 episode(마이그레이션 대상 아님 — 비파괴 fallback)\n//   2) 값이 있지만 일부 필드가 빠져 있는 경우(과거 버전에서 저장된 부분 객체)\n//   3) 값이 있지만 범위를 벗어나거나 타입이 잘못된 경우(수동 조작/손상된 백업 복원 등) — clamp\nexport function resolveCaptionStyle(ep) {\n  const base = newCaptionStyle();\n  const raw = ep && typeof ep.captionStyle === \"object\" && ep.captionStyle !== null ? ep.captionStyle : {};\n  const out = { ...base, ...raw };\n\n  Object.entries(CAPTION_STYLE_NUMERIC_RANGES).forEach(([key, [min, max]]) => {\n    const v = Number(out[key]);\n    out[key] = Number.isFinite(v) ? clamp(v, min, max) : base[key];\n  });\n  out.maxLines = Math.round(out.maxLines);\n  out.fontWeight = Math.round(out.fontWeight / 100) * 100;\n  if (!CAPTION_FONT_WEIGHTS.includes(out.fontWeight)) out.fontWeight = base.fontWeight;\n\n  if (!CAPTION_TEXT_ALIGNS.includes(out.textAlign)) out.textAlign = base.textAlign;\n  if (![\"center\", \"left\", \"right\"].includes(out.horizontalAlign)) out.horizontalAlign = base.horizontalAlign;\n  if (!isHexColor(out.textColor)) out.textColor = base.textColor;\n  if (!isHexColor(out.strokeColor)) out.strokeColor = base.strokeColor;\n  if (!isHexColor(out.backgroundColor)) out.backgroundColor = base.backgroundColor;\n  if (!CAPTION_FONT_OPTIONS.some((f) => f.id === out.fontId)) out.fontId = base.fontId;\n  out.shadow = !!out.shadow;\n  out.backgroundBox = !!out.backgroundBox;\n  out.presetId = typeof out.presetId === \"string\" && out.presetId ? out.presetId : base.presetId;\n\n  return out;\n}\n\nexport function captionStyleSignature(epOrStyle) {\n  const style = epOrStyle && epOrStyle.captionStyle ? resolveCaptionStyle(epOrStyle) : resolveCaptionStyle({ captionStyle: epOrStyle || {} });\n  const keys = [\n    \"fontId\",\"fontSizePct\",\"fontWeight\",\"textAlign\",\"topPct\",\"horizontalAlign\",\"leftPct\",\n    \"maxWidthPct\",\"maxLines\",\"lineHeight\",\"textColor\",\"strokeColor\",\"strokeWidth\",\"shadow\",\n    \"shadowIntensity\",\"backgroundBox\",\"backgroundColor\",\"backgroundOpacity\",\"backgroundRadius\"\n  ];\n  return keys.map((k) => `${k}:${String(style[k])}`).join(\"|\");\n}\n\nexport function captionFontStack(fontId) {\n  const found = CAPTION_FONT_OPTIONS.find((f) => f.id === fontId);\n  return found ? found.cssStack : CAPTION_FONT_OPTIONS[0].cssStack;\n}\n","js_v420a12/aiContracts.js":"// V4 AI Provider-independent contract foundation.\n// Alpha 1에서는 실제 네트워크/API 호출을 하지 않는다. 이 모듈은 어떤 Provider(OpenAI,\n// Anthropic, Gemini 등)를 붙여도 Tracker 내부 모델이 바뀌지 않도록 요청/응답 계약만 정의한다.\n\nimport { newCut, newDialogueLine } from \"./model.js\";\n\nexport const AI_CONTRACT_VERSION = \"1.0\";\nexport const AI_PROVIDER_IDS = [\"openai\", \"anthropic\", \"google\", \"custom\"];\nexport const AI_TASK_TYPES = [\"story_draft\", \"rewrite\", \"image_prompts\"];\n\nexport function newAiWorkspace() {\n  return {\n    contractVersion: AI_CONTRACT_VERSION,\n    providerId: null,\n    modelId: \"\",\n    status: \"idle\", // idle | ready | running | succeeded | failed\n    lastTaskType: null,\n    lastRequestAt: null,\n    lastResultAt: null,\n    lastError: \"\",\n    promptInput: \"\",\n    lastResult: null,\n  };\n}\n\nexport function newStoryDraft(seriesType = \"general_issue\") {\n  return {\n    contractVersion: AI_CONTRACT_VERSION,\n    seriesType,\n    title: \"\",\n    subject: \"\",\n    hook: \"\",\n    summary: \"\",\n    cutCountSuggested: 0,\n    cuts: [],\n    imageStyleNote: \"\",\n    warnings: [],\n  };\n}\n\nfunction isNarratorSpeaker(value) {\n  const s = String(value || \"\").trim().toLowerCase().replace(/\\s+/g, \"\");\n  return s === \"나레이터\" || s === \"내레이터\" || s === \"narrator\";\n}\n\nfunction normalizeDraftCut(c, i) {\n  const narration = String(c?.narration || \"\").trim();\n  const rawDialogueLines = Array.isArray(c?.dialogueLines)\n    ? c.dialogueLines.map((d) => ({ speaker: String(d?.speaker || \"\").trim(), text: String(d?.text || \"\").trim(), voice: String(d?.voice || \"\").trim() }))\n    : [];\n  const nonEmptyLines = rawDialogueLines.filter((d) => d.text);\n  const narratorOnly = nonEmptyLines.length > 0 && nonEmptyLines.every((d) => isNarratorSpeaker(d.speaker));\n\n  // Alpha 32 — Story API가 일반 나레이션을 dialogueLines의 \"나레이터\" 대사로 반환해도\n  // Tracker 내부에서는 narration 필드가 단일 진실 소스가 되도록 즉시 정규화한다.\n  // 실제 캐릭터 대사가 하나라도 섞여 있으면 건드리지 않아 다중화자 콘텐츠를 보존한다.\n  const normalizedNarration = narratorOnly\n    ? (narration || nonEmptyLines.map((d) => d.text).join(\" \"))\n    : narration;\n  const dialogueLines = narratorOnly ? [] : rawDialogueLines;\n\n  return {\n    index: i,\n    purpose: String(c?.purpose || \"\").trim(),\n    situation: String(c?.situation || \"\").trim(),\n    narration: normalizedNarration,\n    speaker: String(c?.speaker || \"\").trim(),\n    directorNote: String(c?.directorNote || \"\").trim(),\n    imagePrompt: String(c?.imagePrompt || \"\").trim(),\n    dialogueLines,\n  };\n}\n\nexport function normalizeStoryDraft(raw, seriesType = \"general_issue\") {\n  const base = newStoryDraft(seriesType);\n  const src = raw && typeof raw === \"object\" ? raw : {};\n  const cuts = Array.isArray(src.cuts) ? src.cuts : [];\n  return {\n    ...base,\n    ...src,\n    contractVersion: AI_CONTRACT_VERSION,\n    seriesType: src.seriesType || seriesType,\n    title: String(src.title || \"\").trim(),\n    subject: String(src.subject || \"\").trim(),\n    hook: String(src.hook || \"\").trim(),\n    summary: String(src.summary || \"\").trim(),\n    imageStyleNote: String(src.imageStyleNote || \"\").trim(),\n    warnings: Array.isArray(src.warnings) ? src.warnings.map(String) : [],\n    cuts: cuts.map(normalizeDraftCut),\n    cutCountSuggested: Number.isFinite(Number(src.cutCountSuggested)) ? Math.max(0, Math.round(Number(src.cutCountSuggested))) : cuts.length,\n  };\n}\n\nexport function validateStoryDraft(draft) {\n  const d = normalizeStoryDraft(draft, draft?.seriesType);\n  const errors = [];\n  if (!d.title && !d.subject) errors.push(\"title 또는 subject가 필요합니다.\");\n  if (!d.cuts.length) errors.push(\"CUT이 1개 이상 필요합니다.\");\n  d.cuts.forEach((c, i) => {\n    if (!c.narration && !c.dialogueLines.some((x) => x.text)) errors.push(`CUT ${i + 1}: 나레이션 또는 대사가 필요합니다.`);\n  });\n  return { valid: errors.length === 0, errors, normalized: d };\n}\n\n// AI 결과를 실제 Episode 구조로 옮기는 단일 변환기. Alpha 1에서는 UI에서 호출하지 않지만,\n// Alpha 2 Story Writer가 이 함수를 그대로 사용하도록 미리 계약을 고정한다.\nexport function storyDraftToEpisodePatch(draft) {\n  const { valid, errors, normalized } = validateStoryDraft(draft);\n  if (!valid) return { valid: false, errors, patch: null };\n  const cuts = normalized.cuts.map((src, i) => {\n    const cut = newCut(i);\n    cut.purpose = src.purpose;\n    cut.situation = src.situation;\n    cut.narration = src.narration;\n    if (src.speaker) cut.voiceSpeaker = src.speaker;\n    cut.directorNote = src.directorNote;\n    cut.productionPrompt = src.imagePrompt;\n    cut.dialogueLines = src.dialogueLines.filter((d) => d.text).map((d) => ({ ...newDialogueLine(), speaker: d.speaker, text: d.text, voice: d.voice }));\n    return cut;\n  });\n  return {\n    valid: true,\n    errors: [],\n    patch: {\n      title: normalized.title || normalized.subject,\n      subject: normalized.subject || normalized.title,\n      cuts,\n      globalVisualBible: normalized.imageStyleNote,\n      metaDescription: normalized.summary || normalized.hook || \"\",\n      aiStoryMeta: {\n        contractVersion: normalized.contractVersion,\n        hook: normalized.hook,\n        summary: normalized.summary,\n        cutCountSuggested: normalized.cutCountSuggested,\n        warnings: [...(normalized.warnings || [])],\n      },\n    },\n  };\n}\n","js_v420a12/aiProvider.js":"import { normalizeStoryDraft, validateStoryDraft } from \"./aiContracts.js\";\n\nconst STORAGE_KEY = \"shortsTracker.aiProvider.v4\";\nconst DEFAULTS = Object.freeze({\n  providerId: \"openai\",\n  proxyUrl: \"https://shorts-tracker-v4-proxy.vercel.app\",\n  modelId: \"gpt-5-mini\",\n  reasoningEffort: \"low\",\n  timeoutMs: 90000,\n});\n\nexport function loadAiProviderSettings() {\n  try {\n    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || \"{}\");\n    const merged = { ...DEFAULTS, ...(raw && typeof raw === \"object\" ? raw : {}) };\n    // Stable: 프록시의 실제 지원 모델과 UI/로컬 설정을 단일 값으로 맞춘다.\n    // 과거 빌드에 저장된 Luna/Terra/Sol 표시는 실제 프록시 모델이 아니므로 모두 정규화한다.\n    if (merged.modelId !== DEFAULTS.modelId) merged.modelId = DEFAULTS.modelId;\n    return merged;\n  } catch (_) {\n    return { ...DEFAULTS };\n  }\n}\n\nexport function saveAiProviderSettings(patch = {}) {\n  const next = { ...loadAiProviderSettings(), ...patch, modelId: DEFAULTS.modelId };\n  // API secret은 절대 브라우저 설정에 받거나 저장하지 않는다.\n  delete next.apiKey;\n  localStorage.setItem(STORAGE_KEY, JSON.stringify(next));\n  return next;\n}\n\nexport function clearAiProviderSettings() {\n  localStorage.removeItem(STORAGE_KEY);\n}\n\nfunction cleanBaseUrl(url) {\n  return String(url || \"\").trim().replace(/\\/+$/, \"\");\n}\n\nexport function providerReady(settings = loadAiProviderSettings()) {\n  return settings.providerId === \"openai\" && /^https:\\/\\//i.test(cleanBaseUrl(settings.proxyUrl));\n}\n\nasync function fetchJson(url, init, timeoutMs) {\n  const controller = new AbortController();\n  const timer = setTimeout(() => controller.abort(), Math.max(5000, Number(timeoutMs) || DEFAULTS.timeoutMs));\n  try {\n    const res = await fetch(url, { ...init, signal: controller.signal });\n    const text = await res.text();\n    let data = null;\n    try { data = text ? JSON.parse(text) : null; } catch (_) {}\n    if (!res.ok) {\n      const message = data?.error?.message || data?.error || data?.message || text || `HTTP ${res.status}`;\n      throw new Error(String(message));\n    }\n    return data;\n  } catch (err) {\n    if (err?.name === \"AbortError\") {\n      throw new Error(`AI 요청 시간이 초과되었습니다. (${Math.round(Math.max(5000, Number(timeoutMs) || DEFAULTS.timeoutMs) / 1000)}초)`);\n    }\n    throw err;\n  } finally {\n    clearTimeout(timer);\n  }\n}\n\nexport async function checkAiProvider(settings = loadAiProviderSettings()) {\n  if (!providerReady(settings)) return { ok: false, reason: \"proxy_not_configured\" };\n  try {\n    const base = cleanBaseUrl(settings.proxyUrl);\n    const data = await fetchJson(`${base}/api/health`, { method: \"GET\", headers: { Accept: \"application/json\" } }, 15000);\n    return { ok: Boolean(data?.ok), ...data };\n  } catch (err) {\n    return { ok: false, reason: \"network_error\", message: err?.message || String(err) };\n  }\n}\n\nexport async function generateStoryDraft({ topic, seriesType, recipe }) {\n  const settings = loadAiProviderSettings();\n  if (!providerReady(settings)) throw new Error(\"OpenAI 프록시 URL이 아직 설정되지 않았습니다.\");\n  const base = cleanBaseUrl(settings.proxyUrl);\n  const payload = {\n    contractVersion: \"1.0\",\n    taskType: \"story_draft\",\n    providerId: \"openai\",\n    modelId: settings.modelId || DEFAULTS.modelId,\n    reasoningEffort: settings.reasoningEffort || \"low\",\n    input: {\n      topic: String(topic || \"\").trim(),\n      seriesType,\n      targetSeconds: recipe?.story?.targetSeconds || 45,\n      targetCutCount: recipe?.story?.targetCutCount || 8,\n      imageStyleNote: recipe?.image?.styleNote || \"\",\n    },\n  };\n  const data = await fetchJson(`${base}/api/story`, {\n    method: \"POST\",\n    headers: { \"Content-Type\": \"application/json\", Accept: \"application/json\" },\n    body: JSON.stringify(payload),\n  }, settings.timeoutMs);\n  const draft = normalizeStoryDraft(data?.draft || data?.result || data, seriesType);\n  const check = validateStoryDraft(draft);\n  if (!check.valid) throw new Error(`AI 응답 구조 오류: ${check.errors.join(\" / \")}`);\n  return { draft: check.normalized, meta: data?.meta || {} };\n}\n\n\n// V5 Alpha 9 — Claude는 대본 작성 전용 Provider로 분리한다.\n// API secret은 Vercel Proxy에만 존재하며 브라우저에는 절대 노출하지 않는다.\nexport async function checkClaudeProvider(settings = loadAiProviderSettings()) {\n  const base = cleanBaseUrl(settings.proxyUrl);\n  if (!/^https:\\/\\//i.test(base)) return { ok: false, reason: \"proxy_not_configured\" };\n  try {\n    const data = await fetchJson(`${base}/api/claude-health`, {\n      method: \"GET\",\n      headers: { Accept: \"application/json\" },\n    }, 15000);\n    return { ok: Boolean(data?.ok), ...data };\n  } catch (err) {\n    return { ok: false, reason: \"network_error\", message: err?.message || String(err) };\n  }\n}\n\nexport async function generateClaudeLongformDraft({ handoff, targetMinutes = 15, chapterCount = 6 }) {\n  const settings = loadAiProviderSettings();\n  const base = cleanBaseUrl(settings.proxyUrl);\n  if (!/^https:\\/\\//i.test(base)) throw new Error(\"Claude 프록시 URL이 아직 설정되지 않았습니다.\");\n  if (!handoff || handoff.contentFormat !== \"longform\") throw new Error(\"Longform 소재를 먼저 선택해주세요.\");\n\n  const input = {\n    title: String(handoff.title || \"\").trim(),\n    summary: String(handoff.summary || \"\").trim(),\n    whyNow: String(handoff.whyNow || \"\").trim(),\n    viewerValue: String(handoff.viewerValue || \"\").trim(),\n    verifiedFacts: Array.isArray(handoff.verifiedFacts) ? handoff.verifiedFacts : [],\n    claimsToVerify: Array.isArray(handoff.claimsToVerify) ? handoff.claimsToVerify : [],\n    sources: Array.isArray(handoff.sources) ? handoff.sources : [],\n    hookCandidates: Array.isArray
