f (!c.image?.assetId || status === \"미생성\") {\n      const promptReady = !!String(c.productionPrompt || \"\").trim();\n      actions.push(\n        makeAction(ep, {\n          id: `cuts-image-missing-${c.id}`,\n          priority: promptReady ? PRIORITY.REQUIRED : PRIORITY.BLOCKER,\n          step: \"cutImages\",\n          target: n,\n          message: promptReady\n            ? `CUT ${n} 이미지 제작 대기 · 프롬프트 준비 완료`\n            : `CUT ${n} 이미지가 없고 Production Prompt도 비어 있습니다.`,\n        })\n      );\n    } else if (status === \"생성중\") {\n      actions.push(\n        makeAction(ep, {\n          id: `cuts-image-generating-${c.id}`,\n          priority: PRIORITY.REQUIRED,\n          step: \"cutImages\",\n          target: n,\n          message: `CUT ${n} 이미지가 생성 중입니다.`,\n        })\n      );\n    } else if (status === \"검수필요\") {\n      actions.push(\n        makeAction(ep, {\n          id: `cuts-image-review-${c.id}`,\n          priority: PRIORITY.REQUIRED,\n          step: \"cutImages\",\n          target: n,\n          message: `CUT ${n} 이미지를 검수해주세요.`,\n        })\n      );\n    } else if (status === \"RETRY\") {\n      actions.push(\n        makeAction(ep, {\n          id: `cuts-image-retry-${c.id}`,\n          priority: PRIORITY.REQUIRED,\n          step: \"cutImages\",\n          target: n,\n          message: `CUT ${n} 이미지를 다시 제작해주세요.${c.image.retryReason ? ` (사유: ${c.image.retryReason})` : \"\"}`,\n          action: {\n            label: `CUT ${n} Production Prompt 복사하러 이동`,\n            href: `#/episode/${ep.id}/story`,\n          },\n        })\n      );\n    }\n    // PASS/확정 → 완료된 것으로 보고 별도 action을 만들지 않는다.\n  });\n\n  // 오디오 규칙 — \"CUT마다 audioEvents가 1개 이상 있어야 한다\"는 골격은 너무 단순하다.\n  // 실제로는 \"스토리에서 필요로 하는 오디오가 채워졌는가\"만 본다: 나레이션 텍스트가 있으면\n  // 나레이션 음성이, 대사 텍스트가 있으면 그 대사에 연결된 음성이, required SFX면 그 파일이\n  // 필요하다. 대사/나레이션이 전혀 없는 CUT은 오디오 없이도 정상 완료된다.\n  // FEATURE_AVAILABILITY.cutAudio가 false인 동안(오디오 STEP이 아직 없던 시절)에는 사용자가\n  // 만들 수 없는 화면을 위해 계속 필수 경고를 띄우지 않도록 이 규칙 자체를 건너뛴다.\n  if (FEATURE_AVAILABILITY.cutAudio) {\n    // rc.3(Master Narration Mode) — 실제 사용자 Workflow는 CUT마다 나레이션 파일을 따로\n    // 만드는 게 아니라, 통합 나레이션 파일 하나 + CUT 시작 마커다. 이 모드에서는 \"CUT N\n    // 나레이션 음성이 없습니다\" 같은(마치 CUT별 파일이 필요한 것처럼 들리는) 안내를 절대\n    // 띄우지 않는다 — 대신 실제로 사용자가 할 일(파일 첨부/마커 기록)을 그대로 안내한다.\n    if (ep.audioMode === \"master_narration\") {\n      if (!ep.masterNarration || !ep.masterNarration.assetId) {\n        actions.push(\n          makeAction(ep, {\n            id: \"master-narration-missing\",\n            priority: PRIORITY.BLOCKER,\n            step: \"cutAudio\",\n            message: \"전체 나레이션 파일을 첨부해주세요.\",\n          })\n        );\n      } else {\n        cuts.forEach((c, i) => {\n          if (i === 0) return; // CUT1은 관례상 0초 자동 처리 — 마킹 불필요(getMasterStart 참고)\n          const n = i + 1;\n          if (getMasterStart(c, i) == null) {\n            actions.push(\n              makeAction(ep, {\n                id: `master-marker-missing-${c.id}`,\n                priority: PRIORITY.BLOCKER,\n                step: \"cutAudio\",\n                target: n,\n                message: `CUT ${n} 시작시간이 아직 기록되지 않았습니다.`,\n              })\n            );\n          }\n        });\n      }\n    } else {\n      cuts.forEach((c, i) => {\n        const n = i + 1;\n        const events = c.audioEvents || [];\n        if (c.narration && c.narration.trim()) {\n          const hasNarrationAsset = events.some((e) => e.type === \"narration\" && e.assetId);\n          if (!hasNarrationAsset) {\n            actions.push(\n              makeAction(ep, {\n                id: `cuts-audio-narration-missing-${c.id}`,\n                priority: PRIORITY.BLOCKER,\n                step: \"cutAudio\",\n                target: n,\n                message: `CUT ${n} 나레이션 음성이 없습니다.`,\n              })\n            );\n          }\n        }\n      });\n    }\n\n    cuts.forEach((c, i) => {\n      const n = i + 1;\n      const events = c.audioEvents || [];\n\n      (c.dialogueLines || []).forEach((line) => {\n        if (!dialogueRequiresSeparateAudio(line, ep.audioMode)) return;\n        const evt = findDialogueAudioEvent(c, line.id);\n        if (!evt || !evt.assetId) {\n          const label = line.speaker ? `${line.speaker}: ${truncateForMessage(line.text)}` : truncateForMessage(line.text);\n          actions.push(\n            makeAction(ep, {\n              id: `cuts-audio-dialogue-missing-${c.id}-${line.id}`,\n              priority: PRIORITY.BLOCKER,\n              step: \"cutAudio\",\n              target: n,\n              message: `CUT ${n} 대사(\"${label}\") 음성이 없습니다.`,\n            })\n          );\n        }\n      });\n\n      events\n        .filter((e) => e.type === \"sfx\" && e.required && !e.assetId)\n        .forEach((e) => {\n          actions.push(\n            makeAction(ep, {\n              id: `cuts-audio-sfx-missing-${c.id}-${e.id}`,\n              priority: PRIORITY.REQUIRED,\n              step: \"cutAudio\",\n              target: n,\n              message: `CUT ${n} SFX \"${e.name || \"이름 없음\"}\" 파일이 없습니다.`,\n            })\n          );\n        });\n    });\n  }\n\n  // 재생시간/타임라인 규칙 — Phase 4에서 실제 타임라인 화면이 생기기 전까지는 완전히 숨긴다.\n  // (사용자가 조작할 화면이 없는 상태에서 \"필수\" 경고만 계속 뜨는 것을 피하기 위함 —\n  // FEATURE_AVAILABILITY 하나만 바꾸면 이 규칙이 다시 켜진다.)\n  if (FEATURE_AVAILABILITY.timeline) {\n    const timelineWarnings = getTimelineWarnings(ep);\n    // duration이 없거나 0인 CUT은 막힘(blocker) — Timeline 자체가 성립하지 않는다.\n    timelineWarnings\n      .filter((w) => w.severity === \"blocker\")\n      .forEach((w) => {\n        actions.push(\n          makeAction(ep, {\n            id: `timeline-blocker-${w.cutId}-${w.message}`,\n            priority: PRIORITY.BLOCKER,\n            step: \"timeline\",\n            target: w.cutIndex != null ? w.cutIndex + 1 : null,\n            message: w.message,\n          })\n        );\n      });\n    // 오디오가 CUT 범위를 넘거나 BGM이 전체 길이를 넘는 건 막지는 않되(자동으로 값을 바꾸지\n    // 않는다는 원칙) 눈에 띄게 권장 안내로 보여준다.\n    timelineWarnings\n      .filter((w) => w.severity === \"warning\")\n      .forEach((w) => {\n        actions.push(\n          makeAction(ep, {\n            id: `timeline-warning-${w.cutId || \"bgm\"}-${w.eventId || \"\"}-${w.message}`,\n            priority: PRIORITY.RECOMMENDED,\n            step: \"timeline\",\n            target: w.cutIndex != null ? w.cutIndex + 1 : null,\n            message: w.message,\n          })\n        );\n      });\n    // 데이터상 문제가 전혀 없는데도 아직 사용자가 명시적으로 \"검토 완료\"를 누르지 않았다면\n    // 안내한다 — 자동 계산만으로 검토 완료로 치지 않는다는 원칙을 액션으로도 드러낸다.\n    const hasBlockingTimelineIssue = timelineWarnings.some((w) => w.severity === \"blocker\");\n    if (cuts.length > 0 && !hasBlockingTimelineIssue && !ep.timelineReviewedAt) {\n      actions.push(\n        makeAction(ep, {\n          id: \"timeline-review-needed\",\n          priority: PRIORITY.REQUIRED,\n          step: \"timeline\",\n          message: \"타임라인을 검토하고 확인해주세요.\",\n        })\n      );\n    }\n  }\n\n  // 미리보기/QC 규칙 — Phase 5. qc.js가 유일한 판정 소스이며(중복 규칙 작성 금지), 여기서는\n  // 그 결과를 요약해 \"다음 할 일\" 목록에 하나로만 연결한다(항목별 중복 action은 만들지 않는다\n  // — 이미지/오디오/타임라인 관련 개별 문제는 위의 cutImages/cutAudio/timeline 규칙에서 각각\n  // blocker/required로 이미 노출되고 있고, QC 화면 자체에서도 항목별로 확인할 수 있다).\n  if (FEATURE_AVAILABILITY.preview) {\n    const qcSummary = summarizeQc(getQcResults(ep));\n    if (qcSummary.errorCount > 0) {\n      actions.push(\n        makeAction(ep, {\n          id: \"preview-qc-error\",\n          priority: PRIORITY.BLOCKER,\n          step: \"preview\",\n          message: `미리보기 QC에서 오류가 ${qcSummary.errorCount}건 발견됐습니다 — 먼저 해결해주세요.`,\n        })\n      );\n    } else if (cuts.length > 0 && !ep.previewReviewedAt) {\n      actions.push(\n        makeAction(ep, {\n          id: \"preview-review-needed\",\n          priority: PRIORITY.REQUIRED,\n          step: \"preview\",\n          message:\n            qcSummary.warningCount > 0\n              ? `미리보기 QC에 경고가 ${qcSummary.warningCount}건 있습니다 — 확인 후 검토 완료로 표시해주세요.`\n              : \"미리보기를 검토하고 확인해주세요.\",\n        })\n      );\n    }\n  }\n\n  if (!ep.bgm || !ep.bgm.assetId) {\n    actions.push(\n      makeAction(ep, {\n        id: \"bgm-optional\",\n        priority: PRIORITY.OPTIONAL,\n        step: \"cutAudio\",\n        message: \"원하시면 BGM을 추가할 수 있습니다.\",\n      })\n    );\n  }\n\n  const hasBlockerOrRequired = actions.some(\n    (a) => a.priority === PRIORITY.BLOCKER || a.priority === PRIORITY.REQUIRED\n  );\n  if (!hasBlockerOrRequired && ep.status !== \"확정\" && ep.status !== \"업로드완료\") {\n    actions.push(\n      makeAction(ep, {\n        id: \"ready-to-confirm\",\n        priority: PRIORITY.REQUIRED,\n        step: \"cutExport\",\n        // Phase 6: CUT 포맷의 마지막 STEP은 실제로 production.json을 생성하는 화면이다 —\n        // 문구도 \"내보내기 단계\"라는 추상적인 안내 대신 실제 행동을 구체적으로 알려준다.\n        message: \"준비가 끝났습니다 — production.json을 생성하고 최종 확정해주세요.\",\n      })\n    );\n  }\n\n  return actions;\n}\n\n// ---------------------------------------------------------------------------\n// 공개 API — 호출부는 formatType을 몰라도 된다.\n// ---------------------------------------------------------------------------\n\nexport function isStepDone(episode, stepKey) {\n  if (!episode) return false;\n  return episode.formatType === \"cut\" ? stepDoneCut(episode, stepKey) : stepDoneTextCard(episode, stepKey);\n}\n\nexport function getNextActions(episode) {\n  if (!episode) return [];\n  return episode.formatType === \"cut\" ? getNextActionsCut(episode) : getNextActionsTextCard(episode);\n}\n\nexport function getPrimaryNextAction(episode) {\n  const actions = getNextActions(episode);\n  if (!actions.length) return null;\n  return [...actions].sort((a, b) => PRIORITY_ORDER.indexOf(a.priority) - PRIORITY_ORDER.indexOf(b.priority))[0];\n}\n\nexport function getBlockers(episode) {\n  return getNextActions(episode).filter((a) => a.blocking);\n}\n\nexport function getProgress(episode) {\n  if (!episode) return { percent: 0, steps: [] };\n  const stepsModule = episode.formatType === \"cut\" ? CUT_STEP_KEYS : TEXT_CARD_STEP_KEYS;\n  const steps = stepsModule.map(({ key, label }) => ({ key, label, done: isStepDone(episode, key) }));\n  const doneCount = steps.filter((s) => s.done).length;\n  const percent = steps.length ? Math.round((doneCount / steps.length) * 100) : 0;\n  return { percent, steps, doneCount, totalCount: steps.length };\n}\n\n// STEP 라벨/키 목록은 model.js가 소유한다 — 여기서는 진행률 계산에 그대로 사용.\nconst TEXT_CARD_STEP_KEYS = STEPS_TEXT_CARD;\nconst CUT_STEP_KEYS = STEPS_CUT;\n","js_v420a12/util.js":"import { isOversizedAsset, isQuotaError } from \"./db.js\";\n\n// 모든 asset(이미지/오디오) 첨부 지점이 공통으로 사용하는 크기 확인 함수.\n// 50MB를 넘어도 업로드를 막지 않는다 — 사용자에게 물어보고, 계속하면 그대로 진행한다.\nexport function confirmOversizedFile(file) {\n  if (!isOversizedAsset(file)) return true;\n  const mb = (file.size / (1024 * 1024)).toFixed(1);\n  return confirm(`이 파일은 50MB를 초과합니다(${mb}MB).\\n기기 저장공간과 백업 크기가 커질 수 있습니다.\\n그래도 첨부하시겠습니까?`);\n}\n\n// putAsset() 저장이 실패했을 때 원인에 따라 사용자에게 다른 메시지를 보여준다.\nexport function toastAssetSaveError(err) {\n  if (isQuotaError(err)) {\n    toast(\"저장공간이 부족해 파일을 저장하지 못했습니다.\");\n  } else {\n    toast(\"파일을 저장하지 못했습니다: \" + (err?.message || \"알 수 없는 오류\"));\n  }\n}\n\nexport function escapeHtml(s) {\n  return String(s ?? \"\").replace(/[&<>\"']/g, (c) => ({\n    \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\",\n  }[c]));\n}\n\nexport function el(html) {\n  const t = document.createElement(\"template\");\n  t.innerHTML = html.trim();\n  return t.content.firstElementChild;\n}\n\nexport function fmtDate(ts) {\n  const d = new Date(ts);\n  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, \"0\")}.${String(d.getDate()).padStart(2, \"0\")} ${String(d.getHours()).padStart(2, \"0\")}:${String(d.getMinutes()).padStart(2, \"0\")}`;\n}\n\nexport function fmtSec(s) {\n  if (s == null || isNaN(s)) return \"--.--\";\n  return s.toFixed(2);\n}\n\nexport function fmtBytes(n) {\n  if (n == null || isNaN(n)) return \"0 B\";\n  const units = [\"B\", \"KB\", \"MB\", \"GB\"];\n  let v = n;\n  let i = 0;\n  while (v >= 1024 && i < units.length - 1) {\n    v /= 1024;\n    i++;\n  }\n  return `${v < 10 && i > 0 ? v.toFixed(1) : Math.round(v)} ${units[i]}`;\n}\n\nlet toastTimer = null;\nexport function toast(msg) {\n  let node = document.getElementById(\"toast\");\n  if (!node) {\n    node = document.createElement(\"div\");\n    node.id = \"toast\";\n    node.className = \"toast\";\n    document.body.appendChild(node);\n  }\n  node.textContent = msg;\n  node.classList.add(\"show\");\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(() => node.classList.remove(\"show\"), 1800);\n}\n\n\nexport function showPersistentError(title, message, { onRetry = null } = {}) {\n  document.getElementById(\"persistent-error-overlay\")?.remove();\n\n  const overlay = document.createElement(\"div\");\n  overlay.id = \"persistent-error-overlay\";\n  overlay.className = \"persistent-error-overlay\";\n\n  const safeTitle = escapeHtml(title || \"오류\");\n  const safeMessage = escapeHtml(message || \"알 수 없는 오류\");\n  overlay.innerHTML = `\n    <div class=\"persistent-error-card\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"persistent-error-title\">\n      <div class=\"persistent-error-head\">\n        <strong id=\"persistent-error-title\">${safeTitle}</strong>\n        <button type=\"button\" class=\"btn secondary small\" data-error-close>닫기</button>\n      </div>\n      <div class=\"persistent-error-message\">${safeMessage}</div>\n      <div class=\"btn-row\" style=\"margin-top:12px;flex-wrap:wrap;\">\n        <button type=\"button\" class=\"btn secondary\" data-error-copy>오류 내용 복사</button>\n        ${onRetry ? `<button type=\"button\" class=\"btn\" data-error-retry>다시 시도</button>` : \"\"}\n      </div>\n      <div class=\"hint\" style=\"margin-top:8px;\">이 오류창은 직접 닫기 전까지 사라지지 않습니다.</div>\n    </div>\n  `;\n\n  const close = () => overlay.remove();\n  overlay.querySelector(\"[data-error-close]\").onclick = close;\n  overlay.querySelector(\"[data-error-copy]\").onclick = async () => {\n    try {\n      await navigator.clipboard.writeText(`${title || \"오류\"}\\n${message || \"\"}`);\n      toast(\"오류 내용을 복사했어요\");\n    } catch {\n      toast(\"복사 실패 — 오류창의 내용을 직접 선택해주세요\");\n    }\n  };\n  const retry = overlay.querySelector(\"[data-error-retry]\");\n  if (retry && onRetry) {\n    retry.onclick = () => {\n      close();\n      onRetry();\n    };\n  }\n  document.body.appendChild(overlay);\n}\n\nexport async function copyText(text) {\n  try {\n    await navigator.clipboard.writeText(text);\n    toast(\"복사했어요\");\n  } catch (e) {\n    toast(\"복사 실패 — 직접 선택해서 복사해주세요\");\n  }\n}\n\nexport function downloadText(filename, text, mime = \"application/json\") {\n  downloadBlob(filename, new Blob([text], { type: mime }));\n}\n\n// Phase 7 — Full Backup처럼 이미 Blob(바이너리)로 만들어진 결과물을 다운로드할 때 쓴다.\n// downloadText()와 트리거 로직을 중복 작성하지 않기 위해 downloadText()도 내부적으로 이 함수를 쓴다.\nexport function downloadBlob(filename, blob) {\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement(\"a\");\n  a.href = url;\n  a.download = filename;\n  document.body.appendChild(a);\n  a.click();\n  a.remove();\n  setTimeout(() => URL.revokeObjectURL(url), 2000);\n}\n","js_v420a12/viewport.js":"// v4.2.0 Alpha 11 — Adaptive UI foundation.\n//\n// Device-name hardcoding is intentionally forbidden.\n// Layout is selected only from the actual browser viewport.\n//\n// UI profiles:\n//   Compact      < 600px\n//   Tablet       600px .. 1199px\n//   Workstation  >= 1200px\n//\n// 1200px is deliberate: a small tablet such as iPad mini stays in Tablet UI even in\n// landscape, while genuinely wide tablet/desktop viewports can use Workstation UI.\n// Rotation/resize changes attributes only; it never re-renders the route, preserving\n// selected CUT, input state, playback/currentTime and narration mark work.\n\nexport const BREAKPOINTS = { tablet: 600, workstation: 1200 };\n\nexport function computeBreakpoint(width) {\n  if (width >= BREAKPOINTS.workstation) return \"desktop\"; // legacy CSS contract\n  if (width >= BREAKPOINTS.tablet) return \"tablet\";\n  return \"phone\";\n}\n\nexport function computeUiProfile(width) {\n  if (width >= BREAKPOINTS.workstation) return \"workstation\";\n  if (width >= BREAKPOINTS.tablet) return \"tablet\";\n  return \"compact\";\n}\n\nexport function computeOrientation(width, height) {\n  return width >= height ? \"landscape\" : \"portrait\";\n}\n\nexport function computeViewportState(width, height) {\n  return {\n    breakpoint: computeBreakpoint(width),\n    profile: computeUiProfile(width),\n    orientation: computeOrientation(width, height),\n    width,\n    height,\n  };\n}\n\nlet lastApplied = null;\n\nfunction updateProfileLabels(profile) {\n  document.querySelectorAll(\"[data-ui-profile-label]\").forEach((node) => {\n    node.textContent =\n      profile === \"workstation\" ? \"Workstation UI\" :\n      profile === \"tablet\" ? \"Tablet UI\" : \"Compact UI\";\n  });\n}\n\nfunction applyViewportState(state) {\n  const key = `${state.breakpoint}:${state.profile}:${state.orientation}`;\n  if (lastApplied === key) return;\n  lastApplied = key;\n  const root = document.documentElement;\n  root.dataset.breakpoint = state.breakpoint;\n  root.dataset.uiProfile = state.profile;\n  root.dataset.orientation = state.orientation;\n  updateProfileLabels(state.profile);\n}\n\nlet rafHandle = null;\nfunction scheduleApply() {\n  if (rafHandle != null) return;\n  rafHandle = requestAnimationFrame(() => {\n    rafHandle = null;\n    applyViewportState(computeViewportState(window.innerWidth, window.innerHeight));\n  });\n}\n\nexport function initViewport() {\n  if (typeof window === \"undefined\") return;\n  applyViewportState(computeViewportState(window.innerWidth, window.innerHeight));\n  window.addEventListener(\"resize\", scheduleApply);\n  window.addEventListener(\"orientationchange\", scheduleApply);\n}\n\nexport function refreshViewportLabels() {\n  if (typeof document === \"undefined\") return;\n  const profile = document.documentElement.dataset.uiProfile || computeUiProfile(window.innerWidth);\n  updateProfileLabels(profile);\n}\n","js_v420a12/views/home.js":"import { getHomeData, saveEpisode, deleteEpisode, saveIdea, deleteIdea } from \"../db.js\";\nimport { newEpisode, stepsFor, EPISODE_LIFECYCLE, normalizeEpisodeLifecycle, CONTENT_CHANNELS, CONTENT_FORMATS, PRODUCTION_PROFILES, contentChannelLabel, contentFormatLabel, productionProfileLabel } from \"../model.js\";\nimport { SERIES_TYPES, seriesTypeLabel } from \"../seriesTypes.js\";\nimport { getPrimaryNextAction, getProgress } from \"../nextActions.js\";\nimport { escapeHtml, fmtDate, el } from \"../util.js\";\nimport { APP_VERSION, RELEASE_LABEL } from \"../version.js\";\nimport { refreshViewportLabels } from \"../viewport.js\";\n\nlet pendingSeriesType = SERIES_TYPES[0].key;\nlet pendingFormatType = \"cut\";\nlet pendingChannelKey = \"unassigned\";\nlet pendingContentFormat = \"shorts\";\nlet pendingProductionProfile = \"standard\";\nlet homeFilter = \"work\";\nlet homeSearch = \"\";\nlet homeSeriesFilter = \"all\";\nlet homeFormatFilter = \"all\";\nlet showIdeaInbox = false;\nlet ideaSearch = \"\";\nlet ideaChannelFilter = \"all\";\nlet ideaContentFormatFilter = \"all\";\nlet ideaProfileFilter = \"all\";\nlet ideaCategoryFilter = \"all\";\nlet ideaReviewFilter = \"all\";\nlet ideaStatusFilter = \"active\";\nlet ideaSort = \"priority\";\nlet workflowStep = \"overview\";\nlet ideaPage = 1;\nlet episodePage = 1;\nconst LIST_PAGE_SIZE = 20;\n\nconst SCORE_KEYS = [\"freshness\", \"virality\", \"hook\", \"channelFit\", \"evidence\", \"productionCost\", \"urgency\"];\nconst SCORE_LABELS = { freshness: \"신선도\", virality: \"화제성\", hook: \"훅\", channelFit: \"채널 적합\", evidence: \"근거\", productionCost: \"제작효율\", urgency: \"긴급도\" };\nconst REVIEW_LABELS = { approved: \"제작 추천\", needs_review: \"추가 확인 필요\", reviewed: \"추가 확인 필요\", hold: \"보류\", (handoff.sources) ? handoff.sources : [];\n  ep.verifiedFacts = Array.isArray(handoff.verifiedFacts) ? handoff.verifiedFacts : [];\n  ep.claimsToVerify = Array.isArray(handoff.claimsToVerify) ? handoff.claimsToVerify : [];\n  ep.sourceCategory = handoff.category;\n  ep.sourceKeywords = handoff.keywords;\n  ep.productionPreset = {\n    version: 1,\n    channelKey: handoff.channelKey,\n    contentFormat: handoff.contentFormat,\n    productionProfile: handoff.productionProfile,\n    direction: handoff.productionDirection || \"\",\n    visualContentMode: handoff.visualContentMode || \"news\",\n    qcLevel: handoff.qcLevel || \"standard\",\n    appliedAt: Date.now(),\n  };\n}\n\nfunction productionPresetFor(channelKey, contentFormat, profile) {\n  const channels = {\n    sports: { direction: \"결과·기록·선수 중심으로 핵심 장면을 빠르게 전개하고 첫 문장에서 승부의 의미를 제시\", visualContentMode: \"sports\" },\n    economy_current: { direction: \"근거와 출처를 우선하고 확인된 사실과 해석을 구분하며 정치적·경제적 과장을 억제한다. 현안·정책·시장 변화를 개인의 생활 문제로 번역하고, 소리를 꺼도 장면과 상단 핵심정보만으로 흐름을 이해할 수 있게 설계한다\", visualContentMode: \"politics\" },\n    odd_today: { direction: \"의외성을 첫 훅에 배치하고 생활 공감과 유머를 빠르게 연결해 끝까지 궁금증을 유지\", visualContentMode: \"humor\" },\n    senior_longform: { direction: \"이해하기 쉬운 문장과 차분한 호흡으로 인물의 감정선과 장면 변화를 중심으로 전개\", visualContentMode: \"info\" },\n    unassigned: { direction: \"핵심 사실과 시청 이유를 먼저 제시하고 불필요한 설명 없이 명확하게 전개\", visualContentMode: \"news\" },\n  };\n  const base = channels[channelKey] || channels.unassigned;\n  const formatDirection = contentFormat === \"longform\" ? \" Scene 단위로 구성하고 같은 설명을 반복하지 않는다.\" : \" 1~2초 훅과 짧은 CUT 중심으로 구성한다.\";\n  const profileDirection = profile === \"fast\" ? \" 시청 이해에 영향 없는 미세 수정은 생략한다.\" : profile === \"premium\" ? \" 캐릭터·IP·사실·시각 일관성을 강하게 검수한다.\" : \" 속도와 완성도의 균형을 유지한다.\";\n  return { ...base, direction: base.direction + formatDirection + profileDirection, qcLevel: profile === \"premium\" ? \"high\" : profile === \"fast\" ? \"viewer_impact\" : \"standard\" };\n}\n\nfunction canonicalCategory(value, existing = []) {\n  const cleaned = String(value || \"\").trim().replace(/\\s+/g, \" \");\n  if (!cleaned) return \"미분류\";\n  return existing.find((x) => x.toLocaleLowerCase() === cleaned.toLocaleLowerCase()) || cleaned;\n}\n\nfunction normalizeScores(raw) {\n  if (!raw || typeof raw !== \"object\") return null;\n  const scores = {};\n  for (const key of SCORE_KEYS) {\n    const value = Number(raw[key]);\n    if (!Number.isFinite(value)) return null;\n    scores[key] = Math.max(0, Math.min(100, Math.round(value)));\n  }\n  return scores;\n}\n\nfunction normalizedReviewStatus(value) {\n  const status = String(value || \"\").trim().toLocaleLowerCase();\n  if (status === \"approved\") return \"approved\";\n  if (status === \"needs_review\" || status === \"reviewed\") return \"needs_review\";\n  if (status === \"hold\") return \"hold\";\n  if (status === \"rejected\") return \"rejected\";\n  return \"unreviewed\";\n}\n\nfunction priorityScore(idea) {\n  const scores = normalizeScores(idea?.scores);\n  if (!scores) return null;\n  const weights = PRIORITY_WEIGHTS[idea.channelKey] || PRIORITY_WEIGHTS.unassigned;\n  return Math.round(SCORE_KEYS.reduce((sum, key) => sum + scores[key] * weights[key], 0));\n}\n\nfunction parseIdeaBatchText(text) {\n  let cleaned = String(text || \"\").trim().replace(/^```(?:json)?\\s*/i, \"\").replace(/\\s*```$/, \"\");\n  const firstObject = cleaned.indexOf(\"{\"), firstArray = cleaned.indexOf(\"[\");\n  const first = firstArray >= 0 && (firstObject < 0 || firstArray < firstObject) ? firstArray : firstObject;\n  if (first > 0) cleaned = cleaned.slice(first);\n  const parsed = JSON.parse(cleaned);\n  const rows = Array.isArray(parsed) ? parsed : parsed?.ideas;\n  if (!Array.isArray(rows)) throw new Error(\"ideas 배열이 없습니다.\");\n  const collector = Array.isArray(parsed) ? \"\" : String(parsed.collector || \"\").trim();\n  const reviewer = Array.isArray(parsed) ? \"\" : String(parsed.reviewer || \"\").trim();\n  const schemaVersion = A \nfunction renderCard(ep, root) {\n  const isCut = ep.formatType === \"cut\";\n  const countLabel = isCut ? `CUT ${(ep.cuts || []).length}개` : `씬 ${(ep.scenes || []).filter((s) => s.narration_line?.trim()).length}/${(ep.scenes || []).length}`;\n  const progress = getProgress(ep);\n  const primary = getPrimaryNextAction(ep);\n  const lifecycle = lifecycleOf(ep);\n  const isTrash = lifecycle === \"trash\";\n  const selectOptions = Object.entries(EPISODE_LIFECYCLE)\n    .filter(([key]) => key !== \"trash\")\n    .map(([key, label]) => `<option value=\"${key}\" ${key === lifecycle ? \"selected\" : \"\"}>${label}</option>`).join(\"\");\n\n  const node = el(`\n    <div class=\"episode-card lifecycle-card\">\n      <div class=\"meta lifecycle-card-main\">\n        <div class=\"title\">${escapeHtml(ep.title || \"(제목 없음)\")}</div>\n        <div class=\"episode-meta-badges\">\n          <span>${escapeHtml(contentChannelLabel(ep.channelKey))}</span>\n          <span>${escapeHtml(contentFormatLabel(ep.contentFormat))}</span>\n          <span class=\"profile-${escapeHtml(ep.productionProfile || \"standard\")}\">${escapeHtml(productionProfileLabel(ep.productionProfile))}</span>\n        </div>\n        <div class=\"sub\">${escapeHtml(ep.date || fmtDate(ep.updatedAt).slice(0, 10))} · ${escapeHtml(seriesTypeLabel(ep.seriesType))} · ${countLabel} · 진행률 ${progress.percent}%</div>\n        ${primary && !isTrash ? `<div class=\"sub next-hint\">${escapeHtml(primary.message)}</div>` : \"\"}\n      </div>\n      <div class=\"lifecycle-card-controls\">\n        ${isTrash ? `\n          <span class=\"badge lifecycle-trash-badge\">폐기</span>\n          <button class=\"btn small secondary\" data-action=\"restore\">복원</button>\n          <button class=\"btn small danger\" data-action=\"delete\">영구 삭제</button>\n        ` : `\n          <select class=\"lifecycle-select\" aria-label=\"에피소드 상태\">${selectOptions}</select>\n          <button class=\"btn small secondary\" data-action=\"trash\">폐기</button>\n        `}\n      </div>\n    </div>\n  `);\n\n  const main = node.querySelector(\".lifecycle-card-main\");\n  if (main && !isTrash) main.onclick = () => (location.hash = resumeHref(ep, primary));\n\n  const select = node.querySelector(\".lifecycle-select\");\n  if (select) select.onchange = async () => {\n    ep.lifecycleStatus = select.value;\n    ep.lifecycleChangedAt = Date.now();\n    ep.trashedAt = null;\n    await saveEpisode(ep);\n    await render(root);\n  };\n\n  const trash = node.querySelector('[data-action=\"trash\"]');\n  if (trash) trash.onclick = async () => {\n    if (!confirm(`“${ep.title || \"제목 없음\"}”을 휴지통으로 이동할까요?\\n이미지와 오디오는 삭제되지 않으며 복원할 수 있습니다.`)) return;\n    ep.lifecycleStatus = \"trash\"; ep.lifecycleChangedAt = Date.now(); ep.trashedAt = Date.now();\n    await saveEpisode(ep); await render(root);\n  };\n\n  const restore = node.querySelector('[data-action=\"restore\"]');\n  if (restore) restore.onclick = async () => {\n    ep.lifecycleStatus = \"draft\"; ep.lifecycleChangedAt = Date.now(); ep.trashedAt = null;\n    await saveEpisode(ep); await render(root);\n  };\n\n  const remove = node.querySelector('[data-action=\"delete\"]');\n  if (remove) remove.onclick = async () => {\n    if (!confirm(`“${ep.title || \"제목 없음\"}”을 영구 삭제할까요?\\n연결된 이미지와 오디오도 함께 삭제되며 되돌릴 수 없습니다.`)) return;\n    await deleteEpisode(ep.id); await render(root);\n  };\n  return node;\n}\n\nfunction resumeHref(ep, primary = getPrimaryNextAction(ep)) {\n  if (primary?.action?.href) return primary.action.href;\n  const steps = stepsFor(ep.formatType);\n  const last = steps[steps.length - 1];\n  return `#/episode/${ep.id}/${last?.key || \"plan\"}`;\n}\n","js_v420a12/recipe.js":"// V4 Production Recipe foundation.\n// Recipe는 Story/Image/Render 전반의 \"제작 방식\"을 재사용하기 위한 앱 내부 계약이다.\n// Alpha 1에서는 Built-in Recipe만 제공하며, 커스텀 저장/AI 자동 선택은 후속 Alpha에서 붙인다.\n\nimport { newCaptionStyle, applyMotionPreset, setCutTransition } from \"./model.js\";\n\nexport const RECIPE_SCHEMA_VERSION = \"1.0\";\n\nconst BASE_RENDER = { width: 1080, height: 1920, fps: 30 };\n\nfunction makeRecipe({ id, label, seriesType, description, story, image, render, cutDefaults }) {\n  return {\n    schemaVersion: RECIPE_SCHEMA_VERSION,\n    id,\n    label,\n    seriesType,\n    description,\n    story: {\n      targetSeconds: 50,\n      targetCutCount: 8,\n      hookSeconds: 2,\n      tone: \"clear\",\n      ...story,\n    },\n    image: {\n      aspectRatio: \"9:16\",\n      consistencyPriority: \"high\",\n      styleNote: \"\",\n      ...image,\n    },\n    render: {\n      ...BASE_RENDER,\n      captionStyle: newCaptionStyle(),\n      outputPreference: \"mp4\",\n      ...render,\n    },\n    cutDefaults: {\n      motion: \"PUSH_IN_SLOW\",\n      transition: \"HARD_CUT\",\n      transitionDuration: 0,\n      ...cutDefaults,\n    },\n  };\n}\n\nexport const BUILTIN_RECIPES = [\n  makeRecipe({\n    id: \"general_issue_fast\",\n    label: \"일반 이슈 · 빠른 전개\",\n    seriesType: \"general_issue\",\n    description: \"1~2초 훅과 짧은 CUT 중심의 일반 이슈 기본 Recipe\",\n    story: { targetSeconds: 50, targetCutCount: 8, hookSeconds: 2, tone: \"factual-fast\" },\n    image: { styleNote: \"밝고 명확한 9:16 정보 전달형 비주얼, 핵심 피사체 중심\" },\n  }),\n  makeRecipe({\n    id: \"horror_tension\",\n    label: \"괴담 · 긴장 상승\",\n    seriesType: \"horror\",\n    description: \"초반 훅 이후 긴장감을 단계적으로 올리는 괴담 Recipe\",\n    story: { targetSeconds: 55, targetCutCount: 9, hookSeconds: 2, tone: \"tension-build\" },\n    image: { styleNote: \"공포 분위기는 유지하되 피사체와 사건이 명확히 읽히는 9:16 장면\" },\n    cutDefaults: { motion: \"PUSH_IN_SLOW\", transition: \"DISSOLVE\", transitionDuration: 0.25 },\n  }),\n  makeRecipe({\n    id: \"two_year_intern_deadpan\",\n    label: \"두살인턴 · 담담한 반전\",\n    seriesType: \"two_year_intern\",\n    description: \"아기 외형과 달관한 직장인 사고방식의 부조화를 살리는 Recipe\",\n    story: { targetSeconds: 45, targetCutCount: 7, hookSeconds: 1.5, tone: \"deadpan-contrast\" },\n    image: { styleNote: \"밝고 귀여운 프리미엄 3D 토들러, 캐릭터 외형과 의상 일관성 최우선\" },\n  }),\n  makeRecipe({\n    id: \"freeform_balanced\",\n    label: \"자유형 · 균형\",\n    seriesType: \"freeform\",\n    description: \"특정 시리즈 규칙 없이 안정적인 기본값을 제공하는 Recipe\",\n    story: { targetSeconds: 50, targetCutCount: 8, hookSeconds: 2, tone: \"balanced\" },\n  }),\n];\n\nexport function recipesForSeries(seriesType) {\n  const matches = BUILTIN_RECIPES.filter((r) => r.seriesType === seriesType);\n  return matches.length ? matches : BUILTIN_RECIPES.filter((r) => r.seriesType === \"freeform\");\n}\n\nexport function defaultRecipeIdForSeries(seriesType) {\n  return recipesForSeries(seriesType)[0]?.id || \"freeform_balanced\";\n}\n\nexport function getRecipe(id) {\n  return BUILTIN_RECIPES.find((r) => r.id === id) || null;\n}\n\nexport function newRecipeState(seriesType = \"general_issue\") {\n  return {\n    schemaVersion: RECIPE_SCHEMA_VERSION,\n    selectedId: defaultRecipeIdForSeries(seriesType),\n    appliedId: null,\n    appliedAt: null,\n    source: \"builtin\",\n  };\n}\n\nexport function resolveRecipeState(ep) {\n  const base = newRecipeState(ep?.seriesType || \"general_issue\");\n  const raw = ep?.recipeState && typeof ep.recipeState === \"object\" ? ep.recipeState : {};\n  const selected = getRecipe(raw.selectedId) ? raw.selectedId : base.selectedId;\n  return { ...base, ...raw, schemaVersion: RECIPE_SCHEMA_VERSION, selectedId: selected };\n}\n\nexport function applyRecipeToEpisode(ep, recipeId) {\n  const recipe = getRecipe(recipeId);\n  if (!ep || !recipe) return ep;\n  ep.renderSettings = { ...(ep.renderSettings || {}), width: recipe.render.width, height: recipe.render.height, fps: recipe.render.fps };\n  ep.captionStyle = { ...recipe.render.captionStyle };\n  if (ep.formatType === \"cut\") {\n    (ep.cuts || []).forEach((cut) => {\n      applyMotionPreset(cut, recipe.cutDefaults.motion);\n      setCutTransition(cut, recipe.cutDefaults.transition, recipe.cutDefaults.transitionDuration);\n    });\n    if (!String(ep.globalVisualBible || \"\").trim() && recipe.image.styleNote) ep.globalVisualBible = recipe.image.styleNote;\n  }\n  ep.recipeState = { schemaVersion: RECIPE_SCHEMA_VERSION, selectedId: recipe.id, appliedId: recipe.id, appliedAt: Date.now(), source: \"builtin\" };\n  return ep;\n}\n","js_v420a12/visualBible.js":"// V4 Beta 4 — Channel Style Bible + Episode Global Visual Bible + CUT prompt merger.\n// 기본 일반 이슈 쇼츠는 '광교 도마뱀' 레퍼런스 계열의 고급 3D 애니메이션 영화풍을 고정 스타일 앵커로 사용한다.\n// 별도 이미지 API 호출 없이 Story 응답 + 고정 스타일 규칙을 결합하므로 추가 API 비용은 발생하지 않는다.\n\nfunction clean(value) {\n  return String(value || \"\").trim();\n}\n\nexport const CHANNEL_STYLE_BIBLE_VERSION = \"1.2\";\n\n// 일반 이슈 쇼츠의 채널 기본 스타일. 레퍼런스 이미지를 직접 첨부하지 않아도\n// Gemini에 전달되는 모든 완성 프롬프트 앞부분에 이 규칙을 고정으로 포함한다.\nexport const DEFAULT_CHANNEL_STYLE_BIBLE = [\n  \"[CHANNEL STYLE BIBLE — 광교 도마뱀 레퍼런스 계열 / 모든 CUT 공통 최우선]\",\n  \"STYLE: premium cinematic 3D animation film look; polished stylized 3D rendering; clearly animated, not photorealistic.\",\n  \"화면 인상: 밝고 깨끗하며 고급스럽고 정돈된 3D 애니메이션 영화 장면. 귀엽고 친근할 수 있지만 유아용/완구 광고처럼 보이지 않게 한다.\",\n  \"색감: 예쁘고 선명한 색을 사용하되 과포화는 피하고, 피사체와 배경의 색 분리가 명확하도록 한다.\",\n  \"조명: 부드러운 시네마틱 키라이트와 자연스러운 림/환경광, 깨끗한 하이라이트, 탁하거나 칙칙한 조명 금지.\",\n  \"공간감: 전경-중경-배경의 깊이가 분명하고 실제 한국 생활환경/도시/실내를 고급 애니메이션 영화 세트처럼 재해석한다.\",\n  \"피사체: 모바일에서도 한눈에 읽히는 명확한 실루엣. 표정과 동작은 현실보다 약간 애니메이션적으로 과장해 감정과 상황이 즉시 전달되게 한다.\",\n  \"인물/동물: 매력적이고 자연스러운 캐릭터 디자인, 깨끗한 형태와 풍부한 표정. 실사 인간/동물 사진처럼 만들지 않는다.\",\n  \"카메라: 스토리의 핵심 행동을 크게 보여주는 시네마틱 프레이밍, 자연스러운 원근감, 불필요한 초광각 왜곡 금지.\",\n  \"렌더 품질: feature-film-quality 3D animation, smooth materials, refined textures, clean edges, soft depth of field only when useful.\",\n  \"FORMAT: 9:16 vertical Shorts frame, main subject readable on a small phone screen.\",\n  \"DO NOT: photorealistic live-action look, dark muddy grading, horror-like darkness unless explicitly required, flat cheap 3D, plastic toy look, childish preschool style, cluttered composition, text/captions/speech bubbles/logos/watermarks/UI inside image.\",\n  \"CONTINUITY: 동일 에피소드에서는 얼굴/체형/의상/동물 특징/주요 소품/렌더링 질감/색감/조명 톤을 모든 CUT에서 동일한 영화의 연속 장면처럼 유지한다.\",\n].join(\"\\n\");\n\n// Alpha 55 — 경제그루터기 전용 이중 비주얼 문법 + 자동 생성용 상상씬 단순화/QC 규칙.\n// 현실 상담은 HYBRID 2.5D/3D, 상상/설명은 같은 IP를 2~3등신 SD 역할극으로 변환한다.\nexport const ECONOMY_CHANNEL_STYLE_BIBLE = [\n  \"[CHANNEL STYLE BIBLE — 경제그루터기 / 모든 CUT 공통 최우선]\",\n  \"BRAND WORLD: 그루는 야외 나무 그루터기에서 상담한다. 현실 상담 → 뭉게뭉게 전환 → SD 상상 역할극 → 현실 복귀 → 대기줄 CTA의 세계관을 유지한다.\",\n  \"REALITY STYLE: HYBRID 2.5D / 3D premium animation. 현실적인 성인 비율, 따뜻한 자연광, 깨끗하고 고급스러운 stylized rendering. 실사 사진처럼 만들지 않고 플라스틱 피규어 느낌도 피한다.\",\n  \"IMAGINATION STYLE: 2~3등신 premium SD animation. 현실 캐릭터의 얼굴·머리·수염·의상·색상 정체성을 유지한 채 작고 귀여운 경제 역할극 배우로 변환한다. 유아용/완구 광고 톤 금지.\",\n  \"SCENE TYPE RULE: 현실/상상 그림체를 임의로 섞지 않는다. 현실 CUT은 현실형 Reference, 상상/설명 CUT은 SD Reference를 우선한다.\",\n  \"ROLEPLAY FIRST: 상상씬은 카드뉴스가 아니라 캐릭터가 집·돈·저울·계산장치·장바구니·계좌 등 핵심 오브젝트를 직접 옮기고 밀고 당기고 뛰어가며 원인→결과를 행동으로 보여준다.\",\n  \"ONE DEVICE RULE: 상상/설명 한 장면에는 핵심 경제 장치/비유를 1개만 크게 사용한다. 계산기+저울+표+그래프+블록을 한 화면에 겹쳐 넣지 않는다. 보조 소품은 핵심 장치를 이해시키는 데 꼭 필요한 것만 남긴다.\",\n  \"CAUSE-ACTION-RESULT: 한 장면 안에서 원인 행동 → 장치 변화 → 상대의 결과/반응이 한눈에 읽혀야 한다. 누가 변화를 일으키는지와 누가 영향을 받는지가 모호하면 실패다.\",\n  \"ACTION ROLE CLARITY: 설명자 캐릭터는 핵심 장치를 직접 조작하거나 변화의 원인을 가리키고, 상담객 캐릭터는 그 결과를 직접 겪거나 확인한다. 둘 다 의미 없이 서 있거나 동시에 여러 행동을 하지 않는다.\",\n  \"CLOUD WORLD ANCHOR: 상상씬은 단색 스튜디오처럼 만들지 않는다. 구름을 바닥·전경·화면 가장자리·일부 배경에 명확히 배치해 뭉게뭉게 상상세계임을 즉시 알 수 있게 한다. 핵심 장치를 가릴 만큼 과도하게 채우지는 않는다.\",\n  \"NO IMAGE TEXT: 이미지 안에 읽을 수 있는 한글/영어 문장, 정책명, 숫자, %, 표지판, 말풍선, UI를 생성하지 않는다. 의미 없는 가짜 글자·깨진 문자·라벨·숫자 비슷한 기호도 만들지 않는다. 글자가 필요해 보이는 소품은 무지/무문자 형태로 만든다. 핵심어·숫자·화살표는 Tracker 오버레이가 담당한다.\",\n  \"MOBILE HIERARCHY: 모바일에서 1초 안에 핵심이 읽히도록 시각 우선순위를 핵심 장치 1개 > 원인 행동 캐릭터 > 결과를 겪는 캐릭터 순으로 둔다. 배경 장치와 장식은 최소화한다.\",\n  \"SOUND-OFF: 텍스트가 없어도 행동·오브젝트·방향 변화만으로 무슨 경제 상황인지 대략 이해되어야 한다.\",\n  \"TRANSITION: 상상세계 진입은 그루의 으음~ → 잠깐 생각 → 하늘 응시 → 오른손 검지 → 방문자가 시선을 따라감 → 뭉게뭉게 구름이 퍼지며 화면을 덮는 전환을 기본 시그니처로 사용한다.\",\n  \"RETURN: 설명이 끝나면 반드시 현실의 그루터기 상담 공간으로 돌아온다. 마지막까지 SD 세계에 머물지 않는다.\",\n  \"ENDING: 심각한 피해/재난 소재가 아니라면 현실 복귀 후 대기줄을 보여주고 ‘너도 고민 있으면 저 뒤로 줄 서.’ → ‘구독이랑 좋아요 눌렀으면… 줄 안 서도 돼.’의 브랜드 CTA를 유지한다.\",\n  \"ADULT SCALE: 현실세계의 성인 방문자는 그루와 정상적인 성인 체격으로 표현한다. 그루가 앉고 방문자가 서 있으면 방문자의 머리가 자연스럽게 더 높아야 하며 방문자를 학생처럼 축소하지 않는다.\",\n  \"REFERENCE PRIORITY: 공식 캐릭터 Reference 이미지가 텍스트 설명보다 우선한다. 현실형/SD형 Reference를 장면 타입에 맞게 사용하고, 여러 각도/포즈 시트는 필요할 때 보조로 사용한다.\",\n  \"CONTINUITY: 같은 에피소드에서 얼굴, 머리, 수염, 연령감, 의상, 색상, 체형과 렌더링 톤을 동일한 작품의 연속 장면처럼 유지한다.\",\n  \"FORMAT: 9:16 vertical Shorts, mobile-first composition, 핵심 피사체와 행동을 크게 보여준다.\",\n  \"DO NOT: photorealistic live-action, flat cheap 3D, plastic toy look, childish preschool style, cluttered card-news composition, readable text inside image, 임의 안경/장신구/의상 변경.\",\n].join(\"\\n\");\n\nexport function channelStyleBibleForSeries(seriesType = \"general_issue\", channelKey = \"unassigned\") {\n  if (channelKey === \"economy_current\") return ECONOMY_CHANNEL_STYLE_BIBLE;\n  // 두살인턴은 기존 IP Bible이 별도로 더 강한 제약을 갖지만, 렌더 품질/프레임 기준은 동일 계열을 유지한다.\n  if (seriesType === \"two_year_intern\") {\n    return [\n      DEFAULT_CHANNEL_STYLE_BIBLE,\n      \"\",\n      \"[SERIES OVERRIDE — 두살인턴]\",\n      \"두살인턴의 기존 공식 Character Bible(얼굴, 헤어, 체형, 의상, INTERN 배지, 색상)을 최우선으로 고정하고 새로운 캐릭터 디자인으로 바꾸지 않는다.\",\n      \"밝고 귀여운 프리미엄 3D 카툰 톤을 유지하되 실제 인간 아동 사진처럼 만들지 않는다.\",\n    ].join(\"\\n\");\n  }\n  if (seriesType === \"horror\") {\n    return [\n      DEFAULT_CHANNEL_STYLE_BIBLE,\n      \"\",\n      \"[SERIES OVERRIDE — 공포/긴장]\",\n      \"긴장감은 구도, 표정, 빛의 대비로 만들되 기본 렌더 품질과 3D 애니메이션 영화 스타일은 유지한다. 과도한 고어/혐오 표현은 피한다.\",\n    ].join(\"\\n\");\n  }\n  return DEFAULT_CHANNEL_STYLE_BIBLE;\n}\n\nexport function buildGlobalVisualBible(draft, recipe = null) {\n  const subject = clean(draft?.subject || draft?.title);\n  const aiStyle = clean(draft?.imageStyleNote);\n  const recipeStyle = clean(recipe?.image?.styleNote);\n  const episodeDirection = aiStyle || recipeStyle || \"소재에 적합한 장면 분위기와 시각적 스토리텔링\";\n\n  return [\n    \"[EPISODE GLOBAL VISUAL BIBLE — 이번 영상 전체 CUT 공통]\",\n    `콘텐츠/소재: ${subject || \"현재 에피소드의 핵심 소재\"}`,\n    `이번 에피소드 추가 비주얼 방향: ${episodeDirection}`,\n    \"※ 위 방향은 CHANNEL STYLE BIBLE의 고정 그림체를 대체하지 않고, 그 안에서 소재별 분위기/배경/연출만 조정한다.\",\n    \"\",\n    \"일관성 규칙:\",\n    \"- 같은 인물/캐릭터/동물/핵심 사물이 반복되면 얼굴, 체형, 연령감, 의상, 색상, 특징을 모든 CUT에서 동일하게 유지한다.\",\n    \"- 이번 에피소드에서 별도 상담객 프로필이 지정되면 그 프로필을 우선한다. 재등장 지시가 없으면 이전 에피소드의 상담객을 임의로 재사용하지 않는다.\",\n    \"- 같은 장소가 반복되면 공간 구조, 주요 소품, 시간대와 조명 방향을 가능한 한 일관되게 유지한다.\",\n    \"- 전체 CUT의 렌더링 방식, 질감, 색감, 대비, 카메라 톤을 하나의 영상처럼 통일한다.\",\n    \"\",\n    \"쇼츠 화면 규칙:\",\n    \"- 9:16 세로 화면, 모바일에서 한눈에 읽히는 단순하고 강한 구도.\",\n    \"- 핵심 피사체와 행동을 명확하게 크게 보여주고 불필요한 배경 요소는 줄인다.\",\n    \"- 장면마다 이야기의 결정적 순간을 포착하며 표정과 행동이 즉시 이해되게 한다.\",\n    \"- 이미지 내부에 자막, 문장, 말풍선, 로고, 워터마크, UI, 읽을 수 있는 텍스트를 넣지 않는다. 핵심어/숫자 표시는 이미지 생성물이 아니라 Tracker 영상 오버레이에서 처리한다.\",\n    \"- 쇼츠는 음소거 상태에서도 장면만으로 상황을 최대한 이해할 수 있게 구성하고, 필요한 핵심어·용어·숫자는 편집 오버레이가 보완한다.\",\n    \"\",\n    \"품질/금지 규칙:\",\n    \"- 깨진 손가락/팔다리/얼굴, 중복 인물이나 사물, 비정상 해부학, 의도하지 않은 흐림과 잘림을 피한다.\",\n    \"- CUT별 개별 프롬프트와 충돌하지 않는 범위에서 CHANNEL STYLE BIBLE과 이 EPISODE GLOBAL VISUAL BIBLE을 공통 규칙으로 유지한다.\",\n  ].join(\"\\n\");\n}\n\nexport function mergeVisualPrompt(channelStyleBible, globalVisualBible, cutPrompt, index = null) {\n  const channel = clean(channelStyleBible);\n  const global = clean(globalVisualBible);\n  const cut = clean(cutPrompt);\n  const cutLabel = Number.isInteger(index) ? `[CUT ${String(index + 1).padStart(2, \"0\")} SCENE]` : \"[CUT SCENE]\";\n  return [\n    channel || DEFAULT_CHANNEL_STYLE_BIBLE,\n    \"\",\n    global || \"[EPISODE GLOBAL VISUAL BIBLE]\\n이번 에피소드의 반복 피사체와 공간을 모든 CUT에서 일관되게 유지한다.\",\n    \"\",\n    cutLabel,\n    cut || \"(개별 장면 프롬프트 없음)\",\n  ].join(\"\\n\");\n}\n\n// Beta 3 호출부 호환용. 신규 코드는 mergeVisualPrompt 사용을 권장한다.\nexport function mergeGlobalAndCutPrompt(globalVisualBible, cutPrompt, index = null, seriesType = \"general_issue\", channelKey = \"unassigned\") {\n  return mergeVisualPrompt(channelStyleBibleForSeries(seriesType, channelKey), globalVisualBible, cutPrompt, index);\n}\n","js_v420a12/thumbnail.js":"import { channelStyleBibleForSeries } from \"./visualBible.js\";\n\n// V4 Alpha 34 — episode-level thumbnail workflow + strong color contrast strategy.\n// CUT 이미지와 별개인 전용 산출물로 관리한다. 실제 이미지 생성 AI 호출은 하지 않는다.\n// 핵심 변경: \"본편용 예쁜 장면\"과 \"클릭을 위한 썸네일\"을 구분한다.\n\nexport const THUMBNAIL_CONCEPTS = [\n  { id: \"auto\", label: \"✨ 자동 추천\", description: \"채널·시리즈·소재에 맞춰 클릭력이 높은 기본 콘셉트를 자동 선택\" },\n  { id: \"channel_default\", label: \"기본형\", description: \"채널 기본 스타일 · 핵심 피사체 크게 · 짧고 강한 훅\" },\n  { id: \"event_focus\", label: \"사건 강조형\", description: \"결정적 순간·기록·결과를 한눈에 보여주는 구도\" },\n  { id: \"emotion_focus\", label: \"감정 강조형\", description: \"표정·반응·감정 대비를 크게 보여주는 구도\" },\n  { id: \"curiosity\", label: \"궁금증 유발형\", description: \"결과를 다 보여주지 않고 질문과 시각적 단서로 클릭 유도\" },\n  { id: \"character_focus\", label: \"캐릭터 중심형\", description: \"주인공/캐릭터를 크게 배치해 IP 인지도를 강화\" },\n  { id: \"custom\", label: \"직접 지정\", description: \"원하는 썸네일 방향을 자유 입력\" },\n];\n\nexport function recommendedThumbnailConcept(seriesType, channelKey = \"unassigned\") {\n  if (seriesType === \"two_year_intern\") return \"character_focus\";\n  if (seriesType === \"horror\") return \"curiosity\";\n  if (channelKey === \"sports\") return \"event_focus\";\n  return \"channel_default\";\n}\n\nexport function newThumbnailState(seriesType = \"general_issue\", channelKey = \"unassigned\") {\n  return {\n    schemaVersion: \"1.2\",\n    conceptId: \"auto\",\n    resolvedConceptId: recommendedThumbnailConcept(seriesType, channelKey),\n    customConcept: \"\",\n    headline: \"\",\n    subline: \"\",\n    sourceCutIndex: 0,\n    prompt: \"\",\n    assetId: null,\n    status: \"planned\", // planned | prompt_ready | attached\n    updatedAt: null,\n  };\n}\n\nexport function normalizeThumbnailState(raw, seriesType = \"general_issue\", channelKey = \"unassigned\") {\n  const base = newThumbnailState(seriesType, channelKey);\n  const src = raw && typeof raw === \"object\" ? raw : {};\n  const ids = new Set(THUMBNAIL_CONCEPTS.map((x) => x.id));\n  const conceptId = ids.has(src.conceptId) ? src.conceptId : \"auto\";\n  const resolved = conceptId === \"auto\" ? recommendedThumbnailConcept(seriesType, channelKey) : conceptId;\n  return {\n    ...base,\n    ...src,\n    schemaVersion: \"1.2\",\n    conceptId,\n    // auto는 과거 저장값보다 현재 채널 규칙을 우선해 Alpha 34 추천을 즉시 반영한다.\n    resolvedConceptId: conceptId === \"auto\"\n      ? resolved\n      : (ids.has(src.resolvedConceptId) && src.resolvedConceptId !== \"auto\" ? src.resolvedConceptId : resolved),\n    customConcept: String(src.customConcept || \"\").trim(),\n    headline: String(src.headline || \"\").trim(),\n    subline: String(src.subline || \"\").trim(),\n    sourceCutIndex: Math.max(0, Number.isFinite(Number(src.sourceCutIndex)) ? Math.round(Number(src.sourceCutIndex)) : 0),\n    prompt: String(src.prompt || \"\").trim(),\n    assetId: src.assetId || null,\n    status: src.assetId ? \"attached\" : src.prompt ? \"prompt_ready\" : \"planned\",\n  };\n}\n\nexport function conceptLabel(id) {\n  return THUMBNAIL_CONCEPTS.find((x) => x.id === id)?.label || \"기본형\";\n}\n\nfunction sportsHeadlineCandidates(ep) {\n  const text = `${ep.title || \"\"} ${ep.subject || \"\"} ${ep.aiStoryMeta?.hook || \"\"}`;\n  const out = [];\n  const streak = text.match(/([가-힣A-Za-z0-9]+)?\\s*(\\d+연승)/);\n  if (streak) out.push(`${streak[1] || \"\"} ${streak[2]}`.trim());\n  const inning = text.match(/(\\d+이닝)\\s*(무실점|무자책)/);\n  if (inning) out.push(`${inning[1]} ${inning[2]}`);\n  if (/보스/.test(text)) out.push(\"보스가 막았다\");\n  if (/선두/.test(text)) out.push(\"선두 지켰다\");\n  return [...new Set(out)].slice(0, 3);\n}\n\nexport function thumbnailHeadlineCandidates(ep) {\n  if (ep.channelKey === \"sports\") {\n    const sports = sportsHeadlineCandidates(ep);\n    if (sports.length) return sports;\n  }\n  const hook = String(ep.aiStoryMeta?.hook || ep.subject || ep.title || \"\").replace(/\\s+/g, \" \").trim();\n  if (!hook) return [];\n  const short = hook.length > 18 ? hook.slice(0, 18).replace(/[,.!?]\\s*$/, \"\") : hook;\n  return [short];\n}\n\nexport function buildThumbnailPrompt(ep) {\n  const t = normalizeThumbnailState(ep.thumbnail, ep.seriesType, ep.channelKey);\n  const resolvedId = t.conceptId === \"auto\" ? recommendedThumbnailConcept(ep.seriesType, ep.channelKey) : t.conceptId;\n  const concept = THUMBNAIL_CONCEPTS.find((x) => x.id === resolvedId);\n  const cut = (ep.cuts || [])[Math.min(t.sourceCutIndex, Math.max(0, (ep.cuts || []).length - 1))];\n  const hook = ep.aiStoryMeta?.hook || ep.metaDescription || cut?.narration || ep.subject || ep.title || \"\";\n  const custom = t.conceptId === \"custom\" && t.customConcept ? `사용자 지정 방향: ${t.customConcept}` : \"\";\n  const candidates = thumbnailHeadlineCandidates(ep);\n  const mainHeadline = t.headline || candidates[0] || \"\";\n  const seriesRule = ep.seriesType === \"two_year_intern\"\n    ? \"두살인턴 IP의 기존 캐릭터 외형과 밝고 귀여운 프리미엄 3D 카툰 톤을 유지\"\n    : ep.seriesType === \"horror\"\n      ? \"공포/긴장 소재의 핵심 단서를 명확하게 보여주되 과도한 고어 표현은 피함\"\n      : \"밝고 선명한 프리미엄 3D 카툰 톤, 깨끗하고 고급스러운 렌더링\";\n  const colorRules = [\n    \"색상 전략: 썸네일은 파스텔/저채도 단색 위주가 아니라 강한 고대비 색 조합을 기본으로 사용\",\n    \"주요 색은 최대 3개 중심으로 정리: 브랜드/배경색 1개 + 강조색 1개 + 흰색 계열 텍스트. 검정 외곽선/그림자로 분리\",\n    \"빨강·노랑은 핵심 숫자·승부·반전·위기 같은 시선 고정 단어에 우선 사용하고 화면 전체를 빨강/노랑으로 도배하지 않기\",\n    \"파랑·빨강·흰색 또는 파랑·노랑·흰색처럼 작은 모바일 화면에서도 즉시 분리되는 조합을 우선\",\n    \"메인 문구 안에서도 핵심 단어/숫자만 별도 강조색을 사용해 1차/2차 정보 위계를 명확히 만들기\",\n    \"배경과 글자 색이 비슷해지는 저대비 조합, 회색끼 도는 탁한 색, 여러 파스텔색 혼합은 피하기\",\n  ];\n  const sportsRules = ep.channelKey === \"sports\"\n    ? [\n        \"스포츠 썸네일 규칙: 본편용 경기 장면처럼 단순하게 만들지 말고, 클릭용 썸네일로 별도 연출\",\n        \"선수 얼굴/상반신 또는 결정적 동작을 크게 배치하고 기록·승부 결과를 한눈에 이해시키기\",\n        \"화면 상단 약 25~35%에 2~5단어의 큰 한글 훅 문구, 굵은 검정 외곽선과 강한 대비. 팀/브랜드 파랑을 기본축으로 하되 핵심 기록 숫자는 빨강 또는 노랑, 보조 문구는 흰색을 우선\",\n        \"가능하면 숫자 기록(연승, 이닝, 무실점 등)을 시각적 핵심으로 사용\",\n        \"선수 전신만 중앙에 세운 평범한 포스터 구도, 의미 없는 야구공 중복, 작은 글씨는 금지\",\n      ]\n    : [];\n  return [\n    channelStyleBibleForSeries(ep.seriesType, ep.channelKey),\n    \"\",\n    \"[YOUTUBE CLICK-DRIVEN THUMBNAIL]\",\n    `제목/소재: ${ep.title || ep.subject || \"(미입력)\"}`,\n    `썸네일 콘셉트: ${concept?.label || \"기본형\"} — ${concept?.description || \"\"}`,\n    custom,\n    `핵심 훅: ${hook}`,\n    candidates.length ? `문구 후보: ${candidates.join(\" / \")}` : \"\",\n    mainHeadline ? `메인 문구: ${mainHeadline}` : \"메인 문구: 2~5단어, 짧고 강하게, 영상 제목과 그대로 중복하지 않기\",\n    t.subline ? `보조 문구: ${t.subline}` : \"보조 문구: 필요할 때만 한 줄, 없으면 생략\",\n    cut?.situation ? `참고 장면: CUT ${t.sourceCutIndex + 1} — ${cut.situation}` : \"\",\n    cut?.productionPrompt ? `참고 이미지 프롬프트: ${cut.productionPrompt}` : \"\",\n    `스타일 규칙: ${seriesRule}`,\n    ...colorRules,\n    ...sportsRules,\n    \"공통 구성 규칙: 작은 모바일 화면에서도 1초 안에 사건을 이해, 가장 강한 표정/행동/관계와 큰 문구를 우선, 배경은 단순화, 핵심 피사체와 문구를 서로 가리지 않기\",\n    \"중요: 썸네일은 본편 CUT 재사용 이미지가 아니라 클릭률을 위해 별도로 설계한 9:16 세로 썸네일 산출물\",\n  ].filter(Boolean).join(\"\\n\");\n}\n","js_v420a12/navigationLifecycle.js":"// v4.1.0 Alpha 19 — active draft lifecycle bridge.\n// 현재 화면의 아직 debounce되지 않은 초안을 라우팅/백그라운드 전환 직전에 flush한다.\nlet activeDraftFlush = null;\n\nexport function setActiveDraftFlush(fn) {\n  activeDraftFlush = typeof fn === \"function\" ? fn : null;\n}\n\nexport function clearActiveDraftFlush() {\n  activeDraftFlush = null;\n}\n\nexport async function flushActiveDraft() {\n  const fn = activeDraftFlush;\n  if (!fn) return;\n  await fn();\n}\n","js_v420a12/views/planStep.js":"import { toast } from \"../util.js\";\nimport { SERIES_TYPES, seriesTypeLabel } from \"../seriesTypes.js\";\nimport { stepsFor, newCut, reindexCuts, applyMotionPreset } from \"../model.js\";\nimport { recipesForSeries, resolveRecipeState, applyRecipeToEpisode } from \"../recipe.js\";\nimport { THUMBNAIL_CONCEPTS, normalizeThumbnailState, buildThumbnailPrompt, conceptLabel } from \"../thumbnail.js\";\nimport { setActiveDraftFlush } from \"../navigationLi ngform = (ep.contentFormat || \"shorts\") === \"longform\";\n  const autoSummary = root.querySelector(\"#v5-auto-summary\");\n  autoSummary.innerHTML = `\n    <div class=\"hint\">자동화 모드: <b>Auto First</b></div>\n    <div class=\"hint\">Seamless Loop: <b>${isEconomyShorts ? \"필수 적용\" : (autoPlan.seamlessLoop?.enabled !== false ? \"자동 검토\" : \"끔\")}</b></div>\n    <div class=\"hint\">롱폼 자동화: <b>${isLongform ? \"활성\" : \"Shorts에서는 대기\"}</b></div>\n  `;\n\n  const longWrap = root.querySelector(\"#v5-longform-settings\");\n  const longMinutes = root.querySelector(\"#v5-longform-minutes\");\n  const longChapters = root.querySelector(\"#v5-longform-chapters\");\n  const longVisualSec = root.querySelector(\"#v5-longform-visual-sec\");\n  function buildLongformScenePlan(){\n    const minutes=Math.max(5,Number(longMinutes.value)||20);\n    const chapters=Math.max(3,Number(longChapters.value)||7);\n    const changeSec=Math.max(6,Number(longVisualSec.value)||18);\n    const estimated=Math.max(chapters,Math.round(minutes*60/changeSec));\n    return Array.from({length:estimated},(_,i)=>({\n      sceneNo:i+1,\n      chapterNo:Math.min(chapters,Math.floor(i*chapters/estimated)+1),\n      role:i===0?\"HOOK\":(i===estimated-1?\"ENDING\":\"BODY\"),\n      targetSeconds:changeSec,\n      visualMode:i%3===0?\"context\":(i%3===1?\"character\":\"detail\"),\n      motionPreset:i%2===0?\"slow_push\":\"slow_pan\",\n      overlayPolicy:\"minimal\"\n    }));\n  }\n\n  function scenePlanToCuts(scenePlan){\n    return (scenePlan || []).map((scene, idx)=>{\n      const cut = newCut(idx);\n      cut.purpose = scene.role === \"HOOK\" ? \"HOOK\" : (scene.role === \"ENDING\" ? \"엔딩\" : \"전개\");\n      cut.situation = `CH${scene.chapterNo} · Scene ${scene.sceneNo} · ${scene.visualMode}`;\n      cut.directorNote = [\n        \"V5_LONGFORM\",\n        `chapter:${scene.chapterNo}`,\n        `scene:${scene.sceneNo}`,\n        `visual:${scene.visualMode}`,\n        `overlay:${scene.overlayPolicy}`\n      ].join(\" · \");\n      cut.duration.estimated = Number(scene.targetSeconds) || 18;\n      applyMotionPreset(cut, scene.motionPreset === \"slow_pan\"\n        ? (idx % 2 === 0 ? \"PAN_RIGHT\" : \"PAN_LEFT\")\n        : \"PUSH_IN_SLOW\");\n      cut.subtitle = { dialogue:false, narration:false };\n      return cut;\n    });\n  }\n\n  if (isLongform) {\n    longWrap.style.display = \"block\";\n    longMinutes.value = autoPlan.longform?.targetMinutes || 20;\n    longChapters.value = autoPlan.longform?.chapterCount || 7;\n    longVisualSec.value = autoPlan.longform?.visualChangeSeconds || 18;\n    [\"change\",\"blur\"].forEach((evt)=>{\n      [longMinutes,longChapters,longVisualSec].forEach((el)=>el.addEventListener(evt, async ()=>{\n        ep.automationPlan.longform = {\n          ...ep.automationPlan.longform,\n          enabled:true,\n          targetMinutes:Math.max(5,Number(longMinutes.value)||20),\n          chapterCount:Math.max(3,Number(longChapters.value)||7),\n          visualChangeSeconds:Math.max(6,Number(longVisualSec.value)||18),\n          narrationMode:\"master_narration\",\n          autoQc:true,\n          autoStoryboard:true,\n          autoTimeline:true\n        };\n        await ctx.save({automationPlan:ep.automationPlan});\n      }));\n    });\n\n    const buildPlanBtn=root.querySelector(\"#v5-build-longform-plan\");\n    const planSummary=root.querySelector(\"#v5-longform-plan-summary\");\n    const refreshPlanSummary=()=>{\n      const p=ep.automationPlan?.longform?.scenePlan||[];\n      planSummary.textContent=p.length?`자동 장면계획 ${p.length}개 · 챕터 ${ep.automationPlan.longform.chapterCount}개`:\"아직 장면계획이 없습니다.\";\n    };\n    refreshPlanSummary();\n    buildPlanBtn?.addEventListener(\"click\",async()=>{\n      ep.automationPlan.longform={\n        ...ep.automationPlan.longform,\n        enabled:true,\n        targetMinutes:Math.max(5,Number(longMinutes.value)||20),\n        chapterCount:Math.max(3,Number(longChapters.value)||7),\n        visualChangeSeconds:Math.max(6,Number(longVisualSec.value)||18),\n        narrationMode:\"master_narration\",\n        autoQc:true,\n        autoStoryboard:true,\n        autoTimeline:true,\n        scenePlan:buildLongformScenePlan()\n      };\n      await ctx.save({automationPlan:ep.automationPlan});\n      refreshPlanSummary();\n      toast(`롱폼 장면계획 ${ep.automationPlan.longform.scenePlan.length}개를 자동 생성했습니다.`);\n    });\n\n    const applyPlanBtn=root.querySelector(\"#v5-apply-longform-plan\");\n    applyPlanBtn?.addEventListener(\"click\",async()=>{\n      const scenePlan=ep.automationPlan?.longform?.scenePlan||[];\n      if(!scenePlan.length){\n        toast(\"먼저 롱폼 장면계획을 자동 생성해주세요.\");\n        return;\n      }\n      if((ep.cuts||[]).some(c=>c?.narration||c?.image?.assetId||(c?.audioEvents||[]).length)){\n        toast(\"기존 CUT 산출물이 있어 자동 덮어쓰기를 중단했습니다.\");\n        return;\n      }\n      ep.cuts=reindexCuts(scenePlanToCuts(scenePlan));\n      ep.audioMode=\"master_narration\";\n      ep.automationPlan.longform.cutSkeletonBuiltAt=Date.now();\n      await ctx.save({cuts:ep.cuts,audioMode:ep.audioMode,automationPlan:ep.automationPlan});\n      refreshPlanSummary();\n      toast(`롱폼 CUT 골격 ${ep.cuts.length}개를 생성했습니다.`);\n    });\n  }\n  thumbSelect.value = ep.thumbnail.conceptId;\n  thumbCustom.value = ep.thumbnail.customConcept || \"\";\n  thumbHeadline.value = ep.thumbnail.headline || \"\";\n  thumbSubline.value = ep.thumbnail.subline || \"\";\n\n  // Alpha 20 — IndexedDB 저장이 시작되기 전 탭/브라우저가 강제 종료되는 극단 상황을 위한\n  // 동기 localStorage 체크포인트. 저장 성공 시 제거하므로 정상 흐름의 SSOT는 IndexedDB다.\n  const emergency = loadEmergencyDraft(ep);\n  if (emergency?.values) {\n    const v = emergency.values;\n    if (typeof v.title === \"string\") root.querySelector(\"#f-title\").value = v.title;\n    if (typeof v.date === \"string\") root.querySelector(\"#f-date\").value = v.date;\n    if (typeof v.subject === \"string\") root.querySelector(\"#f-subject\").value = v.subject;\n    if (Array.isArray(v.sources)) root.querySelector(\"#f-sources\").value = v.sources.join(\"\\n\");\n    if (v.thumbnail) {\n      thumbSelect.value = v.thumbnail.conceptId || thumbSelect.value;\n      thumbCustom.value = v.thumbnail.customConcept || \"\";\n      thumbHeadline.value = v.thumbnail.headline || \"\";\n      thumbSubline.value = v.thumbnail.subline || \"\";\n    }\n  }\n  const renderThumbPlan = () => {\n    const selected = THUMBNAIL_CONCEPTS.find((x) => x.id === thumbSelect.value) || THUMBNAIL_CONCEPTS[0];\n    root.querySelector(\"#thumb-concept-desc\").textContent = selected.description;\n    root.querySelector(\"#thumb-custom-wrap\").style.display = thumbSelect.value === \"custom\" ? \"block\" : \"none\";\n    const resolved = thumbSelect.value === \"auto\" ? conceptLabel(normalizeThumbnailState({ conceptId: \"auto\" }, ep.seriesType, ep.channelKey).resolvedConceptId) : selected.label;\n    root.querySelector(\"#thumb-plan-status\").textContent = thumbSelect.value === \"auto\" ? `자동 추천 결과: ${resolved}` : `선택됨: ${resolved}`;\n  };\n  thumbSelect.onchange = renderThumbPlan;\n  renderThumbPlan();\n\n  const recipeState = resolveRecipeState(ep);\n  const recipeSelect = root.querySelector(\"#recipe-select\");\n  const availableRecipes = recipesForSeries(ep.seriesType);\n  availableRecipes.forEach((recipe) => {\n    const option = document.createElement(\"option\");\n    option.value = recipe.id;\n    option.textContent = recipe.label;\n    if (recipe.id === recipeState.selectedId) option.selected = true;\n    recipeSelect.appendChild(option);\n  });\n  const renderRecipeDescription = () => {\n    const selected = availableRecipes.find((r) => r.id === recipeSelect.value) || availableRecipes[0];\n    root.querySelector(\"#recipe-desc\").textContent = selected ? `${selected.description} · 목표 ${selected.story.targetSeconds}초 / CUT ${selected.story.targetCutCount}개` : \"선택 가능한 Recipe가 없습니다.\";\n    root.querySelector(\"#recipe-state\").textContent = recipeState.appliedId ? `마지막 적용 /subject/sources는 애초에 저장된 적이 없으므로 나중에\n  // 사라진 것처럼 보이는 생산 차단 버그가 있었다. #save-stay-btn(\"저장\")을 추가해 다음으로\n  // 넘어가지 않고도 언제든 안전하게 저장할 수 있게 한다 — 두 버튼 모두 같은 readFormValues()\n  // + ctx.save() 경로를 공유한다(작업지시서: \"Plan draft와 CUT을 동일 merge save로 저장하면서\n  // 다른 episode metadata도 보존\"). ctx.save()는 Object.assign(ep, patch) 후 episode 전체를\n  // 그대로 저장하므로(js/views/episode.js), 이 STEP이 저장한 필드({title,date,subject,sources})\n  // 는 이후 다른 STEP이 자신의 필드만 담은 patch로 저장하더라도(예: cutAudioStep의\n  // ctx.save({cuts})) 함께 보존된다 — 두 저장 모두 매번 \"현재 episode 전체\"를 대상으로 하는\n  // merge save이기 때문이다.\n  function readFormValues() {\n    return {\n      title: root.querySelector(\"#f-title\").value.trim(),\n      date: root.querySelector(\"#f-date\").value.trim(),\n      subject: root.querySelector(\"#f-subject\").value.trim(),\n      sources: root.querySelector(\"#f-sources\").value.split(\"\\n\").map((s) => s.trim()).filter(Boolean),\n      thumbnail: (() => {\n        const t = normalizeThumbnailState(ep.thumbnail, ep.seriesType, ep.channelKey);\n        t.conceptId = thumbSelect.value;\n        t.customConcept = thumbCustom.value.trim();\n        t.headline = thumbHeadline.value.trim();\n        t.subline = thumbSubline.value.trim();\n        t.updatedAt = Date.now();\n        const draftEp = { ...ep, thumbnail: t, title: root.querySelector(\"#f-title\").value.trim(), subject: root.querySelector(\"#f-subject\").value.trim() };\n        t.prompt = buildThumbnailPrompt(draftEp);\n        t.status = t.assetId ? \"attached\" : \"prompt_ready\";\n        return t;\n      })(),\n    };\n  }\n\n  // v4.1.0 Alpha 8 — Plan draft autosave.\n  // 모바일에서 제목/날짜/주제/출처/썸네일 방향을 입력한 뒤 STEP 칩이나 하단 빠른 이동을\n  // 눌러도 초안이 사라지지 않도록, 입력을 잠깐 멈추거나 포커스를 벗어날 때 조용히 저장한다.\n  // 화면 전체 re-render는 하지 않아 키보드/커서가 끊기지 않는다.\n  let autoSaveTimer = null;\n  let autoSaveBusy = false;\n  let autoSaveQueued = false;\n  let lastAutoSaveErrorNoticeAt = 0;\n\n  function reportAutoSaveError(err) {\n    console.error(\"Plan autosave failed\", err);\n    const now = Date.now();\n    if (now - lastAutoSaveErrorNoticeAt > 5000) {\n      lastAutoSaveErrorNoticeAt = now;\n      toast(\"자동저장에 실패했어요. 입력값은 비상 체크포인트에 보관 중입니다.\");\n    }\n  }\n\n  async function persistDraftSilently() {\n    if (autoSaveBusy) {\n      autoSaveQueued = true;\n      return;\n    }\n    autoSaveBusy = true;\n    const values = readFormValues();\n    try {\n      await ctx.save(values);\n      clearEmergencyDraftIfCovered(ep, values);\n      if (ctx.refreshShell) await ctx.refreshShell();\n    } finally {\n      autoSaveBusy = false;\n      if (autoSaveQueued) {\n        autoSaveQueued = false;\n        await persistDraftSilently();\n      }\n    }\n  }\n\n  function scheduleDraftSave() {\n    writeEmergencyDraft(ep, readFormValues());\n    clearTimeout(autoSaveTimer);\n    autoSaveTimer = setTimeout(() => {\n      persistDraftSilently().catch(reportAutoSaveError);\n    }, 450);\n  }\n\n  // Alpha 19: STEP 칩/브라우저 뒤로가기/백그라운드 전환이 debounce 450ms보다 빨라도\n  // app.js가 화면을 바꾸기 전에 현재 Plan DOM을 읽어 강제 flush할 수 있게 등록한다.\n  setActiveDraftFlush(async () => {\n    clearTimeout(autoSaveTimer);\n    await persistDraftSilently();\n  });\n\n  [\n    \"#f-title\", \"#f-date\", \"#f-subject\", \"#f-sources\",\n    \"#thumb-custom\", \"#thumb-headline\", \"#thumb-subline\"\n  ].forEach((selector) => {\n    const field = root.querySelector(selector);\n    if (!field) return;\n    field.addEventListener(\"input\", scheduleDraftSave);\n    field.addEventListener(\"blur\", () => {\n      writeEmergencyDraft(ep, readFormValues());\n      clearTimeout(autoSaveTimer);\n      persistDraftSilently().catch(reportAutoSaveError);\n    });\n  });\n  thumbSelect.addEventListener(\"change\", () => {\n    writeEmergencyDraft(ep, readFormValues());\n    clearTimeout(autoSaveTimer);\n    persistDraftSilently().catch(reportAutoSaveError);\n  });\n\n  root.querySelector(\"#save-stay-btn\").onclick = async () => {\n    clearTimeout(autoSaveTimer);\n    await persistDraftSilently();\n    toast(\"저장했어요\");\n  };\n\n  root.querySelector(\"#save-btn\").onclick = async () => {\n    clearTimeout(autoSaveTimer);\n    await ctx.save(readFormValues());\n    toast(\"저장했어요\");\n    location.hash = `#/episode/${ep.id}/${nextStep.key}`;\n  };\n}\n\nfunction attr(s) {\n  return String(s ?? \"\").replace(/&/g, \"&amp;\").replace(/\"/g, \"&quot;\").replace(/</g, \"&lt;\");\n}\n","js_v420a12/parse.js":"// Cowork 대화 결과 붙여넣기용 아주 단순한 파서.\n// 실패해도 예외를 던지지 않고 null을 반환 — 실패 시 그냥 수동 입력으로 넘어가면 됨.\nimport { newScene } from \"./model.js\";\n\nexport function parsePaste(text) {\n  const trimmed = (text || \"\").trim();\n  if (!trimmed) return null;\n\n  // 패턴 1: content_issue_vN.json 형태의 JSON\n  if (trimmed.startsWith(\"{\")) {\n    try {\n      const obj = JSON.parse(trimmed);\n      if (Array.isArray(obj.scenes)) {\n        return {\n          type: \"json\",\n          meta: obj.meta || {},\n          // newScene()을 인자 없이 호출하면 내부 기본값 로직 때문에 panel이 항상 true로 잡히는\n          // 버그가 있었음(2026.08.19 발견) — JSON에 명시된 값만 그대로 쓰도록 마지막에 덮어씀.\n          scenes: obj.scenes.map((s) => ({ ...newScene(), ...s, panel: !!s.panel })),\n        };\n      }\n    } catch (e) {\n      // JSON 파싱 실패 -> 다음 패턴 시도\n    }\n  }\n\n  // 패턴 2: \"1. 문장...\" 번호 매겨진 나레이션 대본\n  const lines = trimmed.split(\"\\n\").map((l) => l.trim()).filter(Boolean);\n  const numbered = lines\n    .map((l) => l.match(/^(\\d+)[.)]\\s*(.+)$/))\n    .filter(Boolean)\n    .map((m) => m[2]);\n  if (numbered.length >= 2) {\n    return { type: \"narration\", lines: numbered };\n  }\n\n  return null;\n}\n","js_v420a12/views/scenesStep.js":"import { newScene, BADGE_COLOR_PRESETS } from \"../model.js\";\nimport { toast, el } from \"../util.js\";\nimport { parsePaste } from \"../parse.js\";\n\nexport async function render(root, ep, ctx) {\n  root.innerHTML = `\n    <div class=\"card\">\n      <h3>Cowork에서 만든 대본/JSON 붙여넣기 (선택)</h3>\n      <textarea id=\"paste-box\" rows=\"4\" placeholder=\"번호 매겨진 나레이션 대본(1. ... 2. ...) 또는 content_issue_vN.json 전체를 붙여넣으면 자동으로 씬을 채워줘요.\"></textarea>\n      <button class=\"btn secondary\" id=\"parse-btn\" style=\"margin-top:8px;\">자동 채우기</button>\n    </div>\n    <div id=\"scene-list\"></div>\n    <div class=\"btn-row\">\n      <button class=\"btn secondary\" id=\"add-scene\">+ 씬 추가</button>\n      <button class=\"btn\" id=\"save-next\">저장하고 다음 (③ 재생시간)</button>\n    </div>\n  `;\n\n  root.querySelector(\"#parse-btn\").onclick = () => {\n    const text = root.querySelector(\"#paste-box\").value;\n    const parsed = parsePaste(text);\n    if (!parsed) {\n      toast(\"인식하지 못했어요 — 형식을 확인해주세요\");\n      return;\n    }\n    if (parsed.type === \"json\") {\n      ep.scenes = parsed.scenes;\n      if (parsed.meta.title) ep.subject = parsed.meta.subject || ep.subject;\n      if (parsed.meta.date) ep.date = parsed.meta.date;\n      if (Array.isArray(parsed.meta.sources)) ep.sources = parsed.meta.sources;\n    } else if (parsed.type === \"narration\") {\n      // 기존 씬 개수에 맞춰 narration_line만 채우고, 부족하면 씬을 새로 만듦\n      const n = parsed.lines.length;\n      while (ep.scenes.length < n) ep.scenes.push(newScene(ep.scenes.length));\n      parsed.lines.forEach((line, i) => (ep.scenes[i].narration_line = line));\n    }\n    ctx.save({ scenes: ep.scenes, subject: ep.subject, date: ep.date, sources: ep.sources });\n    toast(`${parsed.type === \"json\" ? \"JSON\" : \"나레이션\"} ${ep.scenes.length}개 씬으로 반영했어요`);\n    renderList();\n  };\n\n  root.querySelector(\"#add-scene\").onclick = async () => {\n    ep.scenes.push(newScene(ep.scenes.length));\n    await ctx.save({ scenes: ep.scenes });\n    renderList();\n  };\n\n  root.querySelector(\"#save-next\").onclick = async () => {\n    await ctx.save({ scenes: ep.scenes });\n    toast(\"저장했어요\");\n    location.hash = `#/episode/${ep.id}/duration`;\n  };\n\n  function renderList() {\n    const list = root.querySelector(\"#scene-list\");\n    list.innerHTML = \"\";\n    ep.scenes.forEach((scene, i) => list.appendChild(sceneCard(scene, i)));\n  }\n\n  function sceneCard(scene, i) {\n    const node = el(`\n      <div class=\"scene-item\">\n        <div class=\"scene-head\">\n          <span class=\"idx\">씬 ${i + 1}${scene.panel ? \" · 패널\" : \"\"}</span>\n          <button class=\"btn danger small\" data-act=\"del\">삭제</button>\n        </div>\n        <label>배지 텍스트 (badge)</label>\n        <input type=\"text\" data-f=\"badge\" value=\"${attr(scene.badge)}\" placeholder=\"예: 8월 3일\" />\n        <label>헤드라인 (headline, 줄바꿈은 \\\\n)</label>\n        <textarea data-f=\"headline\" rows=\"2\" placeholder=\"세제개편안 발표\\\\n양도세·종부세 인상\">${attr(scene.headline)}</textarea>\n        <label>자막 (caption)</label>\n        <textarea data-f=\"caption\" rows=\"2\">${attr(scene.caption)}</textarea>\n        <label>나레이션 문장 (narration_line)</label>\n        <textarea data-f=\"narration_line\" rows=\"2\">${attr(scene.narration_line)}</textarea>\n        <label style=\"display:flex;align-items:center;gap:8px;\">\n          <input type=\"checkbox\" data-f=\"panel\" ${scene.panel ? \"checked\" : \"\"} style=\"width:auto;\" /> 패널(테두리 박스) 사용\n        </label>\n        <label>배지 색상</label>\n        <div class=\"color-swatches\" data-f=\"badge_color\"></div>\n      </div>\n    `);\n\n    node.querySelectorAll(\"input[data-f], textarea[data-f]\").forEach((input) => {\n      const field = input.dataset.f;\n      const handler = async () => {\n        if (input.type === \"checkbox\") {\n          scene[field] = input.checked;\n        } else {\n          scene[field] = input.value;\n        }\n        await ctx.save({ scenes: ep.scenes });\n      };\n      input.addEventListener(\"change\", handler);\n      input.addEventListener(\"blur\", handler);\n    });\n\n    const swatchBox = node.querySelector('[data-f=\"badge_color\"]');\n    BADGE_COLOR_PRESETS.forEach((preset) => {\n      const isSel = JSON.stringify(scene.badge_color) === JSON.stringify(preset.rgb);\n      const sw = el(`<div class=\"swatch ${isSel ? \"selected\" : \"\"}\" title=\"${preset.name}\" style=\"background: rgb(${preset.rgb.join(\",\")})\"></div>`);\n      sw.onclick = async () => {\n        scene.badge_color = preset.rgb;\n        await ctx.save({ scenes: ep.scenes });\n        renderList();\n      };\n      swatchBox.appendChild(sw);\n    });\n\n    node.querySelector('[data-act=\"del\"]').onclick = async () => {\n      if (!confirm(`씬 ${i + 1}을 삭제할까요?`)) return;\n      ep.scenes.splice(i, 1);\n      await ctx.save({ scenes: ep.scenes });\n      renderList();\n    };\n\n    return node;\n  }\n\n  renderList();\n}\n\nfunction attr(s) {\n  return String(s ?? \"\").replace(/&/g, \"&amp;\").replace(/</g, \"&lt;\").replace(/\"/g, \"&quot;\");\n}\n","js_v420a12/views/durationStep.js":"import { estimateSceneDurations, RATE_NORMAL, RATE_SLOW, RATE_HORROR } from \"../sceneTiming.js\";\nimport { ratePresetForSeriesType } from \"../seriesTypes.js\";\nimport { copyText, toast } from \"../util.js\";\n\nexport async function render(root, ep, ctx) {\n  // rate는 어디까지나 \"초기 참고값\"이다 — 최종 재생시간 우선순위는\n  // manual > measured(실측) > estimated(이 값) 순이며, 사용자가 버튼으로 언제든 바꿀 수 있다.\n  const defaultRate = ratePresetForSeriesType(ep.seriesType);\n\n  root.innerHTML = `\n    <div class=\"card\">\n      <h3>계산 기준 속도 (rate, 초당 글자수)</h3>\n      <div class=\"btn-row\">\n        <button class=\"btn small ${eqRate(defaultRateState(), RATE_NORMAL) ? \"\" : \"secondary\"}\" data-rate=\"${RATE_NORMAL}\">일반 ${RATE_NORMAL}</button>\n        <button class=\"btn small ${eqRate(defaultRateState(), RATE_SLOW) ? \"\" : \"secondary\"}\" data-rate=\"${RATE_SLOW}\">뉴스/정치 ${RATE_SLOW}</button>\n        <button class=\"btn small ${eqRate(defaultRateState(), RATE_HORROR) ? \"\" : \"secondary\"}\" data-rate=\"${RATE_HORROR}\">공포 ${RATE_HORROR}</button>\n      </div>\n      <p class=\"hint\">글자수(공백·가운뎃점 제외) ÷ 속도 + 0.7초 여유, 최소 3.5초 보장 (기존 scene_timing.py와 동일한 공식)</p>\n    </div>\n    <div class=\"card\">\n      <table class=\"dur-table\" id=\"dur-table\">\n        <thead><tr><th>씬</th><th>글자수</th><th>여유(초)</th><th class=\"num\">추정(초)</th></tr></thead>\n        <tbody></tbody>\n      </table>\n      <div class=\"hint\" id=\"total-line\" style=\"margin-top:10px;\"></div>\n    </div>\n    <div class=\"btn-row\">\n      <button class=\"btn secondary\" id=\"copy-btn\">Python 배열로 복사</button>\n      <button class=\"btn\" id=\"save-next\">저장하고 다음 (④ 이미지검수)</button>\n    </div>\n    <p class=\"hint\">⑤ 나레이션 타이밍 마커에서 실측값을 찍으면, 이 추정치 대신 실측값이 최종 결과에 우선 사용돼요.</p>\n  `;\n\n  let currentRate = defaultRate;\n\n  root.querySelectorAll(\"[data-rate]\").forEach((btn) => {\n    btn.onclick = () => {\n      currentRate = Number(btn.dataset.rate);\n      root.querySelectorAll(\"[data-rate]\").forEach((b) => b.classList.toggle(\"secondary\", Number(b.dataset.rate) !== currentRate));\n      compute();\n    };\n  });\n\n  root.querySelector(\"#copy-btn\").onclick = () => {\n    const durs = ep.scenes.map((s) => s._estimatedDur ?? 0);\n    const code = `_SCENE_DURS_ESTIMATE = [${durs.join(\", \")}]  # rate=${currentRate}`;\n    copyText(code);\n  };\n\n  root.querySelector(\"#save-next\").onclick = async () => {\n    await ctx.save({ scenes: ep.scenes });\n    toast(\"저장했어요\");\n    location.hash = `#/episode/${ep.id}/images`;\n  };\n\n  function defaultRateState() {\n    return defaultRate;\n  }\n  function eqRate(a, b) {\n    return Math.abs(a - b) < 1e-6;\n  }\n\n  function compute() {\n    const lines = ep.scenes.map((s) => s.narration_line || \"\");\n    const extraPad = {};\n    ep.scenes.forEach((s, i) => { if (s.extra_pad) extraPad[i] = s.extra_pad; });\n    const durs = estimateSceneDurations(lines, { rate: currentRate, extraPad });\n\n    const tbody = root.querySelector(\"#dur-table tbody\");\n    tbody.innerHTML = \"\";\n    let total = 0;\n    ep.scenes.forEach((s, i) => {\n      s._estimatedDur = durs[i];\n      total += durs[i];\n      const nChars = (s.narration_line || \"\").replace(/[\\s·]/g, \"\").length;\n      const tr = document.createElement(\"tr\");\n      tr.innerHTML = `\n        <td>씬 ${i + 1}</td>\n        <td>${nChars}</td>\n        <td><input type=\"number\" step=\"0.1\" min=\"0\" value=\"${s.extra_pad || 0}\" data-extra=\"${i}\" style=\"width:64px;padding:6px;background:var(--bg-card2);border:1px solid var(--border);color:var(--text);border-radius:6px;\" /></td>\n        <td class=\"num\">${durs[i].toFixed(1)}s</td>\n      `;\n      tbody.appendChild(tr);\n    });\n    root.querySelector(\"#total-line\").textContent = `예상 총 길이: 약 ${total.toFixed(1)}초`;\n\n    tbody.querySelectorAll(\"[data-extra]\").forEach((input) => {\n      input.onchange = async () => {\n        const i = Number(input.dataset.extra);\n        ep.scenes[i].extra_pad = Number(input.value) || 0;\n        await ctx.save({ scenes: ep.scenes });\n        compute();\n      };\n    });\n  }\n\n  compute();\n}\n","js_v420a12/views/imagesStep.js":"import { el, toast, copyText } from \"../util.js\";\n\n// 이미지 파일명 순서를 믿지 않고, 사람이 직접 눈으로 보고 STEP 순서를 맞추는 검수 도구.\n// 파일 자체는 서버로 전송되지 않고 브라우저 메모리(object URL)에만 존재함 — 새로고침하면 사라지므로\n// \"완료\" 시 파일명 매핑만 에피소드에 저장해둠.\n\nlet slotFiles = []; // { file, url } | null, index = STEP 순서(0-based)\nlet selectedIndex = null;\n\nexport async function render(root, ep, ctx) {\n  const n = ep.scenes.length;\n  slotFiles = ep.scenes.map(() => null);\n  selectedIndex = null;\n\n  root.innerHTML = `\n    <div class=\"card\">\n      <h3>1) 폰 갤러리에서 이미지 ${n}장 선택</h3>\n      <p class=\"hint\">AI가 만들어준 순서(파일명)를 그대로 믿지 마세요 — 실제로 순서가 어긋난 적이 있었어요. 아래에서 직접 확인하고 재배치하세요.</p>\n      <input type=\"file\" id=\"file-input\" accept=\"image/*\" multiple class=\"btn secondary\" style=\"padding:10px;\" />\n    </div>\n    <div class=\"card\">\n      <h3>2) STEP 순서대로 재배치 (탭해서 두 장씩 자리 바꾸기)</h3>\n      <div class=\"img-grid\" id=\"img-grid\"></div>\n      <p class=\"hint\">이미지를 탭하면 선택되고(테두리 강조), 다른 이미지를 다시 탭하면 두 자리가 서로 바뀌어요.</p>\n    </div>\n    <div class=\"card\" id=\"mapping-card\" style=\"display:none;\">\n      <h3>3) STEP ↔ 원본 파일명
