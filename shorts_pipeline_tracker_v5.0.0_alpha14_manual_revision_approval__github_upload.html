(handoff.hookCandidates) ? handoff.hookCandidates : [],\n    targetMinutes: Math.max(5, Math.min(30, Number(targetMinutes) || 15)),\n    chapterCount: Math.max(3, Math.min(10, Number(chapterCount) || 6)),\n  };\n\n  const data = await fetchJson(`${base}/api/claude-story`, {\n    method: \"POST\",\n    headers: { \"Content-Type\": \"application/json\", Accept: \"application/json\" },\n    body: JSON.stringify({ input }),\n  }, Math.max(Number(settings.timeoutMs) || 90000, 420000));\n\n  if (!data?.ok || !data?.draft) throw new Error(data?.error || \"Claude 대본 응답이 비어 있습니다.\");\n  return {\n    draft: data.draft,\n    model: data.model || \"Claude\",\n    usage: data.usage || null,\n    provider: data.provider || \"Anthropic\",\n  };\n}\n\n\n// V5 Alpha 10 — Claude Longform Draft를 OpenAI QC 전용 endpoint로 보낸다.\nexport async function checkGptLongformQcProvider(settings = loadAiProviderSettings()) {\n  const base = cleanBaseUrl(settings.proxyUrl);\n  if (!/^https:\\/\\//i.test(base)) return { ok: false, reason: \"proxy_not_configured\" };\n  try {\n    const data = await fetchJson(`${base}/api/gpt-script-qc`, {\n      method: \"GET\",\n      headers: { Accept: \"application/json\" },\n    }, 15000);\n    return { ok: Boolean(data?.ok), ...data };\n  } catch (err) {\n    return { ok: false, reason: \"network_error\", message: err?.message || String(err) };\n  }\n}\n\nexport async function reviewClaudeLongformDraft({ handoff, draft }) {\n  const settings = loadAiProviderSettings();\n  const base = cleanBaseUrl(settings.proxyUrl);\n  if (!/^https:\\/\\//i.test(base)) throw new Error(\"GPT QC 프록시 URL이 아직 설정되지 않았습니다.\");\n  if (!handoff || handoff.contentFormat !== \"longform\") throw new Error(\"Longform 소재를 먼저 선택해주세요.\");\n  if (!draft || typeof draft !== \"object\") throw new Error(\"Claude 롱폼 대본이 없습니다.\");\n\n  const qcHandoff = {\n    title: String(handoff.title || \"\").trim(),\n    summary: String(handoff.summary || \"\").trim(),\n    whyNow: String(handoff.whyNow || \"\").trim(),\n    viewerValue: String(handoff.viewerValue || \"\").trim(),\n    channelKey: String(handoff.channelKey || \"\").trim(),\n    contentFormat: String(handoff.contentFormat || \"\").trim(),\n    verifiedFacts: Array.isArray(handoff.verifiedFacts) ? handoff.verifiedFacts : [],\n    claimsToVerify: Array.isArray(handoff.claimsToVerify) ? handoff.claimsToVerify : [],\n    sources: Array.isArray(handoff.sources) ? handoff.sources : [],\n  };\n\n  const data = await fetchJson(`${base}/api/gpt-script-qc`, {\n    method: \"POST\",\n    headers: { \"Content-Type\": \"application/json\", Accept: \"application/json\" },\n    body: JSON.stringify({ input: { handoff: qcHandoff, draft } }),\n  }, Math.max(Number(settings.timeoutMs) || 90000, 240000));\n\n  if (!data?.ok || !data?.qc) throw new Error(data?.error || \"GPT QC 응답이 비어 있습니다.\");\n  return {\n    qc: data.qc,\n    model: data.model || \"OpenAI\",\n    usage: data.usage || null,\n    provider: data.provider || \"OpenAI\",\n  };\n}\n\n\n\n// V5 Alpha 12 — GPT QC의 revision_required를 Claude 1회 자동 수정으로 넘긴다.\n// 무한 수정 루프는 금지하며, 호출자는 revisionCount를 1회로 제한한다.\nexport async function reviseClaudeLongformDraft({ handoff, draft, qc }) {\n  const settings = loadAiProviderSettings();\n  const base = cleanBaseUrl(settings.proxyUrl);\n  if (!/^https:\\/\\//i.test(base)) throw new Error(\"Claude 수정 프록시 URL이 아직 설정되지 않았습니다.\");\n  if (!handoff || handoff.contentFormat !== \"longform\") throw new Error(\"Longform 소재를 먼저 선택해주세요.\");\n  if (!draft || typeof draft !== \"object\") throw new Error(\"Claude 롱폼 대본이 없습니다.\");\n  if (!qc || typeof qc !== \"object\") throw new Error(\"GPT QC 결과가 없습니다.\");\n  if (qc.status !== \"revision_required\") throw new Error(`Claude 자동 수정 대상이 아닙니다: ${qc.status || \"unknown\"}`);\n\n  const safeHandoff = {\n    title: String(handoff.title || \"\").trim(),\n    summary: String(handoff.summary || \"\").trim(),\n    whyNow: String(handoff.whyNow || \"\").trim(),\n    viewerValue: String(handoff.viewerValue || \"\").trim(),\n    channelKey: String(handoff.channelKey || \"\").trim(),\n    contentFormat: String(handoff.contentFormat || \"\").trim(),\n    verifiedFacts: Array.isArray(handoff.verifiedFacts) ? handoff.verifiedFacts : [],\n    claimsToVerify: Array.isArray(handoff.claimsToVerify) ? handoff.claimsToVerify : [],\n    sources: Array.isArray(handoff.sources) ? handoff.sources : [],\n  };\n\n  const safeQc = {\n    status: qc.status,\n    summary: String(qc.summary || \"\"),\n    issues: Array.isArray(qc.issues) ? qc.issues : [],\n    revisionInstructions: Array.isArray(qc.revisionInstructions) ? qc.revisionInstructions : [],\n    finalDecision: String(qc.finalDecision || \"\"),\n  };\n\n  const data = await fetchJson(`${base}/api/claude-longform-revise`, {\n    method: \"POST\",\n    headers: { \"Content-Type\": \"application/json\", Accept: \"application/json\" },\n    body: JSON.stringify({ input: { handoff: safeHandoff, draft, qc: safeQc } }),\n  }, Math.max(Number(settings.timeoutMs) || 90000, 420000));\n\n  if (!data?.ok || !data?.draft) throw new Error(data?.error || \"Claude 수정 대본 응답이 비어 있습니다.\");\n  return {\n    draft: data.draft,\n    model: data.model || \"Claude\",\n    usage: data.usage || null,\n    provider: data.provider || \"Anthropic\",\n    revisionCount: Number(data.revisionCount || 1),\n  };\n}\n\n\nexport async function reviseStoryDraft({ draft, feedback, seriesType, recipe }) {\n  const settings = loadAiProviderSettings();\n  if (!providerReady(settings)) throw new Error(\"OpenAI 프록시 URL이 아직 설정되지 않았습니다.\");\n  const request = String(feedback || \"\").trim();\n  if (!request) throw new Error(\"수정 요청을 입력해주세요.\");\n  const current = normalizeStoryDraft(draft, seriesType);\n  const compactDraft = {\n    seriesType: current.seriesType,\n    title: current.title,\n    subject: current.subject,\n    hook: current.hook,\n    summary: current.summary,\n    imageStyleNote: current.imageStyleNote,\n    cuts: current.cuts.map((c) => ({\n      purpose: c.purpose,\n      situation: c.situation,\n      narration: c.narration,\n      directorNote: c.directorNote,\n      imagePrompt: c.imagePrompt,\n      dialogueLines: c.dialogueLines || [],\n    })),\n  };\n  const topic = [\n    \"아래는 이미 만든 쇼츠 Story Draft입니다.\",\n    \"사용자의 수정 요청을 반영해 전체 JSON 초안을 다시 작성하세요.\",\n    \"요청하지 않은 핵심 사실과 좋은 부분은 최대한 유지하고, 수정 요청과 충돌하는 부분만 자연스럽게 조정하세요.\",\n    `사용자 수정 요청: ${request}`,\n    `현재 초안 JSON: ${JSON.stringify(compactDraft)}`,\n  ].join(\"\\n\\n\");\n  const base = cleanBaseUrl(settings.proxyUrl);\n  const payload = {\n    contractVersion: \"1.0\",\n    taskType: \"rewrite\",\n    providerId: \"openai\",\n    modelId: settings.modelId || DEFAULTS.modelId,\n    reasoningEffort: settings.reasoningEffort || \"low\",\n    input: {\n      topic,\n      seriesType: seriesType || current.seriesType,\n      targetSeconds: recipe?.story?.targetSeconds || 45,\n      targetCutCount: recipe?.story?.targetCutCount || current.cuts.length || 8,\n      imageStyleNote: current.imageStyleNote || recipe?.image?.styleNote || \"\",\n    },\n  };\n  const data = await fetchJson(`${base}/api/story`, {\n    method: \"POST\",\n    headers: { \"Content-Type\": \"application/json\", Accept: \"application/json\" },\n    body: JSON.stringify(payload),\n  }, settings.timeoutMs);\n  const revised = normalizeStoryDraft(data?.draft || data?.result || data, current.seriesType);\n  const check = validateStoryDraft(revised);\n  if (!check.valid) throw new Error(`AI 수정 응답 구조 오류: ${check.errors.join(\" / \")}`);\n  return { draft: check.normalized, meta: data?.meta || {} };\n}\n\n// Beta 23 — 비용 가시성. 현재 프록시 기본 모델(gpt-5-mini) 단가(USD / 1M tokens)를\n// 클라이언트에서 예측/사후 계산에만 사용한다. 실제 청구는 OpenAI가 수행한다.\nconst COST_LEDGER_KEY = \"shortsTracker.aiCostLedger.v4\";\nconst PRICE_TABLE = Object.freeze({\n  \"gpt-5-mini\": { inputPerM: 0.25, cachedInputPerM: 0.025, outputPerM: 2.00 },\n});\nconst DEFAULT_PREPAID_BASELINE_USD = 5.00;\n\nexport function modelPricing(modelId) {\n  return PRICE_TABLE[String(modelId || \"\").trim()] || null;\n}\n\nexport function estimateStoryCost({ topic, recipe, modelId } = {}) {\n  const pricing = modelPricing(modelId || loadAiProviderSettings().modelId);\n  const cuts = Math.max(1, Math.min(30, Number(recipe?.story?.targetCutCount) || 8));\n  const topicChars = String(topic || \"\").trim().length;\n  const styleChars = String(recipe?.image?.styleNote || \"\").length;\n  // 한국어 + JSON schema + 시스템 지시문 오버헤드를 보수적으로 포함한 근사치.\n  const inputTokens = Math.ceil(1100 + topicChars * 1.15 + styleChars * 0.65);\n  const outputTokensLow = Math.ceil(320 + cuts * 360);\n  const outputTokensHigh = Math.ceil(520 + cuts * 560);\n  if (!pricing) return { inputTokens, outputTokensLow, outputTokensHigh, lowUsd: null, highUsd: null };\n  const inputUsd = inputTokens / 1_000_000 * pricing.inputPerM;\n  return {\n    inputTokens, outputTokensLow, outputTokensHigh,\n    lowUsd: inputUsd + outputTokensLow / 1_000_000 * pricing.outputPerM,\n    highUsd: inputUsd + outputTokensHigh / 1_000_000 * pricing.outputPerM,\n  };\n}\n\nexport function costFromUsage(usage, modelId) {\n  const pricing = modelPricing(modelId);\n  if (!pricing || !usage) return null;\n  const input = Number(usage.input_tokens ?? usage.inputTokens ?? 0) || 0;\n  const output = Number(usage.output_tokens ?? usage.outputTokens ?? 0) || 0;\n  const cached = Number(usage.input_tokens_details?.cached_tokens ?? usage.cached_input_tokens ?? 0) || 0;\n  const uncached = Math.max(0, input - cached);\n  return uncached / 1_000_000 * pricing.inputPerM + cached / 1_000_000 * pricing.cachedInputPerM + output / 1_000_000 * pricing.outputPerM;\n}\n\nexport function loadAiCostLedger() {\n  try {\n    const raw = JSON.parse(localStorage.getItem(COST_LEDGER_KEY) || \"{}\");\n    return {\n      baselineUsd: Number.isFinite(Number(raw.baselineUsd)) ? Number(raw.baselineUsd) : DEFAULT_PREPAID_BASELINE_USD,\n      trackedSpendUsd: Number.isFinite(Number(raw.trackedSpendUsd)) ? Number(raw.trackedSpendUsd) : 0,\n      requests: Number.isFinite(Number(raw.requests)) ? Number(raw.requests) : 0,\n      lastCostUsd: Number.isFinite(Number(raw.lastCostUsd)) ? Number(raw.lastCostUsd) : null,\n      lastUsage: raw.lastUsage || null,\n      lastModel: raw.lastModel || \"\",\n      startedAt: raw.startedAt || Date.now(),\n      manualBalanceUsd: Number.isFinite(Number(raw.manualBalanceUsd)) ? Number(raw.manualBalanceUsd) : null,\n      manualBalanceSpendCheckpointUsd: Number.isFinite(Number(raw.manualBalanceSpendCheckpointUsd)) ? Number(raw.manualBalanceSpendCheckpointUsd) : 0,\n      manualBalanceSetAt: Number.isFinite(Number(raw.manualBalanceSetAt)) ? Number(raw.manualBalanceSetAt) : null,\n    };\n  } catch (_) {\n    return {\n      baselineUsd: DEFAULT_PREPAID_BASELINE_USD,\n      trackedSpendUsd: 0,\n      requests: 0,\n      lastCostUsd: null,\n      lastUsage: null,\n      lastModel: \"\",\n      startedAt: Date.now(),\n      manualBalanceUsd: null,\n      manualBalanceSpendCheckpointUsd: 0,\n      manualBalanceSetAt: null,\n    };\n  }\n}\n\nexport function recordAiUsage(usage, modelId) {\n  const ledger = loadAiCostLedger();\n  const cost = costFromUsage(usage, modelId);\n  if (cost == null) return ledger;\n  const next = {\n    ...ledger,\n    trackedSpendUsd: ledger.trackedSpendUsd + cost,\n    requests: ledger.requests + 1,\n    lastCostUsd: cost,\n    lastUsage: usage || null,\n    lastModel: modelId || \"\",\n  };\n  localStorage.setItem(COST_LEDGER_KEY, JSON.stringify(next));\n  return next;\n}\n\nexport function setManualBalanceUsd(balanceUsd) {\n  const value = Number(balanceUsd);\n  if (!Number.isFinite(value) || value < 0 || value > 100000) {\n    throw new Error(\"현재 잔액은 0 이상 숫자로 입력해주세요.\");\n  }\n  const ledger = loadAiCostLedger();\n  const next = {\n    ...ledger,\n    manualBalanceUsd: value,\n    manualBalanceSpendCheckpointUsd: ledger.trackedSpendUsd,\n    manualBalanceSetAt: Date.now(),\n  };\n  localStorage.setItem(COST_LEDGER_KEY, JSON.stringify(next));\n  return next;\n}\n\nexport function clearManualBalanceUsd() {\n  const ledger = loadAiCostLedger();\n  const next = {\n    ...ledger,\n    manualBalanceUsd: null,\n    manualBalanceSpendCheckpointUsd: 0,\n    manualBalanceSetAt: null,\n  };\n  localStorage.setItem(COST_LEDGER_KEY, JSON.stringify(next));\n  return next;\n}\n\nexport function estimatedTrackedBalanceUsd(ledger = loadAiCostLedger()) {\n  if (Number.isFinite(Number(ledger.manualBalanceUsd))) {\n    const spentSinceManualCheck = Math.max(\n      0,\n      Number(ledger.trackedSpendUsd || 0) - Number(ledger.manualBalanceSpendCheckpointUsd || 0)\n    );\n    return Math.max(0, Number(ledger.manualBalanceUsd) - spentSinceManualCheck);\n  }\n  return Math.max(0, Number(ledger.baselineUsd || 0) - Number(ledger.trackedSpendUsd || 0));\n}\n\nexport const OPENAI_BILLING_URL = \"https://platform.openai.com/settings/organization/billing/overview\";\n","js_v420a12/sceneTiming.js":"// scene_timing.py 로직을 그대로 이식 (오늘의 이슈/괴담 제작 프로세스 문서의 2026.08 표준)\nexport const RATE_NORMAL = 6.9; // 일반\nexport const RATE_SLOW = 6.4;   // 정치/뉴스형 (\"오늘의 이슈\")\nexport const RATE_HORROR = 6.2; // 공포형 (\"오늘의 괴담\")\nexport const PAD = 0.7;\nexport const FLOOR = 3.5;\n\nexport function ratePresetFor(seriesType) {\n  return seriesType === \"horror\" ? RATE_HORROR : RATE_SLOW;\n}\n\n// lines: string[] (씬별 나레이션 문장), extraPad: { [index]: number }\nexport function estimateSceneDurations(lines, { rate, pad = PAD, floor = FLOOR, extraPad = {} } = {}) {\n  return lines.map((line, i) => {\n    const nChars = (line || \"\").replace(/[\\s·]/g, \"\").length;\n    const d = nChars / rate + pad + (extraPad[i] || 0);\n    return Math.max(floor, Math.round(d * 10) / 10);\n  });\n}\n\n// 실측 타이밍 배열([0.0, t1, t2, ..., totalDur])로부터 씬별 duration 계산\nexport function durationsFromMeasuredStarts(starts) {\n  const durs = [];\n  for (let i = 0; i < starts.length - 1; i++) {\n    durs.push(Math.round((starts[i + 1] - starts[i]) * 100) / 100);\n  }\n  return durs;\n}\n","js_v420a12/seriesTypes.js":"// Series Type 레지스트리 — 콘텐츠/IP 종류를 정의하는 단일 소스.\n// formatType(제작 구조: text_card | cut)과는 완전히 독립적인 축이다.\n// 새 시리즈 타입을 추가하려면 이 배열에 항목을 추가하기만 하면 된다 —\n// 다른 파일(홈 화면 생성 버튼, 기획STEP, 재생시간STEP 등)은 전부 이 배열을 순회해서 렌더링하므로\n// \"if (seriesType === 'horror')\" 같은 하드코딩을 코드 곳곳에 두지 않는다.\n\nimport { RATE_NORMAL, RATE_SLOW, RATE_HORROR } from \"./sceneTiming.js\";\n\nexport const SERIES_TYPES = [\n  {\n    key: \"general_issue\",\n    label: \"일반 이슈\",\n    shortLabel: \"이슈\",\n    legacyKeys: [\"issue\"], // v1 데이터의 구 seriesType 값 → 이 키로 정규화\n    ratePreset: RATE_SLOW,\n    description: \"뉴스/정책 등 시사 이슈 카드뉴스·CUT 콘텐츠\",\n  },\n  {\n    key: \"horror\",\n    label: \"괴담\",\n    shortLabel: \"괴담\",\n    legacyKeys: [\"horror\"],\n    ratePreset: RATE_HORROR,\n    description: \"공포/괴담류 콘텐츠\",\n  },\n  {\n    key: \"two_year_intern\",\n    label: \"두살인턴\",\n    shortLabel: \"두살인턴\",\n    legacyKeys: [],\n    ratePreset: RATE_NORMAL,\n    description: \"두살인턴 시리즈 전용\",\n  },\n  {\n    key: \"freeform\",\n    label: \"자유형\",\n    shortLabel: \"자유형\",\n    legacyKeys: [],\n    ratePreset: null, // 프리셋 없음 — 재생시간STEP에서 수동 rate 입력을 허용\n    description: \"프리셋 없이 자유롭게 제작\",\n  },\n];\n\nconst DEFAULT_KEY = SERIES_TYPES[0].key;\n\nexport function getSeriesType(key) {\n  if (!key) return null;\n  return (\n    SERIES_TYPES.find((s) => s.key === key) ||\n    SERIES_TYPES.find((s) => (s.legacyKeys || []).includes(key)) ||\n    null\n  );\n}\n\n// 알 수 없거나 레거시 키를 항상 현재 레지스트리의 key로 정규화한다.\n// 레지스트리에 없는 값이 들어와도 절대 throw하지 않고 기본값으로 안전하게 폴백한다.\nexport function normalizeSeriesTypeKey(key) {\n  const st = getSeriesType(key);\n  return st ? st.key : DEFAULT_KEY;\n}\n\nexport function seriesTypeLabel(key) {\n  const st = getSeriesType(key);\n  return st ? st.label : key || \"(미지정)\";\n}\n\nexport function ratePresetForSeriesType(key) {\n  const st = getSeriesType(key);\n  return (st && st.ratePreset) || RATE_NORMAL;\n}\n","js_v420a12/migration.js":"// Load-time migration adapter.\n//\n// 원칙(사용자 확정):\n// - destructive migration 금지 — 기존 필드를 지우거나 값을 덮어써 의미를 바꾸지 않는다.\n// - 즉시 rewrite 금지 — 여기서 IndexedDB에 쓰기(save)를 하지 않는다. 읽어올 때마다\n//   메모리 상의 객체에 누락 필드의 default만 채워 넣는다. 실제 저장은 사용자가\n//   해당 에피소드를 정상적으로 편집·저장할 때 자연스럽게 새 스키마로 반영된다.\n// - v1 에피소드는 formatType이 아예 없다(그 필드 자체가 v2에서 생겼기 때문) →\n//   formatType이 없으면 \"text_card\"로 간주한다. v2에서 만든 신규 에피소드는\n//   생성 시점에 이미 formatType이 박혀 있으므로 여기서 건드릴 일이 없다.\n\nimport { normalizeSeriesTypeKey } from \"./seriesTypes.js\";\nimport { dialogueUid, normalizeEpisodeLifecycle } from \"./model.js\";\n\nfunction isNarratorSpeaker(value) {\n  const s = String(value || \"\").trim().toLowerCase().replace(/\\s+/g, \"\");\n  return s === \"나레이터\" || s === \"내레이터\" || s === \"narrator\";\n}\n\nfunction normalizeMasterNarratorCut(cut, audioMode) {\n  if (!cut || audioMode !== \"master_narration\" || !Array.isArray(cut.dialogueLines)) return;\n  const nonEmpty = cut.dialogueLines.filter((line) => line?.text && String(line.text).trim());\n  if (!nonEmpty.length || !nonEmpty.every((line) => isNarratorSpeaker(line.speaker))) return;\n\n  // Alpha 32 — Alpha 31 Story Writer가 통합 나레이션 문장을 \"나레이터\" dialogueLines로\n  // 저장한 Episode를 읽을 때만 메모리에서 안전하게 교정한다. DB_VERSION은 바꾸지 않고,\n  // 실제 캐릭터 대사가 하나라도 섞인 CUT은 전혀 수정하지 않는다.\n  if (!String(cut.narration || \"\").trim()) {\n    cut.narration = nonEmpty.map((line) => String(line.text).trim()).join(\" \");\n  }\n  cut.dialogueLines = cut.dialogueLines.filter((line) => !(line?.text && isNarratorSpeaker(line.speaker)));\n  if (!cut.subtitle || typeof cut.subtitle !== \"object\") cut.subtitle = { dialogue: true, narration: true };\n  cut.subtitle.narration = true;\n}\n\nexport function migrateEpisode(ep) {\n  if (!ep || typeof ep !== \"object\") return ep;\n\n  // formatType 기본값 부여 (v1 레코드에는 이 필드가 없었음)\n  if (ep.formatType !== \"text_card\" && ep.formatType !== \"cut\") {\n    ep.formatType = \"text_card\";\n  }\n\n  // seriesType 정규화 (구 \"issue\"/\"horror\" 등 → 신규 레지스트리 키)\n  ep.seriesType = normalizeSeriesTypeKey(ep.seriesType);\n\n  if (ep.formatType === \"text_card\") {\n    // 기존 text_card 필드가 없으면(이론상 없을 수 없지만 방어적으로) 안전한 기본값만 채움\n    if (!Array.isArray(ep.scenes)) ep.scenes = [];\n    if (typeof ep.narrationAudioName !== \"string\") ep.narrationAudioName = \"\";\n  } else {\n    // formatType === \"cut\"\n    if (!Array.isArray(ep.cuts)) ep.cuts = [];\n    if (typeof ep.globalVisualBible !== \"string\") ep.globalVisualBible = \"\";\n    if (ep.styleReferenceAssetId === undefined) ep.styleReferenceAssetId = null;\n    if (ep.characterReferenceAssetId === undefined) ep.characterReferenceAssetId = null;\n    if (!ep.bgm || typeof ep.bgm !== \"object\") {\n      ep.bgm = { assetId: null, start: 0, end: null, volume: 1, fadeIn: 0, fadeOut: 0, fadeCurve: \"linear\", cutActions: {} };\n    }\n    if (!ep.bgm.cutActions || typeof ep.bgm.cutActions !== \"object\") ep.bgm.cutActions = {};\n    // Phase 5: fadeIn/fadeOut/fadeCurve가 없던 episode(Phase 4 이전)는 \"페이드 없음/linear\"로\n    // 안전하게 해석한다 — 기존 값을 덮어쓰지 않고, 없을 때만 채운다.\n    if (typeof ep.bgm.fadeIn !== \"number\") ep.bgm.fadeIn = 0;\n    if (typeof ep.bgm.fadeOut !== \"number\") ep.bgm.fadeOut = 0;\n    if (typeof ep.bgm.fadeCurve !== \"string\") ep.bgm.fadeCurve = \"linear\";\n    // Phase 3: 오디오를 어떻게 준비할지(파일 첨부/외부 TTS/없음) — 없던 필드면 기본값 부여.\n    if (typeof ep.audioWorkflow !== \"string\") ep.audioWorkflow = \"attach_files\";\n    // rc.3: Master Narration Mode(audioMode) — 이 필드가 없다는 것은 이 기능이 생기기 전에\n    // 만들어진 기존 Episode라는 뜻이다. non-destructive 원칙에 따라 강제 전환하지 않고\n    // \"per_cut\"(기존 CUT별 개별 오디오 방식)으로 채워 기존 동작을 그대로 보존한다 — 신규\n    // Episode만 생성 시점에 이미 \"master_narration\"이 박혀 있으므로 여기서 건드릴 일이 없다.\n    if (ep.audioMode !== \"master_narration\" && ep.audioMode !== \"per_cut\") ep.audioMode = \"per_cut\";\n    if (!ep.masterNarration || typeof ep.masterNarration !== \"object\") {\n      ep.masterNarration = { assetId: null, duration: null };\n    }\n    if (typeof ep.masterNarration.assetId === \"undefined\") ep.masterNarration.assetId = null;\n    if (typeof ep.masterNarration.duration === \"undefined\") ep.masterNarration.duration = null;\n    // Phase 4/5: 검토 완료 확인 시각 — 없던 필드면 \"미검토\"로 안전하게 해석.\n    if (ep.timelineReviewedAt === undefined) ep.timelineReviewedAt = null;\n    if (ep.previewReviewedAt === undefined) ep.previewReviewedAt = null;\n    // Phase 6: production.json 렌더 기본값/생성 이력 — 없던 필드면 기본값으로 안전하게 채운다.\n    if (!ep.renderSettings || typeof ep.renderSettings !== \"object\") {\n      ep.renderSettings = { width: 1080, height: 1920, fps: 30 };\n    }\n    if (ep.lastProductionGeneratedAt === undefined) ep.lastProductionGeneratedAt = null;\n    if (ep.lastProductionRevision === undefined) ep.lastProductionRevision = null;\n    // V4 Alpha 1: 기존 Episode는 AI/Recipe 필드가 없다. 읽을 때만 안전한 기본값을 채우고\n    // 즉시 IndexedDB rewrite는 하지 않는 기존 non-destructive migration 원칙을 그대로 유지한다.\n    if (!ep.aiWorkspace || typeof ep.aiWorkspace !== \"object\") {\n      ep.aiWorkspace = { contractVersion: \"1.0\", providerId: null, modelId: \"\", status: \"idle\", lastTaskType: null, lastRequestAt: null, lastResultAt: null, lastError: \"\", promptInput: \"\", lastResult: null };\n    }\n    // V4 Alpha 20: 전용 썸네일 상태 — 기존 Episode는 읽을 때만 기본값을 채운다.\n    if (!ep.thumbnail || typeof ep.thumbnail !== \"object\") {\n      ep.thumbnail = { schemaVersion: \"1.0\", conceptId: \"auto\", resolvedConceptId: ep.seriesType === \"two_year_intern\" ? \"character_focus\" : ep.seriesType === \"horror\" ? \"curiosity\" : \"channel_default\", customConcept: \"\", headline: \"\", subline: \"\", sourceCutIndex: 0, prompt: \"\", assetId: null, status: \"planned\", updatedAt: null };\n    }\n    if (ep.thumbnail.assetId === undefined) ep.thumbnail.assetId = null;\n    if (!ep.recipeState || typeof ep.recipeState !== \"object\") {\n      const selectedId = ep.seriesType === \"horror\" ? \"horror_tension\" : ep.seriesType === \"two_year_intern\" ? \"two_year_intern_deadpan\" : ep.seriesType === \"freeform\" ? \"freeform_balanced\" : \"general_issue_fast\";\n      ep.recipeState = { schemaVersion: \"1.0\", selectedId, appliedId: null, appliedAt: null, source: \"builtin\" };\n    }\n    ep.cuts.forEach((cut, i) => {\n      if (!cut) return;\n      if (typeof cut.index !== \"number\") cut.index = i;\n      if (!cut.image || typeof cut.image !== \"object\") {\n        cut.image = { assetId: null, status: \"미생성\", generator: \"\", qcNote: \"\", retryReason: \"\" };\n      }\n      // Alpha 43: 기존 CUT은 video 필드가 없으므로 이미지 CUT으로 안전하게 해석한다.\n      if (cut.mediaType !== \"video\" && cut.mediaType !== \"image\") cut.mediaType = \"image\";\n      if (!cut.video || typeof cut.video !== \"object\") cut.video = { assetId: null, duration: null, trimStart: 0, trimEnd: null, mute: true };\n      if (cut.video.assetId === undefined) cut.video.assetId = null;\n      if (cut.video.duration === undefined) cut.video.duration = null;\n      if (cut.video.trimStart === undefined) cut.video.trimStart = 0;\n      if (cut.video.trimEnd === undefined) cut.video.trimEnd = null;\n      if (cut.video.mute === undefined) cut.video.mute = true;\n      if (cut.mediaType === \"video\" && !cut.video.assetId) cut.mediaType = \"image\";\n      if (!Array.isArray(cut.dialogueLines)) cut.dialogueLines = [];\n      normalizeMasterNarratorCut(cut, ep.audioMode);\n      // Phase 2까지 만들어진 대사 행에는 안정적 id가 없었다 — non-destructive하게 부여한다.\n      // (실제 저장은 여기서 하지 않는다 — 사용자가 이 에피소드를 저장할 때 자연스럽게 반영된다.)\n      cut.dialogueLines.forEach((line) => {\n        if (line && typeof line.id !== \"string\") line.id = dialogueUid();\n      });\n      if (!Array.isArray(cut.audioEvents)) cut.audioEvents = [];\n      if (!cut.duration || typeof cut.duration !== \"object\") {\n        cut.duration = { manual: null, measured: null, estimated: null };\n      }\n      if (cut.masterStart === undefined) cut.masterStart = null;\n      if (!cut.motion || typeof cut.motion !== \"object\") {\n        cut.motion = { type: \"STATIC\", startScale: 1, endScale: 1, panX: 0, panY: 0, easing: \"linear\" };\n      }\n      if (!cut.transition) cut.transition = \"HARD_CUT\";\n      if (!cut.subtitle || typeof cut.subtitle !== \"object\") {\n        cut.subtitle = { dialogue: true, narration: true };\n      }\n    });\n  }\n\n  // v4.1.0 Alpha 2: Alpha 1 Story Writer가 만든 CUT Episode는 date를 채우지 않아\n  // 기획 완료 조건(title + date)을 영구히 만족하지 못하는 버그가 있었다. 기존 사용자가\n  // 날짜를 직접 입력할 필요가 없도록, Story Writer 생성 이력이 있고 date만 비어 있는\n  // Episode에 한해서 createdAt의 로컬 날짜를 메모리상 기본값으로 채운다. 기존 date 값은\n  // 절대 덮어쓰지 않으며 DB_VERSION/migration rewrite도 발생시키지 않는다.\n  if (!String(ep.date || \"\").trim() && ep.formatType === \"cut\" && ep.aiWorkspace?.lastTaskType === \"story_draft\" && ep.createdAt) {\n    const created = new Date(ep.createdAt);\n    ep.date = `${created.getFullYear()}.${String(created.getMonth() + 1).padStart(2, \"0\")}.${String(created.getDate()).padStart(2, \"0\")}`;\n  }\n\n  // 공통 메타 필드 누락 방어(구버전 백업 파일 등에서 비어있을 수 있음)\n  if (!Array.isArray(ep.sources)) ep.sources = [];\n  if (typeof ep.status !== \"string\") ep.status = \"기획\";\n  // Alpha 12: 읽기 시 누락 기본값만 채우며 IndexedDB를 즉시 rewrite하지 않는다.\n  ep.lifecycleStatus = normalizeEpisodeLifecycle(ep.lifecycleStatus, ep.status);\n  if (ep.lifecycleChangedAt === undefined) ep.lifecycleChangedAt = ep.updatedAt || ep.createdAt || null;\n  if (ep.trashedAt === undefined) ep.trashedAt = ep.lifecycleStatus === \"trash\" ? (ep.updatedAt || Date.now()) : null;\n  // Alpha 17: 기존 Episode는 저장소 rewrite 없이 메모리에서만 안전한 기본값을 받는다.\n  if (![\"unassigned\", \"senior_longform\", \"economy_current\", \"odd_today\", \"sports\"].includes(ep.channelKey)) ep.channelKey = \"unassigned\";\n  if (![\"shorts\", \"longform\"].includes(ep.contentFormat)) ep.contentFormat = \"shorts\";\n  if (![\"fast\", \"standard\", \"premium\"].includes(ep.productionProfile)) ep.productionProfile = \"standard\";\n\n\n  // V5 Alpha1 — 기존 v4 에피소드에도 자동화 계획을 비파괴적으로 추가.\n  if (!ep.automationPlan || typeof ep.automationPlan !== \"object\") {\n    ep.automationPlan = {\n      schemaVersion: \"1.0\",\n      mode: \"auto_first\",\n      seamlessLoop: {\n        enabled: true,\n        requiredForEconomyShorts: true,\n        openingIntent: \"마지막 장면의 공간/상황과 자연스럽게 이어지는 시작\",\n        closingIntent: \"첫 장면으로 다시 이어져도 끝/시작 경계가 튀지 않는 마무리\"\n      },\n      longform: {\n        enabled: ep.contentFormat === \"longform\",\n        targetMinutes: 20,\n        chapterCount: 7,\n        visualChangeSeconds: 18,\n        narrationMode: \"master_narration\",\n        autoQc: true\n      }\n    };\n  } else {\n    ep.automationPlan.seamlessLoop = {\n      enabled: ep.automationPlan?.seamlessLoop?.enabled !== false,\n      requiredForEconomyShorts: true,\n      openingIntent: ep.automationPlan?.seamlessLoop?.openingIntent || \"마지막 장면의 공간/상황과 자연스럽게 이어지는 시작\",\n      closingIntent: ep.automationPlan?.seamlessLoop?.closingIntent || \"첫 장면으로 다시 이어져도 끝/시작 경계가 튀지 않는 마무리\"\n    };\n    ep.automationPlan.longform = {\n      enabled: ep.contentFormat === \"longform\" || ep.automationPlan?.longform?.enabled === true,\n      targetMinutes: Number(ep.automationPlan?.longform?.targetMinutes) || 20,\n      chapterCount: Number(ep.automationPlan?.longform?.chapterCount) || 7,\n      visualChangeSeconds: Number(ep.automationPlan?.longform?.visualChangeSeconds) || 18,\n      narrationMode: ep.automationPlan?.longform?.narrationMode || \"master_narration\",\n      autoQc: ep.automationPlan?.longform?.autoQc !== false,\n      autoStoryboard: ep.automationPlan?.longform?.autoStoryboard !== false,\n      autoTimeline: ep.automationPlan?.longform?.autoTimeline !== false,\n      scenePlan: Array.isArray(ep.automationPlan?.longform?.scenePlan) ? ep.automationPlan.longform.scenePlan : []\n    };\n  }\n\n  return ep;\n}\n\nexport function migrateEpisodes(list) {\n  return (list || []).map(migrateEpisode);\n}\n","js_v420a12/version.js":"// Phase 7 — 버전 상수 Single Source of Truth.\n//\n// 이전까지 \"2.0\" 같은 버전 문자열이 production.js/sw.js 등 여러 파일에 각각 흩어져 있었다.\n// Phase 7부터는 앱 버전/DB 버전 표시값/Production Schema 버전/Release Channel을 이 파일\n// 하나에서만 정의하고, 다른 모든 파일(production.js, sw.js, settings.js, backup.js 등)은\n// 여기서 값을 import해서만 쓴다 — 문자열을 직접 다시 적지 않는다.\n//\n// 주의: IndexedDB open()에 실제로 넘기는 DB_VERSION(정수, 2)은 db.js 안에서만 정의된 채로\n// 남겨둔다 — indexedDB.open()은 그 자리에서 즉시 평가되는 리터럴이 아니어도 되지만, db.js가\n// 이 파일을 import하게 만들면 \"버전 상수 모듈이 IndexedDB 스키마 마이그레이션 흐름까지 알아야\n// 하는\" 불필요한 순환 의존을 만든다. 대신 여기서는 \"화면에 표시하기 위한\" DB_VERSION_DISPLAY\n// 값만 갖고, db.js의 실제 DB_VERSION과 사람이 직접 맞춰준다(둘 다 정수 2, 값 자체가 자주 바뀌는\n// 것도 아니라서 실용적으로 충분하다).\n\nexport const APP_VERSION = \"5.0.0\";\nexport const DB_VERSION_DISPLAY = 2;\nexport const PRODUCTION_SCHEMA_VERSION = \"2.1\";\n\n// v5.0.0 Alpha 11 — Claude↔GPT Longform one-cycle correction loop.\nexport const RELEASE_CHANNEL = \"alpha\";\nexport const RC_ITERATION = 11;\nexport const RELEASE_LABEL = RELEASE_CHANNEL === \"stable\" ? \"Stable\" : RELEASE_CHANNEL === \"alpha\" ? `Alpha ${RC_ITERATION}` : RELEASE_CHANNEL === \"beta\" ? `Beta ${RC_ITERATION}` : RELEASE_CHANNEL === \"rc\" ? `Release Candidate (RC ${RC_ITERATION})` : RELEASE_CHANNEL;\n\nexport const BACKUP_FORMAT_VERSION_LIGHT = \"1.1\";\nexport const BACKUP_FORMAT_VERSION_FULL = \"1.0\";\n\n// Settings/README 등에서 그대로 문자열로 꽂아 쓸 수 있는 표시용 앱 이름 — manifest.json과는\n// 별개 파일이라 여기서도 한 번 더 상수로 둔다(사람이 두 곳을 손으로 맞추는 것보다 안전).\nexport const APP_DISPLAY_NAME = \"Shorts Production Tracker\";\n","js_v420a12/db.js":"// 아주 가벼운 IndexedDB 래퍼 — 외부 라이브러리 없이 브라우저 네이티브 API만 사용.\n// 서버 전송 없음: 모든 데이터는 이 기기 브라우저 안에만 저장됨.\n//\n// v2: DB_VERSION 1→2. 기존 \"episodes\" 스토어는 그대로 두고 \"assets\" 스토어를 신규 추가한다.\n// 이미지·오디오 Blob은 episode 레코드에 직접 넣지 않고 여기 별도 저장한다\n// (레코드에 직접 넣으면 저장할 때마다 전체 Blob을 다시 쓰게 되어 무거워짐).\n//\n// migration.js의 migrateEpisode()는 여기서 읽어올 때마다 호출된다 — 즉 이 파일이\n// \"load-time migration\"이 실제로 걸리는 지점이다. 절대 여기서 IndexedDB에 즉시\n// 다시 쓰지(rewrite) 않는다 — 실제 저장은 사용자가 saveEpisode()를 호출할 때만 일어난다.\n\nimport { migrateEpisode } from \"./migration.js\";\nimport { APP_VERSION, DB_VERSION_DISPLAY, BACKUP_FORMAT_VERSION_LIGHT } from \"./version.js\";\n\nconst DB_NAME = \"shorts_pipeline_db\";\nconst DB_VERSION = 2;\nconst STORE = \"episodes\";\nconst ASSET_STORE = \"assets\";\nconst ASSET_BY_EPISODE_INDEX = \"byEpisode\";\n\n// 파일 1개당 경고 임계값 — 이미지/오디오 등 모든 asset 첨부가 이 상수 하나만 참조한다\n// (여러 파일에 50MB를 따로 하드코딩하지 않는다 — 나중에 설정 가능하게 만들 때도 여기만 고치면 된다).\n// 초과해도 업로드를 막지는 않는다 — 호출부가 isOversizedAsset()으로 확인 후 사용자에게 물어보고 진행한다.\nexport const ASSET_SIZE_WARN_BYTES = 50 * 1024 * 1024; // 50MB\n\nexport function isOversizedAsset(fileOrBlob) {\n  return !!(fileOrBlob && typeof fileOrBlob.size === \"number\" && fileOrBlob.size > ASSET_SIZE_WARN_BYTES);\n}\n\n// IndexedDB 저장 실패가 \"저장공간 부족\"인지 판별한다 — 화면에서 사용자에게 명확한 메시지를\n// 보여줄지(quota) 아니면 일반 오류로 보여줄지 나누기 위함.\nexport function isQuotaError(err) {\n  if (!err) return false;\n  if (err.name === \"QuotaExceededError\") return true;\n  return /quota/i.test(err.message || \"\");\n}\n\nfunction openDB() {\n  return new Promise((resolve, reject) => {\n    const req = indexedDB.open(DB_NAME, DB_VERSION);\n    req.onupgradeneeded = () => {\n      const db = req.result;\n      if (!db.objectStoreNames.contains(STORE)) {\n        db.createObjectStore(STORE, { keyPath: \"id\" });\n      }\n      if (!db.objectStoreNames.contains(ASSET_STORE)) {\n        const assetStore = db.createObjectStore(ASSET_STORE, { keyPath: \"id\" });\n        assetStore.createIndex(ASSET_BY_EPISODE_INDEX, \"episodeId\", { unique: false });\n      }\n      // 향후 스토어 버전이 더 올라가도 기존 데이터는 여기서 손대지 않는다 —\n      // non-destructive 마이그레이션 원칙.\n    };\n    req.onsuccess = () => resolve(req.result);\n    req.onerror = () => reject(req.error);\n  });\n}\n\n// Phase 7 — 커넥션 누수 수정. openDB()는 호출될 때마다 새 IDBDatabase 연결을 만드는데,\n// 예전 코드는 트랜잭션이 끝난 뒤에도 그 연결을 한 번도 닫지 않았다(db.close() 없음). 앱을\n// 실제로 오래 쓰면(=db.js 함수가 수백~수천 번 호출되면) 열린 커넥션이 계속 쌓이기만 하고,\n// 결국 새 indexedDB.open() 호출이 지연/멈추는 문제로 이어질 수 있다(장시간 자동 테스트에서\n// 실제로 재현됨 — Phase 7 발견 버그, 완료 보고서 참고). 모든 저수준 호출은 이제 트랜잭션\n// 완료 직후 연결을 닫는다 — 각 호출이 자기 것만 여는 독립 연결이므로 안전하다.\nasync function withStore(mode, fn) {\n  const db = await openDB();\n  try {\n    return await new Promise((resolve, reject) => {\n      const tx = db.transaction(STORE, mode);\n      const store = tx.objectStore(STORE);\n      const result = fn(store);\n      tx.oncomplete = () => resolve(result);\n      tx.onerror = () => reject(tx.error);\n    });\n  } finally {\n    db.close();\n  }\n}\n\nasync function withAssetStore(mode, fn) {\n  const db = await openDB();\n  try {\n    return await new Promise((resolve, reject) => {\n      const tx = db.transaction(ASSET_STORE, mode);\n      const store = tx.objectStore(ASSET_STORE);\n      const result = fn(store);\n      tx.oncomplete = () => resolve(result);\n      tx.onerror = () => reject(tx.error);\n    });\n  } finally {\n    db.close();\n  }\n}\n\n// ---------------------------------------------------------------------------\n// episodes\n// ---------------------------------------------------------------------------\n\nexport async function getAllEpisodes() {\n  const db = await openDB();\n  let episodes;\n  try {\n    episodes = await new Promise((resolve, reject) => {\n      const tx = db.transaction(STORE, \"readonly\");\n      const store = tx.objectStore(STORE);\n      const req = store.getAll();\n      req.onsuccess = () => resolve(req.result.sort((a, b) => b.updatedAt - a.updatedAt));\n      req.onerror = () => reject(req.error);\n    });\n  } finally {\n    db.close();\n  }\n  return episodes.filter((record) => record?.recordType !== \"idea\").map(migrateEpisode);\n}\n\n// Alpha 18 — 소재는 기존 episodes object store를 공유하되 recordType으로 완전히 분리한다.\n// 새 object store가 필요 없으므로 DB_VERSION=2를 유지한다.\nexport async function getAllIdeas() {\n  const db = await openDB();\n  try {\n    return await new Promise((resolve, reject) => {\n      const tx = db.transaction(STORE, \"readonly\");\n      const req = tx.objectStore(STORE).getAll();\n      req.onsuccess = () => resolve((req.result || []).filter((record) => record?.recordType === \"idea\").sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)));\n      req.onerror = () => reject(req.error);\n    });\n  } finally { db.close(); }\n}\n\n// Alpha 22 — 홈 화면은 같은 object store를 Episode용/소재용으로 두 번 읽지 않는다.\nexport async function getHomeData() {\n  const db = await openDB();\n  try {\n    const records = await new Promise((resolve, reject) => {\n      const tx = db.transaction(STORE, \"readonly\");\n      const req = tx.objectStore(STORE).getAll();\n      req.onsuccess = () => resolve(req.result || []);\n      req.onerror = () => reject(req.error);\n    });\n    const ideas = records.filter((record) => record?.recordType === \"idea\").sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));\n    const episodes = records.filter((record) => record?.recordType !== \"idea\").sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)).map(migrateEpisode);\n    return { episodes, ideas };\n  } finally { db.close(); }\n}\n\nexport async function saveIdea(idea) {\n  if (!idea || idea.recordType !== \"idea\") throw new Error(\"잘못된 소재 데이터입니다.\");\n  idea.updatedAt = Date.now();\n  await withStore(\"readwrite\", (store) => store.put(idea));\n  return idea;\n}\n\nexport async function deleteIdea(id) {\n  const db = await openDB();\n  try {\n    const record = await new Promise((resolve, reject) => {\n      const tx = db.transaction(STORE, \"readonly\");\n      const req = tx.objectStore(STORE).get(id);\n      req.onsuccess = () => resolve(req.result || null);\n      req.onerror = () => reject(req.error);\n    });\n    if (!record || record.recordType !== \"idea\") throw new Error(\"소재 데이터만 삭제할 수 있습니다.\");\n  } finally { db.close(); }\n  await withStore(\"readwrite\", (store) => store.delete(id));\n}\n\nexport async function getEpisode(id) {\n  const db = await openDB();\n  let ep;\n  try {\n    ep = await new Promise((resolve, reject) => {\n      const tx = db.transaction(STORE, \"readonly\");\n      const req = tx.objectStore(STORE).get(id);\n      req.onsuccess = () => resolve(req.result || null);\n      req.onerror = () => reject(req.error);\n    });\n  } finally {\n    db.close();\n  }\n  return ep ? migrateEpisode(ep) : null;\n}\n\nexport async function saveEpisode(episode) {\n  episode.updatedAt = Date.now();\n  await withStore(\"readwrite\", (store) => store.put(episode));\n  return episode;\n}\n\n// Phase 7 — Backup/Restore 전용 저수준 저장 함수. saveEpisode()와 달리 updatedAt을 \"지금\"으로\n// 덮어쓰지 않는다: 백업에서 복원하는 레코드는 원래 만들어진/마지막으로 저장된 시각을 그대로\n// 보존해야 복원 전후 데이터가 \"동일\"하다고 말할 수 있기 때문이다(조건 30번, Backup/Restore E2E).\n// 일반 화면 코드에서는 이 함수를 쓰지 않는다 — 오직 backup.js의 restore 흐름에서만 쓴다.\nexport async function putEpisodeRaw(episode) {\n  await withStore(\"readwrite\", (store) => store.put(episode));\n  return episode;\n}\n\nexport async function deleteEpisode(id) {\n  // cascade: 에피소드에 연결된 asset(Blob)도 함께 정리 — 고아 Blob이 남지 않도록.\n  await deleteAssetsByEpisode(id);\n  return withStore(\"readwrite\", (store) => store.delete(id));\n}\n\n// ---------------------------------------------------------------------------\n// assets (이미지 / 오디오 Blob)\n// asset shape: { id, episodeId, kind: \"image\"|\"audio\", role, mimeType, sizeBytes,\n//                originalFileName, blob, createdAt }\n// ---------------------------------------------------------------------------\n\nfunction assetUid() {\n  return \"asset_\" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);\n}\n\nexport async function putAsset(asset) {\n  const record = {\n    id: asset.id || assetUid(),\n    episodeId: asset.episodeId,\n    kind: asset.kind, // \"image\" | \"audio\"\n    role: asset.role || \"\",\n    mimeType: asset.mimeType || asset.blob?.type || \"\",\n    sizeBytes: asset.sizeBytes ?? asset.blob?.size ?? 0,\n    originalFileName: asset.originalFileName || \"\",\n    blob: asset.blob,\n    createdAt: asset.createdAt || Date.now(),\n  };\n  await withAssetStore(\"readwrite\", (store) => store.put(record));\n  return record;\n}\n\nexport async function getAsset(id) {\n  return withAssetStore(\"readonly\", (store) => {\n    return new Promise((resolve, reject) => {\n      const req = store.get(id);\n      req.onsuccess = () => resolve(req.result || null);\n      req.onerror = () => reject(req.error);\n    });\n  });\n}\n\nexport async function getAssetsByEpisode(episodeId) {\n  const db = await openDB();\n  try {\n    return await new Promise((resolve, reject) => {\n      const tx = db.transaction(ASSET_STORE, \"readonly\");\n      const idx = tx.objectStore(ASSET_STORE).index(ASSET_BY_EPISODE_INDEX);\n      const req = idx.getAll(episodeId);\n      req.onsuccess = () => resolve(req.result || []);\n      req.onerror = () => reject(req.error);\n    });\n  } finally {\n    db.close();\n  }\n}\n\nexport async function getAllAssets() {\n  return withAssetStore(\"readonly\", (store) => {\n    return new Promise((resolve, reject) => {\n      const req = store.getAll();\n      req.onsuccess = () => resolve(req.result || []);\n      req.onerror = () => reject(req.error);\n    });\n  });\n}\n\n// 내부용 — Blob 레코드만 지운다. 참조 정리는 하지 않는다.\n// 바깥에서는 deleteAssetSafely()를 쓰는 게 기본이고, 이 함수는\n// cascade delete(에피소드 자체가 사라질 때)처럼 참조를 신경 쓸 필요가 없는\n// 경우에만 직접 호출한다.\nasync function deleteAssetRaw(id) {\n  return withAssetStore(\"readwrite\", (store) => store.delete(id));\n}\n\nexport async function deleteAssetsByEpisode(episodeId) {\n  const assets = await getAssetsByEpisode(episodeId);\n  for (const a of assets) await deleteAssetRaw(a.id);\n  return assets.length;\n}\n\n// ---------------------------------------------------------------------------\n// 참조 무결성 — asset을 참조할 수 있는 모든 필드를 한 곳에서 관리한다.\n// (CUT 이미지 / 스타일·캐릭터 레퍼런스 / BGM / CUT의 audioEvents)\n// ---------------------------------------------------------------------------\n\nexport function findAssetReferences(episode, assetId) {\n  const refs = [];\n  if (!episode || !assetId) return refs;\n\n  if (episode.thumbnail && episode.thumbnail.assetId === assetId) {\n    refs.push({ type: \"thumbnail\" });\n  }\n  if (episode.styleReferenceAssetId === assetId) {\n    refs.push({ type: \"styleReference\" });\n  }\n  if (episode.characterReferenceAssetId === assetId) {\n    refs.push({ type: \"characterReference\" });\n  }\n  if (episode.bgm && episode.bgm.assetId === assetId) {\n    refs.push({ type: \"bgm\" });\n  }\n  // rc.3(Master Narration Mode) — 다른 asset 참조 필드(스타일/캐릭터 레퍼런스, BGM)와 동일한\n  // 원칙으로 등록한다. 이걸 빼먹으면 findOrphanAssets()가 이 파일을 \"아무도 참조하지 않는\n  // 고아 asset\"으로 잘못 판단하고, deleteAssetSafely()도 이 참조를 못 찾아 정리하지 못한다.\n  if (episode.masterNarration && episode.masterNarration.assetId === assetId) {\n    refs.push({ type: \"masterNarration\" });\n  }\n  (episode.cuts || []).forEach((cut, i) => {\n    if (cut.image && cut.image.assetId === assetId) {\n      refs.push({ type: \"cutImage\", cutId: cut.id, cutIndex: i });\n    }\n    (cut.audioEvents || []).forEach((evt, j) => {\n      if (evt.assetId === assetId) {\n        refs.push({ type: \"cutAudioEvent\", cutId: cut.id, cutIndex: i, eventIndex: j });\n      }\n    });\n  });\n  return refs;\n}\n\nfunction clearAssetReferences(episode, assetId) {\n  if (episode.thumbnail && episode.thumbnail.assetId === assetId) { episode.thumbnail.assetId = null; episode.thumbnail.status = episode.thumbnail.prompt ? \"prompt_ready\" : \"planned\"; }\n  if (episode.styleReferenceAssetId === assetId) episode.styleReferenceAssetId = null;\n  if (episode.characterReferenceAssetId === assetId) episode.characterReferenceAssetId = null;\n  if (episode.bgm && episode.bgm.assetId === assetId) episode.bgm.assetId = null;\n  if (episode.masterNarration && episode.masterNarration.assetId === assetId) episode.masterNarration.assetId = null;\n  (episode.cuts || []).forEach((cut) => {\n    if (cut.image && cut.image.assetId === assetId) {\n      cut.image.assetId = null;\n      cut.image.status = \"미생성\";\n    }\n    if (cut.video && cut.video.assetId === assetId) {\n      cut.video.assetId = null;\n      cut.video.duration = null;\n      cut.video.trimStart = 0;\n      cut.video.trimEnd = null;\n      cut.mediaType = \"image\";\n    }\n    if (Array.isArray(cut.audioEvents)) {\n      // 이벤트 자체(대사/나레이션 슬롯)는 남겨두고 assetId만 비운다 — 그래야 STEP2의 대사와의\n      // 연결(sourceDialogueId)이나 SFX 이름 같은 메타데이터가 asset 삭제만으로 함께 사라지지 않는다.\n      cut.audioEvents.forEach((evt) => {\n        if (evt.assetId === assetId) evt.assetId = null;\n      });\n    }\n  });\n}\n\n// 안전한 asset 삭제 서비스 함수 — 참조 확인 → 참조 해제 → asset 삭제 순으로\n// 하나의 함수 안에서 처리한다. dangling reference가 남지 않도록 보장한다.\nexport async function deleteAssetSafely(assetId, episodeId) {\n  const ep = await getEpisode(episodeId);\n  if (!ep) throw new Error(\"에피소드를 찾을 수 없습니다.\");\n\n  const refs = findAssetReferences(ep, assetId);\n  if (refs.length) {\n    clearAssetReferences(ep, assetId);\n    await saveEpisode(ep);\n  }\n  await deleteAssetRaw(assetId);\n  return { clearedReferences: refs, episode: ep };\n}\n\n// 고아 Blob(어느 에피소드에서도 참조되지 않는 asset) 탐지.\n// 자동으로 지우지 않는다 — 설정 화면에서 사용자가 목록을 보고 직접 정리한다.\nexport async function findOrphanAssets() {\n  const [episodes, assets] = await Promise.all([getAllEpisodes(), getAllAssets()]);\n  const episodeById = new Map(episodes.map((e) => [e.id, e]));\n  const orphans = [];\n  for (const asset of assets) {\n    const ep = episodeById.get(asset.episodeId);\n    if (!ep) {\n      orphans.push(asset); // 에피소드 자체가 이미 삭제된 경우\n      continue;\n    }\n    const refs = findAssetReferences(ep, asset.id);\n    if (refs.length === 0) orphans.push(asset);\n  }\n  return orphans;\n}\n\n// 사용자가 확인한 assetId 목록만 지운다 — 절대 자동/암묵적으로 전체를 쓸어버리지 않는다.\nexport async function sweepOrphanAssets(assetIds) {\n  let count = 0;\n  for (const id of assetIds || []) {\n    await deleteAssetRaw(id);\n    count++;\n  }\n  return count;\n}\n\n// ---------------------------------------------------------------------------\n// 저장 용량 조회\n// ---------------------------------------------------------------------------\n\nexport async function getEpisodeStorageUsage(episodeId) {\n  const assets = await getAssetsByEpisode(episodeId);\n  return assets.reduce((sum, a) => sum + (a.sizeBytes || 0), 0);\n}\n\nexport async function getTotalStorageUsage() {\n  const assets = await getAllAssets();\n  return assets.reduce((sum, a) => sum + (a.sizeBytes || 0), 0);\n}\n\n// 브라우저가 지원하면 기기 전체 저장공간 추정치도 함께 제공(가능하면 추가 요구사항).\n// Phase 7: navigator.storage.estimate()는 실제 디스크 사용량을 조회하는 브라우저 API라\n// 기기/브라우저 상태에 따라 드물게 응답이 크게 늦어질 수 있다(자동 테스트 중 실제로 관찰됨).\n// 이 값은 어디까지나 참고 정보이므로, 일정 시간 안에 응답이 없으면 포기하고 null을 반환한다 —\n// Settings 화면의 다른 정보(저장 용량 합계, 앱 정보 등)가 이 호출 하나 때문에 멈추지 않는다.\nconst STORAGE_ESTIMATE_TIMEOUT_MS = 4000;\nexport async function getStorageEstimate() {\n  if (typeof navigator !== \"undefined\" && navigator.storage && navigator.storage.estimate) {\n    try {\n      return await Promise.race([\n        navigator.storage.estimate(), // { usage, quota }\n        new Promise((resolve) => setTimeout(() => resolve(null), STORAGE_ESTIMATE_TIMEOUT_MS)),\n      ]);\n    } catch (e) {\n      return null;\n    }\n  }\n  return null;\n}\n\n// ---------------------------------------------------------------------------\n// 백업 — Light(episodes 정보만) / Full(이미지·오디오 Blob 포함, Phase 7에서 실제 구현 — js/backup.js)\n// ---------------------------------------------------------------------------\n\n// Light 백업(\"빠른 백업 — 프로젝트 정보만\") — episodes(JSON)만 포함, 빠르고 가볍다.\n// Phase 7: 향후 어떤 버전에서 만든 백업인지 구분할 수 있도록 최소 metadata를 함께 넣는다\n// (exportedAt은 기존 필드명을 그대로 유지 — 예전 백업 파일과의 하위호환을 위해 남겨둔다).\nexport async function exportAll() {\n  const episodes = await getAllEpisodes();\n  return {\n    backupFormatVersion: BACKUP_FORMAT_VERSION_LIGHT,\n    kind: \"light\",\n    appVersion: APP_VERSION,\n    dbVersion: DB_VERSION_DISPLAY,\n    createdAt: Date.now(),\n    exportedAt: Date.now(),\n    episodeCount: episodes.length,\n    episodes,\n  };\n}\n\n// 하위호환 유지 — payload에 backupFormatVersion이 없어도(구버전 라이트 백업) episodes 배열만\n// 있으면 그대로 가져온다. 충돌 정책은 이제 backup.js의 restoreLightBackup()이 담당하고,\n// 이 함수는 \"무조건 덮어쓰며 저장\"하는 저수준 동작만 제공한다(호출부는 이제 이 함수를 직접\n// 쓰지 않고 backup.js를 거친다 — 다만 예전 호출부/테스트 호환을 위해 그대로 남겨둔다).\nexport async function importAll(payload) {\n  if (!payload || !Array.isArray(payload.episodes)) throw new Error(\"잘못된 백업 파일입니다.\");\n  for (const ep of payload.episodes) {\n    await withStore(\"readwrite\", (store) => store.put(ep));\n  }\n  return payload.episodes.length;\n}\n\n// Full 백업 예상 용량 계산 — js/backup.js의 Full 백업 컨테이너 포맷(SPB1)은 Blob을 base64로\n// 바꾸지 않고 원본 바이트 그대로 이어붙이므로(조건 4번 \"portable container\" 방식 채택 —\n// docs/RELEASE_NOTES.md 참고), 인코딩 오버헤드가 없다. 예상 용량 = asset 원본 바이트 총합 +\n// episodes/asset manifest용 JSON 헤더 크기.\nexport async function estimateFullBackupSize() {\n  const [episodes, assets] = await Promise.all([getAllEpisodes(), getAllAssets()]);\n  const assetBytes = assets.reduce((sum, a) => sum + (a.sizeBytes || 0), 0);\n  const headerJsonBytes = new Blob([\n    JSON.stringify({ episodes, assets: assets.map((a) => ({ id: a.id, episodeId: a.episodeId, kind: a.kind })) }),\n  ]).size;\n  const estimatedBytes = headerJsonBytes + assetBytes;\n  return { headerJsonBytes, assetBytes, assetCount: assets.length, episodeCount: episodes.length, estimatedBytes };\n}\n","js_v420a12/featureAvailability.js":"// Phase별로 실제 구현된 CUT STEP이 무엇인지 한 곳에서만 관리한다.\n//\n// NextActionEngine과 화면들은 전부 이 값만 보고 판단한다 — \"이 기능은 Phase 3에서 제공됩니다\"\n// 같은 개발자용 표현이 여러 파일에 흩어져 최종 사용자 UI에 그대로 남는 것을 막기 위함이다.\n// 해당 Phase 구현이 끝나면 여기 값만 true로 바꾸면 NextActionEngine의 required/blocker 규칙이\n// 자동으로 다시 켜진다.\nexport const FEATURE_AVAILABILITY = {\n  cutAudio: true, // Phase 3에서 구현 완료 — 실제 required/blocker 규칙 적용\n  timeline: true, // Phase 4에서 구현 완료 — 실제 required/blocker 규칙 적용\n  preview: true, // Phase 5에서 구현 완료 — 실제 required/blocker 규칙 적용\n};\n","js_v420a12/timeline.js":"// Timeline 계산 모듈 — 시간축 관련 계산은 전부 여기서만 한다(View에 흩뿌리지 않는다).\n//\n// Phase 5(미리보기 재생)와 Phase 6(production.json 내보내기)도 \"언제 무엇이 일어나는가\"를\n// 판단할 때 이 모듈의 함수를 그대로 재사용해야 한다 — Timeline 화면만의 독자적인 시간 계산\n// 로직을 만들지 않는다.\n//\n// 핵심 원칙:\n// - CUT의 global start/end는 이전 CUT들의 resolved duration(manual > measured > estimated)을\n//   누적해서 계산한다.\n// - CUT 내부 audioEvent.start는 항상 \"CUT 상대시간\"이다(Phase 3 원칙 그대로 유지) — 이 모듈은\n//   표시/계산 시에만 globalStart = cutGlobalStart + event.start로 변환하고, 원본 데이터\n//   (episode.cuts[i].audioEvents[j].start)는 절대 건드리지 않는다(순수 함수, 부수효과 없음).\n\nimport { resolveCutDuration } from \"./model.js\";\n\n// resolveCutDuration()은 아직 아무 값도 없으면 null을 반환한다(정직하게). Timeline 레이아웃\n// 계산 시에는 숫자가 있어야 누적합이 깨지지 않으므로 여기서만 0으로 대체한다 — \"duration이\n// 없다\"는 사실 자체는 getTimelineWarnings()가 별도로 정확히 잡아낸다(이 함수가 숨기지 않는다).\nfunction resolvedOrZero(cut) {\n  const d = resolveCutDuration(cut);\n  return d == null ? 0 : d;\n}\n\n// duration의 출처(manual/measured/estimated 중 실제로 쓰인 것)를 함께 알려준다 —\n// UI에 \"최종 2.8초 · 실측 2.1초 · 추정 2.5초\"처럼 출처를 구분해서 보여주기 위함.\n// rc.3: audioMode(선택)를 함께 넘기면, \"measured\" 칸이 실제로는 Master Narration의 CUT\n// 마커에서 역산된 값일 때 source를 \"master\"로 구분해 보여준다 — resolveCutDuration()의\n// manual > measured > estimated 우선순위/계산 결과 자체는 전혀 바뀌지 않는다(표시용 구분일 뿐).\nexport function describeCutDuration(cut, audioMode) {\n  const d = cut?.duration || {};\n  let source = null;\n  if (d.manual != null) source = \"manual\";\n  else if (d.measured != null) source = audioMode === \"master_narration\" ? \"master\" : \"measured\";\n  else if (d.estimated != null) source = \"estimated\";\n  return {\n    manual: d.manual ?? null,\n    measured: d.measured ?? null,\n    estimated: d.estimated ?? null,\n    resolved: resolveCutDuration(cut),\n    source, // \"manual\" | \"measured\" | \"master\" | \"estimated\" | null(값 자체가 없음)\n  };\n}\n\n// CUT 배열에서 index번째 CUT의 전역 시작 시각 — 이전 CUT들의 resolved duration 누적합.\nexport function getCutGlobalStart(cuts, index) {\n  const list = cuts || [];\n  let t = 0;\n  for (let i = 0; i < index && i < list.length; i++) t += resolvedOrZero(list[i]);\n  return t;\n}\n\nexport function getCutGlobalRange(cuts, index) {\n  const list = cuts || [];\n  const cut = list[index];\n  const start = getCutGlobalStart(list, index);\n  const duration = cut ? resolvedOrZero(cut) : 0;\n  return { start, end: start + duration, duration };\n}\n\n// 전체 에피소드 재생시간 — 모든 CUT의 resolved duration 합(= 마지막 CUT의 end와 같다).\nexport function getEpisodeDuration(episode) {\n  const cuts = episode?.cuts || [];\n  return cuts.reduce((sum, c) => sum + resolvedOrZero(c), 0);\n}\n\n// 모든 CUT의 모든 audioEvent를 \"전역시간 좌표\"로 변환해 평탄화한 목록.\n// 원본 audioEvent.start(CUT 상대시간)는 절대 수정하지 않는다 — globalStart는 항상 계산해서만\n// 반환한다.\nexport function getTimelineEvents(episode) {\n  const cuts = episode?.cuts || [];\n  const events = [];\n  cuts.forEach((cut, i) => {\n    const cutStart = getCutGlobalStart(cuts, i);\n    (cut.audioEvents || []).forEach((evt) => {\n      const start = evt.start || 0;\n      const duration = evt.duration ?? 0;\n      events.push({\n        event: evt,\n        cutId: cut.id,\n        cutIndex: i,\n        cutNumber: i + 1,\n        globalStart: cutStart + start,\n        globalEnd: cutStart + start + duration,\n      });\n    });\n  });\n  return events;\n}\n\n// rc.4(코드 리뷰 후속 수정) — \"지금 이 episode가 Master Narration 모드로 활성화돼 있는가\"를\n// 판단하는 조건을 한 곳에만 정의한다. buildTimeline()의 VOICE 트랙 필터링, getTimelineWarnings()의\n// 경고 대상 필터링, cutTimelineStep.js의 CUT 상세 편집기 audioEvent 목록 필터링이 전부 이\n// 함수 하나만 호출해야 세 곳의 판정이 어긋날 여지가 없다. text_card(V1) 포맷에는 audioMode\n// 개념 자체가 없으므로 formatType===\"cut\"도 함께 확인한다.\nexport function isMasterNarrationMode(episode) {\n  return episode?.formatType === \"cut\" && episode?.audioMode === \"master_narration\";\n}\n\n// Timeline 화면(및 향후 qc.js)이 그대로 재사용할 수 있는 트랙별 데이터 + 전체 요약.\nexport function buildTimeline(episode) {\n  const cuts = episode?.cuts || [];\n  const episodeDuration = getEpisodeDuration(episode);\n  const isMasterMode = isMasterNarrationMode(episode);\n\n  const cutBlocks = cuts.map((cut, i) => {\n    const range = getCutGlobalRange(cuts, i);\n    return { cut, index: i, n: i + 1, ...range, durationInfo: describeCutDuration(cut, episode?.audioMode) };\n  });\n\n  const flatEvents = getTimelineEvents(episode);\n  // rc.4(코드 리뷰 수정) — master_narration 모드에서는 CUT별 narration audioEvent가 \"활성\n  // 재생 오디오\"가 아니다. per_cut → master_narration으로 모드를 전환해도 기존 narration\n  // audioEvent/asset은 (다시 per_cut으로 돌아갈 수 있도록) episode 데이터에서 절대 지우지\n  // 않지만, 여기 VOICE 트랙에는 더 이상 포함시키지 않는다 — 포함시키면 마스터 나레이션과\n  // 기존 CUT별 나레이션이 동시에 \"활성 이벤트\"로 잡혀 Preview에서 같은 나레이션이 중복\n  // 재생되는 문제가 생긴다(모드 전환만으로 데이터를 지우지 않는다는 비파괴 원칙과, \"활성\n  // 재생 오디오는 모드당 하나의 소스만\"이라는 원칙을 동시에 지키기 위한 순수 read-time 필터\n  // 링이다 — episode.cuts는 전혀 건드리지 않는다). 대사(dialogue)는 오디오 방식과 무관하게\n  // 항상 CUT별로 관리되므로 모드에 상관없이 그대로 포함한다.\n  let voice = isMasterMode\n    ? flatEvents.filter((e) => e.event.type === \"dialogue\")\n    : flatEvents.filter((e) => e.event.type === \"narration\" || e.event.type === \"dialogue\");\n  const sfx = flatEvents.filter((e) => e.event.type === \"sfx\");\n  const silence = flatEvents.filter((e) => e.event.type === \"silence\");\n\n  let subtitle;\n  if (isMasterMode) {\n    // rc.3(Master Narration Mode) — 나레이션 오디오는 CUT별 audioEvent가 아니라 에피소드\n    // 전체에 걸친 단일 트랙이다. VOICE 트랙에는 (per-cut narration audioEvent 대신) 마스터\n    // 나레이션 파일 하나를 CUT 마커로 계산된 전체 구간(0~episodeDuration)에 걸친 블록으로\n    // 얹는다 — Preview의 오디오 재생 루프(narration/dialogue/sfx 공용)가 이 블록을 그대로\n    // \"이벤트 하나\"로 다뤄서 currentTime을 그대로 offset으로 써도 정확히 맞아떨어진다(CUT1의\n    // 시작이 항상 0초이기 때문). 대사(dialogue) 오디오는 기존처럼 CUT별 audioEvent를 그대로 쓴다.\n    if (episode.masterNarration && episode.masterNarration.assetId) {\n      voice = [\n        {\n          event: { id: \"master_narration\", type: \"narration\", assetId: episode.masterNarration.assetId, master: true },\n          cutId: null,\n          cutIndex: null,\n          cutNumber: null,\n          globalStart: 0,\n          globalEnd: episodeDuration,\n        },\n        ...voice,\n      ];\n    }\n    // 자막 원본도 마찬가지 — per-cut narration audioEvent가 없으므로, \"이 CUT의 나레이션\n    // 자막이 켜져 있고 실제 대본 텍스트가 있다\"는 조건만으로 CUT 전역 구간을 그대로 자막\n    // 구간으로 쓴다(Story 단계의 cut.narration이 원본, 오디오 이벤트에 의존하지 않는다).\n    const narrationSubs = cutBlocks\n      .filter((cb) => cb.cut?.subtitle?.narration && cb.cut.narration && cb.cut.narration.trim())\n      .map((cb) => ({\n        event: { type: \"narration\" },\n        cutId: cb.cut.id,\n        cutIndex: cb.index,\n        globalStart: cb.start,\n        globalEnd: cb.end,\n      }));\n    const dialogueSubs = flatEvents.filter((e) => e.event.type === \"dialogue\" && cuts[e.cutIndex]?.subtitle?.dialogue);\n    subtitle = [...narrationSubs, ...dialogueSubs].sort((a, b) => a.globalStart - b.globalStart);\n  } else {\n    subtitle = flatEvents\n      .filter((e) => e.event.type === \"narration\" || e.event.type === \"dialogue\")\n      .filter((e) => {\n        const cut = cuts[e.cutIndex];\n        const key = e.event.type === \"narration\" ? \"narration\" : \"dialogue\";\n        return !!(cut?.subtitle && cut.subtitle[key]);\n      });\n  }\n\n  const bgm = episode?.bgm && episode.bgm.assetId\n    ? [{ bgm: episode.bgm, globalStart: episode.bgm.start || 0, globalEnd: episode.bgm.end != null ? episode.bgm.end : episodeDuration }]\n    : [];\n\n  return {\n    episodeDuration,\n    cuts: cutBlocks,\n    tracks: { video: cutBlocks, voice, sfx, silence, bgm, subtitle },\n  };\n}\n\n// Timeline 자체 화면에서 즉시 보여줄 경고 — Phase 6 이전 qc.js가 재사용할 수 있도록\n// View에 하드코딩하지 않고 여기서 순수 함수로 제공한다. severity: \"warning\" | \"blocker\".\nexport function getTimelineWarnings(episode) {\n  const cuts = episode?.cuts || [];\n  const warnings = [];\n  const episodeDuration = getEpisodeDuration(episode);\n  // rc.4(코드 리뷰 후속 수정) — Master Narration 모드에서는 CUT별 narration audioEvent가\n  // \"비활성 보존 데이터\"다(episode.cuts는 건드리지 않지만 활성 재생/노출 대상에서는 제외).\n  // 이 경고 계산도 그 원칙을 따라야 한다 — 그러지 않으면 DB에만 남아있는 옛 나레이션이\n  // 실제 CUT 길이보다 길다는 이유로 \"나레이션이 CUT 종료보다 N초 늦게 끝납니다\" 같은 잘못된\n  // 경고가 뜬다(실제 VOICE 트랙에는 이미 그 이벤트가 없으므로 사용자 입장에서는 원인을 알 수\n  // 없는 유령 경고가 된다). Dialogue/SFX 경고와 per_cut 모드의 narration 경고는 그대로\n  // 동작해야 하므로, narration 타입 + 마스터 모드일 때만 이 CUT의 이 이벤트를 건너뛴다.\n  const isMasterMode = isMasterNarrationMode(episode);\n\n  cuts.forEach((cut, i) => {\n    const n = i + 1;\n    const resolved = resolveCutDuration(cut);\n    if (resolved == null) {\n      warnings.push({ severity: \"blocker\", cutIndex: i, cutId: cut.id, message: `CUT ${n} 재생시간이 아직 정해지지 않았습니다.` });\n      return; // duration이 없으면 아래 오버플로 계산 자체가 의미 없다.\n    }\n    if (resolved <= 0) {\n      warnings.push({ severity: \"blocker\", cutIndex: i, cutId: cut.id, message: `CUT ${n} duration이 0초입니다.` });\n    }\n\n    (cut.audioEvents || []).forEach((evt) => {\n      if (isMasterMode && evt.type === \"narration\") return; // 비활성 보존 데이터 — 경고 대상 아님(episode.cuts는 미수정).\n      const start = evt.start || 0;\n      const duration = evt.duration ?? 0;\n      const end = start + duration;\n      if (evt.type === \"sfx\" && start >= resolved && resolved > 0) {\n        warnings.push({\n          severity: \"warning\",\n          cutIndex: i,\n          cutId: cut.id,\n          eventId: evt.id,\n          message: `CUT ${n} SFX${evt.name ? ` \"${evt.name}\"` : \"\"}가 CUT 종료 이후 시작합니다.`,\n        });\n        return;\n      }\n      if (end > resolved) {\n        const over = Math.round((end - resolved) * 10) / 10;\n        const label = evt.type === \"narration\" ? \"나레이션\" : evt.type === \"dialogue\" ? \"대사\" : evt.type === \"sfx\" ? `SFX${evt.name ? ` \"${evt.name}\"` : \"\"}` : \"정적\";\n        warnings.push({\n          severity: \"warning\",\n          cutIndex: i,\n          cutId: cut.id,\n          eventId: evt.id,\n          message: `CUT ${n} ${label}이(가) CUT 종료보다 ${over}초 늦게 끝납니다.`,\n        });\n      }\n    });\n  });\n\n  if (episode?.bgm && episode.bgm.assetId && episode.bgm.end != null && episode.bgm.end > episodeDuration) {\n    warnings.push({\n      severity: \"warning\",\n      cutIndex: null,\n      cutId: null,\n      message: `BGM 종료 시각(${episode.bgm.end}초)이 전체 영상 길이(${Math.round(episodeDuration * 10) / 10}초)를 초과합니다.`,\n    });\n  }\n\n  return warnings;\n}\n\n// ---------------------------------------------------------------------------\n// Phase 5(Preview 재생)가 필요로 하는 순수 시간/볼륨 계산 — 여기도 View에 흩뿌리지 않는다.\n// Timeline과 Preview가 서로 다른 시간 계산을 하지 않도록, 아래 함수들을 Preview 화면과\n// 테스트가 그대로 재사용한다.\n// ---------------------------------------------------------------------------\n\n// 현재 재생시각(초)이 속한 CUT의 index를 반환한다. 범위 밖이면 첫 CUT(currentTime<=0)이나\n// 마지막 CUT(currentTime>=전체 길이)으로 clamp한다. CUT이 하나도 없으면 null.\nexport function getActiveCutIndex(cuts, currentTime) {\n  const list = cuts || [];\n  if (!list.length) return null;\n  let acc = 0;\n  for (let i = 0; i < list.length; i++) {\n    const dur = resolvedOrZero(list[i]);\n    if (currentTime < acc + dur || i === list.length - 1) return i;\n    acc += dur;\n  }\n  return list.length - 1;\n}\n\n// CUT별 BGM 동작(continue/lower/raise/stop)이 볼륨에 주는 배율 — Preview 재생과 테스트가\n// 같은 상수를 쓰도록 한 곳에만 정의한다. fade_out은 상수가 아니라 해당 CUT 구간 안에서\n// 1→0으로 선형 감쇠하므로 getBgmEnvelopeVolume()에서 별도로 계산한다.\n// 실제 최종 렌더러(FFmpeg)의 정확한 수치와는 다를 수 있다 — Phase 5는 제작 판단이 가능한\n// 정도의 근사치가 목표이지 pixel-perfect 재현이 목표가 아니다(조건 15번).\nexport const BGM_CUT_ACTION_VOLUME = {\n  continue: 1,\n  lower: 0.35,\n  raise: 1,\n  stop: 0,\n};\n\n// episode.bgm과 현재 재생시각(초)을 받아 0~1 사이의 최종 재생 볼륨을 계산한다:\n// bgm.start~end 범위 밖이면 0, 경계에서 fadeIn/fadeOut(초)만큼 linear fade, 그 위에 현재\n// 활성 CUT의 bgmAction 배율을 곱한다. fadeCurve는 지금은 \"linear\"만 실제로 계산하지만\n// 인자로 episode 전체를 받으므로 향후 다른 curve를 추가해도 이 함수의 시그니처는 그대로다.\nexport function getBgmEnvelopeVolume(episode, currentTime) {\n  const bgm = episode?.bgm;\n  if (!bgm || !bgm.assetId) return 0;\n  const episodeDuration = getEpisodeDuration(episode);\n  const start = bgm.start || 0;\n  const end = bgm.end != null ? bgm.end : episodeDuration;\n  if (currentTime < start || currentTime >= end) return 0;\n\n  const base = bgm.volume ?? 1;\n  const fadeIn = Math.max(0, bgm.fadeIn || 0);\n  const fadeOut = Math.max(0, bgm.fadeOut || 0);\n  let envelope = 1;\n  if (fadeIn > 0 && currentTime < start + fadeIn) {\n    envelope = Math.min(envelope, (currentTime - start) / fadeIn);\n  }\n  if (fadeOut > 0 && currentTime > end - fadeOut) {\n    envelope = Math.min(envelope, (end - currentTime) / fadeOut);\n  }\n  envelope = Math.max(0, Math.min(1, envelope));\n\n  const cuts = episode?.cuts || [];\n  const activeIndex = getActiveCutIndex(cuts, currentTime);\n  const activeCut = activeIndex != null ? cuts[activeIndex] : null;\n  const action = (activeCut && bgm.cutActions && bgm.cutActions[activeCut.id]) || \"continue\";\n\n  let actionMultiplier = BGM_CUT_ACTION_VOLUME[action] ?? 1;\n  if (action === \"fade_out\" && activeCut) {\n    const range = getCutGlobalRange(cuts, activeIndex);\n    const localT = currentTime - range.start;\n    actionMultiplier = range.duration > 0 ? Math.max(0, 1 - localT / range.duration) : 0;\n  }\n\n  return Math.max(0, Math.min(1, base * envelope * actionMultiplier));\n}\n","js_v420a12/qc.js":"// Preview/QC 규칙 모듈(Phase 5) — \"이대로 영상을 만들어도 되는가?\"를 판단하기 위한\n// 규칙을 한 곳에서만 정의한다. 화면(previewStep.js)은 이 모듈의 결과를 표시만 할 뿐,\n// 자체적으로 QC 판정 로직을 만들지 않는다(조건 9번 \"화면마다 별도의 QC 규칙을 중복\n// 작성하지 마세요\").\n//\n// 순수 함수만 존재한다(DOM/비동기 DB 조회 없음) — model.js/timeline.js가 이미 갖고 있는\n// episode.cuts의 필드(assetId 존재 여부 등)만으로 판정한다. asset이 실제로 IndexedDB에\n// 남아있는지(진짜 broken blob 여부)는 db.js의 참조무결성 삭제 흐름(deleteAssetSafely)이\n// 애초에 dangling assetId가 생기지 않도록 항상 보장하므로, 여기서는 별도의 비동기 검증을\n// 하지 않는다 — \"참조 asset 없음\"은 \"assetId 필드 자체가 비어있음\"으로 해석한다.\n//\n// severity: \"error\" | \"warning\" | \"info\" — Preview 화면과 NextActionEngine이 그대로 재사용한다.\n\nimport { resolveCutDuration, isImageApproved } from \"./model.js\";\nimport { getTimelineWarnings, getEpisodeDuration, describeCutDuration } from \"./timeline.js\";\n\nexport const QC_SEVERITY = { ERROR: \"error\", WARNING: \"warning\", INFO: \"info\" };\n\n// 임의로 정한 참고 임계값(제작 판단용) — FFmpeg 등 실제 렌더러의 기준이 아니다.\nexport const SHORT_DURATION_WARN_SEC = 0.5;\nexport const LONG_DURATION_WARN_SEC = 12;\n\nfunction isNarratorSpeaker(value) {\n  const s = String(value || \"\").trim().toLowerCase().replace(/\\s+/g, \"\");\n  return s === \"나레이터\" || s === \"내레이터\" || s === \"narrator\";\n}\n\nfunction dialogueRequiresSeparateAudio(line, audioMode) {\n  if (!line?.text || !String(line.text).trim()) return false;\n  if (audioMode === \"master_narration\" && isNarratorSpeaker(line.speaker)) return false;\n  return true;\n}\n\nfunction push(items, severity, cutIndex, cutId, message, eventId) {\n  items.push({ severity, cutIndex, cutId, eventId: eventId ?? null, message });\n}\n\n\nfunction applyEconomyGoldenReferenceQc(episode, items) {\n  if (episode?.channelKey !== \"economy_current\") return;\n  const cuts=episode?.cuts||[];\n  const isShorts=(episode?.contentFormat||\"shorts\")===\"shorts\";\n  if (isShorts && cuts.length>=2) {\n    const firstText=`${cuts[0]?.directorNote||\"\"} ${cuts[0]?.situation||\"\"}`;\n    const lastText=`${cuts[cuts.length-1]?.directorNote||\"\"} ${cuts[cuts.length-1]?.situation||\"\"}`;\n    if (!/LOOP_OPEN|루프|마지막 CUT/.test(firstText))\n      push(items,QC_SEVERITY.WARNING,0,cuts[0]?.id,\"경제 Shorts 첫 CUT의 Seamless Loop 시작 설계가 확인되지 않습니다.\");\n    if (!/LOOP_CLOSE|루프|첫 CUT/.test(lastText))\n      push(items,QC_SEVERITY.WARNING,cuts.length-1,cuts[cuts.length-1]?.id,\"경제 Shorts 마지막 CUT의 Seamless Loop 마감 설계가 확인되지 않습니다.\");\n  }\n  const staticCount=cuts.filter(c=>!c?.motion||c.motion.type===\"STATIC\").length;\n  if (cuts.length && staticCount/cuts.length>0.65)\n    push(items,QC_SEVERITY.WARNING,null,null,\"경제 Golden Reference 기준보다 정지 CUT 비율이 높습니다.\");\n}\n\n// episode 전체에 대한 QC 결과 목록을 계산한다. Timeline의 getTimelineWarnings()를 그대로\n// 재사용해 blocker→error/warning→warning으로 매핑하고(시간 계산 관련 경고는 여기서 다시\n// 만들지 않는다), 그 위에 QC 전용 규칙(이미지/필수오디오/자막/참고성 INFO)을 추가한다.\nexport function getQcResults(episode) {\n  const cuts = episode?.cuts || [];\n  const items = [];\n\n  getTimelineWarnings(episode).forEach((w) => {\n    push(items, w.severity === \"blocker\" ? QC_SEVERITY.ERROR : QC_SEVERITY.WARNING, w.cutIndex, w.cutId, w.message, w.eventId);\n  });\n\n  const episodeDuration = getEpisodeDuration(episode);\n  if (cuts.length === 0) {\n    push(items, QC_SEVERITY.ERROR, null, null, \"CUT이 하나도 없어 Preview를 계산할 수 없습니다.\");\n    return items;\n  }\n\n  cuts.forEach((cut, i) => {\n    const n = i + 1;\n\n    // ERROR — 이미지(참조 asset) 없음\n    if (!cut.image?.assetId) {\n      push(items, QC_SEVERITY.ERROR, i, cut.id, `CUT ${n} 이미지가 없습니다.`);\n    } else if (cut.image.status === \"RETRY\") {\n      push(items, QC_SEVERITY.WARNING, i, cut.id, `CUT ${n} 이미지가 RETRY 상태입니다 — 다시 제작이 필요해요.`);\n    } else if (!isImageApproved(cut)) {\n      push(items, QC_SEVERITY.WARNING, i, cut.id, `CUT ${n} 이미지가 검수 완료(PASS/확정) 상태가 아닙니다(현재: ${cut.image.status}).`);\n    }\n\n    // ERROR — 필수 오디오 asset 참조 누락(Phase 3 cutAudio 규칙과 같은 기준을 QC에서도 보여줌)\n    // rc.3: Master Narration 모드에서는 나레이션이 CUT별 asset이 아니라 에피소드 전체의\n    // 마스터 파일이다 — \"이 CUT에 나레이션 음성 asset이 없다\"는 검사 자체가 성립하지 않는다\n    // (마스터 파일/마커 누락은 getTimelineWarnings의 duration-없음 blocker로 이미 ERROR로\n    // 잡힌다 — nextActions.js의 isMasterNarrationReady와 같은 데이터를 본다).\n    if (episode?.audioMode !== \"master_narration\" && cut.narration && cut.narration.trim()) {\n      const hasNarrationAsset = (cut.audioEvents || []).some((e) => e.type === \"narration\" && e.assetId);\n      if (!hasNarrationAsset) push(items, QC_SEVERITY.ERROR, i, cut.id, `CUT ${n} 나레이션 음성 asset이 없습니다.`);\n    }\n    (cut.dialogueLines || []).forEach((line) => {\n      if (!dialogueRequiresSeparateAudio(line, episode?.audioMode)) return;\n      const evt = (cut.audioEvents || []).find((e) => e.type === \"dialogue\" && e.sourceDialogueId === line.id);\n      if (!evt || !evt.assetId) push(items, QC_SEVERITY.ERROR, i, cut.id, `CUT ${n} 대사(\"${line.text.slice(0, 16)}\") 음성 asset이 없습니다.`);\n    });\n    (cut.audioEvents || [])\n      .filter((e) => e.type === \"sfx\" && e.required && !e.assetId)\n      .forEach((e) => push(items, QC_SEVERITY.ERROR, i, cut.id, `CUT ${n} 필수 SFX \"${e.name || \"이름 없음\"}\" asset이 없습니다.`, e.id));\n\n    // WARNING — duration이 비정상적으로 짧거나 긴 CUT\n    const resolved = resolveCutDuration(cut);\n    if (resolved != null && resolved > 0) {\n      if (resolved < SHORT_DURATION_WARN_SEC) push(items, QC_SEVERITY.WARNING, i, cut.id, `CUT ${n} 길이(${resolved}초)가 비정상적으로 짧습니다.`);\n      if (resolved > LONG_DURATION_WARN_SEC) push(items, QC_SEVERITY.WARNING, i, cut.id, `CUT ${n} 길이(${resolved}초)가 비정상적으로 깁니다.`);\n    }\n\n    // WARNING — Subtitle ON인데 표시할 텍스트가 없음(자막 대상 텍스트는 audioEvent가 아니라\n    // Story의 cut.narration / dialogueLines.text가 원본이다 — Preview도 이 필드를 그대로 읽는다)\n    if (cut.subtitle?.narration && !(cut.narration && cut.narration.trim())) {\n      push(items, QC_SEVERITY.WARNING, i, cut.id, `CUT ${n} 나레이션 자막이 켜져 있지만 표시할 텍스트가 없습니다.`);\n    }\n    if (cut.subtitle?.dialogue && (cut.dialogueLines || []).length > 0 && !(cut.dialogueLines || []).some((l) => l?.text && l.text.trim())) {\n      push(items, QC_SEVERITY.WARNING, i, cut.id, `CUT ${n} 대사 자막이 켜져 있지만 표시할 텍스트가 없습니다.`);\n    }\n\n    // INFO — 제작은 가능하지만 참고할 사항\n    const info = describeCutDuration(cut, episode?.audioMode);\n    if (info.source === \"estimated\") push(items, QC_SEVERITY.INFO, i, cut.id, `CUT ${n}은(는) 추정(estimated) 길이를 사용 중입니다.`);\n    if ((cut.motion?.type || \"STATIC\") === \"STATIC\") push(items, QC_SEVERITY.INFO, i, cut.id, `CUT ${n} 모션이 STATIC(정지)입니다.`);\n    if (!(cut.audioEvents || []).some((e) => e.type === \"sfx\")) push(items, QC_SEVERITY.INFO, i, cut.id, `CUT ${n}에 SFX가 없습니다.`);\n  });\n\n  if (episodeDuration <= 0) {\n    push(items, QC_SEVERITY.ERROR, null, null, \"전체 영상 길이를 계산할 수 없습니다(모든 CUT의 duration이 0이거나 없음).\");\n  }\n\n  applyEconomyGoldenReferenceQc(episode, items);\n\n  return items;\n}\n\nexport function summarizeQc(items) {\n  const list = items || [];\n  return {\n    errorCount: list.filter((i) => i.severity === QC_SEVERITY.ERROR).length,\n    warningCount: list.filter((i) => i.severity === QC_SEVERITY.WARNING).length,\n    infoCount: list.filter((i) => i.severity === QC_SEVERITY.INFO).length,\n  };\n}\n\n// \"최종 제작 준비 완료\"는 ERROR가 0건일 때만 성립한다 — WARNING/INFO만으로는 판단하지 않는다.\nexport function isReadyForProduction(items) {\n  return summarizeQc(items).errorCount === 0;\n}\n","js_v420a12/nextActions.js":"// NextActionEngine — 공통 상태 엔진 (Single Source of Truth).\n//\n// 어떤 화면도 자체적으로 진행률/블로커를 계산하지 않는다. 전부 이 파일의 함수를 통해서만\n// 얻는다: getNextActions(episode), getPrimaryNextAction(episode), getProgress(episode),\n// getBlockers(episode), isStepDone(episode, stepKey).\n//\n// 반환 스키마(고정 — Phase 1에서 확정):\n//   { id, priority, step, target, message, blocking, action }\n//   priority: \"blocker\" | \"required\" | \"recommended\" | \"optional\"\n//   action: { label, href } | null  — href는 \"#/episode/:id/:step\" 형태의 라우팅 해시\n//\n// CUT 포맷의 세부 규칙(이미지 QC 상태, 오디오 이벤트 검증, 타임라인 QC 등)은\n// Phase 2~6에서 이 엔진에 계속 추가된다. 호출부(각 View)는 always getNextActions() 하나만\n// 부르면 되고, 내부적으로 formatType에 따라 분기한다.\n\nimport { isImageApproved, hasStoryContent, STEPS_TEXT_CARD, STEPS_CUT, resolveCutDuration, getMasterStart } from \"./model.js\";\nimport { FEATURE_AVAILABILITY } from \"./featureAvailability.js\";\nimport { getTimelineWarnings } from \"./timeline.js\";\nimport { getQcResults, summarizeQc } from \"./qc.js\";\n\nexport const PRIORITY = {\n  BLOCKER: \"blocker\",\n  REQUIRED: \"required\",\n  RECOMMENDED: \"recommended\",\n  OPTIONAL: \"optional\",\n};\n\nconst PRIORITY_ORDER = [PRIORITY.BLOCKER, PRIORITY.REQUIRED, PRIORITY.RECOMMENDED, PRIORITY.OPTIONAL];\n\nfunction makeAction(ep, partial) {\n  return {\n    id: partial.id,\n    priority: partial.priority,\n    step: partial.step,\n    target: partial.target ?? null,\n    message: partial.message,\n    blocking: partial.blocking ?? partial.priority === PRIORITY.BLOCKER,\n    action: partial.action ?? (partial.step ? { label: `${partial.step} 단계로 이동`, href: `#/episode/${ep.id}/${partial.step}` } : null),\n  };\n}\n\n// ---------------------------------------------------------------------------\n// text_card (레거시)\n// ---------------------------------------------------------------------------\n\nfunction stepDoneTextCard(ep, key) {\n  switch (key) {\n    case \"plan\":\n      return !!(ep.title && ep.date);\n    case \"scenes\":\n      return (ep.scenes || []).some((s) => s.narration_line?.trim());\n    case \"duration\":\n      return (\n        (ep.scenes || []).every((s) => s.measured_start != null) ||\n        (ep.scenes || []).some((s) => s._estimatedDur != null)\n      );\n    case \"images\":\n      return (ep.scenes || []).every((s) => s.image_filename);\n    case \"narration\":\n      return (ep.scenes || []).every((s) => s.measured_start != null);\n    case \"export\":\n      return ep.status === \"확정\" || ep.status === \"업로드완료\";\n    default:\n      return false;\n  }\n}\n\nfunction getNextActionsTextCard(ep) {\n  const actions = [];\n  const scenes = ep.scenes || [];\n\n  if (!ep.title || !ep.date) {\n    actions.push(\n      makeAction(ep, {\n        id: \"plan-basic-info\",\n        priority: PRIORITY.REQUIRED,\n        step: \"plan\",\n        message: \"제목과 날짜를 입력해주세요.\",\n      })\n    );\n  }\n\n  if (!scenes.some((s) => s.narration_line?.trim())) {\n    actions.push(\n      makeAction(ep, {\n        id: \"scenes-empty\",\n        priority: PRIORITY.REQUIRED,\n        step: \"scenes\",\n        message: \"나레이션 문장이 입력된 씬이 없습니다.\",\n      })\n    );\n  }\n\n  const missingImageIdx = scenes.map((s, i) => (s.image_filename ? null : i + 1)).filter((v) => v != null);\n  if (missingImageIdx.length) {\n    actions.push(\n      makeAction(ep, {\n        id: \"images-missing\",\n        priority: PRIORITY.REQUIRED,\n        step: \"images\",\n        target: missingImageIdx,\n        message: `이미지가 없는 씬이 ${missingImageIdx.length}개 있습니다 (씬 ${missingImageIdx.join(\", \")}).`,\n      })\n    );\n  }\n\n  const missingMeasuredIdx = scenes.map((s, i) => (s.measured_start == null ? i + 1 : null)).filter((v) => v != null);\n  if (missingMeasuredIdx.length && scenes.some((s) => s.narration_line?.trim())) {\n    actions.push(\n      makeAction(ep, {\n        id: \"narration-not-measured\",\n        priority: PRIORITY.RECOMMENDED,\n        step: \"narration\",\n        target: missingMeasuredIdx,\n        message: `나레이션 실측 타이밍이 비어있는 씬이 ${missingMeasuredIdx.length}개 있습니다 — 실측하면 더 정확한 재생시간을 쓸 수 있어요.`,\n      })\n    );\n  }\n\n  const hasBlockerOrRequired = actions.some(\n    (a) => a.priority === PRIORITY.BLOCKER || a.priority === PRIORITY.REQUIRED\n  );\n  if (!hasBlockerOrRequired && ep.status !== \"확정\" && ep.status !== \"업로드완료\") {\n    actions.push(\n      makeAction(ep, {\n        id: \"ready-to-confirm\",\n        priority: PRIORITY.REQUIRED,\n        step: \"export\",\n        message: \"준비가 끝났습니다 — 내보내기 단계에서 확정해주세요.\",\n      })\n    );\n  }\n\n  return actions;\n}\n\n// ---------------------------------------------------------------------------\n// cut (v2)\n// ---------------------------------------------------------------------------\n\n// CUT에 오디오가 필요한지 — \"스토리가 요구하는 오디오\"만 필요로 본다.\n// 나레이션 텍스트가 있으면 나레이션 음성이, 대사 텍스트가 있으면 그 대사 음성이,\n// required로 표시된 SFX가 있으면 그 SFX 파일이 필요하다. 그 외에는 필요 없다 —\n// 대사도 나레이션도 없는 순수 비주얼 CUT은 audioEvents가 0개여도 정상이다.\nexport function cutNeedsAudio(cut) {\n  if (!cut) return false;\n  const hasNarrationText = !!(cut.narration && cut.narration.trim());\n  const hasDialogueText = (cut.dialogueLines || []).some((l) => l?.text && l.text.trim());\n  const hasRequiredSfx = (cut.audioEvents || []).some((e) => e.type === \"sfx\" && e.required);\n  return hasNarrationText || hasDialogueText || hasRequiredSfx;\n}\n\nfunction findDialogueAudioEvent(cut, dialogueLineId) {\n  return (cut.audioEvents || []).find((e) => e.type === \"dialogue\" && e.sourceDialogueId === dialogueLineId);\n}\n\nfunction isNarratorSpeaker(value) {\n  const s = String(value || \"\").trim().toLowerCase().replace(/\\s+/g, \"\");\n  return s === \"나레이터\" || s === \"내레이터\" || s === \"narrator\";\n}\n\nfunction dialogueRequiresSeparateAudio(line, audioMode) {\n  if (!line?.text || !String(line.text).trim()) return false;\n  if (audioMode === \"master_narration\" && isNarratorSpeaker(line.speaker)) return false;\n  return true;\n}\n\n// cutNeedsAudio()가 \"필요한 게 있는가\"라면, isCutAudioComplete()는 \"필요한 게 전부 채워졌는가\"이다.\n// rc.3: audioMode===\"master_narration\"이면 나레이션 완료 여부는 이 CUT 하나만으로 판단할 수\n// 없다(에피소드 전체의 마스터 파일 + CUT 시작 마커로 판단해야 함) — 그 판정은 stepDoneCut()이\n// isMasterNarrationReady()로 별도로 하고, 여기서는 대사/SFX 조건만 그대로 확인한다(대사/SFX는\n// 모드와 무관하게 항상 CUT별로 유지되는 기존 구조 그대로). audioMode를 넘기지 않으면(기존\n// 호출부/테스트 호환) per_cut 판정으로 동작해 기존 동작을 그대로 보존한다.\nexport function isCutAudioComplete(cut, audioMode) {\n  if (!cut) return false;\n  const events = cut.audioEvents || [];\n  const narrationOk =\n    audioMode === \"master_narration\"\n      ? true\n      : !(cut.narration && cut.narration.trim()) || events.some((e) => e.type === \"narration\" && e.assetId);\n  const dialogueLines = (cut.dialogueLines || []).filter((l) => dialogueRequiresSeparateAudio(l, audioMode));\n  const dialogueOk = dialogueLines.every((line) => {\n    const evt = findDialogueAudioEvent(cut, line.id);\n    return !!(evt && evt.assetId);\n  });\n  const requiredSfxOk = events.filter((e) => e.type === \"sfx\" && e.required).every((e) => !!e.assetId);\n  return narrationOk && dialogueOk && requiredSfxOk;\n}\n\n// rc.3: Master Narration 자체(에피소드 레벨)의 완료 조건 — (1) 마스터 나레이션 파일이\n// 있고, (2) CUT1을 제외한 모든 CUT의 시작 마커가 기록됐고, (3) 그 마커로부터 모든 CUT의\n// duration이 실제로 계산 가능(0보다 큼)해야 한다. 값을 억지로 만들지 않는다는 원칙에 따라\n// recalcMasterNarrationDurations()가 이미 채워둔 cut.duration.measured/resolveCutDuration()\n// 결과를 그대로 신뢰한다(여기서 다시 계산하지 않는다).\nfunction isMasterNarrationReady(ep) {\n  const cuts = ep.cuts || [];\n  if (!cuts.length) return false;\n  if (!ep.masterNarration || !ep.masterNarration.assetId) return false;\n  if (!cuts.every((c, i) => i === 0 || getMasterStart(c, i) != null)) return false;\n  return cuts.every((c) => {\n    const d = resolveCutDuration(c);\n    return d != null && d > 0;\n  });\n}\n\nfunction truncateForMessage(s, n = 20) {\n  const t = String(s || \"\").trim();\n  return t.length > n ? t.slice(0, n) + \"…\" : t;\n}\n\nfunction stepDoneCut(ep, key) {\n  const cuts = ep.cuts || [];\n  switch (key) {\n    case \"plan\":\n      return !!(ep.title && ep.date);\n    case \"story\":\n      return cuts.length > 0 && cuts.every((c) => hasStoryContent(c));\n    case \"cutImages\":\n      // Phase 2: assetId만으로는 부족하다 — 실제로 승인 가능한 최종 상태(PASS/확정)여야\n      // 이미지 STEP이 \"완료\"된 것으로 인정한다. RETRY/검수필요/미생성/생성중은 완료가 아니다.\n      return cuts.length > 0 && cuts.every((c) => isImageApproved(c));\n    case \"cutAudio\":\n      // Phase 3: \"CUT마다 audioEvents가 1개 이상\"이 아니라 \"스토리가 요구하는 오디오가\n      // 실제로 채워졌는가\"로 완료를 판정한다. 아직 오디오 STEP 자체가 없던 시절에는\n      // FEATURE_AVAILABILITY.cutAudio가 false였고 그때는 항상 미완료로 정직하게 표시했다.\n      if (!FEATURE_AVAILABILITY.cutAudio) return false;\n      if (cuts.length === 0) return false;\n      // rc.3: Master Narration 모드에서는 나레이션 완료 조건이 \"에피소드 전체 마스터 파일 +\n      // CUT 마커\"로 바뀐다 — 대사/SFX(isCutAudioComplete)는 모드와 무관하게 그대로 확인한다.\n      if (ep.audioMode === \"master_narration\") {\n        if (!isMasterNarrationReady(ep)) return false;\n        return cuts.every((c) => isCutAudioComplete(c, ep.audioMode));\n      }\n      return cuts.every((c) => isCutAudioComplete(c, ep.audioMode));\n    case \"timeline\":\n      // Phase 4: 단순히 \"모든 CUT에 duration이 있다\"만으로 끝내지 않는다 — (1) 모든 CUT의\n      // resolved duration이 존재하고 0보다 커야 하고(getTimelineWarnings의 blocker 항목이\n      // 정확히 이 두 가지), (2) 사용자가 명시적으로 \"검토 완료\"를 눌러야(timelineReviewedAt)\n      // 완료로 인정한다 — 자동 계산이 끝났다고 사용자가 확인한 것으로 간주하지 않는다.\n      if (!FEATURE_AVAILABILITY.timeline) return false;\n      if (cuts.length === 0) return false;\n      if (getTimelineWarnings(ep).some((w) => w.severity === \"blocker\")) return false;\n      return !!ep.timelineReviewedAt;\n    case \"preview\":\n      // Phase 5: QC(qc.js)가 ERROR 0건이고, 사용자가 실제로 [미리보기 검토 완료]를 눌러\n      // previewReviewedAt이 찍혀 있어야 완료로 인정한다 — 자동 계산만으로 완료로 치지 않는다\n      // (timelineReviewedAt과 동일한 원칙).\n      if (!FEATURE_AVAILABILITY.preview) return false;\n      if (cuts.length === 0) return false;\n      if (summarizeQc(getQcResults(ep)).errorCount > 0) return false;\n      return !!ep.previewReviewedAt;\n    case \"cutExport\":\n      return ep.status === \"확정\" || ep.status === \"업로드완료\";\n    default:\n      return false;\n  }\n}\n\nfunction getNextActionsCut(ep) {\n  const actions = [];\n  const cuts = ep.cuts || [];\n\n  if (!ep.title || !ep.date) {\n    actions.push(\n      makeAction(ep, {\n        id: \"plan-basic-info\",\n        priority: PRIORITY.REQUIRED,\n        step: \"plan\",\n        message: \"제목과 날짜를 입력해주세요.\",\n      })\n    );\n  }\n\n  if (cuts.length === 0) {\n    actions.push(\n      makeAction(ep, {\n        id: \"cuts-empty\",\n        priority: PRIORITY.BLOCKER,\n        step: \"story\",\n        message: \"CUT이 하나도 없습니다. CUT을 추가해주세요.\",\n      })\n    );\n    // CUT이 없으면 이후 단계는 판정할 대상 자체가 없으므로 여기서 반환한다.\n    return actions;\n  }\n\n  // 대사는 speaker/voice/offset만 채워진 빈 행이 아니라 실제 text가 있어야 \"내용 있음\"으로\n  // 인정한다(hasStoryContent — stepDoneCut(\"story\")와 동일한 기준을 공유한다).\n  const missingStoryIdx = cuts.map((c, i) => (hasStoryContent(c) ? null : i + 1)).filter((v) => v != null);\n  if (missingStoryIdx.length) {\n    actions.push(\n      makeAction(ep, {\n        id: \"cuts-missing-narration\",\n        priority: PRIORITY.REQUIRED,\n        step: \"story\",\n        target: missingStoryIdx,\n        message: `나레이션/대사가 비어있는 CUT이 ${missingStoryIdx.length}개 있습니다 (CUT ${missingStoryIdx.join(\", \")}).`,\n      })\n    );\n  }\n\n  // 이미지 QC 상태를 CUT 하나하나 따로 판정한다(집계 메시지가 아니라 \"CUT 03 이미지를\n  // 검수해주세요\"처럼 구체적으로) — 상태마다 우선순위/문구/다음 행동이 다르기 때문이다.\n  cuts.forEach((c, i) => {\n    const n = i + 1;\n    const status = c.image?.assetId ? c.image.status : \"미생성\";\n    i
