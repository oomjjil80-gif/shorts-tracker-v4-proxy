firm = finalSummary.errorCount === 0 && requiredStepsDone && captionConfirmed;\n\n  const brokenAssetCount = (production.assets || []).filter((a) => a.broken).length;\n  const assetOkCount = (production.assets || []).length - brokenAssetCount;\n  const readiness = getRendererReadiness(production);\n  const currentRender = normalizeRenderSettings(ep.renderSettings);\n  const jsonText = serializeProduction(production);\n  const jsonLineCount = jsonText.split(\"\\n\").length;\n  const rendererCaps = detectRendererCapabilities();\n  const standardMp4Caps = await detectStandardMp4Capabilities();\n  const rendererLoad = estimateRendererLoad(production);\n  const renderQuality = normalizeRenderQuality(ep.renderQuality || \"balanced\");\n  const preflight = rendererPreflight(production, renderQuality);\n  ep.thumbnail = normalizeThumbnailState(ep.thumbnail, ep.seriesType, ep.channelKey);\n  // Alpha 34: 과거 Alpha에서 저장된 썸네일 프롬프트도 현재 채널/고대비 색상 규칙으로 즉시 재계산.\n  ep.thumbnail.prompt = buildThumbnailPrompt(ep);\n  ensureUploadPack(ep);\n  const thumbnailAsset = ep.thumbnail.assetId ? await getAsset(ep.thumbnail.assetId) : null;\n  const thumbnailUrl = thumbnailAsset?.blob ? await getAssetObjectUrl(ep.thumbnail.assetId) : null;\n  const thumbnailConcept = ep.thumbnail.conceptId === \"auto\" ? `자동 추천 → ${conceptLabel(ep.thumbnail.resolvedConceptId)}` : conceptLabel(ep.thumbnail.conceptId);\n  const thumbHeadlineOptions = thumbnailHeadlineCandidates(ep);\n  const uploadTitles = splitTitleCandidates(ep.metaTitleCandidates);\n  const selectedUploadTitle = ep.metaSelectedTitle || uploadTitles[0] || ep.title || ep.subject || \"\";\n\n  root.innerHTML = `\n    <div class=\"card\" id=\"ce-status-card\">\n      <h3>영상 만들기</h3>\n      <p class=\"hint\">최종 QC — ERROR ${finalSummary.errorCount} · WARNING ${finalSummary.warningCount} · INFO ${finalSummary.infoCount}</p>\n      <p class=\"hint\">전체 길이 ${production.totalDuration.toFixed(2)}초 · CUT ${production.cuts.length}개 · Asset ${assetOkCount}/${production.assets.length} 정상</p>\n      ${\n        finalSummary.errorCount > 0\n          ? `<p class=\"hint\" style=\"font-weight:700;\">⚠ 해결해야 할 ERROR ${finalSummary.errorCount}건이 있어 아직 영상을 만들 수 없어요.</p>`\n          : !requiredStepsDone\n          ? `<p class=\"hint\" style=\"font-weight:700;\">⚠ \"${escapeHtml(incompleteSteps[0]?.label || \"이전\")}\" 단계를 먼저 완료해주세요.</p>`\n          : !captionConfirmed\n          ? `<p class=\"hint\" style=\"font-weight:700;\">⚠ 자막 변경사항이 아직 최종 확정되지 않았습니다. ⑤ 미리보기/QC의 자막 스타일에서 확정해주세요.</p>`\n          : `<p class=\"hint\">✅ 제작 준비 완료 · 아래 버튼으로 바로 표준 MP4를 만들 수 있어요.</p>`\n      }\n    </div>\n\n    ${ep.channelKey === \"economy_current\" && ep.contentFormat === \"shorts\" ? `<div class=\"card\" style=\"border-color:rgba(91,126,255,.55);\"><h3>📰 NEWS INFO CARD 적용</h3><p class=\"hint\">경제·시사·정치 Shorts는 배경 이미지 위에 <b>대제목 → 소주제 → 핵심 수치/정보</b>를 크게 표시하고, 나레이션 자막은 하단에 분리합니다. 소리 없이 봐도 핵심이 이해되는 정보 전달형 포맷입니다.</p></div>` : \"\"}\n\n    <div class=\"card\" id=\"ce-thumbnail-card\">\n      <h3>썸네일 출력</h3>\n      <p class=\"hint\">선택 콘셉트: <b>${escapeHtml(thumbnailConcept)}</b> · 본편 CUT과 별도로 클릭률을 위한 전용 썸네일을 설계합니다.</p>\n      ${thumbHeadlineOptions.length ? `<div class=\"hint\" style=\"margin:8px 0;\"><b>추천 문구</b> · ${thumbHeadlineOptions.map(escapeHtml).join(\" / \")}</div>` : \"\"}\n      <div class=\"hint\" style=\"margin:8px 0;\"><b>색상 규칙</b> · 고대비 2~3색 중심. 빨강/노랑은 핵심 단어·숫자 강조, 파랑/브랜드색 + 흰색 텍스트 + 검정 외곽선을 우선합니다.</div>\n      ${ep.channelKey === \"sports\" ? `<div class=\"hint\" style=\"margin:8px 0;\"><b>스포츠 규칙</b> · 선수/결정적 장면 크게 + 기록/결과를 큰 문구로. 팀 파랑 + 빨강/노랑 기록 강조 + 흰색 보조문구를 우선하고 단순 경기 포스터형은 피합니다.</div>` : \"\"}\n      ${thumbnailUrl ? `<img src=\"${thumbnailUrl}\" alt=\"thumbnail\" style=\"display:block;width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin:10px 0;\" />` : `<div class=\"hint\" style=\"padding:18px 0;\">아직 최종 썸네일 이미지가 첨부되지 않았습니다.</div>`}\n      <div class=\"btn-row\" style=\"flex-wrap:wrap;\">\n        <button class=\"btn secondary\" id=\"ce-thumb-copy\">📋 썸네일 프롬프트 복사</button>\n        <button class=\"btn\" id=\"ce-thumb-attach\">${thumbnailUrl ? \"🖼 썸네일 교체\" : \"🖼 최종 썸네일 첨부\"}</button>\n        ${thumbnailUrl ? `<button class=\"btn secondary\" id=\"ce-thumb-download\">⬇ 썸네일 다운로드</button><button class=\"btn secondary\" id=\"ce-thumb-delete\">삭제</button>` : \"\"}\n      </div>\n      <input type=\"file\" accept=\"image/*\" id=\"ce-thumb-input\" style=\"display:none;\" />\n      <details style=\"margin-top:10px;\">\n        <summary>썸네일 제작 프롬프트 보기</summary>\n        <pre class=\"code-block\" style=\"white-space:pre-wrap;margin-top:8px;\">${escapeHtml(ep.thumbnail.prompt)}</pre>\n      </details>\n      <p class=\"hint\" style=\"margin-top:8px;\">최종 출력 세트: MP4 + 썸네일 이미지. 실제 이미지 생성은 외부 이미지 도구에서 하고, 완성본만 여기에 첨부하면 됩니다.</p>\n    </div>\n\n    <div class=\"card\" id=\"ce-upload-pack-card\">\n      <h3>유튜브 업로드 패키지</h3>\n      <p class=\"hint\">영상 완성 후 바로 업로드할 수 있도록 제목 · 설명 · 태그 · 고정댓글을 한 번에 준비합니다. 자동 초안은 언제든 직접 수정할 수 있습니다.</p>\n\n      <label>최종 제목</label>\n      <input id=\"ce-upload-title\" value=\"${attrText(selectedUploadTitle)}\" />\n      <div class=\"btn-row\" style=\"margin-top:6px;flex-wrap:wrap;\">\n        ${uploadTitles.slice(0,3).map((t,i)=>`<button type=\"button\" class=\"btn secondary\" data-upload-title-choice=\"${i}\">${i===0?\"추천\":\"대안 \"+i} · ${escapeHtml(t)}</button>`).join(\"\")}\n      </div>\n\n      <label>설명</label>\n      <textarea id=\"ce-upload-desc\" rows=\"6\">${escapeHtml(ep.metaDescription || \"\")}</textarea>\n\n      <label>태그 (쉼표 구분)</label>\n      <textarea id=\"ce-upload-tags\" rows=\"3\">${escapeHtml(ep.metaTags || \"\")}</textarea>\n\n      <label>해시태그</label>\n      <textarea id=\"ce-upload-hashtags\" rows=\"2\">${escapeHtml(ep.metaHashtags || \"\")}</textarea>\n\n      <label>고정댓글</label>\n      <textarea id=\"ce-upload-pinned\" rows=\"3\">${escapeHtml(ep.metaPinnedComment || \"\")}</textarea>\n\n      <div class=\"btn-row\" style=\"margin-top:10px;flex-wrap:wrap;\">\n        <button class=\"btn\" id=\"ce-upload-save\">업로드 정보 저장</button>\n        <button class=\"btn secondary\" id=\"ce-upload-copy-all\">📋 전체 업로드 정보 복사</button>\n        <button class=\"btn secondary\" id=\"ce-upload-regenerate\">추천안 다시 만들기</button>\n      </div>\n      <details style=\"margin-top:10px;\">\n        <summary>항목별 복사</summary>\n        <div class=\"btn-row\" style=\"margin-top:8px;flex-wrap:wrap;\">\n          <button class=\"btn secondary\" data-copy-upload=\"title\">제목 복사</button>\n          <button class=\"btn secondary\" data-copy-upload=\"description\">설명 복사</button>\n          <button class=\"btn secondary\" data-copy-upload=\"tags\">태그 복사</button>\n          <button class=\"btn secondary\" data-copy-upload=\"pinned\">고정댓글 복사</button>\n        </div>\n      </details>\n    </div>\n\n    <div class=\"card\" id=\"ce-render-card\">\n      <h3>최종 영상 출력</h3>\n      ${newsInfoCardEnabled ? `<p class=\"hint\" style=\"font-weight:800;\">📰 NEWS INFO CARD · 최종 MP4 적용 ON</p>` : \"\"}\n      <p class=\"hint\">기본 출력은 실기기에서 검증된 H.264/AAC 표준 MP4입니다.</p>\n      <button class=\"btn\" id=\"ce-v31-mp4\" style=\"width:100%;margin-top:8px;\" ${!readiness.ready || !standardMp4Caps.readyForStandardMp4 || finalSummary.errorCount || !requiredStepsDone || !captionConfirmed ? \"disabled\" : \"\"}>🎬 표준 MP4 영상 만들기</button>\n      <button class=\"btn secondary\" id=\"ce-v3-cancel\" style=\"width:100%;margin-top:8px;display:none;\">중단</button>\n      <div id=\"ce-v3-progress\" class=\"hint\" style=\"margin-top:10px;display:none;\"></div>\n      <p class=\"hint\" style=\"margin-top:10px;\">1080×1920 · ${currentRender.fps}fps · 현재 품질 ${escapeHtml(RENDER_QUALITY_PROFILES.find((q)=>q.id===renderQuality)?.label || renderQuality)}</p>\n      <p class=\"hint\" style=\"font-weight:800;\">📱 Shorts 호환 Alpha 41 · H.264 ${escapeHtml(standardMp4Caps.h264.config?.codec || \"미확인\")} · SAR 1:1(pasp) · AAC ${escapeHtml(String(standardMp4Caps.aac.config?.sampleRate || \"미확인\"))}Hz · MP4 Matrix 2.30 Unity FIX · 목표 약 2.5Mbps</p>\n      ${!standardMp4Caps.readyForStandardMp4 ? `<p class=\"hint\">이 기기에서 표준 MP4 엔진을 사용할 수 없으면 아래 고급 도구의 WebM 안전 출력을 사용할 수 있습니다.</p>` : \"\"}\n    </div>\n\n    <details class=\"card\" id=\"ce-advanced-tools\">\n      <summary style=\"font-weight:800;cursor:pointer;\">세부 출력 설정 / 고급 도구</summary>\n      <div style=\"margin-top:14px;\">\n        <h3>렌더 설정</h3>\n        <div class=\"form-grid\">\n          <label>세로 영상 해상도\n            <select id=\"ce-render-preset\">\n              ${RENDER_PRESETS.map((p) => `<option value=\"${p.id}\" ${p.width === currentRender.width && p.height === currentRender.height ? \"selected\" : \"\"}>${escapeHtml(p.label)}</option>`).join(\"\")}\n            </select>\n          </label>\n          <label>FPS\n            <select id=\"ce-render-fps\">\n              ${RENDER_FPS_OPTIONS.map((fps) => `<option value=\"${fps}\" ${fps === currentRender.fps ? \"selected\" : \"\"}>${fps} fps</option>`).join(\"\")}\n            </select>\n          </label>\n        </div>\n        <div class=\"btn-row\" style=\"margin-top:8px;\"><button class=\"btn secondary\" id=\"ce-render-save\">렌더 설정 저장</button></div>\n\n        <label style=\"margin-top:10px;\">출력 품질\n          <select id=\"ce-v3-quality\">${RENDER_QUALITY_PROFILES.map((q) => `<option value=\"${q.id}\" ${q.id === renderQuality ? \"selected\" : \"\"}>${escapeHtml(q.label)}</option>`).join(\"\")}</select>\n        </label>\n        <p class=\"hint\" id=\"ce-v3-preflight\">예상 ${(preflight.targetMbps).toFixed(1)} Mbps · 약 ${preflight.estimatedMB.toFixed(0)}MB${preflight.warnings.length ? ` · ⚠️ ${escapeHtml(preflight.warnings[0])}` : \" · 사전 점검 정상\"}</p>\n\n        <div class=\"renderer-readiness\" style=\"margin-top:10px;\">\n          ${readiness.checks.map((c) => `<p class=\"hint\">${c.ok ? \"✅\" : \"❌\"} <strong>${escapeHtml(c.label)}</strong>${c.detail ? ` — ${escapeHtml(c.detail)}` : \"\"}</p>`).join(\"\")}\n        </div>\n        <p class=\"hint\">MP4 엔진: ${standardMp4Caps.h264.supported ? \"✅ H.264\" : \"❌ H.264\"} · ${standardMp4Caps.aac.supported ? \"✅ AAC\" : \"❌ AAC\"} · ${standardMp4Caps.muxerReady ? \"✅ muxer\" : \"❌ muxer\"}</p>\n        <p class=\"hint\">렌더 부하: <strong>${rendererLoad.level === \"high\" ? \"높음\" : rendererLoad.level === \"medium\" ? \"보통\" : \"일반\"}</strong> · ${rendererLoad.megapixelsPerSecond.toFixed(1)} MP/s</p>\n\n        <div class=\"btn-row\">\n          <button class=\"btn secondary\" id=\"ce-v3-render\" ${!readiness.ready || !rendererCaps.supported || finalSummary.errorCount || !requiredStepsDone || !captionConfirmed ? \"disabled\" : \"\"}>WebM 안전 출력</button>\n        </div>\n\n        <div class=\"card\" id=\"ce-qc-card\" style=\"margin-top:14px;\">\n          <h3>Final QC 상세</h3>\n          ${renderQcGroup(\"ERROR\", QC_SEVERITY.ERROR, finalQcItems)}\n          ${renderQcGroup(\"WARNING\", QC_SEVERITY.WARNING, finalQcItems)}\n          ${renderQcGroup(\"INFO\", QC_SEVERITY.INFO, finalQcItems)}\n          ${finalQcItems.length === 0 ? `<p class=\"hint\">문제가 없습니다.</p>` : \"\"}\n        </div>\n\n        <div class=\"card\" style=\"margin-top:14px;\">\n          <h3>Production JSON</h3>\n          <p class=\"hint\">schemaVersion ${escapeHtml(production.schemaVersion)} · fingerprint ${escapeHtml(production.revision.fingerprint)} · 총 ${jsonLineCount}줄</p>\n          <details id=\"ce-json-details\">\n            <summary>JSON 미리보기</summary>\n            <div class=\"json-scroll\"><pre class=\"code-block\" id=\"ce-json-out\"></pre></div>\n          </details>\n          <div class=\"btn-row\" style=\"margin-top:8px;\">\n            <button class=\"btn secondary\" id=\"ce-copy\">복사</button>\n            <button class=\"btn secondary\" id=\"ce-dl\">production.json 다운로드</button>\n          </div>\n        </div>\n      </div>\n    </details>\n\n    <div class=\"card\">\n      <h3>제작 완료 상태</h3>\n      ${\n        alreadyConfirmed\n          ? `<p class=\"hint\">✅ 최종 확정됨(${escapeHtml(ep.status)})</p>`\n          : readyToConfirm\n          ? `<p class=\"hint\">영상 확인이 끝났다면 최종 확정할 수 있습니다.</p>`\n          : `<p class=\"hint\">필수 제작 조건을 모두 충족하면 최종 확정 버튼이 활성화됩니다.</p>`\n      }\n      <button class=\"btn secondary\" id=\"ce-confirm-btn\" style=\"width:100%;\" ${alreadyConfirmed || !readyToConfirm ? \"disabled\" : \"\"}>\n        ${alreadyConfirmed ? \"확정됨 ✓\" : \"최종 확정\"}\n      </button>\n    </div>\n  `;\n\n  root.querySelector(\"#ce-json-out\").textContent = jsonText;\n\n  const uploadField = (id) => root.querySelector(id);\n  const readUploadPackFromUi = () => ({\n    title: uploadField(\"#ce-upload-title\")?.value.trim() || \"\",\n    description: uploadField(\"#ce-upload-desc\")?.value.trim() || \"\",\n    tags: uploadField(\"#ce-upload-tags\")?.value.trim() || \"\",\n    hashtags: uploadField(\"#ce-upload-hashtags\")?.value.trim() || \"\",\n    pinned: uploadField(\"#ce-upload-pinned\")?.value.trim() || \"\",\n  });\n  const saveUploadPackFromUi = async () => {\n    const pack = readUploadPackFromUi();\n    ep.metaSelectedTitle = pack.title;\n    ep.metaDescription = pack.description;\n    ep.metaTags = pack.tags;\n    ep.metaHashtags = pack.hashtags;\n    ep.metaPinnedComment = pack.pinned;\n    await saveEpisode(ep);\n    return pack;\n  };\n  root.querySelectorAll(\"[data-upload-title-choice]\").forEach((btn) => {\n    btn.addEventListener(\"click\", () => {\n      const t = uploadTitles[Number(btn.dataset.uploadTitleChoice)] || \"\";\n      const input = uploadField(\"#ce-upload-title\");\n      if (input && t) input.value = t;\n    });\n  });\n  root.querySelector(\"#ce-upload-save\")?.addEventListener(\"click\", async () => {\n    await saveUploadPackFromUi();\n    toast(\"유튜브 업로드 정보를 저장했어요\");\n  });\n  root.querySelector(\"#ce-upload-copy-all\")?.addEventListener(\"click\", async () => {\n    const pack = await saveUploadPackFromUi();\n    await copyText(formatUploadPack(pack));\n    toast(\"제목·설명·태그·고정댓글을 한 번에 복사했어요\");\n  });\n  root.querySelectorAll(\"[data-copy-upload]\").forEach((btn) => {\n    btn.addEventListener(\"click\", async () => {\n      const pack = readUploadPackFromUi();\n      const map = { title: pack.title, description: pack.description, tags: pack.tags, pinned: pack.pinned };\n      await copyText(map[btn.dataset.copyUpload] || \"\");\n      toast(\"복사했어요\");\n    });\n  });\n  root.querySelector(\"#ce-upload-regenerate\")?.addEventListener(\"click\", async () => {\n    const fresh = buildDefaultUploadPack(ep, { force: true });\n    ep.metaTitleCandidates = fresh.titles.join(\"\\\\n\");\n    ep.metaSelectedTitle = fresh.titles[0] || ep.title || \"\";\n    ep.metaDescription = fresh.description;\n    ep.metaTags = fresh.tags;\n    ep.metaHashtags = fresh.hashtags;\n    ep.metaPinnedComment = fresh.pinned;\n    await saveEpisode(ep);\n    toast(\"현재 소재 기준으로 추천안을 다시 만들었어요\");\n    ctx.reRender();\n  });\n\n  const thumbInput = root.querySelector(\"#ce-thumb-input\");\n  root.querySelector(\"#ce-thumb-copy\")?.addEventListener(\"click\", async () => {\n    await copyText(ep.thumbnail.prompt || buildThumbnailPrompt(ep));\n    toast(\"썸네일 제작 프롬프트를 복사했어요\");\n  });\n  root.querySelector(\"#ce-thumb-attach\")?.addEventListener(\"click\", () => {\n    if (!thumbInput) return;\n    thumbInput.value = \"\";\n    thumbInput.click();\n  });\n  if (thumbInput) thumbInput.onchange = async (e) => {\n    const file = e.target.files?.[0];\n    if (!file) return;\n    if (!confirmOversizedFile(file)) return;\n    try {\n      const oldId = ep.thumbnail.assetId;\n      const asset = await putAsset({ episodeId: ep.id, kind: \"image\", role: \"youtube_thumbnail\", blob: file, originalFileName: file.name });\n      ep.thumbnail.assetId = asset.id;\n      ep.thumbnail.status = \"attached\";\n      ep.thumbnail.updatedAt = Date.now();\n      await saveEpisode(ep);\n      if (oldId) {\n        try { await deleteAssetSafely(oldId, ep.id); forgetAssetObjectUrl(oldId); } catch (_) {}\n      }\n      toast(\"최종 썸네일을 첨부했어요\");\n      ctx.reRender();\n    } catch (err) {\n      toastAssetSaveError(err);\n    }\n  };\n  root.querySelector(\"#ce-thumb-download\")?.addEventListener(\"click\", async () => {\n    const asset = ep.thumbnail.assetId ? await getAsset(ep.thumbnail.assetId) : null;\n    if (!asset?.blob) return toast(\"썸네일 파일을 찾을 수 없어요\");\n    downloadBlob(asset.blob, thumbnailFilename(ep, asset));\n    toast(\"썸네일을 다운로드했어요\");\n  });\n  root.querySelector(\"#ce-thumb-delete\")?.addEventListener(\"click\", async () => {\n    if (!ep.thumbnail.assetId) return;\n    const id = ep.thumbnail.assetId;\n    await deleteAssetSafely(id, ep.id);\n    forgetAssetObjectUrl(id);\n    ep.thumbnail.assetId = null;\n    ep.thumbnail.status = ep.thumbnail.prompt ? \"prompt_ready\" : \"planned\";\n    await saveEpisode(ep);\n    toast(\"썸네일 첨부를 삭제했어요\");\n    ctx.reRender();\n  });\n\n  const renderSaveBtn = root.querySelector(\"#ce-render-save\");\n  if (renderSaveBtn) {\n    renderSaveBtn.onclick = async () => {\n      const presetId = root.querySelector(\"#ce-render-preset\").value;\n      const preset = RENDER_PRESETS.find((p) => p.id === presetId) || RENDER_PRESETS[1];\n      const fps = Number(root.querySelector(\"#ce-render-fps\").value);\n      ep.renderSettings = normalizeRenderSettings({ width: preset.width, height: preset.height, fps });\n      ep.lastProductionGeneratedAt = null;\n      ep.lastProductionRevision = null;\n      await saveEpisode(ep);\n      toast(\"렌더 설정을 저장했어요\");\n      ctx.reRender();\n    };\n  }\n\n\n  const v3Quality = root.querySelector(\"#ce-v3-quality\");\n  if (v3Quality) {\n    v3Quality.onchange = async () => {\n      ep.renderQuality = normalizeRenderQuality(v3Quality.value);\n      await saveEpisode(ep);\n      const pf = rendererPreflight(production, ep.renderQuality);\n      const el = root.querySelector(\"#ce-v3-preflight\");\n      if (el) el.textContent = `예상 ${pf.targetMbps.toFixed(1)} Mbps · 약 ${pf.estimatedMB.toFixed(0)}MB${pf.warnings.length ? ` · ⚠️ ${pf.warnings[0]}` : \" · 사전 점검 정상\"}`;\n    };\n  }\n\n  const v3RenderBtn = root.querySelector(\"#ce-v3-render\");\n  const v3CancelBtn = root.querySelector(\"#ce-v3-cancel\");\n  if (v3RenderBtn && !v3RenderBtn.disabled) {\n    v3RenderBtn.onclick = async () => {\n      const progressEl = root.querySelector(\"#ce-v3-progress\");\n      if (activeRenderController) {\n        toast(\"이미 렌더링 중입니다\");\n        return;\n      }\n      const controller = new AbortController();\n      activeRenderController = controller;\n      v3RenderBtn.disabled = true;\n      v3RenderBtn.textContent = \"렌더링 중…\";\n      if (v3CancelBtn) {\n        v3CancelBtn.style.display = \"inline-flex\";\n        v3CancelBtn.disabled = false;\n        v3CancelBtn.onclick = () => {\n          v3CancelBtn.disabled = true;\n          v3CancelBtn.textContent = \"중단 중…\";\n          controller.abort();\n        };\n      }\n      progressEl.style.display = \"block\";\n      progressEl.textContent = \"미디어 준비 중…\";\n      try {\n        const freshManifest = await loadAssetManifest(ep);\n        const freshProduction = buildProduction(ep, freshManifest);\n        if (ep.captionStyleConfirmedSignature !== captionStyleSignature(ep)) throw new Error(\"자막 변경사항이 최종 확정되지 않았습니다.\");\n        const result = await renderProductionToVideo(freshProduction, {\n          signal: controller.signal,\n          qualityId: normalizeRenderQuality(root.querySelector(\"#ce-v3-quality\")?.value || ep.renderQuality),\n          onProgress: ({ currentTime, totalDuration, progress, stallCount }) => {\n            const remain = Math.max(0, totalDuration - currentTime);\n            progressEl.textContent = `렌더링 ${Math.round(progress * 100)}% · ${currentTime.toFixed(1)} / ${totalDuration.toFixed(1)}초 · 약 ${remain.toFixed(0)}초 남음${stallCount ? ` · 지연 ${stallCount}` : \"\"}`;\n          },\n        });\n        const diag = result.diagnostics || {};\n        progressEl.textContent = `완료 · ${(result.size / 1024 / 1024).toFixed(1)}MB · ${result.extension.toUpperCase()}${diag.targetMbps ? ` · ${diag.targetMbps.toFixed(1)} Mbps` : \"\"}${diag.stallCount ? ` · 지연 ${diag.stallCount}` : \" · 프레임 지연 없음\"}`;\n        downloadRenderedVideo(result);\n        toast(\"영상 렌더가 완료됐어요\");\n      } catch (e) {\n        if (e?.name === \"AbortError\") {\n          progressEl.textContent = \"렌더링을 중단했어요. 안전한 재렌더를 위해 렌더러를 자동 초기화합니다…\";\n          toast(\"렌더러를 자동 초기화합니다\");\n          setTimeout(() => location.reload(), 450);\n        } else if (e?.name === \"RendererSessionError\" || e?.name === \"RendererDurationError\") {\n          console.error(e);\n          progressEl.textContent = `출력 검증 실패: ${e?.message || e} · 렌더러를 자동 초기화합니다…`;\n          toast(\"출력 이상 감지 — 자동 초기화합니다\");\n          setTimeout(() => location.reload(), 800);\n        } else {\n          console.error(e);\n          progressEl.textContent = `렌더 실패: ${e?.message || e}`;\n          toast(\"렌더에 실패했어요\");\n        }\n      } finally {\n        activeRenderController = null;\n        v3RenderBtn.disabled = false;\n        v3RenderBtn.textContent = \"🎬 WebM 안전 출력\";\n        if (v3CancelBtn) {\n          v3CancelBtn.style.display = \"none\";\n          v3CancelBtn.disabled = false;\n          v3CancelBtn.textContent = \"중단\";\n          v3CancelBtn.onclick = null;\n        }\n      }\n    };\n  }\n\n\n  const mp4Btn = root.querySelector(\"#ce-v31-mp4\");\n  if (mp4Btn && !mp4Btn.disabled) {\n    mp4Btn.onclick = async () => {\n      const progressEl = root.querySelector(\"#ce-v3-progress\");\n      if (activeRenderController) { toast(\"이미 렌더링 중입니다\"); return; }\n      const controller = new AbortController(); activeRenderController = controller;\n      mp4Btn.disabled = true; if (v3RenderBtn) v3RenderBtn.disabled = true;\n      mp4Btn.textContent = \"MP4 렌더링 중…\";\n      if (v3CancelBtn) { v3CancelBtn.style.display=\"inline-flex\"; v3CancelBtn.disabled=false; v3CancelBtn.onclick=()=>controller.abort(); }\n      progressEl.style.display=\"block\"; progressEl.textContent=\"1080p 표준 MP4 엔진 준비 중…\";\n      try {\n        const freshManifest = await loadAssetManifest(ep);\n        const freshProduction = buildProduction(ep, freshManifest);\n        if (ep.captionStyleConfirmedSignature !== captionStyleSignature(ep)) throw new Error(\"자막 변경사항이 최종 확정되지 않았습니다.\");\n        const result = await renderProductionToStandardMp4(freshProduction, {\n          signal:controller.signal,\n          qualityId:normalizeRenderQuality(root.querySelector(\"#ce-v3-quality\")?.value || ep.renderQuality),\n          onProgress:({currentTime,totalDuration,progress,phase})=>{\n            const label = phase === \"audio\" ? \"오디오 인코딩\" : phase === \"mux\" ? \"MP4 패키징\" : \"H.264 인코딩\";\n            progressEl.textContent = `${label} ${Math.round(progress*100)}%${totalDuration ? ` · ${Math.min(currentTime,totalDuration).toFixed(1)} / ${totalDuration.toFixed(1)}초` : \"\"}`;\n          }\n        });\n        progressEl.textContent=`표준 MP4 완료 · ${(result.size/1024/1024).toFixed(1)}MB · H.264/AAC${result.diagnostics?.measuredDuration ? ` · ${result.diagnostics.measuredDuration.toFixed(1)}초` : \"\"}`;\n        downloadRenderedVideo(result);\n        if (ep.thumbnail?.assetId) {\n          const thumbAsset = await getAsset(ep.thumbnail.assetId);\n          if (thumbAsset?.blob) setTimeout(() => downloadBlob(thumbAsset.blob, thumbnailFilename(ep, thumbAsset)), 300);\n        }\n        toast(ep.thumbnail?.assetId ? \"표준 MP4 + 썸네일 출력 완료\" : \"표준 MP4 렌더가 완료됐어요\");\n      } catch(e) {\n        if(e?.name === \"AbortError\") { progressEl.textContent=\"표준 MP4 렌더를 중단했어요.\"; toast(\"렌더를 중단했어요\"); }\n        else { console.error(e); progressEl.textContent=`표준 MP4 실패: ${e?.message || e}`; toast(\"표준 MP4 렌더에 실패했어요\"); }\n      } finally {\n        activeRenderController=null; mp4Btn.disabled=false; mp4Btn.textContent=\"🎬 표준 MP4 렌더\";\n        if(v3RenderBtn) v3RenderBtn.disabled=false;\n        if(v3CancelBtn){v3CancelBtn.style.display=\"none\";v3CancelBtn.disabled=false;v3CancelBtn.textContent=\"중단\";v3CancelBtn.onclick=null;}\n      }\n    };\n  }\n\n  root.querySelectorAll(\"#ce-qc-card [data-qc-jump]\").forEach((btn) => {\n    btn.onclick = () => {\n      const step = btn.dataset.qcJump;\n      if (step) location.hash = `#/episode/${ep.id}/${step}`;\n    };\n  });\n\n  root.querySelector(\"#ce-copy\").onclick = () => copyText(jsonText);\n\n  root.querySelector(\"#ce-dl\").onclick = async () => {\n    downloadText(productionFilename(ep), jsonText);\n    ep.lastProductionGeneratedAt = Date.now();\n    ep.lastProductionRevision = production.revision.fingerprint;\n    // 주의: 여기서는 ctx.save()를 쓰지 않는다 — episode.js의 ctx.save()는 \"현재 보고 있는 STEP의\n    // statusByStep 값으로 상태를 자동 승격\"하는 범용 로직을 갖고 있는데, cutExport STEP의\n    // statusByStep 값이 하필 \"확정\"이다. 그 로직을 그대로 쓰면 사용자가 [최종 확정]을 누르지\n    // 않고 단순히 다운로드만 해도(메타데이터 저장 한 번으로) episode가 조용히 \"확정\" 상태로\n    // 넘어가버린다 — 조건 13번(\"확정은 ERROR 0일 때만\" = 명시적 확정 행동이어야 함)에 어긋난다.\n    // 그래서 이 화면의 저장은 항상 saveEpisode()를 직접 호출해 상태 자동승격을 우회하고,\n    // status 필드는 [최종 확정] 버튼에서만 명시적으로 바꾼다.\n    await saveEpisode(ep);\n    toast(\"다운로드했어요\");\n  };\n\n  const confirmBtn = root.querySelector(\"#ce-confirm-btn\");\n  if (confirmBtn && !alreadyConfirmed && readyToConfirm) {\n    confirmBtn.onclick = async () => {\n      // 같은 이유로 여기도 saveEpisode()를 직접 호출한다 — status=\"확정\"은 이 버튼에서만\n      // 명시적으로 설정하는 것이 맞고, ctx.save()의 범용 자동승격 로직에 기대지 않는다.\n      ep.status = \"확정\";\n      ep.lastProductionGeneratedAt = Date.now();\n      ep.lastProductionRevision = production.revision.fingerprint;\n      await saveEpisode(ep);\n      toast(\"최종 확정했어요\");\n      ctx.reRender();\n    };\n  }\n}\n\n\nfunction attrText(value) {\n  return String(value ?? \"\").replace(/&/g, \"&amp;\").replace(/\"/g, \"&quot;\").replace(/</g, \"&lt;\");\n}\n\nfunction splitTitleCandidates(raw) {\n  return String(raw || \"\")\n    .split(/\\n+/)\n    .map((s) => s.replace(/^\\s*(?:\\d+[.)]\\s*|[-•]\\s*)/, \"\").trim())\n    .filter(Boolean);\n}\n\nfunction uniqueTokens(values) {\n  const seen = new Set();\n  const out = [];\n  for (const raw of values) {\n    const v = String(raw || \"\").trim();\n    const key = v.toLowerCase();\n    if (!v || seen.has(key)) continue;\n    seen.add(key);\n    out.push(v);\n  }\n  return out;\n}\n\nfunction titleCore(ep) {\n  return String(ep.title || ep.subject || \"\").replace(/\\s+/g, \" \").trim();\n}\n\nfunction buildSportsTitles(ep) {\n  const base = titleCore(ep);\n  const text = `${base} ${ep.aiStoryMeta?.hook || \"\"}`;\n  const team = /삼성/.test(text) ? \"삼성\" : (text.match(/([가-힣A-Za-z]+)\\s*\\d+연승/)?.[1] || \"\");\n  const streak = text.match(/(\\d+연승)/)?.[1] || \"\";\n  const innings = text.match(/(\\d+이닝\\s*(?:무실점|무자책))/)?.[1] || \"\";\n  const player = /오스틴\\s*보스|보스/.test(text) ? \"보스\" : \"\";\n  const titles = [];\n  if (team && streak && player && innings) titles.push(`${team} ${streak}! ${player} ${innings}으로 선두 지켰다`);\n  if (team && streak && player) titles.push(`${team} ${streak} 질주…${player}가 막았다`);\n  if (player && innings) titles.push(`${player} ${innings}, ${team || \"팀\"} 상승세 이어갔다`);\n  if (base) titles.push(base);\n  return uniqueTokens(titles).slice(0, 3);\n}\n\nfunction genericTitles(ep) {\n  const base = titleCore(ep);\n  const hook = String(ep.aiStoryMeta?.hook || \"\").replace(/\\s+/g, \" \").trim();\n  const subject = String(ep.subject || \"\").replace(/\\s+/g, \" \").trim();\n  return uniqueTokens([base, hook, subject]).filter(Boolean).slice(0, 3);\n}\n\nfunction keywordTokens(ep) {\n  const fromKeywords = String(ep.sourceKeywords || \"\")\n    .split(/[,#|/·\\n]+/)\n    .map((s) => s.trim())\n    .filter(Boolean);\n  const title = titleCore(ep)\n    .replace(/[^\\w가-힣]+/g, \" \")\n    .split(/\\s+/)\n    .filter((s) => s.length >= 2 && !/^(으로|에서|에게|그리고|이번|해당|대한)$/.test(s));\n  return uniqueTokens([...fromKeywords, ...title]).slice(0, 10);\n}\n\nfunction buildDefaultUploadPack(ep, { force = false } = {}) {\n  const sports = ep.channelKey === \"sports\";\n  const titles = sports ? buildSportsTitles(ep) : genericTitles(ep);\n  const summary = String(ep.aiStoryMeta?.summary || ep.summary || ep.metaDescription || \"\").trim();\n  const hook = String(ep.aiStoryMeta?.hook || \"\").trim();\n  const subject = titleCore(ep);\n  const sourceNames = uniqueTokens([ep.sourceName, ...(ep.sources || [])]).slice(0, 3);\n  const keywords = keywordTokens(ep);\n  const baseTags = sports\n    ? [\"KBO\", \"프로야구\", \"야구\", \"야구쇼츠\", \"스포츠쇼츠\"]\n    : ep.channelKey === \"economy_current\"\n      ? [\"경제\", \"시사\", \"뉴스\", \"Shorts\"]\n      : [\"오늘의이슈\", \"Shorts\"];\n  const tags = uniqueTokens([...keywords, ...baseTags]).join(\", \");\n  const hashtags = uniqueTokens([\n    ...(sports ? [\"KBO\", \"프로야구\"] : []),\n    ...keywords.slice(0, 4),\n    \"Shorts\",\n  ]).slice(0, 7).map((x) => `#${x.replace(/\\s+/g, \"\")}`).join(\" \");\n  const descriptionBody = summary || hook || subject;\n  const sourceLine = sourceNames.length ? `\\n\\n출처: ${sourceNames.join(\" · \")}` : \"\";\n  const description = `${descriptionBody}${sourceLine}\\n\\n${hashtags}`.trim();\n  let pinned;\n  if (sports) {\n    const team = /삼성/.test(subject) ? \"삼성\" : \"이 팀\";\n    pinned = `${team}의 상승세, 어디까지 이어질 것 같나요? ⚾\\n이번 경기에서 가장 인상적이었던 장면도 댓글로 남겨주세요!`;\n  } else {\n    pinned = \"여러분은 이 소식 어떻게 보셨나요?\\n가장 인상적이었던 부분을 댓글로 남겨주세요.\";\n  }\n  return { titles, description, tags, hashtags, pinned };\n}\n\nfunction ensureUploadPack(ep) {\n  const defaults = buildDefaultUploadPack(ep);\n  if (!splitTitleCandidates(ep.metaTitleCandidates).length) ep.metaTitleCandidates = defaults.titles.join(\"\\n\");\n  if (!ep.metaSelectedTitle) ep.metaSelectedTitle = defaults.titles[0] || ep.title || ep.subject || \"\";\n  if (!ep.metaDescription) ep.metaDescription = defaults.description;\n  if (!ep.metaTags) ep.metaTags = defaults.tags;\n  if (!ep.metaHashtags) ep.metaHashtags = defaults.hashtags;\n  if (!ep.metaPinnedComment) ep.metaPinnedComment = defaults.pinned;\n}\n\nfunction formatUploadPack(pack) {\n  return [\n    \"[제목]\",\n    pack.title || \"\",\n    \"\",\n    \"[설명]\",\n    pack.description || \"\",\n    \"\",\n    \"[태그]\",\n    pack.tags || \"\",\n    \"\",\n    \"[고정댓글]\",\n    pack.pinned || \"\",\n  ].join(\"\\n\");\n}\n\nfunction safeFilePart(value) {\n  return String(value || \"episode\").trim().replace(/[\\\\/:*?\"<>|]+/g, \"_\").replace(/\\s+/g, \"_\").slice(0, 70) || \"episode\";\n}\n\nfunction thumbnailFilename(ep, asset) {\n  const mime = asset?.mimeType || asset?.blob?.type || \"image/png\";\n  const ext = mime.includes(\"jpeg\") ? \"jpg\" : mime.includes(\"webp\") ? \"webp\" : \"png\";\n  return `${safeFilePart(ep.title || ep.subject || ep.id)}_thumbnail.${ext}`;\n}\n\nfunction downloadBlob(blob, filename) {\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement(\"a\");\n  a.href = url;\n  a.download = filename;\n  document.body.appendChild(a);\n  a.click();\n  a.remove();\n  setTimeout(() => URL.revokeObjectURL(url), 1500);\n}\n\nfunction renderQcGroup(label, severity, items) {\n  const list = items.filter((i) => i.severity === severity);\n  if (!list.length) return \"\";\n  return `<div class=\"qc-group\" data-qc-group=\"${severity}\">\n    <p class=\"hint\" style=\"font-weight:700;margin-top:10px;\">${label} ${list.length}</p>\n    ${list\n      .map((i) =>\n        i.stepHint\n          ? `<button type=\"button\" class=\"qc-item qc-${severity}\" data-qc-jump=\"${escapeHtml(i.stepHint)}\">${escapeHtml(i.message)}</button>`\n          : `<p class=\"qc-item qc-${severity}\">${escapeHtml(i.message)}</p>`\n      )\n      .join(\"\")}\n  </div>`;\n}\n","js_v420a12/views/episode.js":"import { getEpisode, saveEpisode, deleteEpisode, getEpisodeStorageUsage } from \"../db.js\";\nimport { stepsFor, statusByStepFor } from \"../model.js\";\nimport { isStepDone, getPrimaryNextAction, getProgress, getBlockers } from \"../nextActions.js\";\nimport { el, fmtBytes, escapeHtml, toast } from \"../util.js\";\nimport { render as renderPlan } from \"./planStep.js\";\nimport { render as renderScenes } from \"./scenesStep.js\";\nimport { render as renderDuration } from \"./durationStep.js\";\nimport { render as renderImages } from \"./imagesStep.js\";\nimport { render as renderNarration } from \"./narrationStep.js\";\nimport { render as renderExport } from \"./exportStep.js\";\nimport { render as renderStory } from \"./storyStep.js\";\nimport { render as renderCutImages } from \"./cutImagesStep.js\";\nimport { render as renderCutAudio } from \"./cutAudioStep.js\";\nimport { render as renderCutTimeline } from \"./cutTimelineStep.js\";\nimport { render as renderPreview } from \"./previewStep.js\";\nimport { render as renderCutExport } from \"./cutExportStep.js\";\n\n// v4.1.0 Alpha 12 — episode write queue.\n// 모바일에서 입력 직후 STEP 이동/브라우저 뒤로가기처럼 저장과 라우팅이 거의 동시에 일어나도\n// 같은 episode의 IndexedDB write가 역순으로 완료되어 최신 값을 덮어쓰지 않도록 직렬화한다.\nconst episodeWriteChains = new Map();\n\nfunction queueEpisodeWrite(ep) {\n  const id = ep?.id;\n  if (!id) return saveEpisode(ep);\n  const prev = episodeWriteChains.get(id) || Promise.resolve();\n  const next = prev.catch(() => {}).then(() => saveEpisode(ep));\n  episodeWriteChains.set(id, next);\n  next.finally(() => {\n    if (episodeWriteChains.get(id) === next) episodeWriteChains.delete(id);\n  });\n  return next;\n}\n\nexport async function waitForEpisodeWrites() {\n  const pending = [...episodeWriteChains.values()];\n  if (pending.length) await Promise.allSettled(pending);\n}\n\nfunction setSaveIndicator(root, state) {\n  const node = root.querySelector(\"#episode-save-state\");\n  if (!node) return;\n  node.dataset.state = state;\n  node.textContent = state === \"saving\" ? \"저장 중…\" : state === \"error\" ? \"저장 확인 필요\" : \"저장됨\";\n}\n\n// 레거시 text_card STEP 렌더러 — 기존 파일을 그대로 사용한다(코드 미변경).\nconst STEP_RENDERERS_TEXT_CARD = {\n  plan: renderPlan,\n  scenes: renderScenes,\n  duration: renderDuration,\n  images: renderImages,\n  narration: renderNarration,\n  export: renderExport,\n};\n\n// CUT STEP 렌더러 — plan은 text_card와 공유, 나머지는 Phase 2~6에서 순서대로 실제 화면이\n// 채워졌다(Phase 6로 마지막 cutExport까지 완료 — 더 이상 placeholder가 없다).\nconst STEP_RENDERERS_CUT = {\n  plan: renderPlan,\n  story: renderStory,\n  cutImages: renderCutImages,\n  cutAudio: renderCutAudio,\n  timeline: renderCutTimeline,\n  preview: renderPreview,\n  cutExport: renderCutExport,\n};\n\nfunction isEpisodeRouteCurrent(epId) {\n  const hash = location.hash.replace(/^#\\/?/, \"\");\n  const parts = hash.split(\"/\").filter(Boolean);\n  return parts[0] === \"episode\" && parts[1] === String(epId);\n}\n\nconst EPISODE_SCROLL_PREFIX = \"shortsTracker.episodeScroll.v1:\";\nlet activeEpisodeScrollKey = null;\nlet pendingSwipeEntryDirection = null;\n\nfunction episodeScrollKey(epId, step) {\n  return `${EPISODE_SCROLL_PREFIX}${epId}:${step || \"plan\"}`;\n}\n\nfunction saveEpisodeScroll(epId, step) {\n  try {\n    sessionStorage.setItem(episodeScrollKey(epId, step), String(Math.max(0, Math.round(window.scrollY || 0))));\n  } catch (_) {}\n}\n\nfunction restoreEpisodeScroll(epId, step) {\n  let y = 0;\n  try {\n    const raw = sessionStorage.getItem(episodeScrollKey(epId, step));\n    const n = Number(raw);\n    if (raw != null && Number.isFinite(n) && n >= 0) y = n;\n  } catch (_) {}\n  requestAnimationFrame(() => requestAnimationFrame(() => window.scrollTo(0, y)));\n}\n\n// 페이지가 백그라운드/종료되기 직전에도 마지막 Episode 위치를 가볍게 보존한다.\n// 이 listener는 Episode 모듈 내부 상태만 읽으며 앱 초기 route/render에는 관여하지 않는다.\nwindow.addEventListener(\"pagehide\", () => {\n  if (!activeEpisodeScrollKey) return;\n  try { sessionStorage.setItem(activeEpisodeScrollKey, String(Math.max(0, Math.round(window.scrollY || 0)))); } catch (_) {}\n});\n\n\nfunction adjacentSteps(steps, step) {\n  const index = steps.findIndex((s) => s.key === step);\n  return {\n    index,\n    prev: index > 0 ? steps[index - 1] : null,\n    current: index >= 0 ? s  : STEPS[0].key);\n  activeEpisodeScrollKey = episodeScrollKey(ep.id, step);\n\n  // 주소 자체도 정규화한다. legacy export 또는 존재하지 않는 STEP을 받았을 때 화면만 바꾸고\n  // 잘못된 hash를 남기지 않는다. 잘못된 STEP은 현재 제작 status에 가장 가까운 유효 STEP으로\n  // 복구하여 ① 기획으로 무조건 튕기는 동작을 방지한다.\n  if (params.step && params.step !== step) {\n    history.replaceState(null, \"\", `#/episode/${ep.id}/${step}`);\n  }\n\n  // NextActionEngine이 단일 소스 — 이 화면은 진행률/블로커를 직접 계산하지 않는다.\n  const progress = getProgress(ep);\n  const primary = getPrimaryNextAction(ep);\n  const blockers = getBlockers(ep);\n  const usageBytes = await getEpisodeStorageUsage(ep.id);\n  if (!isEpisodeRouteCurrent(ep.id)) return;\n\n  root.innerHTML = `\n    <div class=\"topbar\">\n      <span class=\"back\" id=\"back-btn\">← 목록</span>\n      <h1>${ep.title ? escapeHtml(ep.title) : \"새 에피소드\"}</h1>\n      <span class=\"episode-save-state\" id=\"episode-save-state\" data-state=\"saved\">저장됨</span>\n      <span class=\"back\" id=\"del-btn\" style=\"color:var(--danger)\">삭제</span>\n    </div>\n\n    <div class=\"card\" id=\"next-action-card\">\n      <h3>다음 할 일</h3>\n      ${\n        primary\n          ? `<p style=\"margin:0 0 6px;\"><span class=\"pill-inline ${primary.priority}\">${priorityLabel(primary.priority)}</span> ${escapeHtml(primary.message)}</p>`\n          : `<p class=\"hint\">지금 당장 처리할 일이 없어요 — 잘 진행되고 있습니다.</p>`\n      }\n      <p class=\"hint episode-progress-hint\">전체 진행률 ${progress.percent}% (${progress.doneCount}/${progress.totalCount} 단계) · 저장 용량 ${fmtBytes(usageBytes)}</p>\n      ${\n        blockers.length\n          ? `<p class=\"hint\" style=\"color:var(--danger);\">BLOCKER: ${blockers.map((b) => escapeHtml(b.message)).join(\" / \")}</p>`\n          : \"\"\n      }\n      ${primary?.action?.href ? `<button class=\"btn small next-action-jump\" data-href=\"${escapeHtml(primary.action.href)}\">${escapeHtml(primary.action.label || \"다음 단계로 이동\")} →</button>` : \"\"}\n    </div>\n\n    <div class=\"episode-workspace\">\n      <div class=\"steps-scroll\" id=\"steps-scroll\"></div>\n      <div id=\"step-body\"></div>\n    </div>\n    <div class=\"mobile-episode-toolbar\" id=\"mobile-episode-toolbar\" aria-label=\"모바일 단계 빠른 이동\">\n      ${renderMobileProductionToolbar(STEPS, step)}\n    </div>\n  `;\n  root.querySelector(\"#back-btn\").onclick = () => {\n    saveEpisodeScroll(ep.id, step);\n    location.hash = \"#/\";\n  };\n  root.querySelector(\"#del-btn\").onclick = async () => {\n    // Phase 7: 삭제 전에 제목/구성요소 개수/예상 삭제 용량을 보여준다 — \"몇 개가 사라지는지\"를\n    // 모른 채 삭제 확인창을 누르는 일이 없도록 한다(조건 17번).\n    const unitLabel = isCut ? \"CUT\" : \"씬\";\n    const unitCount = isCut ? (ep.cuts || []).length : (ep.scenes || []).length;\n    const proceed = confirm(\n      `\"${ep.title || \"(제목 없음)\"}\"\\n${unitLabel} ${unitCount}개 · 예상 삭제 용량 ${fmtBytes(usageBytes)}\\n\\n` +\n        \"이 에피소드를 삭제할까요? 되돌릴 수 없어요.\"\n    );\n    if (proceed) {\n      await deleteEpisode(ep.id);\n      toast(\"삭제했어요\");\n      location.hash = \"#/\";\n    }\n  };\n\n  const nextJump = root.querySelector(\"#next-action-card .next-action-jump\");\n  if (nextJump) nextJump.onclick = () => {\n    saveEpisodeScroll(ep.id, step);\n    location.hash = nextJump.dataset.href;\n  };\n  bindMobileEpisodeToolbar(root, ep, STEPS, step);\n  bindEpisodeStageSwipe(root, ep, STEPS, step);\n\n  const stepsScroll = root.querySelector(\"#steps-scroll\");\n  STEPS.forEach((s) => {\n    const chip = el(\n      `<div class=\"step-chip ${s.key === step ? \"active\" : \"\"} ${isStepDone(ep, s.key) ? \"done\" : \"\"}\">${s.label}</div>`\n    );\n    chip.dataset.stepKey = s.key; // rc.4(FINAL Galaxy Smoke UI Refresh Fix) — refreshShell()이 재생성 없이 done 상태만 갱신할 때 필요\n    chip.onclick = () => {\n      if (s.key === step) {\n        window.scrollTo({ top: 0, behavior: \"smooth\" });\n        return;\n      }\n      saveEpisodeScroll(ep.id, step);\n      location.hash = `#/episode/${ep.id}/${s.key}`;\n    };\n    stepsScroll.appendChild(chip);\n  });\n  const activeChip = stepsScroll.querySelector(\".step-chip.active\");\n  if (activeChip) activeChip.scrollIntoView({ inline: \"center\", block: \"nearest\" });\n\n  const body = root.querySelector(\"#step-body\");\n  await RENDERERS[step](body, ep, {\n    save: async (patch) => {\n      Object.assign(ep, patch);\n      const statusByStep = statusByStepFor(ep.formatType);\n      const autoStatus = statusByStep[step];\n      if (\n        autoStatus &&\n        STEPS.findIndex((s) => s.key === step) >= STEPS.findIndex((s) => s.key === statusStepKey(ep.status, statusByStep))\n      ) {\n        ep.status = autoStatus;\n      }\n      setSaveIndicator(root, \"saving\");\n      try {\n        await queueEpisodeWrite(ep);\n        setSaveIndicator(root, \"saved\");\n      } catch (err) {\n        setSaveIndicator(root, \"error\");\n        throw err;\n      }\n    },\n    reRender: async () => {\n      if (!isEpisodeRouteCurrent(ep.id)) return;\n      await render(root, params);\n    },\n    // rc.4(FINAL Galaxy Smoke UI Refresh Fix) — Master Narration CUT 마커 기록처럼 재생 중인\n    // <audio>를 끊으면 안 되는 저장 직후에도, 상단 \"다음 할 일/BLOCKER/진행률/STEP 완료\" 카드를\n    // 같은 저장 상태 기준으로 즉시 갱신하기 위한 경량 갱신. reRender()(episode 재조회 + 현재\n    // STEP 화면 전체 재마운트)와 달리 step-body는 건드리지 않는다 — 재생 위치/포커스가 유지된다.\n    // 계산 로직은 새로 만들지 않고 render()가 쓰는 것과 동일한 getPrimaryNextAction/getBlockers/\n    // getProgress/isStepDone을 그대로 재사용한다(단일 소스 유지).\n    refreshShell: () => refreshShell(root, ep),\n  });\n\n  animateSwipeEntry(root);\n\n  // Alpha 22: 전역 app 부팅 경로를 건드리지 않고 현재 Episode STEP 렌더 완료 후에만 복구.\n  if (isEpisodeRouteCurrent(ep.id)) restoreEpisodeScroll(ep.id, step);\n}\n\nasync function refreshShell(root, ep) {\n  const progress = getProgress(ep);\n  const primary = getPrimaryNextAction(ep);\n  const blockers = getBlockers(ep);\n  const usageBytes = await getEpisodeStorageUsage(ep.id);\n\n  const card = root.querySelector(\"#next-action-card\");\n  if (card) {\n    card.innerHTML = `\n      <h3>다음 할 일</h3>\n      ${\n        primary\n          ? `<p style=\"margin:0 0 6px;\"><span class=\"pill-inline ${primary.priority}\">${priorityLabel(primary.priority)}</span> ${escapeHtml(primary.message)}</p>`\n          : `<p class=\"hint\">지금 당장 처리할 일이 없어요 — 잘 진행되고 있습니다.</p>`\n      }\n      <p class=\"hint episode-progress-hint\">전체 진행률 ${progress.percent}% (${progress.doneCount}/${progress.totalCount} 단계) · 저장 용량 ${fmtBytes(usageBytes)}</p>\n      ${\n        blockers.length\n          ? `<p class=\"hint\" style=\"color:var(--danger);\">BLOCKER: ${blockers.map((b) => escapeHtml(b.message)).join(\" / \")}</p>`\n          : \"\"\n      }\n      ${primary?.action?.href ? `<button class=\"btn small next-action-jump\" data-href=\"${escapeHtml(primary.action.href)}\">${escapeHtml(primary.action.label || \"다음 단계로 이동\")} →</button>` : \"\"}\n    `;\n    const nextJump = card.querySelector(\".next-action-jump\");\n    if (nextJump) nextJump.onclick = () => {\n      const parts = location.hash.replace(/^#\\/?/, \"\").split(\"/\").filter(Boolean);\n      saveEpisodeScroll(ep.id, parts[2] || \"plan\");\n      location.hash = nextJump.dataset.href;\n    };\n  }\n\n  const toolbar = root.querySelector(\"#mobile-episode-toolbar\");\n  if (toolbar) {\n    const parts = location.hash.replace(/^#\\/?/, \"\").split(\"/\").filter(Boolean);\n    const currentStep = parts[2] || stepsFor(ep.formatType)[0]?.key || \"plan\";\n    const steps = stepsFor(ep.formatType);\n    toolbar.innerHTML = renderMobileProductionToolbar(steps, currentStep);\n    bindMobileEpisodeToolbar(root, ep, steps, currentStep);\n  }\n\n  root.querySelectorAll(\"#steps-scroll .step-chip\").forEach((chip) => {\n    const key = chip.dataset.stepKey;\n    if (!key) return;\n    chip.classList.toggle(\"done\", isStepDone(ep, key));\n  });\n}\n\nfunction bindMobileEpisodeToolbar(root, ep, steps, step) {\n  const topBtn = root.querySelector(\"#mobile-to-top\");\n  if (topBtn) topBtn.onclick = () => window.scrollTo({ top: 0, behavior: \"smooth\" });\n\n  const go = async (targetStep) => {\n    if (!targetStep || targetStep === step) return;\n    saveEpisodeScroll(ep.id, step);\n    // Alpha 2: 입력 직후 하단 이전/다음 버튼을 눌러도 최신 write가 먼저 끝난 뒤 이동한다.\n    await waitForEpisodeWrites();\n    if (!isEpisodeRouteCurrent(ep.id)) return;\n    location.hash = `#/episode/${ep.id}/${targetStep}`;\n  };\n\n  const prevBtn = root.querySelector(\".mobile-step-prev[data-step]\");\n  if (prevBtn) prevBtn.onclick = () => go(prevBtn.dataset.step);\n\n  const nextBtn = root.querySelector(\".mobile-step-next[data-step]\");\n  if (nextBtn) nextBtn.onclick = () => go(nextBtn.dataset.step);\n}\n\n// Alpha 14 — 터치 기기 전용 STEP 스와이프 이동.\n// 손가락을 왼쪽으로 밀면 다음 STEP, 오른쪽으로 밀면 이전 STEP으로 이동한다.\n// 입력/버튼/오디오/타임라인 등 조작 영역에서 시작한 제스처는 무시하고,\n// 수평 이동이 충분히 크고 수직 스크롤보다 명확할 때만 작동한다.\n// UI profile로 제한하지 않는다 — Galaxy Tab Ultra 가로모드는 Workstation UI지만 터치 기기다.\nfunction bindEpisodeStageSwipe(root, ep, steps, step) {\n  const workspace = root.querySelector(\".episode-workspace\");\n  if (!workspace) return;\n\n  let start = null;\n  const blockedSelector = [\n    \"input\", \"textarea\", \"select\", \"button\", \"a\", \"audio\", \"video\", \"canvas\",\n    \"[contenteditable='true']\", \"[draggable='true']\", \"[data-swipe-lock]\",\n    \".steps-scroll\", \".mobile-episode-toolbar\", \".timeline-track\", \".timeline-ruler\",\n    \".waveform\", \".scrubber\", \".range-row\", \".drag-handle\"\n  ].join(\",\");\n\n  workspace.addEventListener(\"touchstart\", (event) => {\n    start = null;\n    if (event.touches.length !== 1) return;\n    if (event.target.closest?.(blockedSelector)) return;\n    const touch = event.touches[0];\n    // OS/브라우저의 가장자리 뒤로가기 제스처와 충돌하지 않는다.\n    if (touch.clientX < 28 || touch.clientX > window.innerWidth - 28) return;\n    start = { x: touch.clientX, y: touch.clientY, at: Date.now() };\n  }, { passive: true });\n\n  workspace.addEventListener(\"touchmove\", (event) => {\n    if (!start || event.touches.length !== 1) return;\n    const touch = event.touches[0];\n    const dx = touch.clientX - start.x;\n    const dy = touch.clientY - start.y;\n    if (Math.abs(dx) < 8 || Math.abs(dx) < Math.abs(dy) * 1.15) return;\n    if (event.cancelable) event.preventDefault();\n    const resisted = Math.max(-96, Math.min(96, dx * 0.38));\n    workspace.style.transition = \"none\";\n    workspace.style.transform = `translate3d(${resisted}px,0,0)`;\n    workspace.style.opacity = String(Math.max(0.82, 1 - Math.abs(resisted) / 520));\n  }, { passive: false });\n\n  workspace.addEventListener(\"touchend\", async (event) => {\n    if (!start || event.changedTouches.length !== 1) { start = null; resetSwipePosition(workspace); return; }\n    const touch = event.changedTouches[0];\n    const dx = touch.clientX - start.x;\n    const dy = touch.clientY - start.y;\n    const elapsed = Date.now() - start.at;\n    start = null;\n    if (elapsed > 900 || Math.abs(dx) < 64 || Math.abs(dx) < Math.abs(dy) * 1.35) {\n      resetSwipePosition(workspace);\n      return;\n    }\n\n    const nav = adjacentSteps(steps, step);\n    const target = dx < 0 ? nav.next : nav.prev;\n    if (!target) { resetSwipePosition(workspace); return; }\n    saveEpisodeScroll(ep.id, step);\n    await waitForEpisodeWrites();\n    if (!isEpisodeRouteCurrent(ep.id)) { resetSwipePosition(workspace); return; }\n    pendingSwipeEntryDirection = dx < 0 ? \"next\" : \"prev\";\n    await animateSwipeExit(workspace, pendingSwipeEntryDirection);\n    location.hash = `#/episode/${ep.id}/${target.key}`;\n  }, { passive: true });\n\n  workspace.addEventListener(\"touchcancel\", () => { start = null; resetSwipePosition(workspace); }, { passive: true });\n}\n\nfunction resetSwipePosition(workspace) {\n  if (!workspace) return;\n  workspace.style.transition = \"transform 170ms cubic-bezier(.22,.72,.24,1), opacity 170ms ease\";\n  workspace.style.transform = \"translate3d(0,0,0)\";\n  workspace.style.opacity = \"1\";\n  setTimeout(() => { if (workspace.isConnected) workspace.style.transition = \"\"; }, 190);\n}\n\nfunction animateSwipeExit(workspace, direction) {\n  if (!workspace) return Promise.resolve();\n  return new Promise((resolve) => {\n    workspace.style.transition = \"transform 150ms cubic-bezier(.4,0,1,1), opacity 150ms ease\";\n    workspace.style.transform = `translate3d(${direction === \"next\" ? -window.innerWidth : window.innerWidth}px,0,0)`;\n    workspace.style.opacity = \"0.68\";\n    setTimeout(resolve, 155);\n  });\n}\n\nfunction animateSwipeEntry(root) {\n  const direction = pendingSwipeEntryDirection;\n  if (!direction) return;\n  pendingSwipeEntryDirection = null;\n  const workspace = root.querySelector(\".episode-workspace\");\n  if (!workspace || typeof workspace.animate !== \"function\") return;\n  const fromX = direction === \"next\" ? 44 : -44;\n  workspace.animate(\n    [\n      { transform: `translate3d(${fromX}px,0,0)`, opacity: 0.72 },\n      { transform: \"translate3d(0,0,0)\", opacity: 1 },\n    ],\n    { duration: 210, easing: \"cubic-bezier(.18,.72,.24,1)\", fill: \"none\" }\n  );\n}\n\nfunction statusStepKey(status, statusByStep) {\n  const entry = Object.entries(statusByStep).find(([, v]) => v === status);\n  return entry ? entry[0] : \"plan\";\n}\n\nfunction priorityLabel(p) {\n  return { blocker: \"필수 · 막힘\", required: \"필수\", recommended: \"권장\", optional: \"선택\" }[p] || p;\n}\n","js_v420a12/backup.js":"// Phase 7 — Backup / Restore 도메인 모듈.\n//\n// production.js가 \"production.json 조립 로직을 View 밖에 둔다\"는 원칙을 따랐던 것과 똑같이,\n// 이 파일도 Full/Light 백업의 생성·검증·충돌 판정·복원 로직 전부를 여기 둔다. Settings 화면은\n// 이 모듈의 결과를 표시/진행상태 업데이트만 하고, 백업 포맷을 스스로 조립하지 않는다.\n//\n// ---------------------------------------------------------------------------\n// 포맷 선택 이유 (조건 4번 — 과설계 금지, 짧은 기술 판단)\n// ---------------------------------------------------------------------------\n// 검토한 4가지 방식과 결론:\n//   A. Blob을 바이너리 그대로 유지하는 portable container  → 채택\n//   B. 표준 ZIP(STORE, 무압축)을 직접 구현                  → 기각: CRC32/중앙 디렉터리 등을\n//      직접 구현하면 코드량과 실수 가능성이 커진다. 우리에게 필요한 건 \"여러 Blob + JSON\n//      메타데이터를 하나의 파일로 묶기\"뿐이라 ZIP 호환성 자체가 필요하지 않다.\n//   C. 브라우저 네이티브 아카이브 API                        → 기각: 그런 API가 없다\n//      (File System Access의 디렉터리 저장은 별개 기능이고 PWA 환경에서 신뢰성 있게 쓰기 어렵다).\n//   D. 모든 Blob을 base64로 거대한 JSON 하나에                → 기각: base64 인코딩은 원본 대비\n//      약 1.33배 크기 증가 + 인코딩 과정에서 문자열 전체를 메모리에 올려야 해서, 모바일 환경에서\n//      수백MB 프로젝트를 백업할 때 메모리 부담이 가장 크다.\n// → A \"portable container\"를 직접 만든다: 새 의존성 없이(Blob 생성자가 여러 파트를 그대로\n//   이어붙여준다) 원본 바이트를 그대로 보존한다. 포맷 이름: SPB1(Shorts Production Backup v1).\n//\n//   [4 bytes magic \"SPB1\"] [4 bytes LE uint32 headerLength] [headerLength bytes UTF-8 JSON] [asset payload bytes...]\n//\n// header JSON에는 episodes 전체와, 각 asset이 payload 안에서 시작하는 offset/length를 적은\n// manifest가 들어있다. 복원 시에는 File/Blob.slice()로 필요한 구간만 잘라내므로(지연 평가),\n// 전체 파일을 한 번에 메모리에 통째로 올리지 않는다 — 이 점이 base64 방식 대비 핵심 이점이다.\n\nimport {\n  getAllEpisodes,\n  getAllAssets,\n  putAsset,\n  putEpisodeRaw,\n} from \"./db.js\";\nimport {\n  APP_VERSION,\n  DB_VERSION_DISPLAY,\n  PRODUCTION_SCHEMA_VERSION,\n  BACKUP_FORMAT_VERSION_FULL,\n  BACKUP_FORMAT_VERSION_LIGHT,\n} from \"./version.js\";\n\nconst MAGIC = new Uint8Array([0x53, 0x50, 0x42, 0x31]); // \"SPB1\"\n\nfunction isFullBackupMagic(bytes) {\n  return bytes.length >= 4 && bytes[0] === MAGIC[0] && bytes[1] === MAGIC[1] && bytes[2] === MAGIC[2] && bytes[3] === MAGIC[3];\n}\n\n// ---------------------------------------------------------------------------\n// 용량 미리보기 (조건 5번 — 백업 시작 전에 보여줄 요약)\n// ---------------------------------------------------------------------------\n\n\nfunction stableAssetMeta(a) {\n  return {\n    id: a?.id || \"\",\n    episodeId: a?.episodeId || \"\",\n    kind: a?.kind || \"\",\n    role: a?.role || \"\",\n    mimeType: a?.mimeType || \"\",\n    sizeBytes: Number(a?.sizeBytes ?? a?.blob?.size ?? 0),\n    originalFileName: a?.originalFileName || \"\",\n    createdAt: a?.createdAt || null,\n  };\n}\n\nfunction fnv1aString(text) {\n  let h = 2166136261 >>> 0;\n  for (let i = 0; i < text.length; i++) {\n    h ^= text.charCodeAt(i);\n    h = Math.imul(h, 16777619) >>> 0;\n  }\n  return h.toString(16).padStart(8, \"0\");\n}\n\n// V5 Alpha5:\n// Full Backup 파일 자체에는 createdAt=Date.now()가 들어가므로 동일 데이터라도\n// 매번 바이트가 달라진다. 따라서 \"파일 Blob\"을 비교하지 않고,\n// 실제 사용자 데이터(episodes + asset metadata)만으로 안정적인 fingerprint를 만든다.\n// 이 함수는 큰 asset Blob을 읽거나 조립하지 않으므로 두 번째 동기화가 즉시 skip 가능하다.\nexport async function buildCloudStateFingerprint() {\n  const [episodes, assets] = await Promise.all([getAllEpisodes(), getAllAssets()]);\n  const stableAssets = assets\n    .map(stableAssetMeta)\n    .sort((a, b) => String(a.id).localeCompare(String(b.id)));\n  const stableEpisodes = [...episodes]\n    .sort((a, b) => String(a?.id || \"\").localeCompare(String(b?.id || \"\")));\n\n  const logical = JSON.stringify({\n    schema: \"cloud-fingerprint-v2\",\n    episodes: stableEpisodes,\n    assets: stableAssets,\n  });\n\n  return {\n    fingerprint: `${logical.length}:${fnv1aString(logical)}`,\n    episodeCount: stableEpisodes.length,\n    assetCount: stableAssets.length,\n  };\n}\n\nexport async function previewFullBackup() {\n  const [episodes, assets] = await Promise.all([getAllEpisodes(), getAllAssets()]);\n  const assetBytes = assets.reduce((sum, a) => sum + (a.sizeBytes || 0), 0);\n  const headerJsonBytes = new Blob([\n    JSON.stringify({ episodes, assets: assets.map((a) => ({ id: a.id, episodeId: a.episodeId })) }),\n  ]).size;\n  return {\n    episodeCount: episodes.length,\n    assetCount: assets.length,\n    assetBytes,\n    estimatedBytes: headerJsonBytes + assetBytes,\n  };\n}\n\n// 용량이 크면 화면에서 경고 문구를 보여줄 기준값 — 과도한 설계 없이 상수 하나로만 판단한다.\nexport const LARGE_BACKUP_WARN_BYTES = 300 * 1024 * 1024; // 300MB\n\n// ---------------------------------------------------------------------------\n// Full Backup 생성 (조건 2~5)\n// ---------------------------------------------------------------------------\n\n// onProgress(stage): \"preparing\" | \"collecting\" | \"building\" | \"done\"\nexport async function buildFullBackup({ onProgress } = {}) {\n  onProgress?.(\"preparing\");\n  const [episodes, assets] = await Promise.all([getAllEpisodes(), getAllAssets()]);\n\n  onProgress?.(\"collecting\");\n  let offset = 0;\n  const assetManifest = [];\n  const blobParts = [];\n  for (const a of assets) {\n    const length = a.blob?.size ?? 0;\n    assetManifest.push({\n      id: a.id,\n      episodeId: a.episodeId,\n      kind: a.kind,\n      role: a.role || \"\",\n      mimeType: a.mimeType || \"\",\n      sizeBytes: a.sizeBytes ?? length,\n      originalFileName: a.originalFileName || \"\",\n      createdAt: a.createdAt || null,\n      offset,\n      length,\n    });\n    blobParts.push(a.blob);\n    offset += length;\n  }\n\n  onProgress?.(\"building\");\n  const header = {\n    backupFormatVersion: BACKUP_FORMAT_VERSION_FULL,\n    kind: \"full\",\n    appVersion: APP_VERSION,\n    dbVersion: DB_VERSION_DISPLAY,\n    productionSchemaVersion: PRODUCTION_SCHEMA_VERSION,\n    createdAt: Date.now(),\n    episodeCount: episodes.length,\n    assetCount: assets.length,\n    episodes,\n    assets: assetManifest,\n  };\n  const headerBytes = new TextEncoder().encode(JSON.stringify(header));\n  const lenBuf = new Uint8Array(4);\n  new DataView(lenBuf.buffer).setUint32(0, headerBytes.byteLength, true);\n\n  // Blob 생성자는 파트들을 즉시 하나의 base64 문자열 등으로 합치지 않는다 — 브라우저가\n  // 내부적으로 파일/메모리 참조를 이어붙일 뿐이라, 큰 asset이 여러 개 있어도 이 시점에서\n  // 전체 내용을 하나의 거대한 문자열/버퍼로 복사하지 않는다(base64 방식과의 핵심 차이).\n  const blob = new Blob([MAGIC, lenBuf, headerBytes, ...blobParts], { type: \"application/octet-stream\" });\n\n  onProgress?.(\"done\");\n  return { blob, header };\n}\n\nexport function fullBackupFilename(now = Date.now()) {\n  const d = new Date(now);\n  const date = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, \"0\")}-${String(d.getDate()).padStart(2, \"0\")}`;\n  return `shorts_full_backup_${date}.spbak`;\n}\n\nexport function lightBackupFilename(now = Date.now()) {\n  const d = new Date(now);\n  const date = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, \"0\")}-${String(d.getDate()).padStart(2, \"0\")}`;\n  return `shorts_pipeline_backup_${date}.json`;\n}\n\n// ---------------------------------------------------------------------------\n// 백업 파일 판독 + 검증 (조건 6번 — \"IndexedDB를 건드리기 전에\" 반드시 먼저 검증한다)\n// ---------------------------------------------------------------------------\n\n// file: File | Blob. 반환값이 null이면 SPB1 컨테이너가 아니다(= Light JSON일 가능성 → 호출부가\n// file.text()로 다시 JSON.parse 시도).\nexport async function readFullBackupHeader(file) {\n  if (!file || file.size < 8) return null;\n  const magicBytes = new Uint8Array(await file.slice(0, 4).arrayBuffer());\n  if (!isFullBackupMagic(magicBytes)) return null;\n  const lenBytes = new Uint8Array(await file.slice(4, 8).arrayBuffer());\n  const headerLength = new DataView(lenBytes.buffer).getUint32(0, true);\n  const headerText = await file.slice(8, 8 + headerLength).text();\n  let header;\n  try {\n    header = JSON.parse(headerText);\n  } catch (e) {\n    throw new Error(\"백업 파일 헤더가 손상되어 읽을 수 없습니다.\");\n  }\n  const payloadStart = 8 + headerLength;\n  return { header, file, payloadStart };\n}\n\n// Full 백업 무결성 검증 — IndexedDB를 전혀 건드리지 않는 순수 검사 함수.\nexport function validateFullBackup({ header, file, payloadStart }) {\n  const errors = [];\n  if (!header || header.kind !== \"full\") errors.push(\"전체 백업(Full Backup) 형식이 아닙니다.\");\n  if (!header?.backupFormatVersion) errors.push(\"backupFormatVersion 정보가 없습니다.\");\n  if (!Array.isArray(header?.episodes)) errors.push(\"episodes 데이터가 없습니다.\");\n  if (!Array.isArray(header?.assets)) errors.push(\"asset manifest가 없습니다.\");\n  if (errors.length) return { valid: false, errors };\n\n  const fileSize = file.size;\n  const seenAssetIds = new Set();\n  header.assets.forEach((a, i) => {\n    if (!a || !a.id) {\n      errors.push(`asset[${i}]에 id가 없습니다.`);\n      return;\n    }\n    if (seenAssetIds.has(a.id)) errors.push(`asset id가 중복됩니다: ${a.id}`);\n    seenAssetIds.add(a.id);\n    if (a.offset == null || a.length == null || a.offset < 0 || a.length < 0) {\n      errors.push(`asset[${i}](${a.id}) payload 위치 정보가 올바르지 않습니다.`);\n    } else if (payloadStart + a.offset + a.length > fileSize) {\n      errors.push(`asset[${i}](${a.id}) payload가 파일 크기를 벗어납니다 — 파일이 손상되었을 수 있습니다.`);\n    }\n  });\n\n  const seenEpisodeIds = new Set();\n  header.episodes.forEach((ep, i) => {\n    if (!ep || !ep.id) {\n      errors.push(`episode[${i}]에 id가 없습니다.`);\n      return;\n    }\n    if (seenEpisodeIds.has(ep.id)) errors.push(`episode id가 중복됩니다: ${ep.id}`);\n    seenEpisodeIds.add(ep.id);\n  });\n\n  return { valid: errors.length === 0, errors };\n}\n\n// Light 백업 검증 — 이미 db.js.importAll()이 최소한으로 하던 검사를 조금 더 명확하게 분리한다.\nexport function validateLightBackup(payload) {\n  const errors = [];\n  if (!payload || typeof payload !== \"object\") errors.push(\"JSON 형식이 아닙니다.\");\n  else if (!Array.isArray(payload.episodes)) errors.push(\"episodes 데이터가 없습니다.\");\n  if (errors.length) return { valid: false, errors };\n  const seen = new Set();\n  payload.episodes.forEach((ep, i) => {\n    if (!ep || !ep.id) {\n      errors.push(`episode[${i}]에 id가 없습니다.`);\n      return;\n    }\n    if (seen.has(ep.id)) errors.push(`episode id가 중복됩니다: ${ep.id}`);\n    seen.add(ep.id);\n  });\n  return { valid: errors.length === 0, errors };\n}\n\n// ---------------------------------------------------------------------------\n// 복원 충돌 미리보기 (조건 7번)\n// ---------------------------------------------------------------------------\n\nexport async function previewRestoreConflicts(backupEpisodes, backupAssets = []) {\n  const [existingEpisodes, existingAssets] = await Promise.all([getAllEpisodes(), getAllAssets()]);\n  const existingEpIds = new Set(existingEpisodes.map((e) => e.id));\n  const existingAssetIds = new Set(existingAssets.map((a) => a.id));\n\n  const newEpisodeIds = [];\n  const conflictEpisodeIds = [];\n  (backupEpisodes || []).forEach((ep) => {\n    if (!ep || !ep.id) return;\n    (existingEpIds.has(ep.id) ? conflictEpisodeIds : newEpisodeIds).push(ep.id);\n  });\n\n  const newAssetIds = [];\n  const conflictAssetIds = [];\n  (backupAssets || []).forEach((a) => {\n    if (!a || !a.id) return;\n    (existingAssetIds.has(a.id) ? conflictAssetIds : newAssetIds).push(a.id);\n  });\n\n  return {\n    newEpisodeCount: newEpisodeIds.length,\n    conflictEpisodeCount: conflictEpisodeIds.length,\n    newAssetCount: newAssetIds.length,\n    conflictAssetCount: conflictAssetIds.length,\n    conflictEpisodeIds,\n    conflictAssetIds,\n  };\n}\n\n// ---------------------------------------------------------------------------\n// 실제 복원 실행 (조건 6, 7 — 검증 통과 + 정책 확정 후에만 호출한다)\n// ---------------------------------------------------------------------------\n\n// policy: \"keep-existing\"(기본, 안전) — 충돌하는 항목은 건드리지 않고 새 항목만 반영한다.\n//         \"overwrite\" — 충돌 항목도 백업 내용으로 덮어쓴다.\n// 절대로 조용히 덮어쓰지 않는다 — 호출부가 사용자에게 충돌 개수를 보여주고 정책을 명시적으로\n// 선택하게 한 뒤에만 이 함수를 호출해야 한다.\nexport async function restoreFullBackup({ header, file, payloadStart }, policy = \"keep-existing\", { onProgress } = {}) {\n  onProgress?.(\"preparing\");\n  const conflicts = await previewRestoreConflicts(header.episodes, header.assets);\n  const skipEpisodeIds = policy === \"keep-existing\" ? new Set(conflicts.conflictEpisodeIds) : new Set();\n  const skipAssetIds = policy === \"keep-existing\" ? new Set(conflicts.conflictAssetIds) : new Set();\n\n  let restoredAssets = 0;\n  let skippedAssets = 0;\n  onProgress?.(\"restoring-assets\");\n  for (const a of header.assets || []) {\n    if (skipAssetIds.has(a.id)) {\n      skippedAssets++;\n      continue;\n    }\n    const blob = file.slice(payloadStart + a.offset, payloadStart + a.offset + a.length, a.mimeType || undefined);\n    await putAsset({\n      id: a.id,\n      episodeId: a.episodeId,\n      kind: a.kind,\n      role: a.role,\n      mimeType: a.mimeType,\n      sizeBytes: a.sizeBytes,\n      originalFileName: a.originalFileName,\n      blob,\n      createdAt: a.createdAt || Date.now(),\n    });\n    restoredAssets++;\n  }\n\n  let restoredEpisodes = 0;\n  let skippedEpisodes = 0;\n  onProgress?.(\"restoring-episodes\");\n  for (const ep of header.episodes || []) {\n    if (skipEpisodeIds.has(ep.id)) {\n      skippedEpisodes++;\n      continue;\n    }\n    await putEpisodeRaw(ep);\n    restoredEpisodes++;\n  }\n\n  onProgress?.(\"done\");\n  return { restoredEpisodes, restoredAssets, skippedEpisodes, skippedAssets };\n}\n\nexport async function restoreLightBackup(payload, policy = \"keep-existing\") {\n  const conflicts = await previewRestoreConflicts(payload.episodes, []);\n  const skipEpisodeIds = policy === \"keep-existing\" ? new Set(conflicts.conflictEpisodeIds) : new Set();\n\n  let restored = 0;\n  let skipped = 0;\n  for (const ep of payload.episodes || []) {\n    if (skipEpisodeIds.has(ep.id)) {\n      skipped++;\n      continue;\n    }\n    await putEpisodeRaw(ep);\n    restored++;\n  }\n  return { restoredEpisodes: restored, skippedEpisodes: skipped };\n}\n\n// ---------------------------------------------------------------------------\n// \"마지막 백업\" 표시 (조건 10번) — IndexedDB 스토어를 새로 만들 정도의 일은 아니라서\n// localStorage에 아주 작은 메타데이터(시각 두 개)만 남긴다. 이 값은 어디까지나 사용자\n// 편의를 위한 표시용 정보이고, 실제로 그 시점에 만든 백업 파일이 지금도 존재한다는 것을\n// 보장하지 않는다(조건 10번에서 명시한 그대로) — 화면 문구에도 그렇게 안내한다.\n// ---------------------------------------------------------------------------\n\nconst LS_LAST_LIGHT = \"sptracker_last_light_backup_at\";\nconst LS_LAST_FULL = \"sptracker_last_full_backup_at\";\n\nfunction safeLocalStorage() {\n  try {\n    return typeof localStorage !== \"undefined\" ? localStorage : null;\n  } catch (e) {\n    return null;\n  }\n}\n\nexport function recordLightBackupDone(now = Date.now()) {\n  safeLocalStorage()?.setItem(LS_LAST_LIGHT, String(now));\n}\nexport function recordFullBackupDone(now = Date.now()) {\n  safeLocalStorage()?.setItem(LS_LAST_FULL, String(now));\n}\nexport function getLastBackupTimes() {\n  const ls = safeLocalStorage();\n  const light = ls ? Number(ls.getItem(LS_LAST_LIGHT)) : NaN;\n  const full = ls ? Number(ls.getItem(LS_LAST_FULL)) : NaN;\n  return {\n    lastLightBackupAt: Number.isFinite(light) && light > 0 ? light : null,\n    lastFullBackupAt: Number.isFinite(full) && full > 0 ? full : null,\n  };\n}\n","js_v420a12/health.js":"// Phase 7 — 데이터 상태 검사(Data Health Check).\n//\n// 새 규칙을 여기서 다시 만들지 않는다(조건 16번 \"기존 qc.js/production validation/db helper를\n// 가능한 재사용\"). 이 모듈은 이미 있는 세 소스를 모아 전체 DB 관점의 리포트만 만든다:\n//   - db.js.findOrphanAssets()      → 어느 에피소드에서도 참조하지 않는 asset\n//   - production.js.loadAssetManifest() → CUT episode별 \"실제 Blob이 진짜 있는가\"(broken asset)\n//   - 이 파일에서만 정의하는 아주 단순한 구조 검사(잘못된 formatType/중복 CUT id) — 이 두 가지는\n//     기존 어떤 모듈도 다루지 않는, DB 전체를 훑어야만 발견되는 문제라서 여기 새로 둔다.\n//\n// 자동으로 아무것도 지우지 않는다 — 문제를 보여주기만 하고, 정리는 Settings 화면(orphan 정리\n// 버튼 등 기존 기능)에서 사용자가 직접 한다.\n\nimport { getAllEpisodes, getAllAssets, findOrphanAssets } from \"./db.js\";\nimport { loadAssetManifest } from \"./production.js\";\n\nexport const HEALTH_SEVERITY = { ERROR: \"error\", WARNING: \"warning\" };\n\nexport async function runHealthCheck() {\n  const [episodes, assets, orphans] = await Promise.all([getAllEpisodes(), getAllAssets(), findOrphanAssets()]);\n  const issues = [];\n  const push = (severity, message, extra = {}) =>\n    issues.push({ severity, message, episodeId: extra.episodeId ?? null, episodeTitle: extra.episodeTitle ?? \"\", cutIndex: extra.cutIndex ?? null });\n\n  let cutCount = 0;\n  let brokenReferenceCount = 0;\n\n  for (const ep of episodes) {\n    if (ep.formatType !== \"text_card\" && ep.formatType !== \"cut\") {\n      push(HEALTH_SEVERITY.ERROR, `잘못된 formatType입니다(${ep.formatType}).`, { episodeId: ep.id, episodeTitle: ep.title });\n      continue;\n    }\n    if (ep.formatType !== \"cut\") continue;\n\n    const cuts = ep.cuts || [];\n    cutCount += cuts.length;\n    const seenCutIds = new Set();\n    cuts.forEach((c, i) => {\n      if (!c || !c.id) {\n        push(HEALTH_SEVERITY.ERROR, `CUT ${i + 1}에 id가 없습니다.`, { episodeId: ep.id, episodeTitle: ep.title, cutIndex: i });\n        return;\n      }\n      if (seenCutIds.has(c.id)) {\n        push(HEALTH_SEVERITY.ERROR, `CUT id가 중복됩니다(${c.id}).`, { episodeId: ep.id, episodeTitle: ep.title, cutIndex: i });\n      }\n      seenCutIds.add(c.id);\n      if (typeof c.index === \"number\" && c.index !== i) {\n        push(HEALTH_SEVERITY.WARNING, `CUT ${i + 1}의 index 값(${c.index})이 실제 순서와 다릅니다.`, {\n          episodeId: ep.id,\n          episodeTitle: ep.title,\n          cutIndex: i,\n        });\n      }\n    });\n\n    // 실제 저장소 기준 broken asset reference — production.js의 검증 로직을 그대로 재사용한다.\n    const { brokenRefs } = await loadAssetManifest(ep);\n    brokenRefs.forEach((ref) => {\n      brokenReferenceCount++;\n      push(HEALTH_SEVERITY.ERROR, `\"${ep.title || \"(제목 없음)\"}\" — 참조하는 asset이 실제로 저장소에 없습니다(broken reference).`, {\n        episodeId: ep.id,\n        episodeTitle: ep.title,\n        cutIndex: ref.cutIndex ?? null,\n      });\n    });\n  }\n\n  return {\n    episodeCount: episodes.length,\n    cutCount,\n    assetCount: assets.length,\n    orphanAssetCount: orphans.length,\n    orphanAssets: orphans,\n    brokenReferenceCount,\n    errorCount: issues.filter((i) => i.severity === HEALTH_SEVERITY.ERROR).length,\n    warningCount: issues.filter((i) => i.severity === HEALTH_SEVERITY.WARNING).length,\n    issues,\n  };\n}\n","js_v420a12/cloudSync.js":"import { buildFullBackup, buildCloudStateFingerprint } from \"./backup.js\";\n\nexport const DEFAULT_SYNC_PROXY = \"https://shorts-tracker-v4-proxy.vercel.app\";\nconst LS_SYNC_KEY = \"sptracker_cloud_sync_key_v1\";\nconst CHUNK_BYTES = 2 * 1024 * 1024;\nconst UPLOAD_CONCURRENCY = 4;\nconst DOWNLOAD_CONCURRENCY = 4;\nconst CHUNK_RETRY_COUNT = 2;\nconst SYNC_FINGERPRINT_KEY = \"tracker_cloud_last_fingerprint_v2\";\nfunction readLastFingerprint(){ try{return localStorage.getItem(SYNC_FINGERPRINT_KEY)||\"\";}catch{return \"\";} }\nfunction writeLastFingerprint(v){ try{localStorage.setItem(SYNC_FINGERPRINT_KEY,String(v||\"\"));}catch{} }\n\n\nfunction sleep(ms){ return new Promise(resolve=>setTimeout(resolve,ms)); }\n\nasync function runPool(total, concurrency, worker){\n  let next = 0;\n  const runners = Array.from({length: Math.min(Math.max(1, concurrency), Math.max(1,total))}, async ()=>{\n    while(true){\n      const index = next++;\n      if(index >= total) return;\n      await worker(index);\n    }\n  });\n  await Promise.all(runners);\n}\n\nasync function withRetry(task, retries=CHUNK_RETRY_COUNT){\n  let lastError;\n  for(let attempt=0; attempt<=retries; attempt++){\n    try{ return await task(attempt); }\n    catch(error){\n      lastError = error;\n      if(attempt >= retries) break;\n      await sleep(350 * (attempt + 1));\n    }\n  }\n  throw lastError;\n}\n\nfunction storage(){\n  try{return typeof localStorage!==\"undefined\"?localStorage:null;}catch{return null;}\n}\nexport function getCloudSyncKey(){ return storage()?.getItem(LS_SYNC_KEY) || \"\"; }\nexport function saveCloudSyncKey(value){\n  const key=String(value||\"\").trim().replace(/\\s+/g,\"\");\n  if(key && key.length<24) throw new Error(\"동기화 코드는 24자 이상이어야 합니다.\");\n  if(key) storage()?.setItem(LS_SYNC_KEY,key); else storage()?.removeItem(LS_SYNC_KEY);\n  return key;\n}\nexport function generateCloudSyncKey(){\n  const bytes=new Uint8Array(24); crypto.getRandomValues(bytes);\n  const key=Array.from(bytes,b=>b.toString(16).padStart(2,\"0\")).join(\"\");\n  saveCloudSyncKey(key); return key;\n}\nfunction headers(key,json=false){\n  return {\"X-Sync-Key\":key,...(json?{\"Content-Type\":\"application/json\"}:{})};\n}\nasync function jsonResult(response){\n  const text=await response.text(); let data={};\n  try{data=text?JSON.parse(text):{};}catch{}\n  if(!response.ok) throw new Error(data?.error?.message || data?.message || text || `HTTP ${response.status}`);\n  return data;\n}\nexport async function checkCloudSync(proxyUrl=DEFAULT_SYNC_PROXY){\n  const r=await fetch(`${proxyUrl}/api/sync-health`,{cache:\"no-store\"});\n  return jsonResult(r);\n}\nexport async function getCloudManifest(key=getCloudSyncKey(),proxyUrl=DEFAULT_SYNC_PROXY){\n  if(!key) throw new Error(\"먼저 동기화 코드를 설정해주세요.\");\n  const r=await fetch(`${proxyUrl}/api/sync/manifest`,{headers:headers(key),cache:\"no-store\"});\n  return (await jsonResult(r)).manifest || null;\n}\nexport async function uploadCloudSnapshot(key=getCloudSyncKey(),{proxyUrl=DEFAULT_SYNC_PROXY,onProgress}={}){\n  if(!key) throw new Error(\"먼저 동기화 코드를 설정해주세요.\");\n\n  // Alpha5: 큰 Full Backup을 만들기 전에 실제 데이터 변경 여부부터 확인한다.\n  onProgress?.({stage:\"checking\",done:0,total:0});\n  const state=await buildCloudStateFingerprint();\n  const fingerprint=state.fingerprint;\n  if(readLastFingerprint()===fingerprint){\n    onProgress?.({\n      stage:\"skipped\",\n      done:1,\n      total:1,\n      reason:\"unchanged\",\n      episodeCount:state.episodeCount,\n      assetCount:state.assetCount\n    });\n    return {\n      skipped:true,\n      reason:\"unchanged\",\n      fingerprint,\n      episodeCount:state.episodeCount,\n      assetCount:state.assetCount,\n      manifest:{revision:null,unchanged:true}\n    };\n  }\n\n  onProgress?.({stage:\"building\",done:0,total:0});\n  const {blob,header}=await buildFullBackup();\n  const start=await jsonResult(await fetch(`${proxyUrl}/api/sync/start`,{method:\"POST\",headers:headers(key,true),body:\"{}\"}));\n  const chunkBytes=Math.min(Number(start.chunkBytes)||CHUNK_BYTES,CHUNK_BYTES);\n  const total=Math.max(1,Math.ceil(blob.size/chunkBytes));\n  onProgress?.({stage:\"uploading\",done:0,total,bytes:blob.size});\n  let uploaded = 0;\n  await runPool(total, UPLOAD_CONCURRENCY, async (i)=>{\n    const part=blob.slice(i*chunkBytes,Math.min(blob.size,(i+1)*chunkBytes));\n    await withRetry(async ()=>{\n      const r=await fetch(`${proxyUrl}/api/sync/chunk/${start.slot}/${i}`,{\n        method:\"POST\",\n        headers:{\"X-Sync-Key\":key,\"Content-Type\":\"application/octet-stream\"},\n        body:part\n      });\n      return jsonResult(r);\n    });\n    uploaded++;\n    onProgress?.({\n      stage:\"uploading\",\n      done:uploaded,\n      total,\n      bytes:blob.size,\n      concurrency:UPLOAD_CONCURRENCY\n    });\n  });\n  const commit=await jsonResult(await fetch(`${proxyUrl}/api/sync/commit`,{\n    method:\"POST\",headers:headers(key,true),body:JSON.stringify({slot:start.slot,chunkCount:total,byteLength:blob.size,previousRevision:start.previousRevision})\n  }));\n  writeLastFingerprint(fingerprint);\n  onProgress?.({stage:\"done\",done:total,total,bytes:blob.size});\n  return {manifest:commit.manifest,header,bytes:blob.size,fingerprint};\n}\nexport async function downloadCloudSnapshot(key=getCloudSyncKey(),{proxyUrl=DEFAULT_SYNC_PROXY,onProgress}={}){\n  if(!key) throw new Error(\"먼저 동기화 코드를 설정해주세요.\");\n  const manifest=await getCloudManifest(key,proxyUrl);\n  if(!manifest) throw new Error(\"클라우드에 저장된 작업이 아직 없습니다.\");\n  const total=Number(manifest.chunkCount)||0,slot=manifest.activeSlot;\n  if(!total||!slot) throw new Error(\"클라우드 동기화 정보가 손상되었습니다.\");\n  const parts=new Array(total); \n  let downloaded=0;\n  onProgress?.({stage:\"downloading\",done:0,total,bytes:manifest.byteLength||0});\n  await runPool(total, DOWNLOAD_CONCURRENCY, async (i)=>{\n    parts[i]=await withRetry(async ()=>{\n      const r=await fetch(`${proxyUrl}/api/sync/chunk/${slot}/${i}`,{headers:headers(key),cache:\"no-store\"});\n      if(!r.ok){\n        let msg=`청크 ${i+1} 다운로드 실패`;\n        try{const d=await r.json();msg=d?.error?.message||msg}catch{}\n        throw new Error(msg);\n      }\n      return r.blob();\n    });\n    downloaded++;\n    onProgress?.({\n      stage:\"downloading\",\n      done:downloaded,\n      total,\n      bytes:manifest.byteLength||0,\n      concurrency:DOWNLOAD_CONCURRENCY\n    });\n  });\n  const blob=new Blob(parts,{type:\"application/octet-stream\"});\n  if(manifest.byteLength && blob.size!==Number(manifest.byteLength)) throw new Error(\"클라우드 파일 크기가 일치하지 않습니다.\");\n  onProgress?.({stage:\"done\",done:total,total,bytes:blob.size});\n  return {blob,manifest};\n}\n","js_v420a12/views/settings.js":"import {\n  getTotalStorageUsage,\n  getStorageEstimate,\n  findOrphanAssets,\n  sweepOrphanAssets,\n  getAllEpisodes,\n  getAllAssets,\n} from \"../db.js\";\nimport {\n  previewFullBackup,\n  LARGE_BACKUP_WARN_BYTES,\n  buildFullBackup,\n  fullBackupFilename,\n  lightBackupFilename,\n  readFullBackupHeader,\n  validateFullBackup,\n  validateLightBackup,\n  previewRestoreConflicts,\n  restoreFullBackup,\n  restoreLightBackup,\n  recordLightBackupDone,\n  recordFullBackupDone,\n  getLastBackupTimes,\n} from \"../backup.js\";\nimport { exportAll } from \"../db.js\";\nimport { runHealthCheck } from \"../health.js\";\nimport { downloadText, downloadBlob, toast, fmtBytes, fmtDate, escapeHtml } from \"../util.js\";\nimport { RATE_NORMAL, RATE_SLOW, RATE_HORROR, PAD, FLOOR } from \"../sceneTiming.js\";\nimport { APP_DISPLAY_NAME, APP_VERSION, DB_VERSION_DISPLAY, PRODUCTION_SCHEMA_VERSION, RELEASE_LABEL } from \"../version.js\";\nimport { AI_CONTRACT_VERSION, AI_PROVIDER_IDS, AI_TASK_TYPES } from \"../aiContracts.js\";\nimport { RECIPE_SCHEMA_VERSION, BUILTIN_RECIPES } from \"../recipe.js\";\nimport { loadAiProviderSettings, saveAiProviderSettings, checkAiProvider } from \"../aiProvider.js\";\nimport { detectRendererCapabilities, detectStandardMp4Capabilities } from \"../renderer.js\";\nimport { computeViewportState } from \"../viewport.js\";\nimport { loadImageProviderSettings, saveImageProviderSettings, checkImageProvider, imageProviderReady } from \"../imageProvider.js\";\nimport { getCloudSyncKey, saveCloudSyncKey, generateCloudSyncKey, checkCloudSync, getCloudManifest, uploadCloudSnapshot, downloadCloudSnapshot } f
